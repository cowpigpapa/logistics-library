<text x="66" y="760" font-size="16" font-weight="500" fill="#1d2a3a">EU 관세영역에 설립되고 EORI가 있으며 관세 관련 업무를 하는 공급망 참여자. 한국 본사는 신청 대상이</text>
<text x="66" y="785" font-size="16" font-weight="500" fill="#1d2a3a">아닙니다.</text>
<text x="66" y="814" font-size="16" font-weight="500" fill="#1d2a3a">승인은 기간 제한 없이 유효하고(UCC 제22조제5항), 세관이 감시·재평가합니다. 결정 기한은 원칙</text>
<text x="66" y="839" font-size="16" font-weight="500" fill="#1d2a3a">120일입니다.</text>
