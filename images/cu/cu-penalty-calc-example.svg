<text x="64" y="560" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">이틀 늦었다면 기준 금액은 10만원입니다.</text>
<text x="64" y="590" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">지연 일수 구간이 바뀌는 날 금액이 크게</text>
<text x="64" y="620" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">달라집니다.</text>
