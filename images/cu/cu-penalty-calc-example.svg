<text x="1344.0" y="782" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="middle">부과통지 금액</text>
<text x="1344.0" y="808" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="middle">30일 안 납부</text>
