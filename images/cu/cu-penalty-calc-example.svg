<text x="984.0" y="808" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="middle">× (1 − 0.20)</text>
<rect x="1100" y="464.0" width="128" height="256.0" fill="#e8f5ee" stroke="#1f8a5b" stroke-width="2.5" rx="6" />
