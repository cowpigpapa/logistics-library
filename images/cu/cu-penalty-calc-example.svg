<text x="804.0" y="754" font-size="18" font-weight="800" fill="#1d2a3a" text-anchor="middle">① 기준 금액</text>
<text x="804.0" y="782" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="middle">별표 5, 1차</text>
<text x="804.0" y="808" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="middle">2일 초과 5일 이내</text>
