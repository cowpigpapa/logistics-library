<text x="78" y="716" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">늦어질 것 같으면 기간이 끝나기 전에</text>
<text x="78" y="744" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">연장 신청: 재해, 차량사고, 도착지 창고</text>
<text x="78" y="772" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">사정 같은 부득이한 사유가 있을 때</text>
<text x="78" y="800" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">(보세운송에 관한 고시 제39조)</text>
<rect x="700" y="30" width="942" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16" />
<text x="724" y="72" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">계산 예시: 중소기업, 최근 2년간 같은 위반 없음</text>
