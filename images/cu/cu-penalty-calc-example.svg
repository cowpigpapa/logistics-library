<text x="1242.0" y="120" font-size="18" font-weight="700" fill="#1f8a5b" text-anchor="end">자진납부로 끝내는 경우</text>
<text x="1266.0" y="120" font-size="18" font-weight="700" fill="#d9482b" text-anchor="start">자진납부하지 않으면</text>
<text x="724" y="876" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="start">감경률은 법령이 정한 최대치를 모두 적용한 예시이며, 실제 감경 여부와 비율은 세관장이 정합니다.</text>
