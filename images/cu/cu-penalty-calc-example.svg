<text x="74" y="160" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">만료일부터 2일 안 / 2일 초과 5일 안 / 5일 초과</text>
<text x="493.0" y="400" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">만료일부터 지난 날 수</text>
<path d="M290 300 L304 274 L276 274 Z" fill="#1d2a3a"/>
<rect x="180" y="426" width="220" height="54" fill="#ffffff" stroke="#1d2a3a" stroke-width="2" rx="10" />
