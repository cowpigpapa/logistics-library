<text x="1164.0" y="754" font-size="18" font-weight="800" fill="#1d2a3a" text-anchor="middle">③ 자진납부 감경</text>
<text x="1164.0" y="782" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="middle">사전통지일부터</text>
<text x="1164.0" y="808" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="middle">20일 안 납부</text>
<rect x="1280" y="400.0" width="128" height="320.0" fill="#fff7e0" stroke="#b7791f" stroke-width="2.5" rx="6" />
