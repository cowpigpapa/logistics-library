<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d2a3a"/></marker>
  </defs>
  <rect width="1672" height="941" fill="#ffffff"/>
  <text x="56" y="60" font-size="32" font-weight="700" fill="#1d2a3a">재수출 확인이 빠졌을 때 돌아가는 시계</text>
  <text x="56" y="96" font-size="20" fill="#5f6b78">위는 모든 협약국에 공통인 ATA 협약의 기한, 아래는 외국 까르네로 한국에 들어온 물품에 한국 세관이 쓰는 고시의 기한</text>

  <!-- Lane 1: Convention -->
  <rect x="40" y="124" width="1592" height="330" rx="16" fill="#fbfcfd" stroke="#c9d2dc"/>
  <text x="64" y="162" font-size="22" font-weight="700" fill="#1f6fd1">ATA 협약 제4조~제9조(이스탄불 협약 부속서 A 제5조·제7조~제9조도 같은 구조)</text>

  <line x1="90" y1="270" x2="1590" y2="270" stroke="#1d2a3a" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- segments -->
  <rect x="100" y="246" width="300" height="48" rx="6" fill="#e8f0fb" stroke="#1f6fd1"/>
  <text x="250" y="277" font-size="18" fill="#1d2a3a" text-anchor="middle">유효기간(발급일부터 최장 1년)</text>
  <rect x="400" y="246" width="420" height="48" rx="6" fill="#fdecea" stroke="#d9482b"/>
  <text x="610" y="277" font-size="18" fill="#1d2a3a" text-anchor="middle">만료 뒤 1년: 이 안에 청구해야 함</text>
  <rect x="820" y="246" width="330" height="48" rx="6" fill="#fff4e5" stroke="#e4572e"/>
  <text x="985" y="277" font-size="18" fill="#1d2a3a" text-anchor="middle">청구일부터 6개월: 증명 기간</text>
  <rect x="1150" y="246" width="300" height="48" rx="6" fill="#e9f6ef" stroke="#1f8a5b"/>
  <text x="1300" y="277" font-size="18" fill="#1d2a3a" text-anchor="middle">예치·잠정 납부 뒤 3개월</text>

  <text x="100" y="228" font-size="17" fill="#5f6b78">발급</text>
  <text x="400" y="228" font-size="17" fill="#5f6b78" text-anchor="middle">유효기간 만료</text>
  <text x="820" y="228" font-size="17" fill="#5f6b78" text-anchor="middle">청구(1년 안 어느 때든)</text>
  <text x="1150" y="228" font-size="17" fill="#5f6b78" text-anchor="middle">증명 못 하면 예치·납부</text>
  <text x="1450" y="228" font-size="17" fill="#5f6b78" text-anchor="middle">확정</text>

  <text x="100" y="330" font-size="17" fill="#1d2a3a">재수출기한은 어떤 경우에도</text>
  <text x="100" y="354" font-size="17" fill="#1d2a3a">유효기간을 넘지 못함(제5조)</text>
  <text x="430" y="330" font-size="17" fill="#1d2a3a">이 1년 안에 청구하지 않으면 세관은</text>
  <text x="430" y="354" font-size="17" fill="#1d2a3a">보증단체에 돈을 요구하지 못함(제6조 제4항)</text>
  <text x="430" y="378" font-size="17" fill="#1d2a3a">보증단체 책임 한도는 수입세액 + 10%</text>
  <text x="840" y="330" font-size="17" fill="#1d2a3a">재수출 증명이나 다른 적법한</text>
  <text x="840" y="354" font-size="17" fill="#1d2a3a">정리 증거를 내면 끝(제7조 제1항)</text>
  <text x="840" y="378" font-size="17" fill="#1d2a3a">다른 협약국의 입국 기록도 증거가</text>
  <text x="840" y="402" font-size="17" fill="#1d2a3a">될 수 있음, 정리 수수료 부과 가능</text>
  <text x="1170" y="330" font-size="17" fill="#1d2a3a">이 3개월 안에 증명하면</text>
  <text x="1170" y="354" font-size="17" fill="#1d2a3a">낸 돈을 돌려받을 수 있음</text>
  <text x="1170" y="378" font-size="17" fill="#1d2a3a">(제7조 제2항)</text>
  <text x="64" y="436" font-size="16" fill="#5f6b78">세관이 조건 없이 재수출을 확인(discharge)했다면 그 물품으로는 다시 청구할 수 없지만, 부정하게 받은 확인이면 예외(제6조 제3항).</text>

  <!-- Lane 2: Korea notice -->
  <rect x="40" y="476" width="1592" height="436" rx="16" fill="#fbfcfd" stroke="#c9d2dc"/>
  <text x="64" y="514" font-size="22" font-weight="700" fill="#d9482b">한국에 들어온 외국 까르네(A.T.A.까르네에 의한 일시수출입 통관에 관한 고시)</text>

  <line x1="90" y1="600" x2="1590" y2="600" stroke="#1d2a3a" stroke-width="2.5" marker-end="url(#a)"/>
  <circle cx="130" cy="600" r="12" fill="#1f6fd1"/>
  <circle cx="470" cy="600" r="12" fill="#e4572e"/>
  <circle cx="760" cy="600" r="12" fill="#d9482b"/>
  <circle cx="1120" cy="600" r="12" fill="#d9482b"/>
  <circle cx="1440" cy="600" r="12" fill="#1f8a5b"/>

  <text x="130" y="570" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="middle">일시수입신고 수리</text>
  <text x="470" y="570" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="middle">재수출기한 전</text>
  <text x="760" y="570" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="middle">유효기간 만료일</text>
  <text x="1120" y="570" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="middle">고지일부터 6개월</text>
  <text x="1440" y="570" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="middle">납부일부터 3개월</text>

  <text x="64" y="644" font-size="17" fill="#1d2a3a">재수출기간 = 1년 범위의</text>
  <text x="64" y="668" font-size="17" fill="#1d2a3a">증서 유효기간(제12조)</text>
  <text x="64" y="692" font-size="17" fill="#1d2a3a">증서에 기한 고무도장 날인</text>
  <text x="64" y="716" font-size="17" fill="#1d2a3a">연장까르네를 받아도 최초</text>
  <text x="64" y="740" font-size="17" fill="#1d2a3a">수리일부터 2년이 상한</text>

  <text x="380" y="644" font-size="17" fill="#1d2a3a">세관이 명의인·사용인에게</text>
  <text x="380" y="668" font-size="17" fill="#1d2a3a">재수출 이행안내(제13조)</text>
  <text x="380" y="692" font-size="17" fill="#1d2a3a">연장은 기한 전에 신청</text>
  <text x="380" y="716" font-size="17" fill="#1d2a3a">(제12조의2)</text>

  <text x="640" y="644" font-size="17" fill="#1d2a3a">만료일 즉시 납부고지와</text>
  <text x="640" y="668" font-size="17" fill="#1d2a3a">부과결정통지: 관세등 +</text>
  <text x="640" y="692" font-size="17" fill="#1d2a3a">그 10% 가산세(제21조)</text>
  <text x="640" y="716" font-size="17" fill="#1d2a3a">사본을 대한상의에 통보</text>

  <text x="980" y="644" font-size="17" fill="#1d2a3a">이 안에 재수출 증거를 내거나</text>
  <text x="980" y="668" font-size="17" fill="#1d2a3a">세액을 납부(제21조 제4항)</text>
  <text x="980" y="692" font-size="17" fill="#1d2a3a">기간 안 재수출이 증명되면</text>
  <text x="980" y="716" font-size="17" fill="#1d2a3a">부과결정 취소(제22조 제2항)</text>

  <text x="1320" y="644" font-size="17" fill="#1d2a3a">기간 안에 수출했음을</text>
  <text x="1320" y="668" font-size="17" fill="#1d2a3a">증명하면 낸 세금 환급</text>
  <text x="1320" y="692" font-size="17" fill="#1d2a3a">(제22조 제3항)</text>

  <rect x="64" y="770" width="760" height="124" rx="12" fill="#ffffff" stroke="#1f6fd1"/>
  <text x="84" y="804" font-size="18" font-weight="700" fill="#1f6fd1">누가 내나(제20조)</text>
  <text x="84" y="834" font-size="17" fill="#1d2a3a">재수출하지 않았거나 늦게 했으면 명의인 또는 사용인, 용도 외 사용·양도는</text>
  <text x="84" y="858" font-size="17" fill="#1d2a3a">그 사람과 양수인. 유효기간 만료일부터 1년 안에는 보증단체(대한상의)도</text>
  <text x="84" y="882" font-size="17" fill="#1d2a3a">납부 의무를 짐(세관이 조건 없이 반출을 확인한 경우 제외)</text>

  <rect x="848" y="770" width="760" height="124" rx="12" fill="#ffffff" stroke="#d9482b" stroke-width="2"/>
  <text x="868" y="804" font-size="18" font-weight="700" fill="#d9482b">늦게라도 내보냈으면 괜찮은가: 아니다</text>
  <text x="868" y="834" font-size="17" fill="#1d2a3a">재수출기한이 지난 뒤 다른 세관에서 재수출 확인을 받았어도 면세되지</text>
  <text x="868" y="858" font-size="17" fill="#1d2a3a">않고, 부득이한 사유가 있어도 연장을 받지 못했으면 같다</text>
  <text x="868" y="882" font-size="17" fill="#1d2a3a">(대법원 1989. 9. 26. 선고 88누6597 판결)</text>
</svg>
