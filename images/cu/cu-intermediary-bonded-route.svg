<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker>
</defs>
<rect width="1672" height="941" fill="#ffffff"/>
<text x="40" y="56" font-size="28" font-weight="800" fill="#1d2a3a">중계무역 화물이 한국 보세구역을 거칠 때: 수입하지 않고 반송신고로 내보낸다</text>
<text x="40" y="90" font-size="19" font-weight="600" fill="#5f6b78">관세법 제2조 제3호·제158조·제241조·제269조 · 수출 및 반송통관에 관한 고시 제45조~제52조·제66조 · 보세화물장치기간 및 체화관리에 관한 고시 제4조</text>

<!-- steps -->
<g font-size="18">
<rect x="40" y="128" width="244" height="168" rx="16" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2"/>
<text x="62" y="164" font-size="21" font-weight="800" fill="#1f6fd1">1 입항·하선</text>
<text x="62" y="198" fill="#1d2a3a">적재화물목록의</text>
<text x="62" y="224" fill="#1d2a3a">수하인은 보통</text>
<text x="62" y="250" fill="#1d2a3a">한국 중계상</text>
<text x="62" y="280" font-size="15" fill="#5f6b78">외국물품 상태</text>

<rect x="314" y="128" width="244" height="168" rx="16" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2"/>
<text x="336" y="164" font-size="21" font-weight="800" fill="#1f6fd1">2 보세구역 반입</text>
<text x="336" y="198" fill="#1d2a3a">보세창고·지정장치장</text>
<text x="336" y="224" fill="#1d2a3a">또는 보세구역외</text>
<text x="336" y="250" fill="#1d2a3a">장치 허가 장소</text>
<text x="336" y="280" font-size="15" fill="#5f6b78">반입일부터 시계가 돈다</text>

<rect x="588" y="128" width="244" height="168" rx="16" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2"/>
<text x="610" y="164" font-size="21" font-weight="800" fill="#1f6fd1">3 보수작업(선택)</text>
<text x="610" y="198" fill="#1d2a3a">라벨·포장개선·분할·</text>
<text x="610" y="224" fill="#1d2a3a">합병은 세관장 승인</text>
<text x="610" y="250" fill="#d9482b" font-weight="700">HSK 10단위가 바뀌면</text>
<text x="610" y="276" fill="#d9482b" font-weight="700">보수작업 아님</text>

<rect x="862" y="128" width="244" height="168" rx="16" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2"/>
<text x="884" y="164" font-size="21" font-weight="800" fill="#1f6fd1">4 반송신고</text>
<text x="884" y="198" fill="#1d2a3a">B/L(AWB) 단위로,</text>
<text x="884" y="224" fill="#1d2a3a">B/L 사본·송품장·</text>
<text x="884" y="250" fill="#1d2a3a">필요 시 승인서류</text>
<text x="884" y="280" font-size="15" fill="#5f6b78">신고인: 화주 또는 관세사등</text>

<rect x="1136" y="128" width="244" height="168" rx="16" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2"/>
<text x="1158" y="164" font-size="21" font-weight="800" fill="#1f6fd1">5 심사·검사·수리</text>
<text x="1158" y="198" fill="#1d2a3a">반입 물품과 품명·</text>
<text x="1158" y="224" fill="#1d2a3a">규격 일치, 금지품·</text>
<text x="1158" y="250" fill="#1d2a3a">지재권 침해 여부</text>
<text x="1158" y="280" font-size="15" fill="#5f6b78">반송신고필증 교부</text>

<rect x="1410" y="128" width="222" height="168" rx="16" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2"/>
<text x="1432" y="164" font-size="21" font-weight="800" fill="#1f6fd1">6 적재·출항</text>
<text x="1432" y="198" fill="#1d2a3a">적재지까지 옮기면</text>
<text x="1432" y="224" fill="#1d2a3a">반송 보세운송, 기간은</text>
<text x="1432" y="250" fill="#1d2a3a">원칙 7일</text>
<text x="1432" y="280" font-size="15" fill="#5f6b78">보세운송업자 명의</text>
</g>
<line x1="286" y1="212" x2="310" y2="212" stroke="#1d2a3a" stroke-width="3" marker-end="url(#a)"/>
<line x1="560" y1="212" x2="584" y2="212" stroke="#1d2a3a" stroke-width="3" marker-end="url(#a)"/>
<line x1="834" y1="212" x2="858" y2="212" stroke="#1d2a3a" stroke-width="3" marker-end="url(#a)"/>
<line x1="1108" y1="212" x2="1132" y2="212" stroke="#1d2a3a" stroke-width="3" marker-end="url(#a)"/>
<line x1="1382" y1="212" x2="1406" y2="212" stroke="#1d2a3a" stroke-width="3" marker-end="url(#a)"/>

<!-- clocks -->
<text x="40" y="350" font-size="22" font-weight="800" fill="#1d2a3a">함께 도는 시계</text>
<line x1="436" y1="384" x2="1600" y2="384" stroke="#9aa6b2" stroke-width="2"/>
<circle cx="436" cy="384" r="8" fill="#1f6fd1"/>
<text x="436" y="414" font-size="16" font-weight="700" fill="#1f6fd1" text-anchor="middle">반입일</text>

<rect x="40" y="430" width="380" height="54" rx="10" fill="#eaf1fb"/>
<text x="56" y="464" font-size="18" font-weight="800" fill="#1f6fd1">반송신고 기한</text>
<rect x="436" y="440" width="300" height="34" fill="#1f6fd1"/>
<text x="586" y="463" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">반입일부터 30일</text>
<text x="752" y="464" font-size="17" fill="#1d2a3a">지정장치장·보세창고 반입 물품(관세법 제241조 제3항). 넘기면 가산세 대상이 될 수 있음(제4항)</text>

<rect x="40" y="500" width="380" height="54" rx="10" fill="#eaf1fb"/>
<text x="56" y="534" font-size="18" font-weight="800" fill="#1f6fd1">장치기간(중계무역 물품)</text>
<rect x="436" y="510" width="760" height="34" fill="#1f8a5b"/>
<text x="816" y="533" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">1년(세관장이 인정한 국제물류 촉진 물품)</text>
<rect x="1196" y="510" width="404" height="34" fill="#9fd3bb"/>
<text x="1398" y="533" font-size="16" font-weight="700" fill="#1d2a3a" text-anchor="middle">1년 단위 연장: 수출실적 비율 30% 이상</text>

<rect x="40" y="570" width="380" height="54" rx="10" fill="#eaf1fb"/>
<text x="56" y="604" font-size="18" font-weight="800" fill="#1f6fd1">반송신고수리 후 적재</text>
<rect x="436" y="580" width="300" height="34" fill="#e4572e"/>
<text x="586" y="603" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">수리일부터 30일</text>
<text x="752" y="604" font-size="17" fill="#1d2a3a">지나도 안 실었으면 세관이 적재 여부를 확인하고 국외반출 또는 취하를 명령(고시 제66조)</text>
<text x="40" y="650" font-size="15" fill="#5f6b78">장치기간은 보세구역 종류마다 다르다. 부산항·인천항 부두 내 보세창고 등은 2개월 규정이 따로 있어 실제 기간은 반입 장소와 세관 인정 여부로 정해진다.</text>

<!-- bottom boxes -->
<rect x="40" y="676" width="520" height="240" rx="16" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2"/>
<text x="62" y="712" font-size="21" font-weight="800" fill="#1d2a3a">환적과 반송은 다르다</text>
<text x="62" y="746" font-size="17" fill="#1d2a3a">같은 세관 구역에서 옮겨 싣기만 하면 환적.</text>
<text x="62" y="774" font-size="17" fill="#1d2a3a">출발지·점유자를 바꿔 한국에서 다시 내보내면</text>
<text x="62" y="802" font-size="17" fill="#1d2a3a">반송신고 대상(대법원 2019도11489).</text>
<text x="62" y="840" font-size="17" font-weight="700" fill="#d9482b">신고 없이 반송하면 3년 이하 징역 또는</text>
<text x="62" y="866" font-size="17" font-weight="700" fill="#d9482b">물품원가 이하 벌금(관세법 제269조 제3항)</text>
<text x="62" y="898" font-size="15" fill="#5f6b78">자유무역지역 반출은 별도 고시 절차를 따른다</text>

<rect x="584" y="676" width="520" height="240" rx="16" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2"/>
<text x="606" y="712" font-size="21" font-weight="800" fill="#1d2a3a">반송인과 취하</text>
<text x="606" y="746" font-size="17" fill="#1d2a3a">반송은 적재화물목록·B/L·AWB의 수하인 또는</text>
<text x="606" y="774" font-size="17" fill="#1d2a3a">처분권리를 취득한 화주가 한다(고시 제46조).</text>
<text x="606" y="812" font-size="17" fill="#1d2a3a">해외 구매자가 인수를 거부하면 거부 증명과</text>
<text x="606" y="840" font-size="17" fill="#1d2a3a">처리계획을 내고 반송신고를 취하할 수 있다</text>
<text x="606" y="868" font-size="17" fill="#1d2a3a">(고시 제51조). 그 뒤 수입·재반송을 정한다.</text>

<rect x="1128" y="676" width="504" height="240" rx="16" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2"/>
<text x="1150" y="712" font-size="21" font-weight="800" fill="#1d2a3a">한국산으로 바꿀 수 없다</text>
<text x="1150" y="746" font-size="17" fill="#1d2a3a">수입 물품을 국내에서 단순 가공해 수출할 때</text>
<text x="1150" y="774" font-size="17" fill="#1d2a3a">우리나라를 원산지로 표시하면 안 된다</text>
<text x="1150" y="802" font-size="17" fill="#1d2a3a">(대외무역법 시행령 제56조 제5항).</text>
<text x="1150" y="840" font-size="17" font-weight="700" fill="#d9482b">국산 가장 수출은 5년 이하 징역 또는</text>
<text x="1150" y="866" font-size="17" font-weight="700" fill="#d9482b">1억원 이하 벌금(법 제38조·제53조의2)</text>
</svg>
