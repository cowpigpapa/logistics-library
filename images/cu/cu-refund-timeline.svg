<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect width="1672" height="941" fill="#ffffff"/>
<text x="56" y="66" font-size="34" font-weight="700" fill="#1d2a3a">관세환급의 기간: 원재료 수입부터 환급 신청까지</text>
<text x="56" y="104" font-size="21" fill="#5f6b78">수출신고가 수리된 수출(특례법 제4조제1호) 기준 · 날짜는 설명용 예시이고 축척은 맞추지 않았습니다</text>
<defs>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2a3a"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fd1"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f8a5b"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9482b"/></marker>
</defs>
<rect x="40" y="130" width="1592" height="450" rx="16" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2"/>
<rect x="110" y="168" width="950" height="46" rx="10" fill="#e8f0fb" stroke="#1f6fd1" stroke-width="2"/>
<text x="585" y="199" font-size="20" font-weight="700" fill="#1f6fd1" text-anchor="middle">수출이행기간: 기준일부터 거꾸로 2년 안에 수입된 원재료만 환급 대상(제9조제1항)</text>
<rect x="560" y="228" width="520" height="44" rx="10" fill="#e7f4ed" stroke="#1f8a5b" stroke-width="2"/>
<text x="820" y="258" font-size="20" font-weight="700" fill="#1f8a5b" text-anchor="middle">수리일부터 30일 안에 적재(관세법 제251조)</text>
<line x1="90" y1="330" x2="1600" y2="330" stroke="#1d2a3a" stroke-width="3" marker-end="url(#ak)"/>
<text x="120" y="312" font-size="18" font-weight="400" fill="#5f6b78" text-anchor="start">기준일 2년 전</text>
<line x1="110" y1="214" x2="110" y2="330" stroke="#1f6fd1" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="190" cy="330" r="11" fill="#1f6fd1" stroke="#ffffff" stroke-width="3"/>
<text x="190" y="372" font-size="20" font-weight="700" fill="#1d2a3a" text-anchor="middle">원재료 수입신고수리</text>
<text x="190" y="400" font-size="19" font-weight="400" fill="#5f6b78" text-anchor="middle">2025. 3. 10.</text>
<circle cx="560" cy="330" r="11" fill="#1d2a3a" stroke="#ffffff" stroke-width="3"/>
<text x="560" y="372" font-size="20" font-weight="700" fill="#1d2a3a" text-anchor="middle">수출신고수리</text>
<text x="560" y="400" font-size="19" font-weight="400" fill="#5f6b78" text-anchor="middle">2026. 10. 5.</text>
<circle cx="800" cy="330" r="11" fill="#1f8a5b" stroke="#ffffff" stroke-width="3"/>
<text x="800" y="372" font-size="20" font-weight="700" fill="#1d2a3a" text-anchor="middle">선적(B/L 발행)</text>
<text x="800" y="400" font-size="19" font-weight="400" fill="#5f6b78" text-anchor="middle">2026. 10. 20.</text>
<circle cx="1060" cy="330" r="11" fill="#1f6fd1" stroke="#ffffff" stroke-width="3"/>
<text x="1060" y="372" font-size="20" font-weight="700" fill="#1d2a3a" text-anchor="middle">기준일(수리한 달 말일)</text>
<text x="1060" y="400" font-size="19" font-weight="400" fill="#5f6b78" text-anchor="middle">2026. 10. 31.</text>
<circle cx="1290" cy="330" r="11" fill="#e4572e" stroke="#ffffff" stroke-width="3"/>
<text x="1290" y="372" font-size="20" font-weight="700" fill="#1d2a3a" text-anchor="middle">환급 신청</text>
<text x="1290" y="400" font-size="19" font-weight="400" fill="#5f6b78" text-anchor="middle">2026. 11. 3.</text>
<circle cx="1520" cy="330" r="11" fill="#d9482b" stroke="#ffffff" stroke-width="3"/>
<text x="1520" y="372" font-size="20" font-weight="700" fill="#1d2a3a" text-anchor="middle">신청 기한</text>
<text x="1520" y="400" font-size="19" font-weight="400" fill="#5f6b78" text-anchor="middle">2031. 10. 5.</text>
<rect x="800" y="440" width="720" height="46" rx="10" fill="#fdeee9" stroke="#e4572e" stroke-width="2"/>
<text x="1160" y="471" font-size="20" font-weight="700" fill="#e4572e" text-anchor="middle">선적 뒤부터 신청 가능 · 기한은 수출신고수리일부터 5년</text>
<line x1="560" y1="463" x2="800" y2="463" stroke="#e4572e" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="560" y1="412" x2="560" y2="463" stroke="#e4572e" stroke-width="2" stroke-dasharray="6 5"/>
<text x="80" y="530" font-size="20" font-weight="400" fill="#5f6b78" text-anchor="start">수리한 날이 아니라 그 달 말일이 기준이라, 같은 달 안에서는 수리 날짜에 따라 원재료 기간이 달라지지 않습니다(시행령 제9조제1항).</text>
<text x="80" y="560" font-size="20" font-weight="400" fill="#5f6b78" text-anchor="start">신청 기한(5년)은 수출신고수리일부터 셉니다(시행령 제18조제5항). 보정·경정·환급금 징수가 있으면 그날부터 다시 5년(특례법 제14조제1항 단서).</text>
<rect x="40" y="605" width="516" height="300" rx="16" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2"/>
<rect x="40" y="605" width="516" height="10" rx="5" fill="#1f6fd1"/>
<text x="68" y="655" font-size="24" font-weight="700" fill="#1f6fd1" text-anchor="start">2년을 넘긴 원재료</text>
<text x="68" y="698" font-size="20" font-weight="400" fill="#1d2a3a" text-anchor="start">환급 대상이 아닙니다.</text>
<text x="68" y="730" font-size="20" font-weight="400" fill="#1d2a3a" text-anchor="start">플랜트수출 물품이 무역 상대국의</text>
<text x="68" y="762" font-size="20" font-weight="400" fill="#1d2a3a" text-anchor="start">전쟁·천재지변 등으로 늦어지면 3년.</text>
<text x="68" y="794" font-size="20" font-weight="400" fill="#1d2a3a" text-anchor="start">내국신용장·구매확인서 거래는</text>
<text x="68" y="826" font-size="20" font-weight="400" fill="#1d2a3a" text-anchor="start">직전 거래부터 1년 안이면</text>
<text x="68" y="858" font-size="20" font-weight="400" fill="#1d2a3a" text-anchor="start">그동안을 기간에서 뺍니다.</text>
<rect x="578" y="605" width="516" height="300" rx="16" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2"/>
<rect x="578" y="605" width="516" height="10" rx="5" fill="#1f8a5b"/>
<text x="606" y="655" font-size="24" font-weight="700" fill="#1f8a5b" text-anchor="start">30일 안에 못 실으면</text>
<text x="606" y="698" font-size="20" font-weight="400" fill="#1d2a3a" text-anchor="start">기간이 끝나기 전에 적재기간</text>
<text x="606" y="730" font-size="20" font-weight="400" fill="#1d2a3a" text-anchor="start">연장승인을 신청합니다(1년 범위).</text>
<text x="606" y="762" font-size="20" font-weight="400" fill="#1d2a3a" text-anchor="start">놓치면 수리취소 예정통보,</text>
<text x="606" y="794" font-size="20" font-weight="400" fill="#1d2a3a" text-anchor="start">14일 안 원인규명, 수리 취소.</text>
<text x="606" y="826" font-size="20" font-weight="400" fill="#1d2a3a" text-anchor="start">수리가 취소되면 환급의 근거인</text>
<text x="606" y="858" font-size="20" font-weight="400" fill="#1d2a3a" text-anchor="start">수출이 없어집니다.</text>
<rect x="1116" y="605" width="516" height="300" rx="16" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2"/>
<rect x="1116" y="605" width="516" height="10" rx="5" fill="#d9482b"/>
<text x="1144" y="655" font-size="24" font-weight="700" fill="#d9482b" text-anchor="start">환급을 받은 뒤에도</text>
<text x="1144" y="698" font-size="20" font-weight="400" fill="#1d2a3a" text-anchor="start">세관의 환급 후 심사는</text>
<text x="1144" y="730" font-size="20" font-weight="400" fill="#1d2a3a" text-anchor="start">신청일부터 5년 안(시행령 제20조).</text>
<text x="1144" y="762" font-size="20" font-weight="400" fill="#1d2a3a" text-anchor="start">선적하지 않고 받은 환급금은</text>
<text x="1144" y="794" font-size="20" font-weight="400" fill="#1d2a3a" text-anchor="start">징수합니다(특례법 제21조).</text>
<text x="1144" y="826" font-size="20" font-weight="400" fill="#1d2a3a" text-anchor="start">소요량 근거서류는 5년,</text>
<text x="1144" y="858" font-size="20" font-weight="400" fill="#1d2a3a" text-anchor="start">수출·납부세액 서류는 3년 보관.</text>
</svg>