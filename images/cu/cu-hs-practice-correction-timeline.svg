<text x="54" y="72" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">세액이 부족하다는 것을 알았을 때: 언제 고치느냐에 따라 부담이 달라진다</text>
<rect x="130" y="176" width="312" height="116" fill="#e8f5ee" stroke="#1f8a5b" stroke-width="2" rx="0" />
<text x="286.0" y="213.0" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle">보정</text>
<text x="286.0" y="241.0" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="middle">가산세 없음</text>
<text x="286.0" y="269.0" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="middle">이자 연 3.1%만</text>
