<text x="598.0" y="213.0" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle">수정신고</text>
<text x="598.0" y="241.0" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="middle">10% 가산세의</text>
<text x="598.0" y="269.0" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="middle">30% 감면</text>
<rect x="754" y="176" width="312" height="116" fill="#fff1e8" stroke="#e4572e" stroke-width="2" rx="0" />
<text x="910.0" y="213.0" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle">수정신고</text>
<text x="910.0" y="241.0" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="middle">10% 가산세의</text>
<text x="910.0" y="269.0" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="middle">20% 감면</text>
<rect x="1066" y="176" width="312" height="116" fill="#fde4dc" stroke="#d9482b" stroke-width="2" rx="0" />
<text x="1222.0" y="213.0" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle">수정신고</text>
<text x="1222.0" y="241.0" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="middle">10% 가산세의</text>
<text x="1222.0" y="269.0" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="middle">10% 감면</text>
<rect x="1378" y="176" width="197.60000000000002" height="116" fill="#f6d5cc" stroke="#d9482b" stroke-width="2" rx="0" />
