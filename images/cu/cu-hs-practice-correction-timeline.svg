<line x1="1066" y1="162" x2="1066" y2="306" stroke="#1d2a3a" stroke-width="2"/>
<text x="1066" y="154" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="middle">1년 6개월</text>
