<text x="64" y="820" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start" >입항전수입신고는 입항 5일 전(항공기 1일 전)부터 · 세율 인상·새 수입요건 적용 예정 물품 등은 도착 후 신고</text>
