<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker>
<marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker>
</defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30" y="30" width="1612" height="320" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16" />
<text x="54" y="74" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">부산 → 로테르담 혼재 컨테이너: 누가 어떤 B/L을 발행하나 (예시)</text>
<rect x="60" y="110" width="310" height="150" fill="#ffffff" stroke="#1d2a3a" stroke-width="3" rx="12" />
<text x="215.0" y="146" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle">한국 셀러(매도인)</text>
<text x="215.0" y="176" font-size="17" font-weight="600" fill="#1d2a3a" text-anchor="middle">인보이스·패킹리스트 발행</text>
<text x="215.0" y="202" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">품명·HS 6단위·매수인 정보</text>
<rect x="460" y="110" width="360" height="150" fill="#f2faf5" stroke="#1f8a5b" stroke-width="3" rx="12" />
<text x="640.0" y="146" font-size="21" font-weight="800" fill="#1f8a5b" text-anchor="middle">한국 포워더</text>
<text x="640.0" y="176" font-size="17" font-weight="600" fill="#1d2a3a" text-anchor="middle">House B/L 발행</text>
<text x="640.0" y="202" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">송하인: 셀러 · 수하인: EU 매수인</text>
<rect x="910" y="110" width="320" height="150" fill="#f1f6fd" stroke="#1f6fd1" stroke-width="3" rx="12" />
<text x="1070.0" y="146" font-size="21" font-weight="800" fill="#1f6fd1" text-anchor="middle">선사(운송인)</text>
<text x="1070.0" y="176" font-size="17" font-weight="600" fill="#1d2a3a" text-anchor="middle">Master B/L 발행</text>
<text x="1070.0" y="202" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">송하인: 한국 포워더</text>
<rect x="1340" y="110" width="270" height="150" fill="#fdf3ef" stroke="#e4572e" stroke-width="3" rx="12" />
<text x="1475.0" y="146" font-size="21" font-weight="800" fill="#e4572e" text-anchor="middle">EU 매수인·수하인</text>
<text x="1475.0" y="176" font-size="17" font-weight="600" fill="#1d2a3a" text-anchor="middle">EORI 보유</text>
<text x="1475.0" y="202" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">매도인·매수인 자료</text>
<line x1="374" y1="185" x2="454" y2="185" stroke="#1d2a3a" stroke-width="3" marker-end="url(#a-ink)"/>
<line x1="824" y1="185" x2="904" y2="185" stroke="#1d2a3a" stroke-width="3" marker-end="url(#a-ink)"/>
<text x="415" y="174" font-size="15" font-weight="700" fill="#5f6b78" text-anchor="middle">운송 의뢰</text>
<text x="865" y="174" font-size="15" font-weight="700" fill="#5f6b78" text-anchor="middle">부킹</text>
<line x1="1234" y1="215" x2="1334" y2="215" stroke="#5f6b78" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-ink)"/>
<text x="1285" y="244" font-size="15" font-weight="700" fill="#5f6b78" text-anchor="middle">도착 후</text>
<text x="1285" y="264" font-size="15" font-weight="700" fill="#5f6b78" text-anchor="middle">인도</text>
<text x="54" y="300" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="start">부킹 때 주고받을 것: 선사 EORI · Master B/L 번호 · House 신고인 EORI · House B/L 발행 사실(이행규정 제184조 제2항)</text>
<text x="54" y="328" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">House 단계 송하인·수하인은 실제 당사자: 운송인·포워더·콘솔사·관세사 이름은 불가(부속서 B 13 02·13 03 주석)</text>
<rect x="30" y="370" width="1612" height="541" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16" />
<text x="54" y="414" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">ICS2에 들어가는 부분 신고와 연결 (다중 신고)</text>
<rect x="60" y="445" width="520" height="112" fill="#f1f6fd" stroke="#1f6fd1" stroke-width="3" rx="12" />
<text x="320.0" y="481" font-size="21" font-weight="800" fill="#1f6fd1" text-anchor="middle">F12 · 선사</text>
<text x="320.0" y="511" font-size="17" font-weight="600" fill="#1d2a3a" text-anchor="middle">Master B/L 자료만</text>
<text x="320.0" y="537" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">House 신고인 EORI·신고 유형 기재 → 책임 이전</text>
<rect x="60" y="575" width="520" height="112" fill="#f2faf5" stroke="#1f8a5b" stroke-width="3" rx="12" />
<text x="320.0" y="611" font-size="21" font-weight="800" fill="#1f8a5b" text-anchor="middle">F15 · 한국 포워더(또는 대리인)</text>
<text x="320.0" y="641" font-size="17" font-weight="600" fill="#1d2a3a" text-anchor="middle">House B/L 자료 + 매도인·매수인</text>
<text x="320.0" y="667" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">품목별 품명·HS 6단위·EORI</text>
<rect x="60" y="705" width="520" height="112" fill="#fdf3ef" stroke="#e4572e" stroke-width="3" rx="12" stroke-dasharray="9 6"/>
<text x="320.0" y="741" font-size="21" font-weight="800" fill="#e4572e" text-anchor="middle">F16 · EU 수하인</text>
<text x="320.0" y="771" font-size="17" font-weight="600" fill="#1d2a3a" text-anchor="middle">매도인·매수인 자료만</text>
<text x="320.0" y="797" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">수하인이 포워더에게 자료를 주지 않을 때</text>
<rect x="680" y="470" width="400" height="300" fill="#ffffff" stroke="#1d2a3a" stroke-width="3" rx="14" />
<text x="880" y="508" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="middle">ICS2 공동 저장소</text>
<text x="880" y="544" font-size="18" font-weight="700" fill="#5f6b78" text-anchor="middle">연결 키(linking key)</text>
<text x="720" y="586" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">① 운송인 EORI</text>
<text x="720" y="620" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">② Master B/L 번호</text>
<text x="720" y="654" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">③ House 신고인 EORI</text>
<line x1="710" y1="690" x2="1050" y2="690" stroke="#c9d2dc" stroke-width="2" />
<text x="880" y="724" font-size="19" font-weight="800" fill="#1f8a5b" text-anchor="middle">모두 연결되면 하나의 ENS</text>
<text x="880" y="752" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="middle">(제출 순서는 상관없음)</text>
<line x1="584" y1="501" x2="676" y2="560" stroke="#1d2a3a" stroke-width="2.5" marker-end="url(#a-ink)"/>
<line x1="584" y1="631" x2="676" y2="620" stroke="#1d2a3a" stroke-width="2.5" marker-end="url(#a-ink)"/>
<line x1="584" y1="761" x2="676" y2="620" stroke="#1d2a3a" stroke-width="2.5" marker-end="url(#a-ink)"/>
<line x1="1084" y1="620" x2="1146" y2="620" stroke="#1d2a3a" stroke-width="3" marker-end="url(#a-ink)"/>
<rect x="1150" y="445" width="460" height="372" fill="#ffffff" stroke="#d9482b" stroke-width="3" rx="14" />
<text x="1380" y="482" font-size="21" font-weight="800" fill="#d9482b" text-anchor="middle">첫 입국 세관(예: 네덜란드)</text>
<text x="1380" y="510" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="middle">위험 분석 결과를 신고한 사람에게 통지</text>
<rect x="1172" y="535" width="416" height="74" fill="#fbfcfd" stroke="#1f8a5b" stroke-width="2" rx="10" />
<text x="1192" y="566" font-size="19" font-weight="800" fill="#1f8a5b" text-anchor="start">평가 완료</text>
<text x="1192" y="593" font-size="17" font-weight="600" fill="#1d2a3a" text-anchor="start">적재·운송 진행</text>
<rect x="1172" y="625" width="416" height="74" fill="#fbfcfd" stroke="#1f6fd1" stroke-width="2" rx="10" />
<text x="1192" y="656" font-size="19" font-weight="800" fill="#1f6fd1" text-anchor="start">정보 요청(RFI)</text>
<text x="1192" y="683" font-size="17" font-weight="600" fill="#1d2a3a" text-anchor="start">낸 사람이 답해야 분석 재개</text>
<rect x="1172" y="715" width="416" height="74" fill="#fbfcfd" stroke="#d9482b" stroke-width="2" rx="10" />
<text x="1192" y="746" font-size="19" font-weight="800" fill="#d9482b" text-anchor="start">적재 금지(Do Not Load)</text>
<text x="1192" y="773" font-size="17" font-weight="600" fill="#1d2a3a" text-anchor="start">해상: ENS 접수 후 24시간 안 통지</text>
<text x="54" y="858" font-size="17" font-weight="700" fill="#1d2a3a" text-anchor="start">기한: 모든 부분 신고는 EU로 들어갈 배에 싣기 24시간 전(위임규정 제105조(a)). 적재 금지는 ENS 접수 후 24시간 안에 올 수 있음(이행규정 제186조 제5항)</text>
<text x="54" y="886" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="start">책임: 각자 낸 부분에 각자 책임(위임규정 제113a조 제1항). 정정·무효도 자기가 낸 부분만(이행규정 제188조 제1항). 회사·일정은 설명용 예시</text>
</svg>
