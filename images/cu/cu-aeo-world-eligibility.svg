<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5f6b78"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f8a5b"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c93c22"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="24" y="22" width="1624" height="897" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="48" y="66" font-size="26" font-weight="800" fill="#1d2a3a">누가 어느 제도에 가입할 수 있나: 한국 포워더 본사는 회원이 아니라 회원의 거래처</text>
<text x="48" y="96" font-size="16" font-weight="600" fill="#3d4a5a">각국 세관이 공개한 자격 요건(2026. 11. 5. 확인)을 요약했습니다. 현지 법인은 그 나라 기업이므로 그 나라 요건으로 따로 판단합니다.</text>
<rect x="48" y="116" width="170" height="46" rx="0" fill="#1d2a3a" stroke="#1d2a3a" stroke-width="1"/>
<text x="60" y="146" font-size="16" font-weight="800" fill="#ffffff">제도</text>
<rect x="218" y="116" width="330" height="46" rx="0" fill="#1d2a3a" stroke="#1d2a3a" stroke-width="1"/>
<text x="230" y="146" font-size="16" font-weight="800" fill="#ffffff">신청 자격의 기준</text>
<rect x="548" y="116" width="250" height="46" rx="0" fill="#1d2a3a" stroke="#1d2a3a" stroke-width="1"/>
<text x="560" y="146" font-size="16" font-weight="800" fill="#ffffff">그 나라 포워더</text>
<rect x="798" y="116" width="190" height="46" rx="0" fill="#1d2a3a" stroke="#1d2a3a" stroke-width="1"/>
<text x="810" y="146" font-size="16" font-weight="800" fill="#ffffff">한국 포워더 본사</text>
<rect x="988" y="116" width="250" height="46" rx="0" fill="#1d2a3a" stroke="#1d2a3a" stroke-width="1"/>
<text x="1000" y="146" font-size="16" font-weight="800" fill="#ffffff">한국 포워더의 현지 법인</text>
<rect x="1238" y="116" width="386" height="46" rx="0" fill="#1d2a3a" stroke="#1d2a3a" stroke-width="1"/>
<text x="1250" y="146" font-size="16" font-weight="800" fill="#ffffff">한국 포워더에게 오는 경로</text>
<rect x="48" y="162" width="170" height="108" rx="0" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="60" y="196" font-size="17" font-weight="800" fill="#1d2a3a">미국 CTPAT</text>
<rect x="218" y="162" width="330" height="108" rx="0" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="230" y="194" font-size="15" font-weight="500" fill="#1d2a3a">미국 기업 중심. 해외는 캐나다·멕시코 제조사,</text>
<text x="230" y="217" font-size="15" font-weight="500" fill="#1d2a3a">멕시코 장거리 운송사, 비거주 캐나다 수입자만</text>
<rect x="548" y="162" width="250" height="108" rx="0" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="560" y="194" font-size="15" font-weight="500" fill="#1d2a3a">미국 콘솔사·OTI·NVOCC 유형.</text>
<text x="560" y="217" font-size="15" font-weight="500" fill="#1d2a3a">자산 없는 3PL은 시범사업</text>
<rect x="798" y="162" width="190" height="108" rx="0" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="810" y="196" font-size="16" font-weight="800" fill="#c93c22">직접 가입 유형 없음</text>
<rect x="988" y="162" width="250" height="108" rx="0" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="1000" y="196" font-size="15" font-weight="700" fill="#1f8a5b">미국 법인은 유형 요건을 갖추면</text>
<text x="1000" y="219" font-size="15" font-weight="700" fill="#1f8a5b">신청</text>
<rect x="1238" y="162" width="386" height="108" rx="0" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="1250" y="194" font-size="15" font-weight="500" fill="#1d2a3a">미국 수입자의 보안 질문지(MSC 3.1·3.5), 검증 때 해외</text>
<text x="1250" y="217" font-size="15" font-weight="500" fill="#1d2a3a">현장 방문</text>
<rect x="48" y="270" width="170" height="108" rx="0" fill="#f7f9fc" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="60" y="304" font-size="17" font-weight="800" fill="#1d2a3a">EU AEO</text>
<rect x="218" y="270" width="330" height="108" rx="0" fill="#f7f9fc" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="230" y="302" font-size="15" font-weight="500" fill="#1d2a3a">EU 관세영역 설립(등록 사무소·본부·고정</text>
<text x="230" y="325" font-size="15" font-weight="500" fill="#1d2a3a">사업장)과 EORI</text>
<rect x="548" y="270" width="250" height="108" rx="0" fill="#f7f9fc" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="560" y="302" font-size="15" font-weight="500" fill="#1d2a3a">가입 가능(AEOC·AEOS·AEOF)</text>
<rect x="798" y="270" width="190" height="108" rx="0" fill="#f7f9fc" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="810" y="304" font-size="16" font-weight="800" fill="#c93c22">신청 대상 아님</text>
<rect x="988" y="270" width="250" height="108" rx="0" fill="#f7f9fc" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="1000" y="304" font-size="15" font-weight="700" fill="#1f8a5b">EU 법인·고정 사업장이 자기</text>
<text x="1000" y="327" font-size="15" font-weight="700" fill="#1f8a5b">이름으로 신청</text>
<rect x="1238" y="270" width="386" height="108" rx="0" fill="#f7f9fc" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="1250" y="302" font-size="15" font-weight="500" fill="#1d2a3a">EU AEOS 업체의 보안 선언서와 계약 조항(UCC-IA</text>
<text x="1250" y="325" font-size="15" font-weight="500" fill="#1d2a3a">제28조)</text>
<rect x="48" y="378" width="170" height="108" rx="0" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="60" y="412" font-size="17" font-weight="800" fill="#1d2a3a">중국</text>
<text x="60" y="436" font-size="17" font-weight="800" fill="#1d2a3a">고급인증·인증기업</text>
<rect x="218" y="378" width="330" height="108" rx="0" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="230" y="410" font-size="15" font-weight="500" fill="#1d2a3a">중국 해관에 등록·신고한 기업(2026. 4.부터</text>
<text x="230" y="433" font-size="15" font-weight="500" fill="#1d2a3a">5등급)</text>
<rect x="548" y="378" width="250" height="108" rx="0" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="560" y="410" font-size="15" font-weight="500" fill="#1d2a3a">등록 기업이면 신청</text>
<rect x="798" y="378" width="190" height="108" rx="0" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="810" y="412" font-size="16" font-weight="800" fill="#c93c22">신청 대상 아님</text>
<rect x="988" y="378" width="250" height="108" rx="0" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="1000" y="412" font-size="15" font-weight="700" fill="#1f8a5b">중국 법인이 해관 등록 뒤 신청</text>
<rect x="1238" y="378" width="386" height="108" rx="0" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="1250" y="410" font-size="15" font-weight="500" fill="#1d2a3a">중국 파트너의 신용 등급을 해관 공시 플랫폼으로 사전</text>
<text x="1250" y="433" font-size="15" font-weight="500" fill="#1d2a3a">조회</text>
<rect x="48" y="486" width="170" height="108" rx="0" fill="#f7f9fc" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="60" y="520" font-size="17" font-weight="800" fill="#1d2a3a">일본 AEO</text>
<rect x="218" y="486" width="330" height="108" rx="0" fill="#f7f9fc" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="230" y="518" font-size="15" font-weight="500" fill="#1d2a3a">지역 세관장에 신청, NACCS 사용 능력 등 네</text>
<text x="230" y="541" font-size="15" font-weight="500" fill="#1d2a3a">요건</text>
<rect x="548" y="486" width="250" height="108" rx="0" fill="#f7f9fc" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="560" y="518" font-size="15" font-weight="500" fill="#1d2a3a">물류업자 유형으로 신청</text>
<rect x="798" y="486" width="190" height="108" rx="0" fill="#f7f9fc" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="810" y="520" font-size="16" font-weight="800" fill="#c93c22">신청 대상 아님</text>
<rect x="988" y="486" width="250" height="108" rx="0" fill="#f7f9fc" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="1000" y="520" font-size="15" font-weight="700" fill="#1f8a5b">일본 법인이 요건을 갖추면 신청</text>
<rect x="1238" y="486" width="386" height="108" rx="0" fill="#f7f9fc" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="1250" y="518" font-size="15" font-weight="500" fill="#1d2a3a">일본 AEO의 준수 프로그램 거래처 요건에 따른 확인</text>
<rect x="48" y="594" width="170" height="108" rx="0" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="60" y="628" font-size="17" font-weight="800" fill="#1d2a3a">캐나다 PIP</text>
<rect x="218" y="594" width="330" height="108" rx="0" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="230" y="626" font-size="15" font-weight="500" fill="#1d2a3a">캐나다 기반, 또는 미국 기반의 운송인·수입자</text>
<rect x="548" y="594" width="250" height="108" rx="0" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="560" y="626" font-size="15" font-weight="500" fill="#1d2a3a">캐나다 기반 포워더 가입 가능</text>
<rect x="798" y="594" width="190" height="108" rx="0" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="810" y="628" font-size="16" font-weight="800" fill="#c93c22">신청 대상 아님</text>
<rect x="988" y="594" width="250" height="108" rx="0" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="1000" y="628" font-size="15" font-weight="700" fill="#1f8a5b">캐나다 법인이 요건을 갖추면</text>
<text x="1000" y="651" font-size="15" font-weight="700" fill="#1f8a5b">신청</text>
<rect x="1238" y="594" width="386" height="108" rx="0" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="1250" y="626" font-size="15" font-weight="500" fill="#1d2a3a">현지 회원사의 거래처 확인 요청</text>
<rect x="48" y="702" width="170" height="108" rx="0" fill="#f7f9fc" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="60" y="736" font-size="17" font-weight="800" fill="#1d2a3a">싱가포르 STP</text>
<rect x="218" y="702" width="330" height="108" rx="0" fill="#f7f9fc" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="230" y="734" font-size="15" font-weight="500" fill="#1d2a3a">유효한 싱가포르 세관 계정과 좋은 준수 기록</text>
<rect x="548" y="702" width="250" height="108" rx="0" fill="#f7f9fc" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="560" y="734" font-size="15" font-weight="500" fill="#1d2a3a">신청 가능(STP, STP-Plus)</text>
<rect x="798" y="702" width="190" height="108" rx="0" fill="#f7f9fc" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="810" y="736" font-size="16" font-weight="800" fill="#c93c22">신청 대상 아님</text>
<rect x="988" y="702" width="250" height="108" rx="0" fill="#f7f9fc" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="1000" y="736" font-size="15" font-weight="700" fill="#1f8a5b">싱가포르 법인이 신청</text>
<rect x="1238" y="702" width="386" height="108" rx="0" fill="#f7f9fc" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="1250" y="734" font-size="15" font-weight="500" fill="#1d2a3a">현지 회원사의 거래처 확인 요청</text>
<rect x="48" y="826" width="1576" height="76" rx="12" fill="#f4f8fd" stroke="#1f6fd1" stroke-width="2"/>
<text x="68" y="860" font-size="18" font-weight="800" fill="#1f6fd1">한국 포워더 본사가 직접 쓸 수 있는 것: 한국 관세청 AEO(화물운송주선업자 부문) 공인과 MRA</text>
<text x="68" y="890" font-size="16" font-weight="600" fill="#1d2a3a">공인은 법인 단위라 본사와 현지 법인 사이에 넘어가지 않습니다. 공인이 없으면 질문지·선언서에 실제 절차와 인증서로 답합니다.</text>
</svg>