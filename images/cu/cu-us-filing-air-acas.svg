<text x="54" y="330" font-size="18" font-weight="800" fill="#8a96a3" text-anchor="start">PST</text>
<text x="874.5" y="304" font-size="1" font-weight="400" fill="#1d2a3a" text-anchor="start"></text>
<text x="156.0" y="258" font-size="17" font-weight="700" fill="#5f6b78" text-anchor="start">11. 12.</text>
<text x="880.5" y="258" font-size="17" font-weight="700" fill="#5f6b78" text-anchor="start">11. 13.(KST)</text>
