<text x="1116.0" y="304" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="middle">03:00</text>
<text x="1116.0" y="330" font-size="18" font-weight="600" fill="#8a96a3" text-anchor="middle">10:00</text>
<line x1="1357.5" y1="264" x2="1357.5" y2="280" stroke="#1d2a3a" stroke-width="2"/>
<text x="1357.5" y="304" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="middle">06:00</text>
<text x="1357.5" y="330" font-size="18" font-weight="600" fill="#8a96a3" text-anchor="middle">13:00</text>
<line x1="1599.0" y1="264" x2="1599.0" y2="280" stroke="#1d2a3a" stroke-width="2"/>
