<text x="391.5" y="164" font-size="21" font-weight="800" fill="#1f8a5b" text-anchor="middle">ACAS 자료: 비행기에 싣기 전까지</text>
<rect x="633.0" y="210" width="885.5" height="30" fill="#1f6fd1" rx="6"/>
<text x="914.75" y="232" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">비행 11시간(예시)</text>
