<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30" y="30" width="1612" height="420" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="54" y="74" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">인천발 LA행 예시: Trade Act 기한보다 ACAS 기한이 먼저 온다</text>
