<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker><marker id="a-sub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5f6b78"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<text x="40" y="58" font-size="28" font-weight="800" fill="#1d2a3a" text-anchor="start" >수입 세금은 과세가격 → 관세 → 부가가치세 순서로 쌓입니다</text>
<text x="40" y="94" font-size="20" font-weight="600" fill="#5f6b78" text-anchor="start" >예시: FOB USD 20,000 화물 · 환율 1,400원/USD와 관세율 8%는 가정값 (관세법 제30조, 부가가치세법 제29조)</text>
<line x1="40" y1="840" x2="1632" y2="840" stroke="#9aa7b5" stroke-width="2"/>
<rect x="120" y="410.3" width="170" height="429.7" fill="#7fa7e0"/>
<rect x="120" y="378.1" width="170" height="32.2" fill="#1f6fd1"/>
<rect x="120" y="377.0" width="170" height="1.1" fill="#123f80"/>
<text x="205.0" y="625.1679986250751" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" >① 인보이스</text>
<text x="205.0" y="653.1679986250751" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" >FOB USD 20,000</text>
<line x1="290" y1="394.223597147031" x2="314" y2="394.223597147031" stroke="#1d2a3a" stroke-width="2"/>
<text x="320" y="401.223597147031" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start" >② 운임 USD 1,500</text>
<line x1="290" y1="377.03703703703695" x2="314" y2="355.03703703703695" stroke="#1d2a3a" stroke-width="2"/>
<text x="320" y="361.03703703703695" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start" >③ 보험료 USD 50</text>
<text x="205.0" y="874" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle" >④ 과세가격(CIF)</text>
<text x="205.0" y="902" font-size="18" font-weight="700" fill="#5f6b78" text-anchor="middle" >USD 21,550 = 30,170,000원</text>
<rect x="560" y="803.0" width="170" height="37.0" fill="#d9482b"/>
<text x="645.0" y="788.9629629629629" font-size="20" font-weight="800" fill="#d9482b" text-anchor="middle" >2,413,600원</text>
<text x="645.0" y="874" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle" >⑤ 관세</text>
<text x="645.0" y="902" font-size="18" font-weight="700" fill="#5f6b78" text-anchor="middle" >④ × 8%</text>
<rect x="900" y="377.0" width="170" height="463.0" fill="#7fa7e0"/>
<rect x="900" y="340.0" width="170" height="37.0" fill="#d9482b"/>
<text x="985.0" y="608.5185185185185" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" >④ 과세가격</text>
<text x="985.0" y="326.0" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="middle" >32,583,600원</text>
<line x1="1070" y1="358.5185185185185" x2="1090" y2="358.5185185185185" stroke="#1d2a3a" stroke-width="2"/>
<text x="1096" y="365.5185185185185" font-size="19" font-weight="800" fill="#d9482b" text-anchor="start" >+ ⑤ 관세</text>
<text x="985.0" y="874" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle" >⑥ 부가가치세 과세표준</text>
<text x="985.0" y="902" font-size="18" font-weight="700" fill="#5f6b78" text-anchor="middle" >④ + ⑤</text>
<rect x="1260" y="803.0" width="170" height="37.0" fill="#d9482b"/>
<rect x="1260" y="753.0" width="170" height="50.0" fill="#1f8a5b"/>
<line x1="1430" y1="821.4814814814815" x2="1450" y2="821.4814814814815" stroke="#1d2a3a" stroke-width="2"/>
<text x="1456" y="828.4814814814815" font-size="19" font-weight="700" fill="#d9482b" text-anchor="start" >⑤ 관세 2,413,600</text>
<line x1="1430" y1="777.9629629629629" x2="1450" y2="777.9629629629629" stroke="#1d2a3a" stroke-width="2"/>
<text x="1456" y="784.9629629629629" font-size="19" font-weight="700" fill="#1f8a5b" text-anchor="start" >⑦ 부가세 3,258,360</text>
<text x="1345.0" y="702.9629629629629" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="middle" >세관 납부 합계</text>
<text x="1345.0" y="734.9629629629629" font-size="24" font-weight="800" fill="#1d2a3a" text-anchor="middle" >5,671,960원</text>
<text x="1345.0" y="874" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle" >⑧ 납부 = ⑤ + ⑦</text>
<text x="1345.0" y="902" font-size="18" font-weight="700" fill="#5f6b78" text-anchor="middle" >⑦ = ⑥ × 10%</text>
<rect x="40" y="124" width="840" height="196" fill="#fff4ef" stroke="#f3c3b3" stroke-width="2" rx="12" />
<text x="64" y="164" font-size="22" font-weight="800" fill="#e4572e" text-anchor="start" >운임을 빠뜨리면</text>
<text x="64" y="202" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start" >과세가격이 USD 1,550(2,170,000원) 줄어 관세 173,600원, 부가가치세 234,360원이</text>
<text x="64" y="232" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start" >덜 계산되고, 나중에 부족세액으로 추징될 수 있습니다.</text>
<text x="64" y="294" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start" >관세가 부가가치세 과세표준에 들어가므로 관세율이 높을수록 부가가치세도 커집니다.</text>
</svg>
