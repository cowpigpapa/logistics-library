<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<text x="40" y="58" font-size="28" font-weight="800" fill="#1d2a3a">특송물품 수입통관은 물품가격으로 세 갈래로 나뉩니다</text>
<text x="40" y="94" font-size="20" font-weight="600" fill="#5f6b78">특송물품 수입통관 사무처리에 관한 고시 제9조·제10조·별표 1~3 (관세청고시 제2026-56호, 2026. 9. 29. 시행)</text>

<!-- price axis -->
<text x="40" y="146" font-size="18" font-weight="700" fill="#5f6b78">물품가격(미화, 축척 아님)</text>
<rect x="40" y="160" width="520" height="40" fill="#1f8a5b"/>
<rect x="560" y="160" width="590" height="40" fill="#1f6fd1"/>
<rect x="1150" y="160" width="482" height="40" fill="#e4572e"/>
<text x="300" y="187" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">목록통관</text>
<text x="855" y="187" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">간이신고</text>
<text x="1391" y="187" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">일반수입신고</text>
<line x1="560" y1="150" x2="560" y2="212" stroke="#1d2a3a" stroke-width="3"/>
<line x1="1150" y1="150" x2="1150" y2="212" stroke="#1d2a3a" stroke-width="3"/>
<text x="560" y="234" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="middle">150달러</text>
<text x="1150" y="234" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="middle">2,000달러</text>
<text x="40" y="234" font-size="17" font-weight="600" fill="#5f6b78">미국발 특송(한미 FTA 특례)은 경계가 150달러 대신 200달러</text>

<!-- panel A -->
<rect x="40" y="256" width="500" height="380" rx="16" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2"/>
<rect x="40" y="256" width="500" height="54" rx="16" fill="#1f8a5b"/>
<rect x="40" y="290" width="500" height="20" fill="#1f8a5b"/>
<text x="64" y="292" font-size="22" font-weight="800" fill="#ffffff">목록통관 특송물품</text>
<text x="64" y="346" font-size="20" font-weight="800" fill="#1d2a3a">150달러 이하 · 미국발 200달러 이하</text>
<text x="64" y="388" font-size="18" font-weight="700" fill="#1f8a5b">대상</text>
<text x="64" y="414" font-size="18" fill="#1d2a3a">우리나라 거주자가 받는 자가사용물품,</text>
<text x="64" y="440" font-size="18" fill="#1d2a3a">면세되는 상업용 견본품</text>
<text x="64" y="480" font-size="18" font-weight="700" fill="#1f8a5b">방법</text>
<text x="64" y="506" font-size="18" fill="#1d2a3a">특송업체가 통관목록을 세관에 제출하면</text>
<text x="64" y="532" font-size="18" fill="#1d2a3a">수입신고를 생략</text>
<text x="64" y="572" font-size="18" font-weight="700" fill="#1f8a5b">세금</text>
<text x="64" y="598" font-size="18" fill="#1d2a3a">관세·부가가치세 없이 반출</text>

<!-- panel B -->
<rect x="586" y="256" width="500" height="380" rx="16" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2"/>
<rect x="586" y="256" width="500" height="54" rx="16" fill="#1f6fd1"/>
<rect x="586" y="290" width="500" height="20" fill="#1f6fd1"/>
<text x="610" y="292" font-size="22" font-weight="800" fill="#ffffff">간이신고특송물품</text>
<text x="610" y="346" font-size="20" font-weight="800" fill="#1d2a3a">150(미국발 200)달러 초과 ~ 2,000달러</text>
<text x="610" y="388" font-size="18" font-weight="700" fill="#1f6fd1">방법</text>
<text x="610" y="414" font-size="18" fill="#1d2a3a">첨부서류 없이 신고서를 전자 제출</text>
<text x="610" y="440" font-size="18" fill="#1d2a3a">검사 대상이면 송품장·B/L·AWB 첨부</text>
<text x="610" y="480" font-size="18" font-weight="700" fill="#1f6fd1">세금</text>
<text x="610" y="506" font-size="18" fill="#1d2a3a">과세. 면세 기준을 넘으면 공제 없이</text>
<text x="610" y="532" font-size="18" fill="#1d2a3a">운임·보험료를 포함한 과세가격 전체에 과세</text>
<text x="610" y="572" font-size="18" font-weight="700" fill="#1f6fd1">신고서</text>
<text x="610" y="598" font-size="18" fill="#1d2a3a">개인 전자상거래물품은 전용 수입신고서</text>

<!-- panel C -->
<rect x="1132" y="256" width="500" height="380" rx="16" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2"/>
<rect x="1132" y="256" width="500" height="54" rx="16" fill="#e4572e"/>
<rect x="1132" y="290" width="500" height="20" fill="#e4572e"/>
<text x="1156" y="292" font-size="22" font-weight="800" fill="#ffffff">일반수입신고특송물품</text>
<text x="1156" y="346" font-size="20" font-weight="800" fill="#1d2a3a">2,000달러 초과</text>
<text x="1156" y="388" font-size="18" font-weight="700" fill="#e4572e">방법</text>
<text x="1156" y="414" font-size="18" fill="#1d2a3a">수입통관 사무처리에 관한 고시의</text>
<text x="1156" y="440" font-size="18" fill="#1d2a3a">일반 수입신고 절차</text>
<text x="1156" y="480" font-size="18" font-weight="700" fill="#e4572e">세금·요건</text>
<text x="1156" y="506" font-size="18" fill="#1d2a3a">관세·내국세 과세, 개별 법령의</text>
<text x="1156" y="532" font-size="18" fill="#1d2a3a">요건 확인도 일반 화물과 같음</text>
<text x="1156" y="572" font-size="18" font-weight="700" fill="#e4572e">수리</text>
<text x="1156" y="598" font-size="18" fill="#1d2a3a">입항 전 신고 건도 X-ray 검사 뒤 수리</text>

<!-- exclusions -->
<rect x="40" y="660" width="1592" height="226" rx="16" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2"/>
<text x="64" y="700" font-size="20" font-weight="800" fill="#d9482b">가격과 관계없이 목록통관에서 빠지는 물품 (별표 1)</text>
<text x="64" y="734" font-size="18" fill="#1d2a3a">의약품, 한약재, 야생동물 관련 제품, 검역대상 농림축수산물,</text>
<text x="64" y="762" font-size="18" fill="#1d2a3a">건강기능식품, 지식재산권 침해 의심물품, 식품류·주류·담배류,</text>
<text x="64" y="790" font-size="18" fill="#1d2a3a">기능성·성분미상 화장품, 품명·가격·수신인 정보가 부정확한 물품 등</text>
<text x="64" y="830" font-size="18" font-weight="700" fill="#1d2a3a">→ 수입신고를 해야 하고, 이때 면세 기준은</text>
<text x="64" y="858" font-size="18" font-weight="700" fill="#1d2a3a">미국발도 150달러 (관세청 안내)</text>
<line x1="836" y1="684" x2="836" y2="862" stroke="#c9d2dc" stroke-width="2"/>
<text x="864" y="700" font-size="20" font-weight="800" fill="#d9482b">간이신고에서 빠지는 물품 (별표 2)</text>
<text x="864" y="734" font-size="18" fill="#1d2a3a">별표 1 물품, 세관장확인대상물품, FTA 협정관세 적용 신청,</text>
<text x="864" y="762" font-size="18" fill="#1d2a3a">추천이 필요한 할당·양허세율 신청, 사후관리 용도세율,</text>
<text x="864" y="790" font-size="18" fill="#1d2a3a">유통이력 신고대상, 성상이 변한 물품, 이사물품 등</text>
<text x="864" y="830" font-size="18" font-weight="700" fill="#1d2a3a">→ 2,000달러 이하라도 일반수입신고</text>

<text x="40" y="918" font-size="17" font-weight="600" fill="#5f6b78">물품가격 = 구매대금 + 발송국 안에서 생긴 세금·운송료·보험료. 우리나라까지 오는 국제운임·보험료는 뺍니다(관세법 시행규칙 제45조 제2항, 고시 별표 3).</text>
</svg>
