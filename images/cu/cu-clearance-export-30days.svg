<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker><marker id="a-sub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5f6b78"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<text x="40" y="58" font-size="28" font-weight="800" fill="#1d2a3a" text-anchor="start" >수출신고 수리 후 30일 안에 운송수단에 싣습니다</text>
<text x="40" y="94" font-size="20" font-weight="600" fill="#5f6b78" text-anchor="start" >관세법 제251조, 수출 및 반송통관에 관한 고시 제65조·제73조</text>
<rect x="150" y="250" width="750" height="48" fill="#1f8a5b" stroke="#1f8a5b" stroke-width="0" rx="6" />
<text x="525.0" y="282" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" >수리일부터 30일 이내 적재</text>
<rect x="900" y="250" width="700" height="48" fill="#f7d9d1" stroke="#e9a897" stroke-width="2" rx="6" />
<text x="1250.0" y="282" font-size="22" font-weight="800" fill="#d9482b" text-anchor="middle" >30일 경과</text>
<line x1="150" y1="206" x2="150" y2="312" stroke="#1d2a3a" stroke-width="3"/>
<text x="150" y="338" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="middle" >수리일</text>
<line x1="900" y1="206" x2="900" y2="312" stroke="#1d2a3a" stroke-width="3"/>
<text x="900" y="338" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="middle" >30일째</text>
<text x="162" y="226" font-size="20" font-weight="700" fill="#1d2a3a" text-anchor="start" >수출신고 수리</text>
<path d="M330 208 H510 L490 236 H346 Z" fill="#2f5aa8"/>
<rect x="350" y="184" width="32" height="22" fill="#e4572e" stroke="#ffffff" stroke-width="1.5"/>
<rect x="384" y="184" width="32" height="22" fill="#1f8a5b" stroke="#ffffff" stroke-width="1.5"/>
<rect x="418" y="184" width="32" height="22" fill="#1f6fd1" stroke="#ffffff" stroke-width="1.5"/>
<rect x="452" y="184" width="32" height="22" fill="#d9a066" stroke="#ffffff" stroke-width="1.5"/>
<rect x="478" y="170" width="22" height="38" fill="#ffffff" stroke="#2f5aa8" stroke-width="3"/>
<text x="528" y="212" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start" >적재 (기간 안 분할 적재 가능)</text>
<rect x="40" y="380" width="850" height="240" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16" />
<text x="64" y="422" font-size="24" font-weight="800" fill="#1f8a5b" text-anchor="start" >적재가 확인되는 연결 고리</text>
<rect x="64" y="446" width="330" height="92" fill="#ffffff" stroke="#1f8a5b" stroke-width="2" rx="10" />
<text x="229.0" y="486" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="middle" >House 출항 적재화물목록</text>
<text x="229.0" y="513" font-size="20" font-weight="700" fill="#1d2a3a" text-anchor="middle" >수출신고번호 기재</text>
<line x1="400" y1="492" x2="470" y2="492" stroke="#1f8a5b" stroke-width="5" marker-end="url(#a-green)"/>
<rect x="480" y="446" width="380" height="92" fill="#ffffff" stroke="#1f8a5b" stroke-width="2" rx="10" />
<text x="670.0" y="486" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="middle" >세관 시스템</text>
<text x="670.0" y="513" font-size="20" font-weight="700" fill="#1d2a3a" text-anchor="middle" >적재 확인</text>
<text x="64" y="580" font-size="20" font-weight="600" fill="#5f6b78" text-anchor="start" >번호가 틀리면 실제로 실었어도 확인되지 않습니다</text>
<rect x="40" y="646" width="850" height="254" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16" />
<text x="64" y="688" font-size="24" font-weight="800" fill="#1f6fd1" text-anchor="start" >30일을 넘길 것 같으면</text>
<text x="64" y="730" font-size="21" font-weight="700" fill="#1d2a3a" text-anchor="start" >선박 지연·부킹 변경 → 변경 전 적재기간 안에</text>
<text x="64" y="764" font-size="21" font-weight="700" fill="#1d2a3a" text-anchor="start" >통관지 세관장에게 적재기간 연장승인 신청</text>
<rect x="64" y="800" width="520" height="70" fill="#eef4fc" stroke="#bcd3f2" stroke-width="2" rx="10" />
<text x="84" y="844" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="start" >수리일부터 1년 범위에서 승인</text>
<line x1="840" y1="366" x2="840" y2="306" stroke="#1f6fd1" stroke-width="4" marker-end="url(#a-blue)"/>
<text x="826" y="360" font-size="19" font-weight="800" fill="#1f6fd1" text-anchor="end" >연장 신청은 기한 전에</text>
<rect x="920" y="380" width="712" height="520" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16" />
<text x="944" y="422" font-size="24" font-weight="800" fill="#d9482b" text-anchor="start" >30일이 지나면</text>
<rect x="944" y="446" width="664" height="78" fill="#ffffff" stroke="#d9482b" stroke-width="2" rx="10" />
<text x="1276.0" y="492" font-size="20" font-weight="700" fill="#1d2a3a" text-anchor="middle" >매주 월요일 조회 → 수출신고수리취소 예정통보</text>
<line x1="1276.0" y1="526" x2="1276.0" y2="556" stroke="#d9482b" stroke-width="4" marker-end="url(#a-red)"/>
<rect x="944" y="560" width="664" height="78" fill="#ffffff" stroke="#d9482b" stroke-width="2" rx="10" />
<text x="1276.0" y="606" font-size="20" font-weight="700" fill="#1d2a3a" text-anchor="middle" >신고인이 통보일부터 14일 안에 원인규명</text>
<line x1="1276.0" y1="640" x2="1276.0" y2="670" stroke="#d9482b" stroke-width="4" marker-end="url(#a-red)"/>
<rect x="944" y="674" width="664" height="78" fill="#fdecea" stroke="#d9482b" stroke-width="3" rx="10" />
<text x="1276.0" y="720" font-size="20" font-weight="800" fill="#d9482b" text-anchor="middle" >미적재·규명 불가 → 수출신고 수리 취소</text>
<text x="944" y="790" font-size="19" font-weight="600" fill="#5f6b78" text-anchor="start" >이미 실었는데 번호 누락·오기라면 적재화물목록 정정</text>
<text x="944" y="822" font-size="19" font-weight="600" fill="#5f6b78" text-anchor="start" >취소 전 적재가 확인되면 취소하지 않음(시행령 제255조)</text>
<text x="944" y="854" font-size="19" font-weight="600" fill="#5f6b78" text-anchor="start" >제251조 제1항 위반은 200만원 이하 과태료</text>
</svg>
