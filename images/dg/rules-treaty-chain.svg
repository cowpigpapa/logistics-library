<text x="230.0" y="229.0" font-size="18" font-weight="600" fill="#1d2a3a" text-anchor="start">「위험물의 안전한 항공운송」</text>
<text x="230.0" y="254.0" font-size="18" font-weight="600" fill="#1d2a3a" text-anchor="start">(1952년 가입)</text>
