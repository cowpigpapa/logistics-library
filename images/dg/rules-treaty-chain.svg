<rect x="580.0" y="496.0" width="300.0" height="120.0" fill="#e6f3ec" stroke="#1f8a5b" stroke-width="2" rx="10"/>
<text x="600.0" y="530.0" font-size="18" font-weight="800" fill="#1f8a5b" text-anchor="start">IMDG Code</text>
<text x="600.0" y="556.0" font-size="18" font-weight="800" fill="#1f8a5b" text-anchor="start">(해양오염물질 규정)</text>
<line x1="884.0" y1="556.0" x2="916.0" y2="556.0" stroke="#5f6b78" stroke-width="3" marker-end="url(#a-sub)"/>
