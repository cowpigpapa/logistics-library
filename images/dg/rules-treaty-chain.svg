<text x="940.0" y="798.0" font-size="18" font-weight="600" fill="#1d2a3a" text-anchor="start">철도안전법</text>
<text x="940.0" y="823.0" font-size="18" font-weight="600" fill="#1d2a3a" text-anchor="start">제44조·제44조의3(교육)</text>
<line x1="1254.0" y1="820.0" x2="1286.0" y2="820.0" stroke="#5f6b78" stroke-width="3" marker-end="url(#a-sub)"/>
<rect x="1290.0" y="764.0" width="342.0" height="112.0" fill="#ffffff" stroke="#c9d2dc" stroke-width="2" rx="10"/>
<text x="1310.0" y="798.0" font-size="17.5" font-weight="500" fill="#1d2a3a" text-anchor="start">철도안전법 시행령·시행규칙</text>
<rect x="580.0" y="286.0" width="300.0" height="54.0" fill="#fff8e6" stroke="#c98a00" stroke-width="2" rx="8" stroke-dasharray="5 4"/>
<text x="594.0" y="308.0" font-size="15" font-weight="600" fill="#8a5f00" text-anchor="start">IATA DGR: 민간 규정(항공사 실무 기준).</text>
<text x="594.0" y="328.0" font-size="15" font-weight="600" fill="#8a5f00" text-anchor="start">항공사가 접수 조건으로 요구</text>
<text x="40.0" y="916.0" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="start">헌법 제6조: 체결·공포된 조약은 국내법과 같은 효력. 다만 화주·포워더가 직접 따르는 의무와 제재는 국내 법률과 하위 규정이 정합니다.</text>
