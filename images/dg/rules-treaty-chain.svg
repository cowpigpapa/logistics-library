<rect width="1672" height="941" fill="#ffffff"/>
<text x="40.0" y="58.0" font-size="30" font-weight="800" fill="#1d2a3a" text-anchor="start">조약에서 국내법으로: 한국이 받아들인 경로</text>
<text x="40.0" y="94.0" font-size="19" font-weight="500" fill="#5f6b78" text-anchor="start">한국에서 법적 의무가 되는 것은 한국이 당사국인 조약의 규칙을 국내 법률과 하위 규정으로 옮긴 부분입니다.</text>
<text x="375.0" y="146.0" font-size="19" font-weight="800" fill="#5f6b78" text-anchor="middle">조약(한국의 지위)</text>
<text x="730.0" y="146.0" font-size="19" font-weight="800" fill="#5f6b78" text-anchor="middle">국제 기술규칙</text>
<text x="1085.0" y="146.0" font-size="19" font-weight="800" fill="#5f6b78" text-anchor="middle">한국 법률</text>
<text x="1461.0" y="146.0" font-size="19" font-weight="800" fill="#5f6b78" text-anchor="middle">시행규칙·고시</text>
