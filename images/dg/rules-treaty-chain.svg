<rect x="210.0" y="634.0" width="330.0" height="112.0" fill="#ffffff" stroke="#d9482b" stroke-width="2" rx="10" stroke-dasharray="7 5"/>
<text x="230.0" y="668.0" font-size="18" font-weight="600" fill="#d9482b" text-anchor="start">ADR</text>
<text x="230.0" y="693.0" font-size="18" font-weight="600" fill="#d9482b" text-anchor="start">한국은 당사국 아님</text>
<line x1="560.0" y1="690.0" x2="900.0" y2="690.0" stroke="#d9482b" stroke-width="2" stroke-dasharray="6 6"/>
<text x="730.0" y="680.0" font-size="16" font-weight="700" fill="#d9482b" text-anchor="middle">조약에 뿌리를 두지 않은 국내법</text>
<rect x="920.0" y="634.0" width="330.0" height="112.0" fill="#ffffff" stroke="#e4572e" stroke-width="2.5" rx="10"/>
<text x="940.0" y="668.0" font-size="18" font-weight="600" fill="#1d2a3a" text-anchor="start">위험물안전관리법</text>
<text x="940.0" y="693.0" font-size="18" font-weight="600" fill="#1d2a3a" text-anchor="start">제20·21·28조 등 국내법</text>
<line x1="1254.0" y1="690.0" x2="1286.0" y2="690.0" stroke="#5f6b78" stroke-width="3" marker-end="url(#a-sub)"/>
<rect x="1290.0" y="634.0" width="342.0" height="112.0" fill="#ffffff" stroke="#c9d2dc" stroke-width="2" rx="10"/>
<text x="1310.0" y="668.0" font-size="17.5" font-weight="500" fill="#1d2a3a" text-anchor="start">각 법의 시행령·시행규칙</text>
<rect x="40.0" y="764.0" width="150.0" height="112.0" fill="#fbe9e5" stroke="#d9482b" stroke-width="2.5" rx="12"/>
<text x="115.0" y="828.0" font-size="21" font-weight="800" fill="#d9482b" text-anchor="middle">철도</text>
<rect x="210.0" y="764.0" width="330.0" height="112.0" fill="#ffffff" stroke="#d9482b" stroke-width="2" rx="10" stroke-dasharray="7 5"/>
<text x="230.0" y="798.0" font-size="18" font-weight="600" fill="#d9482b" text-anchor="start">COTIF 부록 C(RID)</text>
<text x="230.0" y="823.0" font-size="18" font-weight="600" fill="#d9482b" text-anchor="start">한국은 체약국 아님</text>
