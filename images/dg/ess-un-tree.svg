<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs>
<marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker>
<marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker>
<marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker>
<marker id="a-sub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5f6b78"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker>
</defs>
<rect width="1672" height="941" fill="#ffffff"/>
<text x="40" y="58" font-size="30" font-weight="800" fill="#1d2a3a" text-anchor="start">ESS·대형 배터리, 어떤 UN 번호인가</text>
<text x="40" y="94" font-size="19" font-weight="500" fill="#5f6b78" text-anchor="start">용량이 아니라 "배터리가 어디에 붙어 어떤 일을 하는가"가 UN 번호를 가릅니다. 리튬이온·리튬금속 기준(IMDG Code 42-24).</text>
<rect x="40" y="130" width="300" height="110" fill="#eef1f4" stroke="#c9d2dc" stroke-width="2" rx="12"/>
<text x="190" y="175" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="middle">보낼 물건</text>
<text x="190" y="207" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="middle">ESS 컨테이너, 캐비닛, 모듈, 팩</text>
<rect x="400" y="140" width="600" height="128" fill="#ffffff" stroke="#8a96a3" stroke-width="2" rx="12"/>
<circle cx="432" cy="174" r="17" fill="#1f6fd1"/>
<text x="432" y="180.5" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
<text x="462" y="181" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">배터리가 화물운송단위(CTU)에 고정 설치돼</text>
<text x="462" y="209" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">외부로 전력을 공급하는 것이 유일한 목적인가?</text>
<text x="462" y="237" font-size="15.5" font-weight="500" fill="#5f6b78" text-anchor="start">예: ISO 컨테이너형 BESS. CTU는 CSC 승인 컨테이너 등</text>
<rect x="400" y="350" width="600" height="128" fill="#ffffff" stroke="#8a96a3" stroke-width="2" rx="12"/>
<circle cx="432" cy="384" r="17" fill="#1f6fd1"/>
<text x="432" y="390.5" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
<text x="462" y="391" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">배터리가 기기(캐비닛·랙 등) 안에 설치돼 있고</text>
<text x="462" y="419" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">그 기기가 장비에 해당하는가?</text>
<text x="462" y="447" font-size="15.5" font-weight="500" fill="#5f6b78" text-anchor="start">P903의 장비: 셀·배터리가 그 작동에 전력을 주는 기기</text>
<rect x="400" y="560" width="600" height="128" fill="#ffffff" stroke="#8a96a3" stroke-width="2" rx="12"/>
<circle cx="432" cy="594" r="17" fill="#1f6fd1"/>
<text x="432" y="600.5" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
<text x="462" y="601" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">모듈·팩·랙용 배터리를 따로 보내는가?</text>
<text x="462" y="629" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">(장비와 함께 포장하면 UN 3481 함께 포장)</text>
<text x="462" y="657" font-size="15.5" font-weight="500" fill="#5f6b78" text-anchor="start">총중량 12kg 이상, 충격에 강한 외장이면 P903 (2)</text>
<line x1="340" y1="185" x2="395" y2="196" stroke="#5f6b78" stroke-width="3" marker-end="url(#a-sub)"/>
<line x1="1000" y1="204" x2="1074" y2="204" stroke="#1f8a5b" stroke-width="3" marker-end="url(#a-green)"/>
<line x1="1000" y1="414" x2="1074" y2="414" stroke="#1f8a5b" stroke-width="3" marker-end="url(#a-green)"/>
<line x1="1000" y1="624" x2="1074" y2="624" stroke="#1f8a5b" stroke-width="3" marker-end="url(#a-green)"/>
<text x="1037" y="196" font-size="17" font-weight="800" fill="#1f8a5b" text-anchor="middle">예</text>
<text x="1037" y="406" font-size="17" font-weight="800" fill="#1f8a5b" text-anchor="middle">예</text>
<text x="1037" y="616" font-size="17" font-weight="800" fill="#1f8a5b" text-anchor="middle">예</text>
<line x1="700" y1="268" x2="700" y2="344" stroke="#d9482b" stroke-width="3" marker-end="url(#a-red)"/>
<text x="716" y="314" font-size="17" font-weight="800" fill="#d9482b" text-anchor="start">아니오</text>
<line x1="700" y1="478" x2="700" y2="554" stroke="#d9482b" stroke-width="3" marker-end="url(#a-red)"/>
<text x="716" y="524" font-size="17" font-weight="800" fill="#d9482b" text-anchor="start">아니오</text>
<rect x="1080" y="130" width="552" height="170" fill="#fbfcfd" stroke="#d9482b" stroke-width="3" rx="14"/>
<text x="1104" y="170" font-size="25" font-weight="800" fill="#d9482b" text-anchor="start">UN 3536</text>
<text x="1104" y="204" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">LITHIUM BATTERIES INSTALLED IN CARGO TRANSPORT UNIT</text>
<text x="1104" y="229" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">특별규정 389 · 포장지침 없음 · 한정수량 0</text>
<text x="1104" y="254" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">컨테이너 반대쪽 두 측면 표찰과 UN 번호</text>
<text x="1104" y="279" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">해상 적재방법 D(화물선 갑판 위만)</text>
<rect x="1080" y="340" width="552" height="170" fill="#fbfcfd" stroke="#1f6fd1" stroke-width="3" rx="14"/>
<text x="1104" y="380" font-size="25" font-weight="800" fill="#1f6fd1" text-anchor="start">UN 3481 (장비에 내장)</text>
<text x="1104" y="414" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">P903 (4): 튼튼한 외부 포장, 대형 장비는</text>
<text x="1104" y="439" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">배터리를 충분히 보호하면 포장 없이·팔레트도 가능</text>
<text x="1104" y="464" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">외부 공급이 주목적인 저장 장치는 장비로</text>
<text x="1104" y="489" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">보기 어려울 수 있음: 제조사 판정 근거를 받는다</text>
<rect x="1080" y="550" width="552" height="170" fill="#fbfcfd" stroke="#1f8a5b" stroke-width="3" rx="14"/>
<text x="1104" y="590" font-size="25" font-weight="800" fill="#1f8a5b" text-anchor="start">UN 3480 (배터리 단독)</text>
<text x="1104" y="624" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">P903 (1)·(2) 또는 대형 포장 LP903</text>
<text x="1104" y="649" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">(셀 500g 초과, 배터리 12kg 초과)</text>
<text x="1104" y="674" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">단자 단락 방지, 단자에 위 짐 하중 금지</text>
<text x="1104" y="699" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">해상 적재방법 A(갑판 위·아래)</text>
<rect x="40" y="760" width="1592" height="150" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="66" y="798" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="start">번호를 고르기 전에 먼저 걸러야 하는 것</text>
<text x="66" y="832" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">손상·결함이 있으면 SP 376(P908·LP904, 열적으로 불안정하면 P911·LP906)</text>
<text x="66" y="859" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">시제품·100개 이하 생산분이면 SP 310(P910·LP905)</text>
<text x="860" y="832" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">나트륨이온은 UN 3551·3552: UN 3536은 리튬이온·리튬금속만 해당</text>
<text x="860" y="859" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">리튬금속 배터리는 UN 3090·3091(형태 구분은 같음)</text>
<text x="66" y="892" font-size="14" font-weight="500" fill="#5f6b78" text-anchor="start">출처: IMDG Code 42-24 특별규정 360·389, P903, LP903, 2.9.4·2.9.5, 위험물 목록</text>
</svg>
