<text x="1425.0" y="312.72" font-size="47" font-weight="800" fill="#111111" text-anchor="middle">3536</text>
<text x="836" y="300" font-size="20" font-weight="800" fill="#5f6b78" text-anchor="middle">또는</text>
<text x="410" y="500" font-size="15.5" font-weight="600" fill="#5f6b78" text-anchor="middle">표찰: 한 변 250mm 이상, 안쪽 선 12.5mm</text>
<text x="1262" y="500" font-size="15.5" font-weight="600" fill="#5f6b78" text-anchor="middle">패널: 높이 120mm·너비 300mm 이상, 검정 테두리 10mm</text>
<rect x="40" y="530" width="520" height="248" fill="#fbfcfd" stroke="#d9482b" stroke-width="3" rx="16"/>
<text x="66" y="570" font-size="22" font-weight="800" fill="#d9482b" text-anchor="start">바깥에 붙이는 것</text>
<text x="66" y="610" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">반대쪽 두 측면에 Class 9 표찰(9A가 아님)</text>
<text x="66" y="640" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">UN 번호 3536: 표찰 안 흰 부분 또는 옆 오렌지 패널</text>
<text x="66" y="670" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">숫자 높이 65mm 이상, 검정</text>
<text x="66" y="700" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">4,000kg 기준과 관계없이 UN 번호를 표시</text>
<text x="66" y="730" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">(일반 위험물 컨테이너는 양 측면·양 끝 네 곳)</text>
<rect x="576" y="530" width="520" height="248" fill="#fbfcfd" stroke="#1f6fd1" stroke-width="3" rx="16"/>
<text x="602" y="570" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="start">안에 둘 수 있는 것</text>
<text x="602" y="610" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">견고하게 고정한 배터리(랙·캐비닛)</text>
<text x="602" y="640" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">과충전·과방전 방지 장치(배터리 관리 시스템)</text>
<text x="602" y="670" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">컨테이너 운용에 필요한 위험물만:</text>
<text x="602" y="700" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">소화 설비, 공조 설비 등(고정·설치 상태)</text>
<text x="602" y="730" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">배터리 자체에는 표시·라벨 불필요</text>
<rect x="1112" y="530" width="520" height="248" fill="#fbfcfd" stroke="#e4572e" stroke-width="3" rx="16"/>
<text x="1138" y="570" font-size="22" font-weight="800" fill="#e4572e" text-anchor="start">안에 두면 안 되는 것</text>
<text x="1138" y="610" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">운용에 필요하지 않은 위험물 전부</text>
<text x="1138" y="640" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">예: 예비 배터리 모듈, 냉매·소화약제 예비 용기,</text>
<text x="1138" y="670" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">스프레이·페인트 같은 소모품</text>
<text x="1138" y="700" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">빈 공간에 위험물인 부품을 넣어 보내면</text>
<text x="1138" y="730" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">특별규정 389를 지키지 못한다</text>
<rect x="40" y="800" width="1592" height="64" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="66" y="840" font-size="17" font-weight="600" fill="#1d2a3a" text-anchor="start">표찰·UN 번호는 바닷물에 3개월 잠겨도 알아볼 수 있는 방법으로 붙입니다. 두 측면의 부착 사진은 화주에게 받아 둡니다(5.3.1.1).</text>
<text x="40" y="914" font-size="14" font-weight="500" fill="#5f6b78" text-anchor="start">출처: IMDG Code 42-24 특별규정 389, 5.3.1.1.2, 5.3.1.1.4.1, 5.3.1.2.1, 5.3.2.1.2, 5.2.2.2(Class 9 표지). 도해는 비율 예시이며 실제 도안은 규정 원문을 따릅니다.</text>
</svg>
