<text x="387.0" y="199.8" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
<text x="413.0" y="201.0" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="start">창고 보관</text>
<text x="373.0" y="256.0" font-size="15" font-weight="800" fill="#5f6b78" text-anchor="start">적용 법령</text>
<text x="373.0" y="282.0" font-size="17.5" font-weight="500" fill="#1d2a3a" text-anchor="start">위험물안전관리법 제4·5조,</text>
<text x="373.0" y="308.0" font-size="17.5" font-weight="500" fill="#1d2a3a" text-anchor="start">화관법(보관·저장업),</text>
<text x="373.0" y="334.0" font-size="17.5" font-weight="500" fill="#1d2a3a" text-anchor="start">고압가스법(저장소),</text>
<text x="373.0" y="360.0" font-size="17.5" font-weight="500" fill="#1d2a3a" text-anchor="start">화재예방법(특수가연물)</text>
<text x="373.0" y="398.0" font-size="15" font-weight="800" fill="#5f6b78" text-anchor="start">판단 기준</text>
<text x="373.0" y="424.0" font-size="17.5" font-weight="600" fill="#1d2a3a" text-anchor="start">별표 1의 품명과 지정수량.</text>
<text x="373.0" y="450.0" font-size="17.5" font-weight="600" fill="#1d2a3a" text-anchor="start">품명이 여럿이면 배수 합산</text>
<text x="373.0" y="488.0" font-size="15" font-weight="800" fill="#5f6b78" text-anchor="start">실무에서 묻는 질문</text>
<text x="373.0" y="514.0" font-size="17.5" font-weight="500" fill="#1d2a3a" text-anchor="start">창고 전체에 어떤 품명이</text>
<text x="373.0" y="540.0" font-size="17.5" font-weight="500" fill="#1d2a3a" text-anchor="start">몇 L·kg 있는가</text>
