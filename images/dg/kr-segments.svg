<text x="70.0" y="199.8" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
<text x="96.0" y="201.0" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="start">제조·수입</text>
<text x="56.0" y="256.0" font-size="15" font-weight="800" fill="#5f6b78" text-anchor="start">적용 법령</text>
<text x="56.0" y="282.0" font-size="17.5" font-weight="500" fill="#1d2a3a" text-anchor="start">화평법, 산업안전보건법,</text>
<text x="56.0" y="308.0" font-size="17.5" font-weight="500" fill="#1d2a3a" text-anchor="start">화관법</text>
<text x="56.0" y="346.0" font-size="15" font-weight="800" fill="#5f6b78" text-anchor="start">판단 기준</text>
<text x="56.0" y="372.0" font-size="17.5" font-weight="600" fill="#1d2a3a" text-anchor="start">물질의 유해성</text>
<text x="56.0" y="398.0" font-size="17.5" font-weight="600" fill="#1d2a3a" text-anchor="start">(등록·지정 여부), GHS 분류</text>
<text x="56.0" y="436.0" font-size="15" font-weight="800" fill="#5f6b78" text-anchor="start">실무에서 묻는 질문</text>
<text x="56.0" y="462.0" font-size="17.5" font-weight="500" fill="#1d2a3a" text-anchor="start">SDS가 있는가,</text>
<text x="56.0" y="488.0" font-size="17.5" font-weight="500" fill="#1d2a3a" text-anchor="start">유해화학물질로 지정된</text>
<text x="56.0" y="514.0" font-size="17.5" font-weight="500" fill="#1d2a3a" text-anchor="start">성분이 있는가</text>
