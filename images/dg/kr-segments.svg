<rect width="1672" height="941" fill="#ffffff"/>
<text x="40.0" y="58.0" font-size="30" font-weight="800" fill="#1d2a3a" text-anchor="start">같은 수출 화물이 구간마다 만나는 기준</text>
<text x="40.0" y="94.0" font-size="19" font-weight="500" fill="#5f6b78" text-anchor="start">구간이 바뀔 때마다 "이 화물이 위험물인가"를 판단하는 기준 자체가 바뀝니다.</text>
