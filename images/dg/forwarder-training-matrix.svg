<text x="447.2" y="642.0" font-size="15.5" font-weight="600" fill="#1d2a3a" text-anchor="start">위험물 · 40/24h</text>
<text x="302.0" y="666.0" font-size="15.5" font-weight="600" fill="#5f6b78" text-anchor="start">보안검색(직무기능 10) 교육과는 별개</text>
<text x="844.0" y="608.0" font-size="16.5" font-weight="500" fill="#5f6b78" text-anchor="start">—</text>
<text x="1264.0" y="608.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="start">—</text>
<rect x="30.0" y="676.0" width="1612.0" height="88.0" fill="#f7f9fb" stroke="none" stroke-width="0" rx="8"/>
<text x="54.0" y="728.0" font-size="18.5" font-weight="800" fill="#1d2a3a" text-anchor="start">운전자</text>
<text x="302.0" y="706.0" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">고시 표에 운전자 구분 없음</text>
<text x="844.0" y="706.0" font-size="16.5" font-weight="600" fill="#1d2a3a" text-anchor="start">위험물 적재차량 운전자: 제7호 4h</text>
<text x="844.0" y="729.0" font-size="16.5" font-weight="600" fill="#1d2a3a" text-anchor="start">(다른 법 교육 이수자는 제외)</text>
<text x="1264.0" y="706.0" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">지정수량 이상 운반: 위험물운반자</text>
<text x="1264.0" y="729.0" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">(강습 8h, 실무 4h)</text>
<text x="1264.0" y="752.0" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">탱크로리: 위험물운송자</text>
<rect x="30.0" y="768.0" width="1612.0" height="88.0" fill="#ffffff" stroke="none" stroke-width="0" rx="8"/>
<text x="54.0" y="820.0" font-size="18.5" font-weight="800" fill="#1d2a3a" text-anchor="start">관리자</text>
<text x="302.0" y="798.0" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">교육훈련프로그램 수립·운영(1.4.1.1)</text>
<text x="302.0" y="821.0" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">보안 교육훈련 확인(1.5.2.3), 기록 36개월(1.4.4.3 가.)</text>
<text x="302.0" y="844.0" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">본인이 그 업무를 하면 해당 직무기능</text>
<text x="844.0" y="798.0" font-size="16.5" font-weight="600" fill="#1d2a3a" text-anchor="start">본인이 위험물을 취급하면 제3호</text>
<text x="1264.0" y="798.0" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">운송사 운전자의 자격·교육 확인</text>
<rect x="40.0" y="866.0" width="30.0" height="24.0" fill="#1f6fd1" stroke="none" stroke-width="0" rx="12"/>
