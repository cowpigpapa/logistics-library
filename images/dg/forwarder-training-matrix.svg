<rect x="230.0" y="866.0" width="30.0" height="24.0" fill="#ffffff" stroke="#1f6fd1" stroke-width="2" rx="12" stroke-dasharray="5 3"/>
<text x="270.0" y="884.0" font-size="15.5" font-weight="600" fill="#5f6b78" text-anchor="start">"2에 준함": 고시에 꼭 맞는 구분이 없어 고용주가 정하는 해석(표 1-4의 주)</text>
<text x="40.0" y="912.0" font-size="15.5" font-weight="600" fill="#5f6b78" text-anchor="start">항공 시간은 표 1-4(b)의 초기/정기 최소 시간. 항공·해상 모두 24개월 이내 재교육(해상 재교육 8h, 운전자 4h). 항공과 해상 교육을 서로 인정하는 조문은 없습니다.</text>
