<rect width="1672" height="941" fill="#ffffff"/>
<text x="40.0" y="58.0" font-size="30" font-weight="800" fill="#1d2a3a" text-anchor="start">직무별 교육 대상: 직함이 아니라 실제로 하는 일로 정합니다</text>
<text x="40.0" y="94.0" font-size="19" font-weight="500" fill="#5f6b78" text-anchor="start">「항공위험물운송기술기준」(2026. 10. 22. 전부개정) 표 1-4·1-4(b)와 「위험물 선박운송 기준」 별표 28·29를 포워더 직무에 대응시킨 해석입니다.</text>
