<text x="1264.0" y="516.0" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">허가 시설 안전관리자(위안법 제28조)</text>
<text x="1264.0" y="539.0" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">유해화학물질 화관법 제33조</text>
<text x="1264.0" y="562.0" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">MSDS 대상물질 산안법 MSDS 교육</text>
<rect x="30.0" y="578.0" width="1612.0" height="94.0" fill="#ffffff" stroke="none" stroke-width="0" rx="8"/>
<text x="54.0" y="633.0" font-size="18.5" font-weight="800" fill="#1d2a3a" text-anchor="start">항공사 인도</text>
<rect x="302.0" y="588.0" width="35.5" height="32.0" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.2" rx="16" stroke-dasharray="5 3"/>
