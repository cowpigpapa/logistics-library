<text x="302.0" y="470.0" font-size="15.5" font-weight="600" fill="#1d2a3a" text-anchor="start">포장 · 40/24h</text>
<rect x="435.4" y="416.0" width="35.5" height="32.0" fill="#1f6fd1" stroke="none" stroke-width="0" rx="16"/>
<text x="453.1" y="438.0" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
