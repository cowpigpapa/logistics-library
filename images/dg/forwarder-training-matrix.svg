<text x="484.6" y="316.0" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="start">(5.1.4.1 나.·5.4.1.6.1 다.)</text>
<text x="844.0" y="276.0" font-size="16.5" font-weight="600" fill="#1d2a3a" text-anchor="start">제3호, 화주 대리면</text>
<text x="844.0" y="299.0" font-size="16.5" font-weight="600" fill="#1d2a3a" text-anchor="start">제1호 대리인(24h)</text>
