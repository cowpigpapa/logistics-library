<text x="844.0" y="196.0" font-size="16.5" font-weight="600" fill="#1d2a3a" text-anchor="start">위험물 건 주선: 제3호 24h</text>
<text x="844.0" y="219.0" font-size="16.5" font-weight="600" fill="#1d2a3a" text-anchor="start">일반화물만이면 문언상 대상 아님</text>
