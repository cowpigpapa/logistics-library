<text x="844.0" y="436.0" font-size="16.5" font-weight="600" fill="#1d2a3a" text-anchor="start">포장: 제2호</text>
<text x="844.0" y="459.0" font-size="16.5" font-weight="600" fill="#1d2a3a" text-anchor="start">포워더 직원의 컨테이너 적입: 제3호</text>
<text x="1264.0" y="436.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="start">—</text>
<rect x="30.0" y="486.0" width="1612.0" height="88.0" fill="#f7f9fb" stroke="none" stroke-width="0" rx="8"/>
<text x="54.0" y="538.0" font-size="18.5" font-weight="800" fill="#1d2a3a" text-anchor="start">창고 보관·취급</text>
<rect x="302.0" y="496.0" width="35.5" height="32.0" fill="#1f6fd1" stroke="none" stroke-width="0" rx="16"/>
<text x="319.7" y="518.0" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
