<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs>
<marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker>
<marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker>
<marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker>
<marker id="a-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a96a3"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker>
<marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c98a00"/></marker>
<marker id="a-sub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5f6b78"/></marker>
</defs>
<rect width="1672" height="941" fill="#ffffff"/>
<text x="40.0" y="58.0" font-size="30" font-weight="800" fill="#1d2a3a" text-anchor="start">둘 이상을 함께 둘 때: 지정수량 배수의 합산(위험물안전관리법 제5조제5항)</text>
<text x="40.0" y="94.0" font-size="19" font-weight="500" fill="#5f6b78" text-anchor="start">각 위험물의 수량을 그 지정수량으로 나눈 값을 더해, 합계가 1 이상이면 지정수량 이상으로 봅니다(설명용 가정 수량).</text>
<rect x="40.0" y="120.0" width="760.0" height="790.0" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="64.0" y="162.0" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">품목별로 보면 둘 다 미만</text>
<rect x="840.0" y="120.0" width="792.0" height="790.0" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="864.0" y="162.0" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">같은 장소에서 더하면 1.1</text>
<line x1="80.0" y1="320.0" x2="770.0" y2="320.0" stroke="#d9482b" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="770.0" y="308.0" font-size="18" font-weight="800" fill="#d9482b" text-anchor="end">1.0 (지정수량)</text>
<line x1="80.0" y1="770.0" x2="770.0" y2="770.0" stroke="#1d2a3a" stroke-width="2"/>
<rect x="150.0" y="545.0" width="200.0" height="225.0" fill="#e8f0fb" stroke="#1f6fd1" stroke-width="2.5" rx="6"/>
<text x="250.0" y="529.0" font-size="26" font-weight="800" fill="#1f6fd1" text-anchor="middle">0.5</text>
<text x="250.0" y="804.0" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="middle">휘발유 100L</text>
<text x="250.0" y="830.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="middle">÷ 200L(제1석유류 비수용성)</text>
<rect x="470.0" y="500.0" width="200.0" height="270.0" fill="#e6f3ec" stroke="#1f8a5b" stroke-width="2.5" rx="6"/>
<text x="570.0" y="484.0" font-size="26" font-weight="800" fill="#1f8a5b" text-anchor="middle">0.6</text>
<text x="570.0" y="804.0" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="middle">경유 600L</text>
<text x="570.0" y="830.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="middle">÷ 1,000L(제2석유류 비수용성)</text>
<line x1="880.0" y1="770.0" x2="1600.0" y2="770.0" stroke="#1d2a3a" stroke-width="2"/>
<rect x="1060.0" y="545.0" width="220.0" height="225.0" fill="#e8f0fb" stroke="#1f6fd1" stroke-width="2.5" rx="0"/>
<text x="1170.0" y="665.5" font-size="21" font-weight="800" fill="#1f6fd1" text-anchor="middle">휘발유 0.5</text>
<rect x="1060.0" y="275.0" width="220.0" height="270.0" fill="#e6f3ec" stroke="#1f8a5b" stroke-width="2.5" rx="0"/>
<text x="1170.0" y="418.0" font-size="21" font-weight="800" fill="#1f8a5b" text-anchor="middle">경유 0.6</text>
<text x="1170.0" y="259.0" font-size="28" font-weight="800" fill="#d9482b" text-anchor="middle">합계 1.1</text>
<text x="1170.0" y="804.0" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="middle">같은 창고</text>
<line x1="880.0" y1="320.0" x2="1600.0" y2="320.0" stroke="#d9482b" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="1600.0" y="308.0" font-size="18" font-weight="800" fill="#d9482b" text-anchor="end">1.0</text>
<rect x="1310.0" y="360.0" width="300.0" height="230.0" fill="#fbe9e5" stroke="#d9482b" stroke-width="2.5" rx="12"/>
<text x="1326.0" y="395.9" font-size="21" font-weight="800" fill="#d9482b" text-anchor="start">1 이상이면</text>
<text x="1326.0" y="423.2" font-size="21" font-weight="800" fill="#d9482b" text-anchor="start">지정수량 이상</text>
<text x="1326.0" y="454.6" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">허가받은 저장소가 아닌</text>
<text x="1326.0" y="478.4" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">곳에 함께 두면 제5조제1항</text>
<text x="1326.0" y="502.2" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">위반(무허가 저장)</text>
<text x="1326.0" y="526.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">운반에도 같은 계산</text>
<text x="880.0" y="870.0" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="start">혼재 창고는 화주별이 아니라 같은 장소에 있는 전체 위험물로 계산합니다.</text>
</svg>
