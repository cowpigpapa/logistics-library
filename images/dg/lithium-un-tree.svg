<rect width="1672" height="941" fill="#ffffff"/>
<text x="40.0" y="58.0" font-size="30" font-weight="800" fill="#1d2a3a" text-anchor="start">UN 번호 고르기: 화학 × 형태</text>
<text x="40.0" y="94.0" font-size="19" font-weight="500" fill="#5f6b78" text-anchor="start">리튬배터리는 모두 Class 9입니다. 용량과 상태는 UN 번호를 바꾸지 않고 적용 조건을 바꿉니다.</text>
<text x="360.0" y="134.0" font-size="20" font-weight="800" fill="#5f6b78" text-anchor="start">2  형태</text>
<rect x="364.0" y="146.0" width="310.0" height="76.0" fill="#eef1f4" stroke="#c9d2dc" stroke-width="2" rx="10"/>
<text x="519.0" y="180.0" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="middle">셀·배터리만</text>
<text x="519.0" y="206.0" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="middle">보조배터리 포함</text>
<rect x="682.0" y="146.0" width="310.0" height="76.0" fill="#eef1f4" stroke="#c9d2dc" stroke-width="2" rx="10"/>
<text x="837.0" y="180.0" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="middle">장비와 함께 포장</text>
<text x="837.0" y="206.0" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="middle">같은 포장 안에 장비와 여분 배터리</text>
<rect x="1000.0" y="146.0" width="310.0" height="76.0" fill="#eef1f4" stroke="#c9d2dc" stroke-width="2" rx="10"/>
<text x="1155.0" y="180.0" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="middle">장비에 내장</text>
<rect x="1318.0" y="146.0" width="310.0" height="76.0" fill="#eef1f4" stroke="#c9d2dc" stroke-width="2" rx="10"/>
<text x="1473.0" y="180.0" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="middle">배터리로 움직이는 차량</text>
<text x="1473.0" y="206.0" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="middle">전기차·전기자전거·휠체어 등</text>
<text x="40.0" y="134.0" font-size="20" font-weight="800" fill="#5f6b78" text-anchor="start">1  화학</text>
<rect x="40.0" y="236.0" width="304.0" height="104.0" fill="#e8f0fb" stroke="#1f6fd1" stroke-width="2.5" rx="12"/>
<text x="62.0" y="284.0" font-size="24" font-weight="800" fill="#1f6fd1" text-anchor="start">리튬이온</text>
<text x="62.0" y="314.0" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="start">리튬폴리머 포함</text>
<rect x="364.0" y="236.0" width="310.0" height="104.0" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5" rx="12"/>
<text x="519.0" y="286.0" font-size="30" font-weight="800" fill="#1f6fd1" text-anchor="middle">UN 3480</text>
<text x="519.0" y="316.0" font-size="13.5" font-weight="600" fill="#5f6b78" text-anchor="middle">BATTERIES</text>
<rect x="682.0" y="236.0" width="310.0" height="104.0" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5" rx="12"/>
<text x="837.0" y="286.0" font-size="30" font-weight="800" fill="#1f6fd1" text-anchor="middle">UN 3481</text>
<text x="837.0" y="316.0" font-size="13.5" font-weight="600" fill="#5f6b78" text-anchor="middle">PACKED WITH EQUIPMENT</text>
<rect x="1000.0" y="236.0" width="310.0" height="104.0" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5" rx="12"/>
<text x="1155.0" y="286.0" font-size="30" font-weight="800" fill="#1f6fd1" text-anchor="middle">UN 3481</text>
<text x="1155.0" y="316.0" font-size="13.5" font-weight="600" fill="#5f6b78" text-anchor="middle">CONTAINED IN EQUIPMENT</text>
<rect x="1318.0" y="236.0" width="310.0" height="104.0" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5" rx="12"/>
<text x="1473.0" y="286.0" font-size="30" font-weight="800" fill="#1f6fd1" text-anchor="middle">UN 3556</text>
<text x="1473.0" y="316.0" font-size="13.5" font-weight="600" fill="#5f6b78" text-anchor="middle">VEHICLE, ... POWERED</text>
<rect x="40.0" y="354.0" width="304.0" height="104.0" fill="#fdece6" stroke="#e4572e" stroke-width="2.5" rx="12"/>
<text x="62.0" y="402.0" font-size="24" font-weight="800" fill="#e4572e" text-anchor="start">리튬금속</text>
<text x="62.0" y="432.0" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="start">리튬합금 포함</text>
<rect x="364.0" y="354.0" width="310.0" height="104.0" fill="#ffffff" stroke="#e4572e" stroke-width="2.5" rx="12"/>
<text x="519.0" y="404.0" font-size="30" font-weight="800" fill="#e4572e" text-anchor="middle">UN 3090</text>
<text x="519.0" y="434.0" font-size="13.5" font-weight="600" fill="#5f6b78" text-anchor="middle">BATTERIES</text>
<rect x="682.0" y="354.0" width="310.0" height="104.0" fill="#ffffff" stroke="#e4572e" stroke-width="2.5" rx="12"/>
<text x="837.0" y="404.0" font-size="30" font-weight="800" fill="#e4572e" text-anchor="middle">UN 3091</text>
<text x="837.0" y="434.0" font-size="13.5" font-weight="600" fill="#5f6b78" text-anchor="middle">PACKED WITH EQUIPMENT</text>
<rect x="1000.0" y="354.0" width="310.0" height="104.0" fill="#ffffff" stroke="#e4572e" stroke-width="2.5" rx="12"/>
<text x="1155.0" y="404.0" font-size="30" font-weight="800" fill="#e4572e" text-anchor="middle">UN 3091</text>
<text x="1155.0" y="434.0" font-size="13.5" font-weight="600" fill="#5f6b78" text-anchor="middle">CONTAINED IN EQUIPMENT</text>
<rect x="1318.0" y="354.0" width="310.0" height="104.0" fill="#ffffff" stroke="#e4572e" stroke-width="2.5" rx="12"/>
<text x="1473.0" y="404.0" font-size="30" font-weight="800" fill="#e4572e" text-anchor="middle">UN 3557</text>
<text x="1473.0" y="434.0" font-size="13.5" font-weight="600" fill="#5f6b78" text-anchor="middle">VEHICLE, ... POWERED</text>
<rect x="40.0" y="472.0" width="304.0" height="104.0" fill="#e6f3ec" stroke="#1f8a5b" stroke-width="2.5" rx="12"/>
<text x="62.0" y="520.0" font-size="24" font-weight="800" fill="#1f8a5b" text-anchor="start">나트륨이온</text>
<text x="62.0" y="550.0" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="start">유기 전해질</text>
<rect x="364.0" y="472.0" width="310.0" height="104.0" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5" rx="12"/>
<text x="519.0" y="522.0" font-size="30" font-weight="800" fill="#1f8a5b" text-anchor="middle">UN 3551</text>
<text x="519.0" y="552.0" font-size="13.5" font-weight="600" fill="#5f6b78" text-anchor="middle">BATTERIES</text>
<rect x="682.0" y="472.0" width="310.0" height="104.0" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5" rx="12"/>
<text x="837.0" y="522.0" font-size="30" font-weight="800" fill="#1f8a5b" text-anchor="middle">UN 3552</text>
<text x="837.0" y="552.0" font-size="13.5" font-weight="600" fill="#5f6b78" text-anchor="middle">PACKED WITH EQUIPMENT</text>
<rect x="1000.0" y="472.0" width="310.0" height="104.0" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5" rx="12"/>
<text x="1155.0" y="522.0" font-size="30" font-weight="800" fill="#1f8a5b" text-anchor="middle">UN 3552</text>
<text x="1155.0" y="552.0" font-size="13.5" font-weight="600" fill="#5f6b78" text-anchor="middle">CONTAINED IN EQUIPMENT</text>
<rect x="1318.0" y="472.0" width="310.0" height="104.0" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5" rx="12"/>
<text x="1473.0" y="522.0" font-size="30" font-weight="800" fill="#1f8a5b" text-anchor="middle">UN 3558</text>
<text x="1473.0" y="552.0" font-size="13.5" font-weight="600" fill="#5f6b78" text-anchor="middle">VEHICLE, ... POWERED</text>
<rect x="40.0" y="600.0" width="520.0" height="162.0" fill="#eef1f4" stroke="#8a96a3" stroke-width="2.5" rx="12"/>
<text x="56.0" y="635.0" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="start">헷갈리는 품목</text>
<text x="56.0" y="665.0" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">보조배터리는 장비가 아니라 배터리(UN 3480)</text>
<text x="56.0" y="693.0" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">충전기·케이블과 배터리만: 배터리 단독</text>
<text x="56.0" y="721.0" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">리튬 잔디깎이·청소기(사람·화물 안 실음): 장비</text>
<rect x="580.0" y="600.0" width="520.0" height="162.0" fill="#eef1f4" stroke="#8a96a3" stroke-width="2.5" rx="12"/>
<text x="596.0" y="635.0" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="start">UN 3171과 UN 3536</text>
<text x="596.0" y="665.0" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">UN 3171은 이제 습식·금속 나트륨 배터리</text>
<text x="596.0" y="691.0" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">차량·장비에만 씀</text>
<text x="596.0" y="717.0" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">CTU에 고정 설치돼 외부에 전력을 공급하는</text>
<text x="596.0" y="743.0" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">리튬배터리는 UN 3536(IMDG 42-24·RID 2025)</text>
<rect x="1120.0" y="600.0" width="512.0" height="162.0" fill="#fbe9e5" stroke="#d9482b" stroke-width="2.5" rx="12"/>
<text x="1136.0" y="635.0" font-size="20" font-weight="800" fill="#d9482b" text-anchor="start">전기차를 UN 3171로 신고한 서류</text>
<text x="1136.0" y="665.0" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">항공 경과 기간은 2025-03-31에 종료</text>
<text x="1136.0" y="693.0" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">화주에게 확인 요청</text>
<rect x="40.0" y="780.0" width="780.0" height="128.0" fill="#e8f0fb" stroke="#1f6fd1" stroke-width="2.5" rx="12"/>
<text x="56.0" y="815.0" font-size="20" font-weight="800" fill="#1f6fd1" text-anchor="start">3  용량: 기준선 위인가 아래인가(모든 운송수단 같음)</text>
<text x="56.0" y="845.0" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">리튬이온·나트륨이온: 셀 20Wh, 배터리 100Wh  ·  리튬금속: 셀 1g, 배터리 2g</text>
<text x="56.0" y="873.0" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">아래이면 해상 특별규정 188, 항공 Section II·IB로 조건 완화(위험물은 그대로)</text>
<rect x="852.0" y="780.0" width="780.0" height="128.0" fill="#fdece6" stroke="#e4572e" stroke-width="2.5" rx="12"/>
<text x="868.0" y="815.0" font-size="20" font-weight="800" fill="#e4572e" text-anchor="start">4  상태: 정상품인가</text>
<text x="868.0" y="845.0" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">손상·결함(SP 376, 항공 A154 금지), 폐기·재활용(SP 377, 항공 A183 승인),</text>
<text x="868.0" y="873.0" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">시제품·소량 생산(SP 310, 항공 A88 승인): UN 번호는 그대로, 조건이 바뀜</text>
</svg>
