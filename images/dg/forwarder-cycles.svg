<text x="78.0" y="918.0" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="start">항공 교육훈련·평가 기록은 고용주가 최근 수료 월부터 최소 36개월 보관합니다(「항공위험물운송기술기준」 1.4.4.3 가.).</text>
