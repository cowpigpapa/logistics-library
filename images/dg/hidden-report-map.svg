<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs>
<marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker>
<marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker>
<marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker>
<marker id="a-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a96a3"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker>
<marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c98a00"/></marker>
<marker id="a-sub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5f6b78"/></marker>
</defs>
<rect width="1672" height="941" fill="#ffffff"/>
<text x="40.0" y="58.0" font-size="30" font-weight="800" fill="#1d2a3a" text-anchor="start">숨은 위험물을 발견한 뒤: 누가 어디에 보고하나</text>
<text x="40.0" y="94.0" font-size="19" font-weight="500" fill="#5f6b78" text-anchor="start">항공 화물은 포워더도 미신고 위험물을 발견하면 보고해야 하고(1.7.1 나.), 해상·보세 화물의 법정 보고 의무는 운송인과 보세구역 운영인에게 있습니다.</text>
<text x="40.0" y="146.0" font-size="19" font-weight="800" fill="#5f6b78" text-anchor="start">발견한 곳</text>
<text x="500.0" y="146.0" font-size="19" font-weight="800" fill="#5f6b78" text-anchor="start">보고 의무자</text>
<text x="940.0" y="146.0" font-size="19" font-weight="800" fill="#5f6b78" text-anchor="start">보고처</text>
<rect x="40.0" y="166.0" width="420.0" height="132.0" fill="#e8f0fb" stroke="#1f6fd1" stroke-width="2.5" rx="12"/>
<text x="64.0" y="240.0" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="start">항공 화물·우편물</text>
<line x1="462.0" y1="232.0" x2="496.0" y2="232.0" stroke="#5f6b78" stroke-width="3" marker-end="url(#a-sub)"/>
<rect x="500.0" y="166.0" width="400.0" height="132.0" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5" rx="12"/>
<text x="524.0" y="240.0" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="start">항공운송사업자</text>
<line x1="902.0" y1="232.0" x2="936.0" y2="232.0" stroke="#5f6b78" stroke-width="3" marker-end="url(#a-sub)"/>
<rect x="940.0" y="166.0" width="692.0" height="132.0" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5" rx="12"/>
<text x="964.0" y="214.0" font-size="21" font-weight="800" fill="#1f6fd1" text-anchor="start">발견된 국가의 관련 당국과 국토교통부장관</text>
<text x="964.0" y="250.0" font-size="17" font-weight="600" fill="#1d2a3a" text-anchor="start">별지 제6호서식 미신고 위험물 보고, 재발 방지 대책</text>
<text x="964.0" y="282.0" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="start">근거: 항공위험물운송기술기준 7.4.5</text>
<rect x="40.0" y="346.0" width="420.0" height="132.0" fill="#e8f0fb" stroke="#1f6fd1" stroke-width="2.5" rx="12"/>
<text x="64.0" y="420.0" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="start">선박 운송 화물</text>
<line x1="462.0" y1="412.0" x2="496.0" y2="412.0" stroke="#5f6b78" stroke-width="3" marker-end="url(#a-sub)"/>
<rect x="500.0" y="346.0" width="400.0" height="132.0" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5" rx="12"/>
<text x="524.0" y="420.0" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="start">선박소유자 또는 선장</text>
<line x1="902.0" y1="412.0" x2="936.0" y2="412.0" stroke="#5f6b78" stroke-width="3" marker-end="url(#a-sub)"/>
<rect x="940.0" y="346.0" width="692.0" height="132.0" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5" rx="12"/>
<text x="964.0" y="394.0" font-size="21" font-weight="800" fill="#1f6fd1" text-anchor="start">최초 입항지 관할 지방해양수산청장</text>
<text x="964.0" y="430.0" font-size="17" font-weight="600" fill="#1d2a3a" text-anchor="start">별지 제1호서식 미신고 위험물 보고</text>
<text x="964.0" y="462.0" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="start">근거: 위험물 선박운송 기준 제4조의2</text>
<rect x="40.0" y="526.0" width="420.0" height="132.0" fill="#fdece6" stroke="#e4572e" stroke-width="2.5" rx="12"/>
<text x="64.0" y="600.0" font-size="22" font-weight="800" fill="#e4572e" text-anchor="start">보세구역 반입 화물</text>
<line x1="462.0" y1="592.0" x2="496.0" y2="592.0" stroke="#5f6b78" stroke-width="3" marker-end="url(#a-sub)"/>
<rect x="500.0" y="526.0" width="400.0" height="132.0" fill="#ffffff" stroke="#e4572e" stroke-width="2.5" rx="12"/>
<text x="524.0" y="586.0" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="start">위험물 장치허가가 없는</text>
<text x="524.0" y="614.0" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="start">운영인 등</text>
<line x1="902.0" y1="592.0" x2="936.0" y2="592.0" stroke="#5f6b78" stroke-width="3" marker-end="url(#a-sub)"/>
<rect x="940.0" y="526.0" width="692.0" height="132.0" fill="#ffffff" stroke="#e4572e" stroke-width="2.5" rx="12"/>
<text x="964.0" y="574.0" font-size="21" font-weight="800" fill="#e4572e" text-anchor="start">세관장(즉시)</text>
<text x="964.0" y="610.0" font-size="17" font-weight="600" fill="#1d2a3a" text-anchor="start">세관장은 장치 가능한 장소로 즉시 반출명령</text>
<text x="964.0" y="642.0" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="start">근거: 보세화물관리에 관한 고시 제5조제4항·제6조제2항</text>
<rect x="40.0" y="706.0" width="420.0" height="132.0" fill="#eef1f4" stroke="#8a96a3" stroke-width="2.5" rx="12"/>
<text x="64.0" y="780.0" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="start">포워더 창고·CFS·일반 창고</text>
<line x1="462.0" y1="772.0" x2="496.0" y2="772.0" stroke="#5f6b78" stroke-width="3" marker-end="url(#a-sub)"/>
<rect x="500.0" y="706.0" width="400.0" height="132.0" fill="#ffffff" stroke="#8a96a3" stroke-width="2.5" rx="12"/>
<text x="524.0" y="752.0" font-size="18.5" font-weight="800" fill="#1d2a3a" text-anchor="start">항공 화물: 포워더도 보고</text>
<text x="524.0" y="782.0" font-size="18.5" font-weight="800" fill="#1d2a3a" text-anchor="start">(항공운송사업자 이외의 관계자)</text>
<text x="524.0" y="812.0" font-size="18.5" font-weight="600" fill="#5f6b78" text-anchor="start">해상·보세: 운송인·운영인</text>
<line x1="902.0" y1="772.0" x2="936.0" y2="772.0" stroke="#5f6b78" stroke-width="3" marker-end="url(#a-sub)"/>
<rect x="940.0" y="706.0" width="692.0" height="132.0" fill="#ffffff" stroke="#8a96a3" stroke-width="2.5" rx="12"/>
<text x="964.0" y="754.0" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="start">항공 화물: 7.4.5 요건대로 국토교통부장관 등</text>
<text x="964.0" y="790.0" font-size="17" font-weight="600" fill="#1d2a3a" text-anchor="start">운송인·항공사와 화주에게도 알림. 보세구역이면 운영인을 거쳐 세관</text>
<text x="964.0" y="822.0" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="start">근거: 기술기준 1.7.1 나.(관계자에 화물 포워더 명시), IATA 기능 7.2, 사내 절차</text>
<text x="40.0" y="914.0" font-size="16.5" font-weight="600" fill="#1d2a3a" text-anchor="start">조용히 화주에게 돌려보내기보다 운송인에게 알리고 기록을 남기는 편이 안전합니다(같은 화물이 다른 경로로 다시 나가는 것을 막기 위해). 항공 화물이라면 보고는 선택이 아닙니다.</text>
</svg>
