<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<text x="40" y="58" font-size="25" font-weight="800" fill="#1d2a3a" text-anchor="start">숫자로 본 화물 범죄: 트럭이 서 있는 시간, 그리고 사칭 (1절)</text>
<rect x="40" y="96" width="380" height="300" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5" rx="14"/>
<text x="62" y="134" font-size="17" font-weight="700" fill="#5f6b78" text-anchor="start">TAPA EMEA · 2022~2024년</text>
<text x="62" y="196" font-size="40" font-weight="800" fill="#1f6fd1" text-anchor="start">157,421건</text>
<text x="62" y="246" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">유럽·중동·아프리카 129개국 화물 범죄</text>
<text x="62" y="273" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">손실액 보고 6% 미만, 그 건만 27억 유로</text>
<text x="62" y="300" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">실제보다 적게 보고된 수치</text>
<rect x="444" y="96" width="380" height="300" fill="#ffffff" stroke="#e4572e" stroke-width="2.5" rx="14"/>
<text x="466" y="134" font-size="17" font-weight="700" fill="#5f6b78" text-anchor="start">TAPA EMEA PSR 안내(2025)</text>
<text x="466" y="196" font-size="40" font-weight="800" fill="#e4572e" text-anchor="start">95% 넘게</text>
<text x="466" y="246" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">기록된 화물 도난이 트럭을 노린 것</text>
<text x="466" y="273" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">그 절반은 보안이 없는 주차 장소에서</text>
<rect x="40" y="426" width="380" height="300" fill="#ffffff" stroke="#d9482b" stroke-width="2.5" rx="14"/>
<text x="62" y="464" font-size="17" font-weight="700" fill="#5f6b78" text-anchor="start">TT Club · 2022년 청구</text>
<text x="62" y="526" font-size="40" font-weight="800" fill="#d9482b" text-anchor="start">84%</text>
<text x="62" y="576" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">사기·기망 관련 청구 중 운송사·기사를</text>
<text x="62" y="603" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">사칭하는 carrier fraud</text>
<rect x="444" y="426" width="380" height="300" fill="#ffffff" stroke="#c98a12" stroke-width="2.5" rx="14"/>
<text x="466" y="464" font-size="17" font-weight="700" fill="#5f6b78" text-anchor="start">Verisk CargoNet · 2025년 미국·캐나다</text>
<text x="466" y="526" font-size="30" font-weight="800" fill="#c98a12" text-anchor="start">약 7억 2,500만 달러</text>
<text x="466" y="576" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">확인된 화물 도난 2,646건(18% 증가)</text>
<text x="466" y="603" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">추정 손실 60% 증가, 건당 평균 273,990달러</text>
<rect x="860" y="96" width="772" height="626" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="884" y="138" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">한국 은행 송금 과정의 무역사기 (금융감독원, 2025. 9.)</text>
<text x="884" y="182" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">2021년~2025년 상반기 1,591건, 9,584만 달러</text>
<text x="884" y="212" font-size="19" font-weight="800" fill="#d9482b" text-anchor="start">이메일 해킹으로 허위 계좌 송금을 유도한 것 1,518건 (95.4%)</text>
<rect x="920" y="311.5" width="90" height="328.5" fill="#eaf2fc" stroke="#1f6fd1" stroke-width="2" rx="6"/>
<text x="965" y="299.5" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="middle">438건</text>
<text x="965" y="670" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">2021</text>
<rect x="1060" y="389.5" width="90" height="250.5" fill="#eaf2fc" stroke="#1f6fd1" stroke-width="2" rx="6"/>
<text x="1105" y="377.5" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="middle">334건</text>
<text x="1105" y="670" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">2022</text>
<rect x="1200" y="404.5" width="90" height="235.5" fill="#eaf2fc" stroke="#1f6fd1" stroke-width="2" rx="6"/>
<text x="1245" y="392.5" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="middle">314건</text>
<text x="1245" y="670" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">2023</text>
<rect x="1340" y="393.25" width="90" height="246.75" fill="#eaf2fc" stroke="#1f6fd1" stroke-width="2" rx="6"/>
<text x="1385" y="381.25" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="middle">329건</text>
<text x="1385" y="670" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">2024</text>
<rect x="1480" y="508.0" width="90" height="132.0" fill="#fbf3e2" stroke="#c98a12" stroke-width="2" rx="6"/>
<text x="1525" y="496.0" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="middle">176건</text>
<text x="1525" y="670" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">2025 상반기</text>
<line x1="900" y1="640" x2="1610" y2="640" stroke="#1d2a3a" stroke-width="2"/>
<rect x="40" y="752" width="1592" height="148" fill="#e8f5ee" stroke="#1f8a5b" stroke-width="2.5" rx="14"/>
<text x="70" y="794" font-size="21" font-weight="800" fill="#1f8a5b" text-anchor="start">점검표로 옮길 교훈</text>
<text x="70" y="832" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">① 트럭이 서 있는 시간과 장소를 관리   ② 고가 화물은 정보가 새는 순간 표적</text>
<text x="70" y="866" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">③ 침입보다 사칭(가짜 기사, 가짜 이메일, 가짜 계좌)을 막는 확인 절차가 더 자주 필요</text>
</svg>
