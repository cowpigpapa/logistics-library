<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="m1d2a3a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<text x="40" y="58" font-size="25" font-weight="800" fill="#1d2a3a" text-anchor="start">사고·도난 직후 순서: 누가 무엇을 (4절)</text>
<rect x="40" y="96" width="380" height="300" fill="#ffffff" stroke="#d9482b" stroke-width="2.5" rx="14"/>
<rect x="41.5" y="97.5" width="377" height="58" fill="#fdeee9" rx="13"/>
<circle cx="72" cy="126" r="18" fill="#d9482b"/>
<text x="72" y="133.2" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="100" y="135" font-size="22" font-weight="800" fill="#d9482b" text-anchor="start">안전과 신고</text>
<text x="60" y="190" font-size="18" font-weight="700" fill="#5f6b78" text-anchor="start">기사</text>
<text x="60" y="228" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">구호·119, 경찰에 사고 신고, 고속도로는</text>
<text x="60" y="256" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">안전삼각대. 도난은 112</text>
<line x1="422" y1="246.0" x2="442" y2="246.0" stroke="#1d2a3a" stroke-width="3" marker-end="url(#m1d2a3a)"/>
<rect x="444" y="96" width="380" height="300" fill="#ffffff" stroke="#d9482b" stroke-width="2.5" rx="14"/>
<rect x="445.5" y="97.5" width="377" height="58" fill="#fdeee9" rx="13"/>
<circle cx="476" cy="126" r="18" fill="#d9482b"/>
<text x="476" y="133.2" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="504" y="135" font-size="22" font-weight="800" fill="#d9482b" text-anchor="start">운송사·화주 보고</text>
<text x="464" y="190" font-size="18" font-weight="700" fill="#5f6b78" text-anchor="start">기사 → 운송사 → 포워더·화주</text>
<text x="464" y="228" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">배차·관제 담당에 즉시 보고하고 운송을</text>
<text x="464" y="256" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">맡긴 쪽에 바로 알림</text>
<line x1="826" y1="246.0" x2="846" y2="246.0" stroke="#1d2a3a" stroke-width="3" marker-end="url(#m1d2a3a)"/>
<rect x="848" y="96" width="380" height="300" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5" rx="14"/>
<rect x="849.5" y="97.5" width="377" height="58" fill="#eaf2fc" rx="13"/>
<circle cx="880" cy="126" r="18" fill="#1f6fd1"/>
<text x="880" y="133.2" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="908" y="135" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="start">현장 기록</text>
<text x="868" y="190" font-size="18" font-weight="700" fill="#5f6b78" text-anchor="start">기사</text>
<text x="868" y="228" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">차량번호, 컨테이너·씰 번호와 씰 상태,</text>
<text x="868" y="256" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">적재·고정 상태, 떨어진 화물을 여러</text>
<text x="868" y="284" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">각도로 촬영</text>
<line x1="1230" y1="246.0" x2="1250" y2="246.0" stroke="#1d2a3a" stroke-width="3" marker-end="url(#m1d2a3a)"/>
<rect x="1252" y="96" width="380" height="300" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5" rx="14"/>
<rect x="1253.5" y="97.5" width="377" height="58" fill="#eaf2fc" rx="13"/>
<circle cx="1284" cy="126" r="18" fill="#1f6fd1"/>
<text x="1284" y="133.2" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="1312" y="135" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="start">기록 보존</text>
<text x="1272" y="190" font-size="18" font-weight="700" fill="#5f6b78" text-anchor="start">운송사</text>
<text x="1272" y="228" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">운행기록장치 기록, 블랙박스 영상,</text>
<text x="1272" y="256" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">관제(GPS) 이력, 배차 메시지를 지우지</text>
<text x="1272" y="284" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">않음</text>
<rect x="40" y="432" width="380" height="300" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5" rx="14"/>
<rect x="41.5" y="433.5" width="377" height="58" fill="#eaf2fc" rx="13"/>
<circle cx="72" cy="462" r="18" fill="#1f6fd1"/>
<text x="72" y="469.2" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5</text>
<text x="100" y="471" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="start">서류 모으기</text>
<text x="60" y="526" font-size="18" font-weight="700" fill="#5f6b78" text-anchor="start">운송사 · 포워더</text>
<text x="60" y="564" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">인수증, EIR, 출고·입고 기록, 씰 번호</text>
<text x="60" y="592" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">서류, 경찰 신고 접수 기록, 보험 증권</text>
<text x="60" y="620" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">사본</text>
<line x1="422" y1="582.0" x2="442" y2="582.0" stroke="#1d2a3a" stroke-width="3" marker-end="url(#m1d2a3a)"/>
<rect x="444" y="432" width="380" height="300" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5" rx="14"/>
<rect x="445.5" y="433.5" width="377" height="58" fill="#e8f5ee" rx="13"/>
<circle cx="476" cy="462" r="18" fill="#1f8a5b"/>
<text x="476" y="469.2" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">6</text>
<text x="504" y="471" font-size="22" font-weight="800" fill="#1f8a5b" text-anchor="start">보험사 통지</text>
<text x="464" y="526" font-size="18" font-weight="700" fill="#5f6b78" text-anchor="start">화주 · 운송사</text>
<text x="464" y="564" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">화주는 적하보험사에, 운송사는</text>
<text x="464" y="592" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">적재물배상책임보험사에 지체 없이</text>
<line x1="826" y1="582.0" x2="846" y2="582.0" stroke="#1d2a3a" stroke-width="3" marker-end="url(#m1d2a3a)"/>
<rect x="848" y="432" width="380" height="300" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5" rx="14"/>
<rect x="849.5" y="433.5" width="377" height="58" fill="#e8f5ee" rx="13"/>
<circle cx="880" cy="462" r="18" fill="#1f8a5b"/>
<text x="880" y="469.2" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">7</text>
<text x="908" y="471" font-size="22" font-weight="800" fill="#1f8a5b" text-anchor="start">서면 통지·권리 보전</text>
<text x="868" y="526" font-size="18" font-weight="700" fill="#5f6b78" text-anchor="start">화주 (포워더가 전달)</text>
<text x="868" y="564" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">손해 내용과 책임을 묻는 뜻을 서면으로.</text>
<text x="868" y="592" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">합의서는 보험사와 상의 전 서명하지</text>
<text x="868" y="620" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">않음</text>
<line x1="1230" y1="582.0" x2="1250" y2="582.0" stroke="#1d2a3a" stroke-width="3" marker-end="url(#m1d2a3a)"/>
<rect x="1252" y="432" width="380" height="300" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5" rx="14"/>
<rect x="1253.5" y="433.5" width="377" height="58" fill="#e8f5ee" rx="13"/>
<circle cx="1284" cy="462" r="18" fill="#1f8a5b"/>
<text x="1284" y="469.2" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">8</text>
<text x="1312" y="471" font-size="22" font-weight="800" fill="#1f8a5b" text-anchor="start">손해 줄이기</text>
<text x="1272" y="526" font-size="18" font-weight="700" fill="#5f6b78" text-anchor="start">화주 · 운송사</text>
<text x="1272" y="564" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">남은 화물 옮겨 싣기, 젖거나 깨진 화물</text>
<text x="1272" y="592" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">분리. 폐기·처분은 보험사 동의 후</text>
<path d="M1450 396 L1450 414 L230 414 L230 426" stroke="#1d2a3a" stroke-width="3" fill="none" marker-end="url(#m1d2a3a)" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="40" y="780" width="1592" height="120" fill="#fbf3e2" stroke="#c98a12" stroke-width="2" rx="14"/>
<text x="70" y="822" font-size="22" font-weight="800" fill="#c98a12" text-anchor="start">기한</text>
<text x="160" y="822" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">즉시 알 수 없는 훼손·일부 멸실은 받은 날부터 2주 안에 운송인에게 통지 (상법 제146조)</text>
<text x="160" y="856" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">인도기한이 지난 뒤 3개월 안에 인도되지 않으면 멸실된 것으로 봄 (화물자동차 운수사업법 제7조)</text>
</svg>
