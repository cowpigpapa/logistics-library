<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect width="1672" height="941" fill="#ffffff"/>
<text x="40" y="58" font-size="27" font-weight="800" fill="#1d2a3a">사기 계좌로 보낸 것을 알았을 때: 시간 순서로 할 일</text>
<text x="40" y="92" font-size="18" fill="#5f6b78">돈이 아직 수취 계좌에 남아 있을 때만 되찾을 기회가 있습니다. 은행이 먼저, 신고와 증거는 같은 날.</text>

<!-- timeline axis -->
<line x1="80" y1="150" x2="1600" y2="150" stroke="#c9d2dc" stroke-width="6" stroke-linecap="round"/>
<circle cx="200" cy="150" r="14" fill="#d9482b"/>
<circle cx="590" cy="150" r="14" fill="#e4572e"/>
<circle cx="990" cy="150" r="14" fill="#1f6fd1"/>
<circle cx="1390" cy="150" r="14" fill="#1f8a5b"/>
<text x="200" y="126" font-size="19" font-weight="800" fill="#d9482b" text-anchor="middle">알게 된 즉시</text>
<text x="590" y="126" font-size="19" font-weight="800" fill="#e4572e" text-anchor="middle">같은 날</text>
<text x="990" y="126" font-size="19" font-weight="800" fill="#1f6fd1" text-anchor="middle">며칠 안</text>
<text x="1390" y="126" font-size="19" font-weight="800" fill="#1f8a5b" text-anchor="middle">그 뒤</text>

<!-- column 1 -->
<rect x="40" y="180" width="370" height="420" fill="#fff6f3" stroke="#d9482b" stroke-width="2.5" rx="16"/>
<text x="62" y="218" font-size="20" font-weight="800" fill="#1d2a3a">송금 은행에 전화</text>
<text x="62" y="254" font-size="16" fill="#1d2a3a">· 지급정지와 반환(recall) 요청</text>
<text x="62" y="282" font-size="16" fill="#1d2a3a">· 송금일, 금액, 참조번호,</text>
<text x="78" y="306" font-size="16" fill="#1d2a3a">수취 은행·계좌를 바로 불러 줌</text>
<text x="62" y="334" font-size="16" fill="#1d2a3a">· 중간 은행·수취 은행까지</text>
<text x="78" y="358" font-size="16" fill="#1d2a3a">요청이 가게 해 달라고 함</text>
<text x="62" y="386" font-size="16" fill="#1d2a3a">· 은행이 요구하는 반환 요청서·</text>
<text x="78" y="410" font-size="16" fill="#1d2a3a">면책 서류를 바로 냄</text>
<rect x="62" y="432" width="326" height="148" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5" rx="10"/>
<text x="78" y="460" font-size="15" font-weight="700" fill="#5f6b78">알아 둘 것</text>
<text x="78" y="486" font-size="15" fill="#1d2a3a">이체 중이면 멈출 수 있지만 이미</text>
<text x="78" y="510" font-size="15" fill="#1d2a3a">입금됐으면 수취 은행·수취인 협조나</text>
<text x="78" y="534" font-size="15" fill="#1d2a3a">현지 수사가 있어야 돌아옵니다.</text>
<text x="78" y="558" font-size="15" fill="#1d2a3a">반환돼도 환전 손실이 남을 수 있음.</text>

<!-- column 2 -->
<rect x="430" y="180" width="370" height="420" fill="#fbfcfd" stroke="#e4572e" stroke-width="2" rx="16"/>
<text x="452" y="218" font-size="20" font-weight="800" fill="#1d2a3a">신고하고 알린다</text>
<text x="452" y="254" font-size="16" fill="#1d2a3a">· 경찰 사이버범죄 신고(182,</text>
<text x="468" y="278" font-size="16" fill="#1d2a3a">경찰청 신고 창구)</text>
<text x="452" y="306" font-size="16" fill="#1d2a3a">· 수취 계좌가 미국이면 FBI IC3</text>
<text x="468" y="330" font-size="16" fill="#1d2a3a">신고(금액과 관계없이)</text>
<text x="452" y="358" font-size="16" fill="#1d2a3a">· 거래처에 전화로 알림</text>
<text x="452" y="386" font-size="16" fill="#1d2a3a">· 메일 비밀번호 변경, 2단계 인증,</text>
<text x="468" y="410" font-size="16" fill="#1d2a3a">모르는 전달 규칙·로그인 확인</text>
<rect x="452" y="432" width="326" height="148" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5" rx="10"/>
<text x="468" y="460" font-size="15" font-weight="700" fill="#5f6b78">남길 증거</text>
<text x="468" y="486" font-size="15" fill="#1d2a3a">송금확인증(계좌 상세 포함), 사기 메일</text>
<text x="468" y="510" font-size="15" fill="#1d2a3a">원문(헤더 포함, 지우지 않음), 접속 IP</text>
<text x="468" y="534" font-size="15" fill="#1d2a3a">기록, 정상 메일과 사기 메일의 시간순</text>
<text x="468" y="558" font-size="15" fill="#1d2a3a">목록, 통화 기록</text>

<!-- column 3 -->
<rect x="820" y="180" width="370" height="420" fill="#fbfcfd" stroke="#1f6fd1" stroke-width="2" rx="16"/>
<text x="842" y="218" font-size="20" font-weight="800" fill="#1d2a3a">기관 도움과 현지 조치</text>
<text x="842" y="254" font-size="16" fill="#1d2a3a">· KOTRA 무역사기 상담</text>
<text x="858" y="278" font-size="16" fill="#1d2a3a">(무역투자24, 1600-7119)</text>
<text x="842" y="306" font-size="16" fill="#1d2a3a">· 수취국 경찰 신고는 거래처·</text>
<text x="858" y="330" font-size="16" fill="#1d2a3a">현지 대리인과 협조</text>
<text x="842" y="358" font-size="16" fill="#1d2a3a">· 수취 은행이 동결했는지 확인,</text>
<text x="858" y="382" font-size="16" fill="#1d2a3a">반환 조건(수취인 동의 등) 파악</text>
<text x="842" y="410" font-size="16" fill="#1d2a3a">· 같은 메일을 받은 다른 거래처 확인</text>
<rect x="842" y="432" width="326" height="148" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5" rx="10"/>
<text x="858" y="460" font-size="15" font-weight="700" fill="#5f6b78">FBI IC3 RAT(2025년)</text>
<text x="858" y="486" font-size="15" fill="#1d2a3a">동결 요청 3,900건, 시도액 11.6억</text>
<text x="858" y="510" font-size="15" fill="#1d2a3a">달러 중 6.8억 달러 동결(58%).</text>
<text x="858" y="534" font-size="15" fill="#1d2a3a">해외 계좌 대상은 326건, 1.7억</text>
<text x="858" y="558" font-size="15" fill="#1d2a3a">달러 동결.</text>

<!-- column 4 -->
<rect x="1210" y="180" width="422" height="420" fill="#fbfcfd" stroke="#1f8a5b" stroke-width="2" rx="16"/>
<text x="1232" y="218" font-size="20" font-weight="800" fill="#1d2a3a">손해를 누가 질지 정리</text>
<text x="1232" y="254" font-size="16" fill="#1d2a3a">· 계약서의 계좌·통지 조항 확인</text>
<text x="1232" y="282" font-size="16" fill="#1d2a3a">· 누구 메일이 어떻게 털렸는지</text>
<text x="1248" y="306" font-size="16" fill="#1d2a3a">기술 조사 기록 확보</text>
<text x="1232" y="334" font-size="16" fill="#1d2a3a">· 거래처와 협의, 안 되면 중재·소송</text>
<text x="1232" y="362" font-size="16" fill="#1d2a3a">· 보험 약관 확인(적하보험은 화물</text>
<text x="1248" y="386" font-size="16" fill="#1d2a3a">손해 보험이라 대금 사기는 대상 밖)</text>
<rect x="1232" y="410" width="378" height="170" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5" rx="10"/>
<text x="1248" y="438" font-size="15" font-weight="700" fill="#5f6b78">판결의 흐름(8절)</text>
<text x="1248" y="464" font-size="15" fill="#1d2a3a">영국·독일·미국 판결은 대체로 바뀐</text>
<text x="1248" y="488" font-size="15" fill="#1d2a3a">계좌로 보낸 쪽이 다시 내라고 봤습니다.</text>
<text x="1248" y="512" font-size="15" fill="#1d2a3a">메일 보안이 부족한 쪽이 배상 책임을 진 독일</text>
<text x="1248" y="536" font-size="15" fill="#1d2a3a">판결도 있습니다. 한국 판결은 공개된</text>
<text x="1248" y="560" font-size="15" fill="#1d2a3a">것을 확인하지 못했습니다.</text>

<!-- law note -->
<rect x="40" y="628" width="1592" height="222" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="64" y="668" font-size="21" font-weight="800" fill="#1d2a3a">보이스피싱 지급정지 제도로 해외 무역 대금을 묶을 수 있나</text>
<text x="64" y="706" font-size="17" fill="#1d2a3a">「전기통신금융사기 피해 방지 및 피해자산 환급에 관한 특별법」의 지급정지(제3조·제4조)는 국내 금융회사등이 관리하는 사기이용계좌가 대상입니다.</text>
<text x="64" y="738" font-size="17" fill="#1d2a3a">해외 은행 계좌로 간 대금은 이 절차로 묶을 수 없고, 송금 은행을 통한 반환 요청과 현지 수사에 기대야 합니다.</text>
<text x="64" y="776" font-size="17" fill="#1d2a3a">또 이 법은 "재화의 공급 또는 용역의 제공 등을 가장한 행위"를 빼며(제2조 제2호 단서), 대법원은 이를 재화·용역과 대가관계가 있는 경우로 봤습니다(2024도6831).</text>
<text x="64" y="808" font-size="17" fill="#1d2a3a">국내 계좌로 간 운임·대금 사기에 이 법이 적용되는지는 공개된 판결·해석을 확인하지 못했으므로, 은행에 즉시 신청하고 판단을 받습니다.</text>
<text x="40" y="890" font-size="15" fill="#5f6b78">자료: 금융감독원 보도자료(2025. 9. 29.), KOTRA 「2024 무역사기 예방 및 대응 매뉴얼」 Ⅳ, FBI IC3 2025 연례 보고서 17~18쪽, 통신사기피해환급법(법률 제22047호, 시행 2026. 10. 2.),</text>
<text x="40" y="914" font-size="15" fill="#5f6b78">대법원 2024. 10. 25. 선고 2024도6831 판결, K v A [2019] EWHC 1118 (Comm)(반환 뒤 환전 손실). 시간 구분은 이 자료들의 권고를 순서대로 정리한 예입니다.</text>
</svg>
