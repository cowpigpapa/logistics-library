<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="m1d2a3a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker><marker id="m1f6fd1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="m1f8a5b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="mc46a12" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c46a12"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<text x="40" y="58" font-size="25" font-weight="800" fill="#1d2a3a" text-anchor="start">부산항 터미널에서 내륙까지: 수입 컨테이너가 움직이는 길 (2절)</text>
<text x="40" y="92" font-size="17" font-weight="600" fill="#34475c" text-anchor="start">수출은 같은 길을 거꾸로 갑니다. 운송 형태 이름은 2026년 적용 안전운임 고시 부대조항을 따랐습니다.</text>
<rect x="40" y="200" width="300" height="200" fill="#eef1f5" stroke="#1d2a3a" stroke-width="2.5" rx="12"/>
<text x="190.0" y="257.4" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle">부산항 컨테이너 터미널</text>
<text x="190.0" y="288.4" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">양하 · 장치</text>
<text x="190.0" y="311.4" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">반출 전: D/O·반출 승인 확인</text>
<text x="190.0" y="334.4" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">게이트에서 반출 EIR</text>
<text x="190.0" y="357.4" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">(장비 번호·일시·상태)</text>
<rect x="1170" y="170" width="462" height="230" fill="#eaf2fc" stroke="#1f6fd1" stroke-width="2.5" rx="12"/>
<text x="1401.0" y="242.3" font-size="21" font-weight="800" fill="#1f6fd1" text-anchor="middle">화주 문전(공장·창고)</text>
<text x="1401.0" y="273.4" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">적출: 샤시 위 작업 또는</text>
<text x="1401.0" y="296.4" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">온그라운드(컨테이너를 내려놓고 작업)</text>
<text x="1401.0" y="319.4" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">밥테일: 샤시를 두고 트랙터만 복귀</text>
<text x="1401.0" y="342.4" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">상·하차 대기 시간은 확인서로 기록</text>
<rect x="420" y="470" width="290" height="160" fill="#e8f5ee" stroke="#1f8a5b" stroke-width="2.5" rx="12"/>
<text x="565.0" y="518.9" font-size="21" font-weight="800" fill="#1f8a5b" text-anchor="middle">철도 CY · 열차</text>
<text x="565.0" y="549.9" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">항만 쪽 철도 CY에서 상차</text>
<text x="565.0" y="572.9" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">임시 열차 증편이</text>
<text x="565.0" y="595.9" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">운송 거부 때 대체 수단</text>
<rect x="790" y="470" width="330" height="160" fill="#e8f5ee" stroke="#1f8a5b" stroke-width="2.5" rx="12"/>
<text x="955.0" y="518.9" font-size="21" font-weight="800" fill="#1f8a5b" text-anchor="middle">내륙 컨테이너 기지(ICD)</text>
<text x="955.0" y="549.9" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">예: 의왕ICD(1992년 설립)</text>
<text x="955.0" y="572.9" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">철도·내륙운송, 통관,</text>
<text x="955.0" y="595.9" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">내륙항만 기능</text>
<rect x="1170" y="520" width="462" height="190" fill="#fdf2e6" stroke="#c46a12" stroke-width="2.5" rx="12"/>
<text x="1401.0" y="572.4" font-size="21" font-weight="800" fill="#c46a12" text-anchor="middle">빈 컨테이너 반납</text>
<text x="1401.0" y="603.4" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">선사가 지정한 터미널·디포·ICD</text>
<text x="1401.0" y="626.4" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">반입 EIR로 반납 때 상태 기록</text>
<text x="1401.0" y="649.4" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">포지셔닝: ICD와 항만 사이</text>
<text x="1401.0" y="672.4" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">빈 컨테이너 공급 운송</text>
<line x1="340" y1="260" x2="1164" y2="260" stroke="#1d2a3a" stroke-width="3" marker-end="url(#m1d2a3a)"/>
<text x="750" y="245" font-size="17" font-weight="700" fill="#1d2a3a" text-anchor="middle">트럭 직송(트랙터 + 샤시)</text>
<path d="M190 400 L190 550 L414 550" stroke="#1f8a5b" stroke-width="3" fill="none" marker-end="url(#m1f8a5b)" stroke-linejoin="round" stroke-linecap="round"/>
<text x="200" y="590" font-size="16" font-weight="700" fill="#1f8a5b" text-anchor="start">철도 CY까지 이동</text>
<line x1="710" y1="550" x2="784" y2="550" stroke="#1f8a5b" stroke-width="3" marker-end="url(#m1f8a5b)"/>
<text x="747" y="535" font-size="16" font-weight="700" fill="#1f8a5b" text-anchor="middle">열차</text>
<path d="M955 470 L955 340 L1164 340" stroke="#1f6fd1" stroke-width="3" fill="none" marker-end="url(#m1f6fd1)" stroke-linejoin="round" stroke-linecap="round"/>
<text x="970" y="325" font-size="16" font-weight="700" fill="#1f6fd1" text-anchor="start">트럭 셔틀</text>
<path d="M1401 400 L1401 514" stroke="#c46a12" stroke-width="3" fill="none" marker-end="url(#mc46a12)" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1412" y="465" font-size="16" font-weight="700" fill="#c46a12" text-anchor="start">반납 운송</text>
<rect x="40" y="760" width="500" height="150" fill="#f1f3f6" stroke="#8a96a3" stroke-width="2.5" rx="12"/>
<text x="290.0" y="803.1" font-size="19" font-weight="800" fill="#8a96a3" text-anchor="middle">보세 상태로 옮길 때</text>
<text x="290.0" y="834.1" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">수입신고 전 외국물품이면 보세운송 절차</text>
<text x="290.0" y="857.1" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">ICD 등 집단화지역 안 이동은 생략 가능</text>
<text x="290.0" y="880.1" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">(Customs 보세구역과 보세운송 문서)</text>
<rect x="586" y="760" width="500" height="150" fill="#f1f3f6" stroke="#8a96a3" stroke-width="2.5" rx="12"/>
<text x="836.0" y="803.1" font-size="19" font-weight="800" fill="#8a96a3" text-anchor="middle">도로 한도</text>
<text x="836.0" y="834.1" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">총중량·축하중·높이 한도는 CTU 분야</text>
<text x="836.0" y="857.1" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">'한국 도로 중량·제원 한도' 문서</text>
<text x="836.0" y="880.1" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">중량물은 화주 서류로 미리 확인</text>
<rect x="1132" y="760" width="500" height="150" fill="#f1f3f6" stroke="#8a96a3" stroke-width="2.5" rx="12"/>
<text x="1382.0" y="803.1" font-size="19" font-weight="800" fill="#8a96a3" text-anchor="middle">수출 방향</text>
<text x="1382.0" y="834.1" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">빈 컨테이너 반출(반출 EIR) → 적입</text>
<text x="1382.0" y="857.1" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">→ 서류·CY 마감 전 터미널 반입</text>
<text x="1382.0" y="880.1" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="middle">마감을 넘기면 다음 배선(롤오버)</text>
</svg>
