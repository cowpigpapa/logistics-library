<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5f6b78"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="24" y="22" width="1624" height="897" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="48" y="66" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">화주가 요구하는 인증·평가 세 종류: 누가 판정하고 얼마 동안 유효한가</text>
<text x="48" y="96" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="start">입찰 요청서의 "인증·평가" 칸에 섞여 나오는 요구를 판정 주체, 근거, 결과, 유효기간, 확인 방법으로 나눴습니다(2026. 11. 5. 확인).</text>
<rect x="48" y="124" width="510" height="640" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="3"/>
<rect x="48" y="124" width="510" height="58" rx="12" fill="#1f6fd1"/>
<rect x="48" y="164" width="510" height="18" fill="#1f6fd1"/>
<text x="303.0" y="162" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">경영시스템 인증</text>
<text x="70" y="216" font-size="17" font-weight="700" fill="#1d2a3a" text-anchor="start">예: ISO 9001·14001·45001, ISO/IEC 27001,</text>
<text x="70" y="242" font-size="17" font-weight="700" fill="#1d2a3a" text-anchor="start">ISO 28000·22301·39001·50001</text>
<path d="M66 268 L540 268" stroke="#c9d2dc" stroke-width="1.5" fill="none"/>
<text x="70" y="304" font-size="17" font-weight="800" fill="#1f6fd1" text-anchor="start">판정</text>
<text x="170" y="304" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">인정기구가 인정한 인증기관(제3자)</text>
<path d="M66 364 L540 364" stroke="#c9d2dc" stroke-width="1.5" fill="none"/>
<text x="70" y="400" font-size="17" font-weight="800" fill="#1f6fd1" text-anchor="start">근거</text>
<text x="170" y="400" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">표준 요구사항, 문서 심사와 사업장 현장 심사</text>
<path d="M66 460 L540 460" stroke="#c9d2dc" stroke-width="1.5" fill="none"/>
<text x="70" y="496" font-size="17" font-weight="800" fill="#1f6fd1" text-anchor="start">결과</text>
<text x="170" y="496" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">인증서(표준·판, 범위, 사업장, 유효기간)</text>
<path d="M66 564 L540 564" stroke="#c9d2dc" stroke-width="1.5" fill="none"/>
<text x="70" y="600" font-size="17" font-weight="800" fill="#1f6fd1" text-anchor="start">유효기간</text>
<text x="170" y="600" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">보통 3년 주기, 매년 사후심사, 만료 전</text>
<text x="170" y="627" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">갱신심사</text>
<path d="M66 668 L540 668" stroke="#c9d2dc" stroke-width="1.5" fill="none"/>
<text x="70" y="704" font-size="17" font-weight="800" fill="#1f6fd1" text-anchor="start">확인</text>
<text x="170" y="704" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">인증기관 조회, KAB KCN, IAF CertSearch</text>
<rect x="581" y="124" width="510" height="640" rx="12" fill="#ffffff" stroke="#1f8a5b" stroke-width="3"/>
<rect x="581" y="124" width="510" height="58" rx="12" fill="#1f8a5b"/>
<rect x="581" y="164" width="510" height="18" fill="#1f8a5b"/>
<text x="836.0" y="162" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">평가 플랫폼 점수</text>
<text x="603" y="216" font-size="17" font-weight="700" fill="#1d2a3a" text-anchor="start">예: EcoVadis 지속가능성 평가, CyberVadis 사이버보안</text>
<text x="603" y="242" font-size="17" font-weight="700" fill="#1d2a3a" text-anchor="start">평가</text>
<path d="M599 268 L1073 268" stroke="#c9d2dc" stroke-width="1.5" fill="none"/>
<text x="603" y="304" font-size="17" font-weight="800" fill="#1f8a5b" text-anchor="start">판정</text>
<text x="703" y="304" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">플랫폼 소속 분석가(원격 서류 검토)</text>
<path d="M599 364 L1073 364" stroke="#c9d2dc" stroke-width="1.5" fill="none"/>
<text x="603" y="400" font-size="17" font-weight="800" fill="#1f8a5b" text-anchor="start">근거</text>
<text x="703" y="400" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">질문지 답변과 근거 서류, 외부 정보(EcoVadis</text>
<text x="703" y="427" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">360° Watch)</text>
<path d="M599 460 L1073 460" stroke="#c9d2dc" stroke-width="1.5" fill="none"/>
<text x="603" y="496" font-size="17" font-weight="800" fill="#1f8a5b" text-anchor="start">결과</text>
<text x="703" y="496" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">점수표(EcoVadis 0~100점, CyberVadis</text>
<text x="703" y="523" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">0~1,000점), 메달·배지</text>
<path d="M599 564 L1073 564" stroke="#c9d2dc" stroke-width="1.5" fill="none"/>
<text x="603" y="600" font-size="17" font-weight="800" fill="#1f8a5b" text-anchor="start">유효기간</text>
<text x="703" y="600" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">점수표 발행일부터 12개월</text>
<path d="M599 668 L1073 668" stroke="#c9d2dc" stroke-width="1.5" fill="none"/>
<text x="603" y="704" font-size="17" font-weight="800" fill="#1f8a5b" text-anchor="start">확인</text>
<text x="703" y="704" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">플랫폼에서 점수표를 공유받아 확인</text>
<rect x="1114" y="124" width="510" height="640" rx="12" fill="#ffffff" stroke="#a35f00" stroke-width="3"/>
<rect x="1114" y="124" width="510" height="58" rx="12" fill="#a35f00"/>
<rect x="1114" y="164" width="510" height="18" fill="#a35f00"/>
<text x="1369.0" y="162" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">공시·목표 검증</text>
<text x="1136" y="216" font-size="17" font-weight="700" fill="#1d2a3a" text-anchor="start">예: CDP 환경 공시와 점수, SBTi 감축 목표 검증</text>
<path d="M1132 268 L1606 268" stroke="#c9d2dc" stroke-width="1.5" fill="none"/>
<text x="1136" y="304" font-size="17" font-weight="800" fill="#a35f00" text-anchor="start">판정</text>
<text x="1236" y="304" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">CDP(점수), SBTi Services(목표 검증)</text>
<path d="M1132 364 L1606 364" stroke="#c9d2dc" stroke-width="1.5" fill="none"/>
<text x="1136" y="400" font-size="17" font-weight="800" fill="#a35f00" text-anchor="start">근거</text>
<text x="1236" y="400" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">회사가 공시한 환경 정보, 제출한 감축 목표</text>
<path d="M1132 460 L1606 460" stroke="#c9d2dc" stroke-width="1.5" fill="none"/>
<text x="1136" y="496" font-size="17" font-weight="800" fill="#a35f00" text-anchor="start">결과</text>
<text x="1236" y="496" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">CDP A~D- 점수, SBTi 검증 목표(단기·넷제로)</text>
<path d="M1132 564 L1606 564" stroke="#c9d2dc" stroke-width="1.5" fill="none"/>
<text x="1136" y="600" font-size="17" font-weight="800" fill="#a35f00" text-anchor="start">유효기간</text>
<text x="1236" y="600" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">CDP는 해마다 공시, SBTi 목표는 정한 목표</text>
<text x="1236" y="627" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">기간</text>
<path d="M1132 668 L1606 668" stroke="#c9d2dc" stroke-width="1.5" fill="none"/>
<text x="1136" y="704" font-size="17" font-weight="800" fill="#a35f00" text-anchor="start">확인</text>
<text x="1236" y="704" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">CDP 공개 점수, 회사가 공개한 SBTi 검증 목표</text>
<rect x="48" y="786" width="1576" height="110" rx="12" fill="#eef4fb" stroke="#5f6b78" stroke-width="1.5"/>
<text x="72" y="820" font-size="18" font-weight="800" fill="#1d2a3a" text-anchor="start">세 종류는 서로를 대신하지 않습니다</text>
<text x="72" y="850" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">ISO 인증서는 EcoVadis 점수의 "인증서" 지표 근거로 쓰이지만, EcoVadis·CyberVadis 메달은 인증이 아니라고 각 플랫폼이 밝힙니다.</text>
<text x="72" y="878" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">세 가지 모두 화주의 입찰 요청서, 공급업체 등록 양식, 계약 조항으로 요구되므로 답변은 종류별로 나눠 적습니다.</text>
</svg>