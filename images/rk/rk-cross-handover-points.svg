<text x="70" y="856.0" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">같은 수하인에게 House B/L 여러 건 · 분할 선적·재선적 · 같은 공급자의 같은 박스 · 화인 없는 무지 박스 · 비슷한 회사 이름·B/L 번호 · 코로딩으로 B/L이 한 층 더 생김</text>
