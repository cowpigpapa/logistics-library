<text x="560" y="810" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">젖은 자재 금지, 말려서 싣기</text>
<text x="60" y="868" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="start">그 밖에: 비 오는 날 노천 적입·적출, 선박 창구 덮개 누수(운송인 쪽), 수분이 많은 화물과 함께 싣기</text>
<text x="60" y="892" font-size="16" font-weight="700" fill="#1d2a3a" text-anchor="start">파란색 = 밖에서 들어온 물, 주황색 = 안에서 생긴 물</text>
