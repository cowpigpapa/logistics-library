<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<text x="40" y="58" font-size="25" font-weight="800" fill="#1d2a3a" text-anchor="start">화인은 '번호'로: 나쁨 · 보통 · 좋음 (3절, 가상 예)</text>
<rect x="40" y="90" width="512" height="560" fill="#fdeee9" stroke="#d9482b" stroke-width="2.5" rx="16"/>
<text x="64" y="132" font-size="26" font-weight="800" fill="#d9482b" text-anchor="start">나쁨</text>
<polygon points="110,210 150,170 480,170 440,210" fill="#e3c9a3" stroke="#a8743a" stroke-width="2"/>
<polygon points="440,210 480,170 480,430 440,470" fill="#d9b98d" stroke="#a8743a" stroke-width="2"/>
<rect x="110" y="210" width="330" height="260" fill="#f2e3cf" stroke="#a8743a" stroke-width="2"/>
<text x="275.0" y="256" font-size="19" font-weight="800" fill="#2b2b2b" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">SAMPLE TRADING</text>
<text x="275.0" y="284" font-size="19" font-weight="800" fill="#2b2b2b" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">HCMC</text>
<text x="64" y="540" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">같은 수하인 다른 B/L, 분할 선적분과 구별할 수 없음</text>
<rect x="576" y="90" width="512" height="560" fill="#fbf3e2" stroke="#c98a12" stroke-width="2.5" rx="16"/>
<text x="600" y="132" font-size="26" font-weight="800" fill="#c98a12" text-anchor="start">보통</text>
<polygon points="646,210 686,170 1016,170 976,210" fill="#e3c9a3" stroke="#a8743a" stroke-width="2"/>
<polygon points="976,210 1016,170 1016,430 976,470" fill="#d9b98d" stroke="#a8743a" stroke-width="2"/>
<rect x="646" y="210" width="330" height="260" fill="#f2e3cf" stroke="#a8743a" stroke-width="2"/>
<text x="811.0" y="256" font-size="19" font-weight="800" fill="#2b2b2b" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">SAMPLE</text>
<text x="811.0" y="284" font-size="19" font-weight="800" fill="#2b2b2b" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">HCMC</text>
<text x="811.0" y="312" font-size="19" font-weight="800" fill="#2b2b2b" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">C/NO. 1-30</text>
<text x="600" y="540" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">포장 번호는 있지만 어느 거래인지 번호가 없음. 다음</text>
<text x="600" y="568" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">선적도 C/NO. 1부터면 겹침</text>
<rect x="1112" y="90" width="512" height="560" fill="#e8f5ee" stroke="#1f8a5b" stroke-width="2.5" rx="16"/>
<text x="1136" y="132" font-size="26" font-weight="800" fill="#1f8a5b" text-anchor="start">좋음</text>
<polygon points="1182,210 1222,170 1552,170 1512,210" fill="#e3c9a3" stroke="#a8743a" stroke-width="2"/>
<polygon points="1512,210 1552,170 1552,430 1512,470" fill="#d9b98d" stroke="#a8743a" stroke-width="2"/>
<rect x="1182" y="210" width="330" height="260" fill="#f2e3cf" stroke="#a8743a" stroke-width="2"/>
<text x="1347.0" y="256" font-size="19" font-weight="800" fill="#2b2b2b" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">SAMPLE</text>
<text x="1347.0" y="284" font-size="19" font-weight="800" fill="#2b2b2b" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">HCMC</text>
<text x="1347.0" y="312" font-size="19" font-weight="800" fill="#2b2b2b" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">EP-2026-1015</text>
<text x="1347.0" y="340" font-size="19" font-weight="800" fill="#2b2b2b" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">C/NO. 1-30</text>
<text x="1347.0" y="368" font-size="19" font-weight="800" fill="#2b2b2b" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">P/NO. 1-6</text>
<text x="1347.0" y="396" font-size="19" font-weight="800" fill="#2b2b2b" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">MADE IN KOREA</text>
<text x="1136" y="540" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">송장 번호가 거래를, 포장 번호가 몇 번째 박스인지를</text>
<text x="1136" y="568" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">알려 줌. 패킹리스트와 1:1</text>
<rect x="40" y="680" width="1592" height="220" fill="#ffffff" stroke="#c9d2dc" stroke-width="2" rx="14"/>
<text x="70" y="722" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="start">붙이는 법</text>
<circle cx="76" cy="756" r="5" fill="#1f6fd1"/>
<text x="92" y="762" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">박스마다 두 면 이상에 화인 → 팔레트에 쌓여도 바깥에서 보임</text>
<circle cx="866" cy="756" r="5" fill="#1f6fd1"/>
<text x="882" y="762" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">팔레트 라벨(송장 번호, 팔레트 번호, 박스 번호 범위·개수)은 랩 바깥에</text>
<circle cx="76" cy="798" r="5" fill="#1f6fd1"/>
<text x="92" y="804" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">바코드·QR에는 송장 번호와 포장 번호처럼 화물을 하나로 특정하는 값</text>
<circle cx="866" cy="798" r="5" fill="#1f6fd1"/>
<text x="882" y="804" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">항공 House 라벨은 화인과 같은 면에 → 도착지를 한눈에 비교</text>
<circle cx="76" cy="840" r="5" fill="#1f6fd1"/>
<text x="92" y="846" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">젖으면 번지는 수기 표시·테이프 위 표시는 피함</text>
<circle cx="866" cy="840" r="5" fill="#1f6fd1"/>
<text x="882" y="846" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">재사용 박스·팔레트의 옛 화인과 라벨은 지움</text>
</svg>
