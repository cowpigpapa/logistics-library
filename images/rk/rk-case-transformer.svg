<text x="1210" y="320.0" font-size="26" font-weight="800" fill="#d9482b" text-anchor="start">적재 높이 4,500</text>
<text x="1210" y="348.0" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="start">1,100 + 100 + 3,300</text>
<text x="1210" y="376.0" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="start">허가 신청 제원 4,300</text>
<rect x="874" y="836" width="734" height="60" fill="#fdeee9" stroke="#d9482b" stroke-width="2" rx="10"/>
<text x="890" y="872.0" font-size="18" font-weight="700" fill="#d9482b" text-anchor="start">허가 4,300으로 4,500 운행 → 덧씌우기로 낮아진 육교와 여유 없음 → 충돌</text>
<text x="440" y="470" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">서베이 보고서는 없었음</text>
<text x="1210" y="450" font-size="20" font-weight="800" fill="#d9482b" text-anchor="start">빠진 것</text>
<text x="1210" y="486" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">· 트레일러 변경 뒤 재서베이</text>
<text x="1210" y="516" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">· 보고서의 지점별 실측 높이</text>
<text x="1210" y="546" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">· 출발 전 적재 높이 실측</text>
<text x="1210" y="576" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">· 측정봉 단 유도차량과 서행</text>
<text x="1210" y="606" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">· 출발 전·도착 후 사진 대조</text>
</svg>
