<text x="400" y="400.0" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="start">허가 신청 제원 4,300</text>
<rect x="64" y="836" width="734" height="60" fill="#e8f5ee" stroke="#1f8a5b" stroke-width="2" rx="10"/>
