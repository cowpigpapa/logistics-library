<text x="70" y="742" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="start">읽는 법</text>
<text x="70" y="780" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">첫날은 넣지 않고(민법 제157조) 말일이 끝나야 만료(제159조). 말일이 토요일·공휴일이면 그다음 날 만료(제161조). 운송 서류 약관이 따로 정하면 그에 따름.</text>
<text x="70" y="814" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">보이는 손상은 수령 때(또는 지체 없이) 서면으로. 헤이그-비스비 규칙도 3일 이내.</text>
<text x="70" y="848" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">기한 다툼을 피하려면 손상을 발견한 당일이나 다음 날 서면으로 보내는 것이 안전합니다.</text>
