<text x="1430.0" y="625.8" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="middle">법률 제21025호 부칙 제2조</text>
<text x="40" y="870" font-size="16" font-weight="600" fill="#34475c" text-anchor="start">업무개시명령 제도는 2004년에 도입되었고 2022. 11. 29. 시멘트 분야가 첫 적용입니다(국토교통부 2022. 11. 29.).</text>
<text x="40" y="900" font-size="16" font-weight="600" fill="#34475c" text-anchor="start">적용 품목은 1차·재도입 모두 수출입 컨테이너와 시멘트입니다. 재도입 법은 특수자동차로 운송되는 것으로 정합니다(제5조의11 제2항).</text>
