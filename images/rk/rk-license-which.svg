<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="m1d2a3a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker><marker id="m1f6fd1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="me4572e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<text x="40" y="58" font-size="25" font-weight="800" fill="#1d2a3a" text-anchor="start">국내 트럭 운송, 어떤 자격으로 주선하나 (2절)</text>
<rect x="40" y="90" width="512" height="120" fill="#eaf2fc" stroke="#1f6fd1" stroke-width="2.5" rx="14"/>
<text x="62" y="128" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="start">국제물류주선업</text>
<text x="62" y="160" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="start">등록 · 시·도지사</text>
<text x="62" y="190" font-size="17" font-weight="500" fill="#5f6b78" text-anchor="start">수출입화물의 물류 주선 (물류정책기본법)</text>
<rect x="576" y="90" width="512" height="120" fill="#fdeee8" stroke="#e4572e" stroke-width="2.5" rx="14"/>
<text x="598" y="128" font-size="22" font-weight="800" fill="#e4572e" text-anchor="start">화물자동차 운송주선사업</text>
<text x="598" y="160" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="start">허가 · 국토교통부장관</text>
<text x="598" y="190" font-size="17" font-weight="500" fill="#5f6b78" text-anchor="start">화물운송계약 중개·대리, 자기 명의 운송</text>
<rect x="1112" y="90" width="512" height="120" fill="#e8f5ee" stroke="#1f8a5b" stroke-width="2.5" rx="14"/>
<text x="1134" y="128" font-size="22" font-weight="800" fill="#1f8a5b" text-anchor="start">화물자동차 운송사업</text>
<text x="1134" y="160" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="start">허가 · 국토교통부장관</text>
<text x="1134" y="190" font-size="17" font-weight="500" fill="#5f6b78" text-anchor="start">화물자동차로 유상 운송</text>
<text x="836" y="240" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">운송사업과 운송주선사업은 서로의 영역을 겸할 수 없음 (대법원 2013도13743)</text>
<rect x="560" y="270" width="552" height="90" fill="#fbf3e2" stroke="#c98a12" stroke-width="2.5" rx="12"/>
<text x="836.0" y="322.8" font-size="24" font-weight="800" fill="#c98a12" text-anchor="middle">수출입화물의 국내 운송인가?</text>
<path d="M560 315 L300 315 L300 384" stroke="#1f6fd1" stroke-width="3" fill="none" marker-end="url(#m1f6fd1)" stroke-linejoin="round" stroke-linecap="round"/>
<text x="430" y="304" font-size="18" font-weight="800" fill="#1f6fd1" text-anchor="middle">예</text>
<path d="M1112 315 L1372 315 L1372 384" stroke="#e4572e" stroke-width="3" fill="none" marker-end="url(#me4572e)" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1128" y="346" font-size="17" font-weight="800" fill="#e4572e" text-anchor="start">아니요 (국내 공장 간 이동, 내수 화물)</text>
<rect x="40" y="390" width="520" height="300" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5" rx="14"/>
<text x="64" y="432" font-size="21" font-weight="800" fill="#1f6fd1" text-anchor="start">국제물류주선업 등록으로 주선 가능</text>
<text x="64" y="462" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="start">운송주선사업 허가 불필요 (법제처 10-0004)</text>
<text x="64" y="500" font-size="18" font-weight="800" fill="#1d2a3a" text-anchor="start">대신 제26조 준수사항 적용 (제26조의2)</text>
<text x="64" y="534" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">· 일부를 떼고 다른 주선사와 재계약 금지</text>
<text x="64" y="563" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">· 수수료 받고 중개·대리 재의뢰 금지</text>
<text x="64" y="592" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">· 종류·무게·부피 거짓 통보, 기준 초과 화물 주선 금지</text>
<text x="64" y="621" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">· 자가용 화물자동차에 주선 금지(시행규칙)</text>
<text x="64" y="650" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">위반: 과태료 500만원 이하(기준 100만원)</text>
<rect x="1112" y="390" width="520" height="300" fill="#ffffff" stroke="#e4572e" stroke-width="2.5" rx="14"/>
<text x="1136" y="432" font-size="21" font-weight="800" fill="#e4572e" text-anchor="start">운송주선사업 허가 필요 (제24조)</text>
<text x="1136" y="470" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">자기 명의로 받아 트럭 운송을 맡기면 운송주선사업의</text>
<text x="1136" y="497" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">정의(제2조 제4호)에 들어감</text>
<text x="1136" y="560" font-size="18" font-weight="800" fill="#1d2a3a" text-anchor="start">허가 없이 영업하면</text>
<text x="1136" y="590" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">2년 이하 징역 또는 2천만원 이하 벌금</text>
<text x="1136" y="620" font-size="17" font-weight="500" fill="#5f6b78" text-anchor="start">(제67조 제4호)</text>
<path d="M300 690 L300 730 L836 730" stroke="#1d2a3a" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M1372 690 L1372 730 L836 730" stroke="#1d2a3a" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="836" y1="730" x2="836" y2="758" stroke="#1d2a3a" stroke-width="3" marker-end="url(#m1d2a3a)"/>
<rect x="560" y="764" width="552" height="136" fill="#e8f5ee" stroke="#1f8a5b" stroke-width="2.5" rx="14"/>
<text x="836" y="802" font-size="21" font-weight="800" fill="#1f8a5b" text-anchor="middle">실제 운송: 운송사업자의 사업용 차량</text>
<rect x="700" y="818" width="120" height="40" fill="#f2c200" stroke="#8a6d00" stroke-width="2" rx="6"/>
<text x="760" y="845" font-size="16" font-weight="800" fill="#1d2a3a" text-anchor="middle">황색 번호판</text>
<text x="836" y="845" font-size="10" font-weight="500" fill="#1d2a3a" text-anchor="start"></text>
<text x="840" y="845" font-size="17" font-weight="600" fill="#1d2a3a" text-anchor="start">자동차운수사업용</text>
<text x="836" y="884" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="middle">허가증·등록증·종사자격·보험 증빙을 받아 둠</text>
<rect x="1150" y="764" width="482" height="136" fill="#fdeee9" stroke="#d9482b" stroke-width="2.5" rx="14"/>
<text x="1174" y="802" font-size="21" font-weight="800" fill="#d9482b" text-anchor="start">자가용 화물자동차는 안 됨</text>
<text x="1174" y="836" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">기름값만 받아도 유상운송 (제56조)</text>
<text x="1174" y="864" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">제공·임대한 쪽 2년 이하 징역·2천만원 이하 벌금</text>
<rect x="40" y="764" width="482" height="136" fill="#f1f3f6" stroke="#8a96a3" stroke-width="2" rx="14"/>
<text x="64" y="802" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">운송사업 · 운송주선사업 허가 없이</text>
<text x="64" y="830" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">화주와 계약하고 운송사업자를</text>
<text x="64" y="858" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">이행보조자로 쓰는 것도 위법(2013도13743)</text>
</svg>
