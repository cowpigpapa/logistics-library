<rect x="1024.0" y="170.0" width="112.0" height="40.0" fill="#f4f7fa" stroke="none" stroke-width="0" rx="0"/>
<text x="1080.0" y="196.0" font-size="16" font-weight="700" fill="#1d2a3a" text-anchor="middle">3월</text>
<rect x="1136.0" y="170.0" width="112.0" height="40.0" fill="#eef2f6" stroke="none" stroke-width="0" rx="0"/>
<text x="1192.0" y="196.0" font-size="16" font-weight="700" fill="#1d2a3a" text-anchor="middle">4월</text>
<rect x="1248.0" y="170.0" width="112.0" height="40.0" fill="#f4f7fa" stroke="none" stroke-width="0" rx="0"/>
<text x="1304.0" y="196.0" font-size="16" font-weight="700" fill="#1d2a3a" text-anchor="middle">5월</text>
<rect x="1360.0" y="170.0" width="112.0" height="40.0" fill="#eef2f6" stroke="none" stroke-width="0" rx="0"/>
<text x="1416.0" y="196.0" font-size="16" font-weight="700" fill="#1d2a3a" text-anchor="middle">6월</text>
<rect x="1472.0" y="170.0" width="112.0" height="40.0" fill="#f4f7fa" stroke="none" stroke-width="0" rx="0"/>
<text x="1528.0" y="196.0" font-size="16" font-weight="700" fill="#1d2a3a" text-anchor="middle">7월</text>
<text x="244.0" y="158.0" font-size="16" font-weight="800" fill="#5f6b78" text-anchor="start">2026년</text>
<text x="804.0" y="158.0" font-size="16" font-weight="800" fill="#5f6b78" text-anchor="start">2027년</text>
<rect x="352.0" y="240.0" width="896.0" height="54.0" fill="#d9482b" stroke="#d9482b" stroke-width="1" rx="10"/>
<text x="368.0" y="274.0" font-size="18" font-weight="800" fill="#fff" text-anchor="start">9월 1일 ~ 4월 30일 선적분(양 끝 포함)</text>
<text x="60.0" y="264.0" font-size="17" font-weight="800" fill="#1d2a3a" text-anchor="start">호주 시즌 조치</text>
<text x="60.0" y="286.0" font-size="14" font-weight="600" fill="#5f6b78" text-anchor="start">대상 품목</text>
<rect x="352.0" y="330.0" width="1120.0" height="54.0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1" rx="10"/>
<text x="368.0" y="364.0" font-size="18" font-weight="800" fill="#fff" text-anchor="start">9월 1일 ~ 6월 30일 도착 시 선박 의무 검사</text>
<text x="60.0" y="354.0" font-size="17" font-weight="800" fill="#1d2a3a" text-anchor="start">로로선 강화 감시</text>
<text x="60.0" y="376.0" font-size="14" font-weight="600" fill="#5f6b78" text-anchor="start">한국 접안·선적·환적선</text>
<line x1="352.0" y1="226.0" x2="352.0" y2="400.0" stroke="#1d2a3a" stroke-width="2" stroke-dasharray="5 5"/>
<text x="352.0" y="420.0" font-size="15" font-weight="800" fill="#1d2a3a" text-anchor="middle">9. 1.</text>
<line x1="1248.0" y1="226.0" x2="1248.0" y2="400.0" stroke="#1d2a3a" stroke-width="2" stroke-dasharray="5 5"/>
<text x="1248.0" y="420.0" font-size="15" font-weight="800" fill="#1d2a3a" text-anchor="middle">4. 30.</text>
<line x1="1472.0" y1="226.0" x2="1472.0" y2="400.0" stroke="#1d2a3a" stroke-width="2" stroke-dasharray="5 5"/>
<text x="1472.0" y="420.0" font-size="15" font-weight="800" fill="#1d2a3a" text-anchor="middle">6. 30.</text>
<rect x="56.0" y="450.0" width="760.0" height="200.0" fill="#fdeee8" stroke="#e4572e" stroke-width="2" rx="12"/>
<text x="78.0" y="490.0" font-size="21" font-weight="800" fill="#e4572e" text-anchor="start">선적 시점은 무엇으로 보나</text>
<text x="78.0" y="526.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">해상 B/L에 적힌 본선 적재일(shipped on board date)로</text>
<text x="78.0" y="554.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">판단하고, 게이트 반입 일시는 인정하지 않습니다.</text>
<text x="78.0" y="582.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">대상 품목이 아니어도 대상 품목과 함께 포장되면</text>
<text x="78.0" y="610.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">조치를 받습니다.</text>
<rect x="846.0" y="450.0" width="770.0" height="200.0" fill="#fff" stroke="#c9d2dc" stroke-width="2" rx="12"/>
<text x="868.0" y="490.0" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="start">한국은 어디에 속하나</text>
<text x="868.0" y="526.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">대상위험국이 아니라 신흥위험국(영국·중국·일본과 함께).</text>
<text x="868.0" y="554.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">대상 고위험 품목(44류 목재, 57류 카펫, 68~70류,</text>
<text x="868.0" y="582.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">72~73류 등)과 39·94·95류가 무작위 검사 대상입니다.</text>
<text x="868.0" y="610.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">대상위험국발 대상 고위험 품목은 의무 처리.</text>
<rect x="56.0" y="670.0" width="1560.0" height="210.0" fill="#fff" stroke="#c9d2dc" stroke-width="2" rx="12"/>
<text x="78.0" y="710.0" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="start">처리 증명과 이번 시즌 변경</text>
<text x="78.0" y="748.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">· 처리 증명은 DAFF 승인 처리업체 것만 인정. 미승인 업체 증명이면 컨테이너 화물은 도착 후 처리, 브레이크벌크는 반송 대상</text>
<text x="78.0" y="778.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">· ISPM 15 마크가 있어도 BMSB 처리 증명이 따로 필요할 수 있음(조치 기준이 품목과 선박)</text>
<text x="78.0" y="808.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">· 2026-27 시즌: 에틸포메이트가 도착 후 처리 방법으로 추가, 롤 화물 정책·보호 조치 제도 폐지</text>
<text x="78.0" y="838.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">· 뉴질랜드도 BMSB 위험국발 차량·기계·부품 등에 시즌 조치(MPI 품목별 안내)</text>
</svg>
