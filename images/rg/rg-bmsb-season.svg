<rect x="30.0" y="30.0" width="1612.0" height="881.0" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="56.0" y="80.0" font-size="30" font-weight="800" fill="#1d2a3a" text-anchor="start">2026-27 썩덩나무노린재(BMSB) 시즌: 호주행 화물의 기간</text>
<text x="56.0" y="114.0" font-size="19" font-weight="600" fill="#5f6b78" text-anchor="start">호주 DAFF 2026-27 시즌 공지 기준. 시즌 날짜·대상국·품목은 해마다 바뀝니다</text>
