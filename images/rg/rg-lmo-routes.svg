<text x="80.0" y="768.0" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">· 인체용 의약품으로 쓰이는 LMO에는 LMO법을 적용하지 않습니다(제3조). 같은 GM 콩도 싹을 틔울 수 있는 원형·종자는 LMO법, 식용유·간장은 식품위생법 표시 대상</text>
<text x="80.0" y="800.0" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">· 신규 LMO는 승인 전에 위해성심사(제7조의2). 수입승인 신청서에는 운반경로·운반수단·운반업자가 적힌 운반계약서나 운반계획서를 붙임</text>
<text x="80.0" y="832.0" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">· 국내 항구·공항에서 하역한 뒤 다른 나라로 보내면 경유 신고(농림축산업용은 농림축산검역본부장). 미신고는 2년 이하 징역 또는 3천만원 이하 벌금</text>
