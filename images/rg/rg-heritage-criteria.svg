<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs>
  <marker id="m1d2a3a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker>
</defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30.0" y="30.0" width="1612.0" height="881.0" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="56.0" y="80.0" font-size="30" font-weight="800" fill="#1d2a3a" text-anchor="start">일반동산문화유산인지 가르는 기준(시행령 별표 3)</text>
<text x="56.0" y="114.0" font-size="19" font-weight="600" fill="#5f6b78" text-anchor="start">지정·등록되지 않은 물건도 기준을 갖추면 반출 금지 대상입니다. 판단은 문화유산감정위원의 감정으로 정해집니다</text>
<rect x="56.0" y="146.0" width="960.0" height="470.0" fill="#fff" stroke="#c9d2dc" stroke-width="2" rx="14"/>
<text x="80.0" y="188.0" font-size="23" font-weight="800" fill="#1f6fd1" text-anchor="start">미술 · 전적 · 생활기술</text>
<text x="80.0" y="216.0" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="start">회화·도자기·공예·서예·석조, 고서·문서·현판·인장, 석기·민속자료·과학기술자료</text>
<text x="80.0" y="262.0" font-size="18" font-weight="800" fill="#1d2a3a" text-anchor="start">공통기준(모두 충족)</text>
<rect x="80.0" y="280.0" width="280.0" height="64.0" fill="#e8f1fc" stroke="#1f6fd1" stroke-width="2.5" rx="10"/>
<text x="220.0" y="320.0" font-size="18" font-weight="800" fill="#1f6fd1" text-anchor="middle">역사·예술·학술적 가치</text>
<text x="374.0" y="320.0" font-size="24" font-weight="800" fill="#1d2a3a" text-anchor="middle">+</text>
<rect x="388.0" y="280.0" width="280.0" height="64.0" fill="#e8f1fc" stroke="#1f6fd1" stroke-width="2.5" rx="10"/>
<text x="528.0" y="320.0" font-size="18" font-weight="800" fill="#1f6fd1" text-anchor="middle">원래 형태를 갖춘 양호한 상태</text>
<text x="682.0" y="320.0" font-size="24" font-weight="800" fill="#1d2a3a" text-anchor="middle">+</text>
<rect x="696.0" y="280.0" width="250.0" height="64.0" fill="#fdecea" stroke="#d9482b" stroke-width="2.5" rx="10"/>
<text x="821.0" y="320.0" font-size="18" font-weight="800" fill="#d9482b" text-anchor="middle">1945년 이전 제작</text>
<text x="80.0" y="390.0" font-size="18" font-weight="800" fill="#1d2a3a" text-anchor="start">추가기준(하나 이상)</text>
<rect x="80.0" y="404.0" width="92.9" height="38.0" fill="#fff" stroke="#1f6fd1" stroke-width="1.5" rx="19.0"/>
<text x="126.5" y="429.3" font-size="18" font-weight="700" fill="#1f6fd1" text-anchor="middle">희소성</text>
<rect x="186.9" y="404.0" width="92.9" height="38.0" fill="#fff" stroke="#1f6fd1" stroke-width="1.5" rx="19.0"/>
<text x="233.4" y="429.3" font-size="18" font-weight="700" fill="#1f6fd1" text-anchor="middle">명확성</text>
<rect x="293.8" y="404.0" width="92.9" height="38.0" fill="#fff" stroke="#1f6fd1" stroke-width="1.5" rx="19.0"/>
<text x="340.3" y="429.3" font-size="18" font-weight="700" fill="#1f6fd1" text-anchor="middle">특이성</text>
<rect x="400.8" y="404.0" width="92.9" height="38.0" fill="#fff" stroke="#1f6fd1" stroke-width="1.5" rx="19.0"/>
<text x="447.2" y="429.3" font-size="18" font-weight="700" fill="#1f6fd1" text-anchor="middle">시대성</text>
<rect x="80.0" y="466.0" width="912.0" height="128.0" fill="#eef1f5" stroke="#c9d2dc" stroke-width="2" rx="10"/>
<text x="100.0" y="500.0" font-size="17" font-weight="800" fill="#1d2a3a" text-anchor="start">별도기준: 공통·추가 기준을 못 갖춰도 대상</text>
<text x="100.0" y="532.0" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">· 국내에서 출토되었거나 오래 전해진 외국 제작 유물로 우리 문화에 상당한 영향을 끼친 것</text>
<text x="100.0" y="560.0" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">· 일부분만 남았어도 명문·문양·제작양식으로 문화유산 가치가 분명한 것</text>
<rect x="1036.0" y="146.0" width="580.0" height="470.0" fill="#e6f4ec" stroke="#1f8a5b" stroke-width="2.5" rx="14"/>
<text x="1060.0" y="188.0" font-size="23" font-weight="800" fill="#1f8a5b" text-anchor="start">자연사</text>
<text x="1060.0" y="216.0" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="start">박제·골격·액침표본, 식물 표본·종자, 화석·광물·운석</text>
<text x="1060.0" y="262.0" font-size="18" font-weight="800" fill="#1d2a3a" text-anchor="start">공통기준</text>
<text x="1060.0" y="296.0" font-size="17" font-weight="600" fill="#1d2a3a" text-anchor="start">· 역사·예술·학술적 또는 관상적 가치</text>
<text x="1060.0" y="324.0" font-size="17" font-weight="600" fill="#1d2a3a" text-anchor="start">· 양호한 상태(머리뼈처럼 특징 부위가</text>
<text x="1072.8" y="352.0" font-size="17" font-weight="600" fill="#1d2a3a" text-anchor="start">온전하면 양호로 봄)</text>
<rect x="1060.0" y="388.0" width="532.0" height="60.0" fill="#fff" stroke="#1f8a5b" stroke-width="3" rx="10"/>
<text x="1326.0" y="426.0" font-size="22" font-weight="800" fill="#1f8a5b" text-anchor="middle">제작연대 기준 없음</text>
<text x="1060.0" y="486.0" font-size="17" font-weight="600" fill="#1d2a3a" text-anchor="start">추가기준: 희소성, 특이성, 시대성·지역성</text>
<text x="1060.0" y="526.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="start">최근 채집한 표본도 대상이 될 수 있어</text>
<text x="1060.0" y="552.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="start">화석·운석 판매용 수출도 확인이 필요</text>
<rect x="56.0" y="636.0" width="1560.0" height="244.0" fill="#fff" stroke="#c9d2dc" stroke-width="2" rx="14"/>
<text x="80.0" y="676.0" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="start">제작연대 기준이 바뀌었습니다(2024. 7. 23. 시행 개정 시행령)</text>
<rect x="80.0" y="700.0" width="560.0" height="76.0" fill="#f1f3f5" stroke="#8a96a3" stroke-width="2" rx="10"/>
<text x="360.0" y="734.0" font-size="19" font-weight="800" fill="#8a96a3" text-anchor="middle">개정 전: 제작된 후 50년 이상</text>
<text x="360.0" y="760.0" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="middle">해마다 기준선이 움직임</text>
<line x1="650.0" y1="738.0" x2="700.0" y2="738.0" stroke="#1d2a3a" stroke-width="3" marker-end="url(#m1d2a3a)"/>
<rect x="710.0" y="700.0" width="560.0" height="76.0" fill="#fdecea" stroke="#d9482b" stroke-width="2.5" rx="10"/>
<text x="990.0" y="734.0" font-size="19" font-weight="800" fill="#d9482b" text-anchor="middle">현행: 1945년 이전 제작</text>
<text x="990.0" y="760.0" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="middle">고정 연도라 해마다 움직이지 않음</text>
<text x="80.0" y="812.0" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">· 수출일·반출일 현재 생존해 있는 제작자의 작품은 제외</text>
<text x="80.0" y="840.0" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">· 문화유산매매업 허가 대상의 “제작된 지 50년 이상”(시행령 제41조)은 매매업 기준이라 반출 기준과 다름</text>
</svg>
