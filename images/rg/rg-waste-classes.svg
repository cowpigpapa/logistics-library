<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs>
  <marker id="m1d2a3a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker>
  <marker id="m1f6fd1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker>
  <marker id="m1f8a5b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker>
  <marker id="m8a96a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a96a3"/></marker>
  <marker id="md9482b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker>
</defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30.0" y="30.0" width="1612.0" height="881.0" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="56.0" y="80.0" font-size="30" font-weight="800" fill="#1d2a3a" text-anchor="start">허가 대상인가, 신고 대상인가: 품목고시에서 찾는 순서</text>
<text x="56.0" y="114.0" font-size="19" font-weight="600" fill="#5f6b78" text-anchor="start">바젤 코드와 영문 품명으로 대조합니다(국문과 영문 해석이 다르면 영문 우선, [별지] 비고 3)</text>
<path d="M250 205.0 L420.0 290 L250 375.0 L80.0 290 Z" fill="#fff" stroke="#1d2a3a" stroke-width="3"/>
<text x="250.0" y="273.0" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="middle">폐기물관리법상</text>
<text x="250.0" y="297.0" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="middle">폐기물인가?</text>
<text x="250.0" y="321.0" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="middle">(재활용 원료로 팔려도)</text>
<line x1="250.0" y1="375.0" x2="250.0" y2="430.0" stroke="#1d2a3a" stroke-width="3" marker-end="url(#m1d2a3a)"/>
<text x="264.0" y="412.0" font-size="18" font-weight="800" fill="#1d2a3a" text-anchor="start">예</text>
<line x1="420.0" y1="290.0" x2="470.0" y2="290.0" stroke="#8a96a3" stroke-width="3" marker-end="url(#m8a96a3)"/>
<text x="430.0" y="278.0" font-size="16" font-weight="700" fill="#8a96a3" text-anchor="start">아니오</text>
<rect x="478.0" y="240.0" width="250.0" height="100.0" fill="#fff" stroke="#8a96a3" stroke-width="2" rx="10"/>
<text x="494.0" y="276.0" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">이 법의 대상 아님</text>
<text x="494.0" y="298.0" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">중고품은 재사용 조건을</text>
<text x="494.0" y="320.0" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">갖춰야(6절)</text>
<rect x="80.0" y="438.0" width="340.0" height="92.0" fill="#eef1f5" stroke="#1d2a3a" stroke-width="2" rx="10"/>
<text x="250.0" y="474.0" font-size="16" font-weight="700" fill="#1d2a3a" text-anchor="middle">품목고시에서 해당 목록 찾기</text>
<text x="250.0" y="500.0" font-size="16" font-weight="700" fill="#1d2a3a" text-anchor="middle">목록 A에 있어도 목록 B·녹색·별표 2면 규제 아님</text>
<rect x="770.0" y="150.0" width="846.0" height="250.0" fill="#fdecea" stroke="#d9482b" stroke-width="2.5" rx="12"/>
<rect x="788.0" y="166.0" width="59.3" height="34.0" fill="#d9482b" stroke="#d9482b" stroke-width="1.5" rx="17.0"/>
<text x="817.6" y="189.3" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">허가</text>
<text x="870.0" y="192.0" font-size="22" font-weight="800" fill="#d9482b" text-anchor="start">[별지] 수출입규제폐기물</text>
<text x="790.0" y="234.0" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">바젤협약 부속서 II(Y46~Y49), 부속서 VIII 목록 A,</text>
<text x="790.0" y="258.0" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">OECD 황색 목록</text>
<text x="790.0" y="282.0" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">유역(지방)환경청 허가, 수출은 수입국·경유국 동의 전제</text>
<text x="790.0" y="306.0" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">이동서류가 화물을 따라감, 보증금·보증보험</text>
<text x="1290.0" y="234.0" font-size="15" font-weight="700" fill="#5f6b78" text-anchor="start">예</text>
<text x="1290.0" y="260.0" font-size="15" font-weight="600" fill="#1d2a3a" text-anchor="start">폐납축전지 A1160</text>
<text x="1290.0" y="283.0" font-size="15" font-weight="600" fill="#1d2a3a" text-anchor="start">유해 전기전자폐기물 A1181</text>
<text x="1290.0" y="306.0" font-size="15" font-weight="600" fill="#1d2a3a" text-anchor="start">비유해 전기전자폐기물 Y49(2025~)</text>
<text x="1290.0" y="329.0" font-size="15" font-weight="600" fill="#1d2a3a" text-anchor="start">혼합 폐플라스틱 Y48(2021~)</text>
<text x="1290.0" y="352.0" font-size="15" font-weight="600" fill="#1d2a3a" text-anchor="start">유해물질 함유 피복 케이블 A1190</text>
<line x1="745.0" y1="275.0" x2="764.0" y2="275.0" stroke="#d9482b" stroke-width="4" marker-end="url(#md9482b)"/>
<rect x="770.0" y="414.0" width="846.0" height="230.0" fill="#e8f1fc" stroke="#1f6fd1" stroke-width="2.5" rx="12"/>
<rect x="788.0" y="430.0" width="59.3" height="34.0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1.5" rx="17.0"/>
<text x="817.6" y="453.3" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">신고</text>
<text x="870.0" y="456.0" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="start">[별표 2] 수출입관리폐기물</text>
<text x="790.0" y="498.0" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">[별표 1](목록 B·OECD 녹색 목록)로 규제에서 빠진 것 중</text>
<text x="790.0" y="522.0" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">사업장폐기물 26개 품목</text>
<text x="790.0" y="546.0" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">유역(지방)환경청 신고, 10일 이내 수리 여부 통지</text>
<text x="790.0" y="570.0" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">중요 사항이 바뀌면 변경신고</text>
<text x="1290.0" y="498.0" font-size="15" font-weight="700" fill="#5f6b78" text-anchor="start">예</text>
<text x="1290.0" y="524.0" font-size="15" font-weight="600" fill="#1d2a3a" text-anchor="start">유해물질 없는 피복 케이블 B1115</text>
<text x="1290.0" y="547.0" font-size="15" font-weight="600" fill="#1d2a3a" text-anchor="start">단일 재질·PET·PE·PP만 섞인 폐플라스틱</text>
<text x="1290.0" y="570.0" font-size="15" font-weight="600" fill="#1d2a3a" text-anchor="start">폐타이어, 폐지류, 폐금속류</text>
<text x="1290.0" y="593.0" font-size="15" font-weight="600" fill="#1d2a3a" text-anchor="start">폐전기전자부품(수입·OECD 수출)</text>
<line x1="745.0" y1="529.0" x2="764.0" y2="529.0" stroke="#1f6fd1" stroke-width="4" marker-end="url(#m1f6fd1)"/>
<rect x="770.0" y="658.0" width="846.0" height="196.0" fill="#e6f4ec" stroke="#1f8a5b" stroke-width="2.5" rx="12"/>
<rect x="788.0" y="674.0" width="59.3" height="34.0" fill="#1f8a5b" stroke="#1f8a5b" stroke-width="1.5" rx="17.0"/>
<text x="817.6" y="697.3" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">제외</text>
<text x="870.0" y="700.0" font-size="22" font-weight="800" fill="#1f8a5b" text-anchor="start">신고도 제외</text>
<text x="790.0" y="742.0" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">배출자신고가 면제되는 고철·비철금속으로</text>
<text x="790.0" y="766.0" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">폐유 등에 오염되지 않고 이물질이 없는 것([별표 2] 비고 3)</text>
<text x="790.0" y="790.0" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">시험분석·연구용 25kg 이하 관리폐기물(증빙 시)</text>
<text x="1290.0" y="742.0" font-size="15" font-weight="700" fill="#5f6b78" text-anchor="start">예</text>
<text x="1290.0" y="768.0" font-size="15" font-weight="600" fill="#1d2a3a" text-anchor="start">깨끗한 철·구리·니켈 스크랩(B1010 등)</text>
<line x1="745.0" y1="756.0" x2="764.0" y2="756.0" stroke="#1f8a5b" stroke-width="4" marker-end="url(#m1f8a5b)"/>
<line x1="420.0" y1="484.0" x2="745.0" y2="484.0" stroke="#1d2a3a" stroke-width="3"/>
<line x1="745.0" y1="275.0" x2="745.0" y2="756.0" stroke="#1d2a3a" stroke-width="3"/>
<rect x="56.0" y="600.0" width="664.0" height="280.0" fill="#fff" stroke="#c9d2dc" stroke-width="2" rx="12"/>
<text x="78.0" y="640.0" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="start">같은 이름도 상태로 갈립니다: 폐전선</text>
<rect x="78.0" y="664.0" width="304.0" height="120.0" fill="#fdecea" stroke="#d9482b" stroke-width="2" rx="10"/>
<text x="96.0" y="698.0" font-size="16" font-weight="800" fill="#d9482b" text-anchor="start">A1190 허가</text>
<text x="96.0" y="724.0" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">납·카드뮴·PCB 등을</text>
<text x="96.0" y="750.0" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">유해할 정도로 함유·오염</text>
<rect x="402.0" y="664.0" width="300.0" height="120.0" fill="#e8f1fc" stroke="#1f6fd1" stroke-width="2" rx="10"/>
<text x="418.0" y="698.0" font-size="16" font-weight="800" fill="#1f6fd1" text-anchor="start">B1115 → 신고</text>
<text x="418.0" y="724.0" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">유해물질 없음, 별표 2의</text>
<text x="418.0" y="750.0" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">폐합성고분자화합물로 신고</text>
<text x="78.0" y="818.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="start">2019년 점검: 납 0.819%(기준 0.1%) 폐전선 49.4톤을</text>
<text x="78.0" y="842.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="start">허가 없이 수출하려다 적발</text>
</svg>
