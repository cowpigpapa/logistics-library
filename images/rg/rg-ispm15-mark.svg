<text x="610.0" y="476.0" font-size="64" font-weight="800" fill="#1d2a3a" text-anchor="middle">HT</text>
<text x="780.0" y="560.0" font-size="28" font-weight="800" fill="#1d2a3a" text-anchor="start">(XX-000)</text>
<line x1="505.0" y1="322.0" x2="440.0" y2="232.0" stroke="#1f8a5b" stroke-width="3"/>
