<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs>
  <marker id="m1d2a3a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker>
</defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30.0" y="30.0" width="1612.0" height="881.0" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="56.0" y="80.0" font-size="30" font-weight="800" fill="#1d2a3a" text-anchor="start">판정에서 수출신고·세관 심사까지</text>
<text x="56.0" y="114.0" font-size="19" font-weight="600" fill="#5f6b78" text-anchor="start">허가 먼저, 신고는 나중(「전략물자 등 수출통관에 관한 고시」 제3조제1항)</text>
<rect x="56.0" y="160.0" width="360.0" height="330.0" fill="#e8f1fc" stroke="#1f6fd1" stroke-width="3" rx="12"/>
<text x="74.0" y="199.6" font-size="24" font-weight="800" fill="#1f6fd1" text-anchor="start">① 판정</text>
<text x="74.0" y="229.4" font-size="18" font-weight="800" fill="#1d2a3a" text-anchor="start">전문판정</text>
<text x="74.0" y="259.4" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">무역안보관리원(별표 2 제1~9부·2의2)</text>
<text x="74.0" y="289.4" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">한국원자력통제기술원(제10부)</text>
<text x="74.0" y="319.4" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">국방기술품질원(별표 3)</text>
<text x="74.0" y="349.4" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">접수일부터 15일 이내, 유효 2년</text>
<text x="74.0" y="379.4" font-size="18" font-weight="800" fill="#1d2a3a" text-anchor="start">자가판정</text>
<text x="74.0" y="409.4" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">교육 이수자가 근거 자료와 함께</text>
<text x="74.0" y="439.4" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">정보시스템에 등록</text>
<rect x="448.0" y="160.0" width="360.0" height="330.0" fill="#fdeee8" stroke="#e4572e" stroke-width="3" rx="12"/>
<text x="466.0" y="199.6" font-size="24" font-weight="800" fill="#e4572e" text-anchor="start">② 허가 또는 면제</text>
<text x="466.0" y="229.4" font-size="18" font-weight="800" fill="#1d2a3a" text-anchor="start">해당이면</text>
<text x="466.0" y="259.4" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">수출허가·상황허가를 받거나</text>
<text x="466.0" y="289.4" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">면제(고시 제26조)를 쓰고</text>
<text x="466.0" y="319.4" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">사전·사후거래보고서 제출</text>
<text x="466.0" y="349.4" font-size="18" font-weight="800" fill="#1d2a3a" text-anchor="start">비해당이어도</text>
<text x="466.0" y="379.4" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">최종사용자·용도·경로로</text>
<text x="466.0" y="409.4" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">상황허가 대상인지 따로 확인</text>
<text x="466.0" y="439.4" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">(고시 제12조제4항)</text>
<rect x="840.0" y="160.0" width="360.0" height="330.0" fill="#e6f4ec" stroke="#1f8a5b" stroke-width="3" rx="12"/>
<text x="858.0" y="199.6" font-size="24" font-weight="800" fill="#1f8a5b" text-anchor="start">③ 수출신고</text>
<text x="858.0" y="229.4" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">신고서에 다음 중 하나를 기재</text>
<text x="858.0" y="259.4" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">· 허가번호</text>
<text x="858.0" y="289.4" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">· 전문판정 발급번호</text>
<text x="858.0" y="319.4" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">· 자가판정 등록번호</text>
<text x="858.0" y="349.4" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">· 사전신고서 판정번호</text>
<text x="858.0" y="379.4" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="start">신고는 화주나 관세사 명의라</text>
<text x="858.0" y="409.4" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="start">화주가 번호를 관세사에게</text>
<text x="858.0" y="439.4" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="start">넘깁니다(관세법 제242조)</text>
<rect x="1232.0" y="160.0" width="360.0" height="330.0" fill="#fdecea" stroke="#d9482b" stroke-width="3" rx="12"/>
<text x="1250.0" y="199.6" font-size="24" font-weight="800" fill="#d9482b" text-anchor="start">④ 세관 심사</text>
<text x="1250.0" y="229.4" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">전략물자 해당 여부와</text>
<text x="1250.0" y="259.4" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">허가사항 심사(제4조)</text>
<text x="1250.0" y="289.4" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">· 판정서 제출 요청</text>
<text x="1250.0" y="319.4" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">· 무역안보관리원에 판정 요청</text>
<text x="1250.0" y="349.4" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">위반 혐의가 있으면</text>
<text x="1250.0" y="379.4" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">조사 전담부서에 의뢰(제6조)</text>
<line x1="420.0" y1="325.0" x2="446.0" y2="325.0" stroke="#1d2a3a" stroke-width="4" marker-end="url(#m1d2a3a)"/>
<line x1="812.0" y1="325.0" x2="838.0" y2="325.0" stroke="#1d2a3a" stroke-width="4" marker-end="url(#m1d2a3a)"/>
<line x1="1204.0" y1="325.0" x2="1230.0" y2="325.0" stroke="#1d2a3a" stroke-width="4" marker-end="url(#m1d2a3a)"/>
<rect x="56.0" y="530.0" width="1560.0" height="150.0" fill="#fdecea" stroke="#d9482b" stroke-width="2" rx="12"/>
<text x="80.0" y="572.0" font-size="22" font-weight="800" fill="#d9482b" text-anchor="start">이동중지(대외무역법 제21조)</text>
<text x="80.0" y="608.0" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">허가 없이 또는 부정한 허가로 수출·경유·환적되는 것을 막기 위해 허가기관은 적법성이 확인될 때까지 이동중지명령을</text>
<text x="80.0" y="632.8" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">하거나 직접 이동중지조치를 할 수 있습니다. 위반·방해하면 5년 이하 징역 또는 1억원 이하 벌금(제53조의2제1호).</text>
<rect x="56.0" y="700.0" width="1560.0" height="180.0" fill="#fff" stroke="#c9d2dc" stroke-width="2" rx="12"/>
<text x="80.0" y="742.0" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="start">판정은 품목을, 상황허가는 거래 상대와 용도를 봅니다</text>
<text x="80.0" y="780.0" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="start">판정 신청은 의무가 아니지만, 판정 없이 수출했다가 전략물자로 드러나면 무허가 수출이 됩니다.</text>
<text x="80.0" y="804.8" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="start">전략물자는 세관장확인 고시 별표 1에 따로 올라 있지 않고, 신고서 기재와 세관 심사로 확인하는 구조입니다.</text>
<text x="80.0" y="829.7" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="start">판정·허가 관련 서류는 5년간 보관합니다(대외무역법 제28조, 고시 제92조).</text>
</svg>
