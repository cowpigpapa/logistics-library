<text x="98.0" y="80.0" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">수출허가</text>
<text x="220.0" y="80.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">대외무역법 제19조의2</text>
<rect x="70.0" y="150.0" width="190.0" height="100.0" fill="#e8f1fc" stroke="#1f6fd1" stroke-width="3" rx="10"/>
