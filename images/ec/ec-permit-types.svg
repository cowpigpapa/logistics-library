<text x="165.0" y="228.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="middle">수출자</text>
<rect x="590.0" y="150.0" width="190.0" height="100.0" fill="#fff" stroke="#1d2a3a" stroke-width="3" rx="10"/>
<text x="685.0" y="200.0" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="middle">외국</text>
<text x="685.0" y="228.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="middle">목적지 어디든</text>
<line x1="270.0" y1="200.0" x2="578.0" y2="200.0" stroke="#1f6fd1" stroke-width="5" marker-end="url(#m1f6fd1)"/>
<rect x="330.0" y="158.0" width="177.4" height="32.0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1.5" rx="16.0"/>
<text x="418.7" y="180.3" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">전략물자(별표 2·3)</text>
<text x="70.0" y="312.0" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">목록에 오른 물품·소프트웨어·기술을 수출하거나 수출신고할 때.</text>
<text x="70.0" y="336.8" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">목적지 제한이 없습니다. 개별수출허가는 물품·수량·최종사용자·</text>
<text x="70.0" y="361.7" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">용도를 건별로 확인하고, 포괄수출허가는 자율준수무역거래자만.</text>
<rect x="846.0" y="30.0" width="796.0" height="410.0" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<circle cx="886.0" cy="72.0" r="18" fill="#d9482b" stroke="#d9482b" stroke-width="1"/>
<text x="886.0" y="78.5" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="914.0" y="80.0" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">상황허가(catch-all)</text>
<text x="1176.0" y="80.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">제19조의3, 고시 제54조</text>
<rect x="886.0" y="150.0" width="190.0" height="100.0" fill="#e8f1fc" stroke="#1f6fd1" stroke-width="3" rx="10"/>
<text x="981.0" y="200.0" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="middle">한국</text>
<text x="981.0" y="228.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="middle">수출자</text>
<rect x="1406.0" y="150.0" width="190.0" height="100.0" fill="#fff" stroke="#1d2a3a" stroke-width="3" rx="10"/>
<text x="1501.0" y="200.0" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="middle">외국</text>
<text x="1501.0" y="228.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="middle">수입자·최종사용자</text>
<line x1="1086.0" y1="200.0" x2="1394.0" y2="200.0" stroke="#d9482b" stroke-width="5" marker-end="url(#md9482b)"/>
<rect x="1164.0" y="158.0" width="123.7" height="32.0" fill="#8a96a3" stroke="#8a96a3" stroke-width="1.5" rx="16.0"/>
<text x="1225.9" y="180.3" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">목록 밖 물품</text>
<text x="886.0" y="298.0" font-size="18" font-weight="800" fill="#d9482b" text-anchor="start">이럴 때 신청합니다</text>
<text x="886.0" y="323.0" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">· 대량파괴무기등 용도를 알았거나 12가지 징후로 의심될 때</text>
<text x="886.0" y="348.0" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">· 우려거래자 목록에 오른 자가 구매자·최종수하인·최종사용자</text>
<text x="886.0" y="373.0" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">· 정부로부터 서면통보를 받았을 때</text>
<text x="886.0" y="398.0" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">· 별표 2의2 품목을 해당 지역(러시아·벨라루스 등)으로 보낼 때</text>
<rect x="30.0" y="470.0" width="796.0" height="410.0" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<circle cx="70.0" cy="512.0" r="18" fill="#e4572e" stroke="#e4572e" stroke-width="1"/>
<text x="70.0" y="518.5" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="98.0" y="520.0" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">경유 또는 환적허가</text>
<text x="348.0" y="520.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">제19조의4, 시행령 제33조의2</text>
<rect x="60.0" y="590.0" width="160.0" height="100.0" fill="#fff" stroke="#1d2a3a" stroke-width="3" rx="10"/>
<text x="140.0" y="648.0" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="middle">외국 A</text>
<rect x="330.0" y="580.0" width="200.0" height="120.0" fill="#fdeee8" stroke="#e4572e" stroke-width="3" rx="10"/>
<text x="430.0" y="640.0" font-size="22" font-weight="800" fill="#e4572e" text-anchor="middle">한국 항만·공항</text>
<text x="430.0" y="668.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="middle">거치거나 옮겨 싣기</text>
<rect x="636.0" y="590.0" width="160.0" height="100.0" fill="#fff" stroke="#1d2a3a" stroke-width="3" rx="10"/>
<text x="716.0" y="648.0" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="middle">외국 B</text>
<line x1="226.0" y1="640.0" x2="322.0" y2="640.0" stroke="#e4572e" stroke-width="5" marker-end="url(#me4572e)"/>
<line x1="538.0" y1="640.0" x2="628.0" y2="640.0" stroke="#e4572e" stroke-width="5" marker-end="url(#me4572e)"/>
<text x="70.0" y="752.0" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">목적지가 외국인 전략물자등이 국내를 거칠 때. 용도 의도를 알았거나</text>
<text x="70.0" y="776.8" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">징후로 의심될 때, 정부 통보를 받았을 때, 우려거래자에게 갈 때 등.</text>
<text x="70.0" y="801.7" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">신청인은 “경유하거나 환적하려는 자”로만 정해져 있습니다.</text>
<rect x="846.0" y="470.0" width="796.0" height="410.0" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<circle cx="886.0" cy="512.0" r="18" fill="#1f8a5b" stroke="#1f8a5b" stroke-width="1"/>
<text x="886.0" y="518.5" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="914.0" y="520.0" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">중개허가</text>
<text x="1036.0" y="520.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">제19조의5, 고시 제59조</text>
<rect x="886.0" y="660.0" width="180.0" height="90.0" fill="#fff" stroke="#1d2a3a" stroke-width="3" rx="10"/>
<text x="976.0" y="713.0" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="middle">제3국 A</text>
<rect x="1416.0" y="660.0" width="180.0" height="90.0" fill="#fff" stroke="#1d2a3a" stroke-width="3" rx="10"/>
<text x="1506.0" y="713.0" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="middle">제3국 B</text>
<line x1="1074.0" y1="705.0" x2="1408.0" y2="705.0" stroke="#1d2a3a" stroke-width="5" marker-end="url(#m1d2a3a)"/>
<text x="1241.0" y="695.0" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">물품 이동</text>
<rect x="1131.0" y="558.0" width="220.0" height="66.0" fill="#e6f4ec" stroke="#1f8a5b" stroke-width="3" rx="10"/>
<text x="1241.0" y="588.0" font-size="20" font-weight="800" fill="#1f8a5b" text-anchor="middle">한국의 중개자</text>
<text x="1241.0" y="612.0" font-size="14" font-weight="500" fill="#5f6b78" text-anchor="middle">국민·국내 법인·국내 거주 외국인</text>
<path d="M1131 591 Q 1006 595 976 652" stroke="#1f8a5b" stroke-width="3" fill="none" marker-end="url(#m1f8a5b)" stroke-dasharray="8 6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M1351 591 Q 1476 595 1506 652" stroke="#1f8a5b" stroke-width="3" fill="none" marker-end="url(#m1f8a5b)" stroke-dasharray="8 6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="886.0" y="788.0" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">대가를 받고 외국에서 다른 외국으로 가는 거래를 주선할 때.</text>
<text x="886.0" y="812.8" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">물품이 한국을 거치지 않아도 허가 대상입니다.</text>
