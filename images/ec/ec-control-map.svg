<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs>
</defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30.0" y="30.0" width="1612.0" height="881.0" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="56.0" y="80.0" font-size="30" font-weight="800" fill="#1d2a3a" text-anchor="start">누가 무엇의 수출을 허가하나</text>
<text x="56.0" y="114.0" font-size="19" font-weight="600" fill="#5f6b78" text-anchor="start">같은 품목이라도 최종사용자·용도에 따라 기관이 달라집니다(수출통제 기초 1절 표 기준)</text>
<rect x="56.0" y="146.0" width="378.0" height="56.0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="2" rx="12"/>
<text x="245.0" y="183.0" font-size="23" font-weight="800" fill="#fff" text-anchor="middle">산업통상부장관</text>
<rect x="56.0" y="218.0" width="378.0" height="82.0" fill="#e8f1fc" stroke="#1f6fd1" stroke-width="2" rx="10"/>
<text x="74.0" y="252.0" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">전략물자 이중용도품목</text>
<text x="74.0" y="280.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="start">별표 2 제1~9부</text>
<rect x="56.0" y="312.0" width="378.0" height="82.0" fill="#e8f1fc" stroke="#1f6fd1" stroke-width="2" rx="10"/>
<text x="74.0" y="346.0" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">상황허가 대상(원칙)</text>
<text x="74.0" y="374.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="start">대외무역법 제19조의3</text>
<rect x="56.0" y="406.0" width="378.0" height="82.0" fill="#e8f1fc" stroke="#1f6fd1" stroke-width="2" rx="10"/>
<text x="74.0" y="440.0" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">특정화학물질·생물작용제</text>
<text x="74.0" y="468.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="start">화학무기·생물무기법 제11조</text>
<rect x="450.0" y="146.0" width="378.0" height="56.0" fill="#1f8a5b" stroke="#1f8a5b" stroke-width="2" rx="12"/>
<text x="639.0" y="183.0" font-size="23" font-weight="800" fill="#fff" text-anchor="middle">방위사업청장</text>
<rect x="450.0" y="218.0" width="378.0" height="82.0" fill="#e6f4ec" stroke="#1f8a5b" stroke-width="2" rx="10"/>
<text x="468.0" y="252.0" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">군용물자품목</text>
<text x="468.0" y="280.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="start">고시 별표 3</text>
<rect x="450.0" y="312.0" width="378.0" height="82.0" fill="#e6f4ec" stroke="#1f8a5b" stroke-width="2" rx="10"/>
<text x="468.0" y="346.0" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">이중용도품목을 외국 정부·군·</text>
<text x="468.0" y="374.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="start">방산업체가 군사 목적으로 쓸 때</text>
<rect x="450.0" y="406.0" width="378.0" height="82.0" fill="#e6f4ec" stroke="#1f8a5b" stroke-width="2" rx="10"/>
<text x="468.0" y="440.0" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">방산물자·국방과학기술</text>
<text x="468.0" y="468.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="start">방위사업법 제57조(건별 허가)</text>
<rect x="450.0" y="500.0" width="378.0" height="82.0" fill="#e6f4ec" stroke="#1f8a5b" stroke-width="2" rx="10"/>
<text x="468.0" y="534.0" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">상황허가 중 군수품</text>
<text x="468.0" y="562.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="start">고시 제5조제2항</text>
<rect x="450.0" y="594.0" width="378.0" height="82.0" fill="#e6f4ec" stroke="#1f8a5b" stroke-width="2" rx="10"/>
<text x="468.0" y="628.0" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">군용 총포·도검·화약류</text>
<text x="468.0" y="656.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="start">방위사업청장 수출허가서</text>
<rect x="844.0" y="146.0" width="378.0" height="56.0" fill="#6b4fbb" stroke="#6b4fbb" stroke-width="2" rx="12"/>
<text x="1033.0" y="183.0" font-size="23" font-weight="800" fill="#fff" text-anchor="middle">원자력안전위원회 등</text>
<rect x="844.0" y="218.0" width="378.0" height="82.0" fill="#f0ecfa" stroke="#6b4fbb" stroke-width="2" rx="10"/>
<text x="862.0" y="252.0" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">이중용도품목 제10부</text>
<text x="862.0" y="280.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="start">원자력 전용품목(원안위 위원장)</text>
<rect x="844.0" y="312.0" width="378.0" height="82.0" fill="#f0ecfa" stroke="#6b4fbb" stroke-width="2" rx="10"/>
<text x="862.0" y="346.0" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">상황허가 중 일부 원자력 품목</text>
<text x="862.0" y="374.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="start">원자력안전위원회</text>
<rect x="844.0" y="406.0" width="378.0" height="82.0" fill="#f0ecfa" stroke="#6b4fbb" stroke-width="2" rx="10"/>
<text x="862.0" y="440.0" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">핵물질</text>
<text x="862.0" y="468.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="start">원안위 수출요건확인서</text>
<rect x="844.0" y="500.0" width="378.0" height="82.0" fill="#f0ecfa" stroke="#6b4fbb" stroke-width="2" rx="10"/>
<text x="862.0" y="534.0" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">방사성동위원소·발생장치</text>
<text x="862.0" y="562.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="start">한국원자력안전재단 확인서</text>
<rect x="1238.0" y="146.0" width="378.0" height="56.0" fill="#b7791f" stroke="#b7791f" stroke-width="2" rx="12"/>
<text x="1427.0" y="183.0" font-size="23" font-weight="800" fill="#fff" text-anchor="middle">경찰청장·지방경찰청장</text>
<rect x="1238.0" y="218.0" width="378.0" height="82.0" fill="#fdf4e3" stroke="#b7791f" stroke-width="2" rx="10"/>
<text x="1256.0" y="252.0" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">총포·도검·화약류</text>
<text x="1256.0" y="280.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="start">권총·소총·화약·도검·분사기 등</text>
<rect x="1238.0" y="312.0" width="378.0" height="82.0" fill="#fdf4e3" stroke="#b7791f" stroke-width="2" rx="10"/>
<text x="1256.0" y="346.0" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="start">수출허가증은 세관장확인 대상</text>
<text x="1256.0" y="374.0" font-size="16" font-weight="500" fill="#5f6b78" text-anchor="start">세관장확인 고시 별표 1</text>
<rect x="56.0" y="690.0" width="1560.0" height="116.0" fill="#fff" stroke="#c9d2dc" stroke-width="2" rx="12"/>
<text x="80.0" y="728.0" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="start">해당 여부 판정(전문판정)은 따로</text>
<rect x="80.0" y="750.0" width="352.4" height="34.0" fill="#fff" stroke="#1d2a3a" stroke-width="1.5" rx="17.0"/>
<text x="256.2" y="773.0" font-size="17" font-weight="700" fill="#1d2a3a" text-anchor="middle">무역안보관리원: 별표 2 제1~9부, 별표 2의2</text>
<rect x="446.4" y="750.0" width="307.6" height="34.0" fill="#fff" stroke="#1d2a3a" stroke-width="1.5" rx="17.0"/>
<text x="600.2" y="773.0" font-size="17" font-weight="700" fill="#1d2a3a" text-anchor="middle">한국원자력통제기술원: 별표 2 제10부</text>
<rect x="768.0" y="750.0" width="199.8" height="34.0" fill="#fff" stroke="#1d2a3a" stroke-width="1.5" rx="17.0"/>
<text x="867.9" y="773.0" font-size="17" font-weight="700" fill="#1d2a3a" text-anchor="middle">국방기술품질원: 별표 3</text>
<text x="60.0" y="850.0" font-size="17" font-weight="500" fill="#5f6b78" text-anchor="start">방위사업법 허가를 받은 방산물자는 대외무역법 수출허가를 따로 받지 않고(대외무역법 제19조의2 단서),</text>
<text x="60.0" y="876.0" font-size="17" font-weight="500" fill="#5f6b78" text-anchor="start">대외무역법 수출허가를 받은 특정화학물질은 화학무기·생물무기법 허가가 따로 필요 없습니다(제11조제1항 단서).</text>
</svg>
