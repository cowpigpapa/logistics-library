<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs>
  <marker id="m1d2a3a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker>
</defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30.0" y="30.0" width="1612.0" height="881.0" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="56.0" y="80.0" font-size="30" font-weight="800" fill="#1d2a3a" text-anchor="start">서류로 거르는 순서: 화물을 열지 않고 서류끼리 대조합니다</text>
<rect x="56.0" y="140.0" width="370.0" height="230.0" fill="#e8f1fc" stroke="#1f6fd1" stroke-width="3" rx="12"/>
<text x="74.0" y="179.6" font-size="24" font-weight="800" fill="#1f6fd1" text-anchor="start">① 품명을 구체화</text>
<text x="74.0" y="210.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">넓은 품명이면 모델명·</text>
<text x="74.0" y="243.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">제조사·용도·HS 10단위</text>
<text x="74.0" y="276.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">러시아·벨라루스행은 HS를</text>
<text x="74.0" y="309.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">별표 2의2와 1차 대조</text>
<rect x="446.0" y="140.0" width="370.0" height="230.0" fill="#e8f1fc" stroke="#1f6fd1" stroke-width="3" rx="12"/>
<text x="464.0" y="179.6" font-size="24" font-weight="800" fill="#1f6fd1" text-anchor="start">② 판정서·허가서</text>
<text x="464.0" y="210.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">판정 모델 = 선적 모델?</text>
<text x="464.0" y="243.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">판정일부터 2년 안?</text>
<text x="464.0" y="276.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">허가서의 물품·수량·</text>
<text x="464.0" y="309.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">최종사용자·목적지 = 부킹?</text>
<rect x="836.0" y="140.0" width="370.0" height="230.0" fill="#e8f1fc" stroke="#1f6fd1" stroke-width="3" rx="12"/>
<text x="854.0" y="179.6" font-size="24" font-weight="800" fill="#1f6fd1" text-anchor="start">③ 최종수하인·사용자</text>
<text x="854.0" y="210.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">운송서류 수하인과 허가서</text>
<text x="854.0" y="243.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">최종사용자가 다르면</text>
<text x="854.0" y="276.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">그 관계를 설명받는다</text>
<rect x="1226.0" y="140.0" width="370.0" height="230.0" fill="#e8f1fc" stroke="#1f6fd1" stroke-width="3" rx="12"/>
<text x="1244.0" y="179.6" font-size="24" font-weight="800" fill="#1f6fd1" text-anchor="start">④ 목록 대조</text>
<text x="1244.0" y="210.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">상황허가 우려거래자 목록</text>
<text x="1244.0" y="243.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">(yestrade.go.kr)</text>
<text x="1244.0" y="276.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">미국 관련이면 통합 제재</text>
<text x="1244.0" y="309.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">목록(CSL)·SDN</text>
<rect x="251.0" y="470.0" width="370.0" height="230.0" fill="#fdeee8" stroke="#e4572e" stroke-width="3" rx="12"/>
<text x="269.0" y="509.6" font-size="24" font-weight="800" fill="#e4572e" text-anchor="start">⑤ 경로·결제·변경</text>
<text x="269.0" y="540.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">수하인·도착항 변경,</text>
<text x="269.0" y="573.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">스위치 B/L, 제3국 결제는</text>
<text x="269.0" y="606.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">사유를 서면으로 받고</text>
<text x="269.0" y="639.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">허가 범위를 다시 대조</text>
<rect x="641.0" y="470.0" width="370.0" height="230.0" fill="#fdeee8" stroke="#e4572e" stroke-width="3" rx="12"/>
<text x="659.0" y="509.6" font-size="24" font-weight="800" fill="#e4572e" text-anchor="start">⑥ 미국산 통제 문구</text>
<text x="659.0" y="540.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">EAR 758.6 문구·ECCN·</text>
<text x="659.0" y="573.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">ITAR 허가번호가 있으면</text>
<text x="659.0" y="606.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">재수출 허가·예외 근거와</text>
<text x="659.0" y="639.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">최소 함량 계산을 받는다</text>
<rect x="1031.0" y="470.0" width="370.0" height="230.0" fill="#fdecea" stroke="#d9482b" stroke-width="3" rx="12"/>
<text x="1049.0" y="509.6" font-size="24" font-weight="800" fill="#d9482b" text-anchor="start">⑦ 멈추고·기록하고·알린다</text>
<text x="1049.0" y="540.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">해명이 없거나 서류가</text>
<text x="1049.0" y="573.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">안 맞으면 부킹 보류</text>
<text x="1049.0" y="606.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">판정·허가기관 상담 권유</text>
<text x="1049.0" y="639.5" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">이동중지 지시엔 정지</text>
<line x1="428.0" y1="255.0" x2="444.0" y2="255.0" stroke="#1d2a3a" stroke-width="4" marker-end="url(#m1d2a3a)"/>
<line x1="818.0" y1="255.0" x2="834.0" y2="255.0" stroke="#1d2a3a" stroke-width="4" marker-end="url(#m1d2a3a)"/>
<line x1="1208.0" y1="255.0" x2="1224.0" y2="255.0" stroke="#1d2a3a" stroke-width="4" marker-end="url(#m1d2a3a)"/>
<path d="M1411.0 374 L 1411.0 410 L 436.0 410 L 436.0 462" stroke="#1d2a3a" stroke-width="3" fill="none" marker-end="url(#m1d2a3a)" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="623.0" y1="585.0" x2="639.0" y2="585.0" stroke="#1d2a3a" stroke-width="4" marker-end="url(#m1d2a3a)"/>
<line x1="1013.0" y1="585.0" x2="1029.0" y2="585.0" stroke="#1d2a3a" stroke-width="4" marker-end="url(#m1d2a3a)"/>
<rect x="56.0" y="770.0" width="1560.0" height="110.0" fill="#fff" stroke="#c9d2dc" stroke-width="2" rx="12"/>
<text x="80.0" y="810.0" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="start">남길 것</text>
<text x="80.0" y="846.0" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">요청·회신·받은 서류·보류 판단의 이유를 건별로 5년 이상 보관합니다. 판정이 “비해당”이어도 상황허가는 별개입니다(고시 제12조제4항).</text>
</svg>
