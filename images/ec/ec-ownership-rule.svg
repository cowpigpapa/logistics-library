<text x="1100.0" y="636.0" font-size="18" font-weight="800" fill="#5f6b78" text-anchor="start">회사 Z(40% + 지배)</text>
<line x1="70.0" y1="652.0" x2="1600.0" y2="652.0" stroke="#c9d2dc" stroke-width="2"/>
<text x="80.0" y="692.0" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="start">미국 OFAC 50% 규칙</text>
<text x="600.0" y="692.0" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">차단 대상(직접·간접, 혼자 또는 합쳐서)</text>
<text x="1100.0" y="692.0" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">자동 차단은 아님</text>
<text x="80.0" y="748.0" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="start">EU 제재</text>
<text x="600.0" y="748.0" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">소유로 봄(여럿의 지분 합산)</text>
<text x="1100.0" y="748.0" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">지배하면 통제 아래로 추정(회사가 반증 가능)</text>
<text x="80.0" y="804.0" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="start">한국 테러자금금지법</text>
<text x="600.0" y="804.0" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">대상(지분 합산, 시행령 제2조제1항)</text>
<text x="1100.0" y="804.0" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">사실상 영향력을 행사하면 해당</text>
<text x="80.0" y="858.0" font-size="15" font-weight="500" fill="#5f6b78" text-anchor="start">한국 소유·지배 법인 조항(제4조제9항)은 2026년 1월 22일 시행. 예시의 지분율은 설명용입니다.</text>
