<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs>
</defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30.0" y="30.0" width="1612.0" height="881.0" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="56.0" y="80.0" font-size="30" font-weight="800" fill="#1d2a3a" text-anchor="start">한 건의 화물에서 따로 확인할 네 겹</text>
<text x="56.0" y="114.0" font-size="19" font-weight="600" fill="#5f6b78" text-anchor="start">품목 판정만 보고 끝내면 나머지 세 겹이 비어 있게 됩니다</text>
<rect x="56.0" y="150.0" width="1560.0" height="150.0" fill="#e8f1fc" stroke="#1f6fd1" stroke-width="2" rx="14"/>
<circle cx="100.0" cy="225.0" r="26" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1"/>
<text x="100.0" y="233.6" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="146.0" y="216.0" font-size="26" font-weight="800" fill="#1f6fd1" text-anchor="start">물품</text>
<rect x="146.0" y="236.0" width="86.7" height="30.0" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1.5" rx="15.0"/>
<text x="189.4" y="256.6" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">수출통제</text>
<text x="470.0" y="200.0" font-size="15" font-weight="700" fill="#5f6b78" text-anchor="start">묻는 것</text>
<text x="470.0" y="232.0" font-size="21" font-weight="700" fill="#1d2a3a" text-anchor="start">이 물품을 이 나라로 보내도 되나?</text>
<text x="470.0" y="268.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">전략물자·상황허가 대상품목과 목적지</text>
<text x="1120.0" y="200.0" font-size="15" font-weight="700" fill="#5f6b78" text-anchor="start">포워더가 보는 서류</text>
<text x="1120.0" y="232.0" font-size="18" font-weight="600" fill="#1d2a3a" text-anchor="start">판정서,</text>
<text x="1120.0" y="262.0" font-size="18" font-weight="600" fill="#1d2a3a" text-anchor="start">수출허가서, 상황허가서</text>
<rect x="56.0" y="316.0" width="1560.0" height="150.0" fill="#fdecea" stroke="#d9482b" stroke-width="2" rx="14"/>
<circle cx="100.0" cy="391.0" r="26" fill="#d9482b" stroke="#d9482b" stroke-width="1"/>
<text x="100.0" y="399.6" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="146.0" y="382.0" font-size="26" font-weight="800" fill="#d9482b" text-anchor="start">사람·실소유자</text>
<rect x="146.0" y="402.0" width="55.4" height="30.0" fill="#d9482b" stroke="#d9482b" stroke-width="1.5" rx="15.0"/>
<text x="173.7" y="422.6" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">제재</text>
<text x="470.0" y="366.0" font-size="15" font-weight="700" fill="#5f6b78" text-anchor="start">묻는 것</text>
<text x="470.0" y="398.0" font-size="21" font-weight="700" fill="#1d2a3a" text-anchor="start">이 사람·회사와 거래해도 되나?</text>
<text x="470.0" y="434.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">목록에 없어도 지정된 자가 50% 이상 소유하면 대상</text>
<text x="1120.0" y="366.0" font-size="15" font-weight="700" fill="#5f6b78" text-anchor="start">포워더가 보는 서류</text>
<text x="1120.0" y="398.0" font-size="18" font-weight="600" fill="#1d2a3a" text-anchor="start">거래처 정보,</text>
<text x="1120.0" y="428.0" font-size="18" font-weight="600" fill="#1d2a3a" text-anchor="start">지분 구조, 목록 조회 기록</text>
<rect x="56.0" y="482.0" width="1560.0" height="150.0" fill="#fdeee8" stroke="#e4572e" stroke-width="2" rx="14"/>
<circle cx="100.0" cy="557.0" r="26" fill="#e4572e" stroke="#e4572e" stroke-width="1"/>
<text x="100.0" y="565.6" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="146.0" y="548.0" font-size="26" font-weight="800" fill="#e4572e" text-anchor="start">운송 수단</text>
<rect x="146.0" y="568.0" width="55.4" height="30.0" fill="#e4572e" stroke="#e4572e" stroke-width="1.5" rx="15.0"/>
<text x="173.7" y="588.6" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">제재</text>
<text x="470.0" y="532.0" font-size="15" font-weight="700" fill="#5f6b78" text-anchor="start">묻는 것</text>
<text x="470.0" y="564.0" font-size="21" font-weight="700" fill="#1d2a3a" text-anchor="start">이 배·비행기를 써도 되나?</text>
<text x="470.0" y="600.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">선박은 IMO 번호, 항공기는 등록부호와 제조 일련번호</text>
<text x="1120.0" y="532.0" font-size="15" font-weight="700" fill="#5f6b78" text-anchor="start">포워더가 보는 서류</text>
<text x="1120.0" y="564.0" font-size="18" font-weight="600" fill="#1d2a3a" text-anchor="start">선명·IMO·기국·선주·운항사,</text>
<text x="1120.0" y="594.0" font-size="18" font-weight="600" fill="#1d2a3a" text-anchor="start">항공기 MSN</text>
<rect x="56.0" y="648.0" width="1560.0" height="150.0" fill="#f0ecfa" stroke="#6b4fbb" stroke-width="2" rx="14"/>
<circle cx="100.0" cy="723.0" r="26" fill="#6b4fbb" stroke="#6b4fbb" stroke-width="1"/>
<text x="100.0" y="731.6" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="146.0" y="714.0" font-size="26" font-weight="800" fill="#6b4fbb" text-anchor="start">경로와 돈</text>
<rect x="146.0" y="734.0" width="91.8" height="30.0" fill="#6b4fbb" stroke="#6b4fbb" stroke-width="1.5" rx="15.0"/>
<text x="191.9" y="754.6" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">우회 수출</text>
<text x="470.0" y="698.0" font-size="15" font-weight="700" fill="#5f6b78" text-anchor="start">묻는 것</text>
<text x="470.0" y="730.0" font-size="21" font-weight="700" fill="#1d2a3a" text-anchor="start">서류상 목적지와 실제 목적지가 같은가?</text>
<text x="470.0" y="766.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">수하인·경유지·결제 국가가 서로 맞는지</text>
<text x="1120.0" y="698.0" font-size="15" font-weight="700" fill="#5f6b78" text-anchor="start">포워더가 보는 서류</text>
<text x="1120.0" y="730.0" font-size="18" font-weight="600" fill="#1d2a3a" text-anchor="start">최종사용자 확인서,</text>
<text x="1120.0" y="760.0" font-size="18" font-weight="600" fill="#1d2a3a" text-anchor="start">수하인·통지처, 결제 정보</text>
<text x="60.0" y="838.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">예: 멕시코→아르헨티나 자동차 부품은 합법이었지만, 전세 낸 항공기가 제재 기체여서 포워더가 1,610,775달러에 합의했습니다(Fracht FWO, 2025).</text>
<text x="60.0" y="868.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">제재 목록은 매일 바뀔 수 있으므로 거래할 때마다 현재 목록으로 조회합니다.</text>
</svg>
