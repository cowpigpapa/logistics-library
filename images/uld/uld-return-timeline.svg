<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9aa5b1"/></marker><marker id="a-sub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5f6b78"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30" y="30" width="1612" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="54" y="72" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">BUP용으로 빌린 ULD의 반납 기한: 한 화물항공사 조건의 예</text>
<text x="56" y="104" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">2022년 9월 개정 조건. 무료 기간·지체료·분실 판정 기간·배상 기준은 항공사마다 다릅니다</text>
<rect x="220" y="190" width="450" height="40" fill="#e2f3ea" rx="8"/>
<text x="445.0" y="216" font-size="18" font-weight="800" fill="#1f8a5b" text-anchor="middle">반납 기간(고객 비용)</text>
<rect x="720" y="190" width="180" height="40" fill="#fdebe4" rx="8"/>
<rect x="930" y="190" width="550" height="40" fill="#fdebe4" rx="8"/>
<text x="1140.0" y="216" font-size="18" font-weight="800" fill="#e4572e" text-anchor="middle">지체료: 주말·공휴일 포함 하루 단위</text>
<line x1="100" y1="230" x2="900" y2="230" stroke="#1d2a3a" stroke-width="3"/>
<line x1="930" y1="230" x2="1560" y2="230" stroke="#1d2a3a" stroke-width="3"/>
<line x1="894" y1="242" x2="906" y2="218" stroke="#1d2a3a" stroke-width="3"/>
<line x1="924" y1="242" x2="936" y2="218" stroke="#1d2a3a" stroke-width="3"/>
<line x1="120" y1="224" x2="120" y2="244" stroke="#1d2a3a" stroke-width="3"/>
<text x="120" y="274" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="middle">내준 날</text>
<line x1="220" y1="224" x2="220" y2="244" stroke="#1d2a3a" stroke-width="3"/>
<text x="220" y="274" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="middle">다음 날</text>
<line x1="620" y1="224" x2="620" y2="244" stroke="#1d2a3a" stroke-width="3"/>
<text x="620" y="274" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="middle">5일째까지</text>
<line x1="720" y1="224" x2="720" y2="244" stroke="#1d2a3a" stroke-width="3"/>
<text x="720" y="274" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="middle">6일째</text>
<line x1="1480" y1="224" x2="1480" y2="244" stroke="#1d2a3a" stroke-width="3"/>
<text x="1480" y="274" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="middle">180일</text>
<circle cx="1480" cy="230" r="14" fill="#d9482b"/>
<rect x="1220" y="320" width="400" height="200" fill="#fff7f5" stroke="#d9482b" stroke-width="2.5" rx="12"/>
<text x="1236" y="358" font-size="24" font-weight="800" fill="#d9482b" text-anchor="start">분실 처리</text>
<text x="1236" y="393" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">180일 안에 돌아오지 않거나</text>
<text x="1236" y="421" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">압류·경제적 수리 한도 초과 손상</text>
<text x="1236" y="449" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">→ 형식별 교체 비용 청구</text>
<rect x="120" y="320" width="520" height="200" fill="#ffffff" stroke="#1d2a3a" stroke-width="2.5" rx="12"/>
<text x="136" y="358" font-size="24" font-weight="800" fill="#1d2a3a" text-anchor="start">범위</text>
<text x="136" y="393" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">함께 내준 네트는 ULD의 일부</text>
<text x="136" y="421" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">스트랩 등은 별도 부속 장비</text>
<text x="136" y="449" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">가장 가까운 항공사 거점으로 반납</text>
<rect x="670" y="320" width="520" height="200" fill="#fff8f4" stroke="#e4572e" stroke-width="2.5" rx="12"/>
<text x="686" y="358" font-size="24" font-weight="800" fill="#e4572e" text-anchor="start">손상</text>
<text x="686" y="393" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">사용·점유 중 생긴 손상은 고객이 배상</text>
<text x="686" y="421" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">더러우면 청소 비용 청구 가능</text>
<rect x="120" y="560" width="1500" height="310" fill="#f5f9fe" stroke="#1f6fd1" stroke-width="2.5" rx="14"/>
<text x="148" y="610" font-size="23" font-weight="800" fill="#1f6fd1" text-anchor="start">받을 때 상태를 기록해야 하는 이유</text>
<text x="148" y="662" font-size="22" font-weight="500" fill="#1d2a3a" text-anchor="start">받을 때 이미 있던 손상을 기록하지 않으면 반납 때 포워더 책임으로 돌아올 수 있음</text>
<text x="148" y="710" font-size="22" font-weight="500" fill="#1d2a3a" text-anchor="start">ULD 번호·상태(팔레트 레일·바닥판, 컨테이너 문·패널, 네트 줄·피팅)를 확인하고 사진으로 남김</text>
<text x="148" y="758" font-size="22" font-weight="500" fill="#1d2a3a" text-anchor="start">업계 표준 서식: IATA ULD 인수증(UCR, 권고관행 RP 1654)</text>
<text x="148" y="806" font-size="22" font-weight="500" fill="#1d2a3a" text-anchor="start">손상이 있으면 그 자리에서 항공사·조업사에 알리고 다른 ULD로 바꿔 받음</text>
</svg>
