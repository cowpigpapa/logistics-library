"start">② 더 단단히: 왼쪽</text><text x="56" y="740" font-size="20" font-weight="700" fill="#e4572e" text-anchor="start">문 안쪽 잠금 막대</text><text x="56" y="800" font-size="19" font-weight="600" fill="#5f6b78" text-anchor="start">걸기 전: CTU 번호·봉인 번호·건 위치 기록</text><text x="56" y="830" font-size="19" font-weight="600" fill="#5f6b78" text-anchor="start">건 뒤: 아래를 세게 당기고 비틀어 잠김 확인</text><rect x="600" y="30" width="1042" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/><text x="626" y="76" font-size="25" font-weight="800" fill="#1d2a3a" text-anchor="start">인계 때마다 하는 확인 (§2)</text><rect x="626" y="110" width="146" height="96" fill="#ffffff" stroke="#e4572e" stroke-width="3" rx="12"/><text x="699" y="150" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle">송하인</text><text x="699" y="182" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">적입 후 봉인</text><line x1="774" y1="158" x2="793" y2="158" stroke="#1f6fd1" stroke-width="3" marker-end="url(#a-blue)"/><rect x="795" y="110" width="146" height="96" fill="#ffffff" stroke="#1f6fd1" stroke-width="3" rx="12"/><text x="868" y="150" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle">도로</text><text x="868" y="182" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">운송업자</text><line x1="943" y1="158" x2="962" y2="158" stroke="#1f6fd1" stroke-width="3" marker-end="url(#a-blue)"/><circle cx="868" cy="230" r="13" fill="#1f8a5b"/><text x="868" y="237" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">✓</text><rect x="964" y="110" width="146" height="96" fill="#ffffff" stroke="#1f6fd1" stroke-width="3" rx="12"/><text x="1037" y="150" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle">중간</text><text x="1037" y="182" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">터미널</text><line x1="1112" y1="158" x2="1131" y2="158" stroke="#1f6fd1" stroke-width="3" marker-end="url(#a-blue)"/><circle cx="1037" cy="230" r="13" fill="#1f8a5b"/><text x="1037" y="237" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">✓</text><rect x="1133" y="110" width="146" height="96" fill="#ffffff" stroke="#1f6fd1" stroke-width="3" rx="12"/><text x="1206" y="150" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle">선적항</text><text x="1206" y="182" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">터미널(운송인)</text><line x1="1281" y1="158" x2="1300" y2="158" stroke="#1f6fd1" stroke-width="3" marker-end="url(#a-blue)"/><circle cx="1206" cy="230" r="13" fill="#1f8a5b"/><text x="1206" y="237" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">✓</text><rect x="1302" y="110" width="146" height="96" fill="#ffffff" stroke="#1f6fd1" stroke-width="3" rx="12"/><text x="1375" y="150" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle">환적</text><text x="1375" y="182" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">터미널</text><line x1="1450" y1="158" x2="1469" y2="158" stroke="#1f6fd1" stroke-width="3" marker-end="url(#a-blue)"/><circle cx="1375" cy="230" r="13" fill="#1f8a5b"/><text x="1375" y="237" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">✓</text><rect x="1471" y="110" width="146" height="96" fill="#ffffff" stroke="#1f6fd1" stroke-width="3" rx="12"/><text x="1544" y="150" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle">수하인</text><circle cx="1544" cy="230" r="13" fill="#1f8a5b"/><text x="1544" y="237" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">✓</text><text x="1612" y="268" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="end">ISPS 보안계획을 갖춘 환적 터미널은 생략 가능(§2.5)</text><rect x="626" y="296" width="310" height="150" fill="#eef7f2" stroke="#1f8a5b" stroke-width="2" rx="14"/><circle cx="662" cy="336" r="20" fill="#1f8a5b"/><text x="662" y="344" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="696" y="345" font-size="25" font-weight="800" fill="#1f8a5b" text-anchor="start">보기</text><text x="650" y="390" font-size="20" font-weight="600" fill="#1d2a3a" text-anchor="start">봉인에 훼손 흔적이</text><text x="650" y="420" font-size="20" font-weight="600" fill="#1d2a3a" text-anchor="start">없는지 눈으로 확인</text><rect x="960" y="296" width="310" height="150" fill="#eef7f2" stroke="#1f8a5b" stroke-width="2" rx="14"/><circle cx="996" cy="336" r="20" fill="#1f8a5b"/><text x="996" y="344" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="1030" y="345" font-size="25" font-weight="800" fill="#1f8a5b" text-anchor="start">대조</text><text x="984" y="390" font-size="20" font-weight="600" fill="#1d2a3a" text-anchor="start">봉인 번호를</text><text x="984" y="420" font-size="20" font-weight="600" fill="#1d2a3a" text-anchor="start">서류와 대조</text><rect x="1294" y="296" width="310" height="150" fill="#eef7f2" stroke="#1f8a5b" stroke-width="2" rx="14"/><circle cx="1330" cy="336" r="20" fill="#1f8a5b"/><text x="1330" y="344" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="1364" y="345" font-size="25" font-weight="800" fill="#1f8a5b" text-anchor="start">기록</text><text x="1318" y="390" font-size="20" font-weight="600" fill="#1d2a3a" text-anchor="start">확인 결과를</text><text x="1318" y="420" font-size="20" font-weight="600" fill="#1d2a3a" text-anchor="start">서류에 적기</text><rect x="626" y="476" width="990" height="210" fill="#fdf1ee" stroke="#d9482b" stroke-width="2" rx="14"/><text x="650" y="516" font-size="22" font-weight="800" fill="#d9482b" text-anchor="start">봉인이 없거나, 훼손 흔적이 있거나, 번호가 다르면 (§2.1.4.1)</text><text x="650" y="556" font-size="20" font-weight="600" fill="#1d2a3a" text-anchor="start">• 수하인은 운송인과 송하인에게 알리고 서류에 적습니다</text><text x="650" y="594" font-size="20" font-weight="600" fill="#1d2a3a" text-anchor="start">• 국내 법령에 따라 세관이나 수사기관에 통보합니다</text><text x="650" y="632" font-size="20" font-weight="600" fill="#1d2a3a" text-anchor="start">• 통보 의무가 없으면 해결될 때까지 인수를 거부합니다</text><rect x="626" y="712" width="990" height="170" fill="#f3f6fa" stroke="#c9d2dc" stroke-width="2" rx="14"/><text x="650" y="752" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="start">정당한 이유로 뗀 경우 (§2.1.4.2~§2.1.4.3)</text><text x="650" y="792" font-size="20" font-weight="600" fill="#1d2a3a" text-anchor="start">세관 검사나 운송인의 고정 상태 점검처럼 정당한 이유로 봉인을 뗐다면,</text><text x="650" y="826" font-size="20" font-weight="600" fill="#1d2a3a" text-anchor="start">뗀 사람이 같거나 더 높은 등급의 봉인을 다시 걸고 새 번호를 서류에 적습니다.</text></svg>
