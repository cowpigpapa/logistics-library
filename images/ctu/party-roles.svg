<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker><marker id="a-sub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5f6b78"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="40" y="120" width="380" height="140" fill="#fbfcfd" stroke="#1f6fd1" stroke-width="3" rx="16"/><text x="64" y="164" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">출하자</text><text x="400" y="164" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="end">consignor</text><text x="64" y="202" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">운송할 화물을 준비</text><rect x="40" y="320" width="380" height="140" fill="#fbfcfd" stroke="#1f6fd1" stroke-width="3" rx="16"/><text x="64" y="364" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">CTU 운영자</text><text x="400" y="364" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="end">CTU operator</text><text x="64" y="402" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">CTU를 소유·운영하며</text><text x="64" y="432" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">빈 CTU를 내줌</text><rect x="500" y="200" width="360" height="180" fill="#fbfcfd" stroke="#1f6fd1" stroke-width="3" rx="16"/><text x="524" y="244" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">적입자</text><text x="840" y="244" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="end">packer</text><text x="524" y="282" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">CTU 안이나 위에</text><text x="524" y="312" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">화물을 싣는 당사자</text><rect x="940" y="200" width="380" height="180" fill="#fbfcfd" stroke="#1f6fd1" stroke-width="3" rx="16"/><text x="964" y="244" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">운송인</text><text x="1300" y="244" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="end">carrier</text><text x="964" y="282" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">도로·철도·해상·내륙수로</text><text x="964" y="312" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">운송을 수행(도로 운송업자,</text><text x="964" y="342" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">철도 운영자, 선사)</text><rect x="940" y="24" width="380" height="136" fill="#fbfcfd" stroke="#5f6b78" stroke-width="3" rx="16"/><text x="964" y="68" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">복합운송 운영자</text><text x="1300" y="68" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="end">intermodal</text><text x="964" y="106" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">환적·적재: 해상·철도 터미널,</text><text x="964" y="136" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">내륙수로 항만</text><rect x="1400" y="200" width="232" height="180" fill="#fbfcfd" stroke="#1f6fd1" stroke-width="3" rx="16"/><text x="1424" y="244" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">수하인</text><text x="1612" y="244" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="end">consignee</text><text x="1424" y="282" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">화물을 받도록</text><text x="1424" y="312" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">지정된 당사자</text><line x1="420" y1="190" x2="494" y2="250" stroke="#1f6fd1" stroke-width="5" marker-end="url(#a-blue)"/><text x="430" y="168" font-size="18" font-weight="700" fill="#1f6fd1" text-anchor="start">화물</text><line x1="420" y1="390" x2="494" y2="330" stroke="#1f6fd1" stroke-width="5" marker-end="url(#a-blue)"/><text x="426" y="428" font-size="18" font-weight="700" fill="#1f6fd1" text-anchor="start">빈 CTU</text><line x1="860" y1="290" x2="934" y2="290" stroke="#1f6fd1" stroke-width="5" marker-end="url(#a-blue)"/><line x1="1320" y1="290" x2="1394" y2="290" stroke="#1f6fd1" stroke-width="5" marker-end="url(#a-blue)"/><line x1="1130" y1="160" x2="1130" y2="200" stroke="#5f6b78" stroke-width="6" /><text x="1144" y="187" font-size="18" font-weight="700" fill="#5f6b78" text-anchor="start">환적·적재</text><rect x="40" y="560" width="1592" height="350" fill="#f3f6fa" stroke="#c9d2dc" stroke-width="2" rx="16"/><text x="64" y="602" font-size="24" font-weight="800" fill="#1d2a3a" text-anchor="start">계약·서류</text><rect x="900" y="620" width="460" height="170" fill="#fbfcfd" stroke="#e4572e" stroke-width="3" rx="16"/><text x="924" y="664" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">송하인</text><text x="1340" y="664" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="end">shipper</text><text x="924" y="702" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">운송인과 운송계약을 맺는(맺게 하는)</text><text x="924" y="732" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">당사자. B/L·운송장에 송하인으로</text><text x="924" y="762" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">적힌 당사자</text><path d="M 1130 620 L 1130 386" fill="none" stroke="#e4572e" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#a-orange)"/><text x="1144" y="470" font-size="22" font-weight="800" fill="#e4572e" text-anchor="start">운송계약</text><rect x="360" y="620" width="460" height="170" fill="#fbfcfd" stroke="#1f8a5b" stroke-width="3" rx="16"/><text x="384" y="664" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">운송주선인(포워더)</text><text x="800" y="664" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="end">forwarder</text><text x="384" y="702" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">남을 위해 운송을 조직. 운송인으로</text><text x="384" y="732" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">나서지 않으면 선복을 잡아 주는</text><text x="384" y="762" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">대리인</text><path d="M 590 620 L 590 520 L 1118 520" fill="none" stroke="#1f8a5b" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#a-green)"/><text x="606" y="508" font-size="20" font-weight="700" fill="#1f8a5b" text-anchor="start">남을 위해 운송 조직</text><text x="64" y="650" font-size="20" font-weight="700" fill="#5f6b78" text-anchor="start">한 회사가</text><text x="64" y="680" font-size="20" font-weight="700" fill="#5f6b78" text-anchor="start">여러 기능을</text><text x="64" y="710" font-size="20" font-weight="700" fill="#5f6b78" text-anchor="start">겸할 수 있습니다</text><text x="64" y="740" font-size="20" font-weight="700" fill="#5f6b78" text-anchor="start">(§4.1.6)</text><text x="64" y="860" font-size="20" font-weight="600" fill="#1d2a3a" text-anchor="start">송하인·출하자가 자기 사업장에서 직접 실으면 그들이 곧 적입자입니다. 출하자가 운송인과 직접 계약하면 송하인 역할도 맡습니다.</text><line x1="1400" y1="470" x2="1450" y2="470" stroke="#1f6fd1" stroke-width="5" marker-end="url(#a-blue)"/><text x="1462" y="477" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">화물·CTU 흐름</text><line x1="1400" y1="508" x2="1450" y2="508" stroke="#e4572e" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#a-orange)"/><text x="1462" y="515" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">계약</text></svg>
