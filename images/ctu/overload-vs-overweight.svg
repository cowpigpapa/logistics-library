<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker><marker id="a-sub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5f6b78"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30" y="30" width="516" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/><text x="56" y="76" font-size="28" font-weight="800" fill="#1d2a3a" text-anchor="start">과적</text><text x="126" y="76" font-size="20" font-weight="600" fill="#5f6b78" text-anchor="start">overloaded</text><text x="56" y="120" font-size="21" font-weight="600" fill="#1d2a3a" text-anchor="start">화물과 CTU를 합한 질량이</text><text x="56" y="150" font-size="21" font-weight="600" fill="#1d2a3a" text-anchor="start">허용 최대 총중량을 넘은 상태</text><line x1="70" y1="790" x2="506" y2="790" stroke="#1d2a3a" stroke-width="3" /><rect x="228" y="730" width="140" height="60" fill="#9aa7b5" stroke="none" stroke-width="2"/><text x="298" y="767" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="middle">CTU 자중</text><rect x="228" y="320" width="140" height="410" fill="#d9a066" stroke="#a8743a" stroke-width="2"/><text x="298" y="532" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="middle">화물</text><line x1="70" y1="380" x2="506" y2="380" stroke="#d9482b" stroke-width="4" /><text x="76" y="410" font-size="19" font-weight="700" fill="#d9482b" text-anchor="start">CTU 허용</text><text x="76" y="436" font-size="19" font-weight="700" fill="#d9482b" text-anchor="start">최대 총중량</text><line x1="400" y1="380" x2="400" y2="326" stroke="#d9482b" stroke-width="4" marker-end="url(#a-red)"/><text x="414" y="350" font-size="20" font-weight="800" fill="#d9482b" text-anchor="start">초과</text><text x="56" y="850" font-size="21" font-weight="800" fill="#d9482b" text-anchor="start">화물 + CTU &gt; 허용 최대 총중량</text><rect x="578" y="30" width="516" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/><text x="604" y="76" font-size="28" font-weight="800" fill="#1d2a3a" text-anchor="start">신고 초과</text><text x="728" y="76" font-size="20" font-weight="600" fill="#5f6b78" text-anchor="start">overweight</text><text x="604" y="120" font-size="21" font-weight="600" fill="#1d2a3a" text-anchor="start">최대 총중량 안이지만</text><text x="604" y="150" font-size="21" font-weight="600" fill="#1d2a3a" text-anchor="start">① 서류에 적은 최대 총중량, 또는</text><text x="604" y="180" font-size="21" font-weight="600" fill="#1d2a3a" text-anchor="start">② 차량 자중을 더한 도로·철도</text><text x="604" y="210" font-size="21" font-weight="600" fill="#1d2a3a" text-anchor="start">   최대 질량을 넘은 상태</text><line x1="610" y1="790" x2="1062" y2="790" stroke="#1d2a3a" stroke-width="3" /><rect x="620" y="730" width="90" height="60" fill="#9aa7b5" stroke="none" stroke-width="2"/><text x="665" y="767" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="middle">CTU</text><rect x="620" y="430" width="90" height="300" fill="#d9a066" stroke="#a8743a" stroke-width="2"/><text x="665" y="587" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="middle">화물</text><line x1="600" y1="470" x2="806" y2="470" stroke="#e4572e" stroke-width="4" stroke-dasharray="12 8"/><text x="718" y="500" font-size="19" font-weight="700" fill="#e4572e" text-anchor="start">① 서류 값</text><rect x="840" y="680" width="90" height="110" fill="#5f6b78" stroke="none" stroke-width="2"/><text x="885" y="742" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">차량</text><rect x="840" y="630" width="90" height="50" fill="#9aa7b5" stroke="none" stroke-width="2"/><text x="885" y="662" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="middle">CTU</text><rect x="840" y="330" width="90" height="300" fill="#d9a066" stroke="#a8743a" stroke-width="2"/><text x="885" y="487" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="middle">화물</text><line x1="822" y1="360" x2="1074" y2="360" stroke="#e4572e" stroke-width="4" stroke-dasharray="12 8"/><text x="940" y="390" font-size="19" font-weight="700" fill="#e4572e" text-anchor="start">② 도로·철도</text><text x="940" y="416" font-size="19" font-weight="700" fill="#e4572e" text-anchor="start">최대 질량</text><text x="604" y="850" font-size="21" font-weight="800" fill="#e4572e" text-anchor="start">컨테이너 한도 안이어도 문제가 됩니다</text><rect x="1126" y="30" width="516" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/><text x="1152" y="76" font-size="28" font-weight="800" fill="#1d2a3a" text-anchor="start">오신고</text><text x="1250" y="76" font-size="20" font-weight="600" fill="#5f6b78" text-anchor="start">misdeclared</text><text x="1152" y="120" font-size="21" font-weight="600" fill="#1d2a3a" text-anchor="start">실제 화물이나 총중량이</text><text x="1152" y="150" font-size="21" font-weight="600" fill="#1d2a3a" text-anchor="start">서류의 신고와 다른 경우</text><line x1="1166" y1="790" x2="1602" y2="790" stroke="#1d2a3a" stroke-width="3" /><rect x="1220" y="730" width="140" height="60" fill="#9aa7b5" stroke="none" stroke-width="2"/><text x="1290" y="767" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="middle">CTU 자중</text><rect x="1220" y="380" width="140" height="350" fill="#d9a066" stroke="#a8743a" stroke-width="2"/><text x="1290" y="562" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="middle">화물</text><text x="1290" y="360" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle">실제</text><rect x="1420" y="520" width="140" height="270" fill="none" stroke="#1f6fd1" stroke-width="3" stroke-dasharray="10 7"/><text x="1490" y="500" font-size="21" font-weight="800" fill="#1f6fd1" text-anchor="middle">서류의 신고</text><line x1="1380" y1="380" x2="1600" y2="380" stroke="#5f6b78" stroke-width="2" stroke-dasharray="4 6"/><line x1="1380" y1="520" x2="1600" y2="520" stroke="#5f6b78" stroke-width="2" stroke-dasharray="4 6"/><line x1="1590" y1="386" x2="1590" y2="514" stroke="#d9482b" stroke-width="4" marker-end="url(#a-red)" marker-start="url(#a-red)"/><text x="1572" y="458" font-size="20" font-weight="800" fill="#d9482b" text-anchor="end">차이</text><text x="1152" y="850" font-size="21" font-weight="800" fill="#1f6fd1" text-anchor="start">실제 ≠ 신고</text></svg>
