<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker><marker id="a-sub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5f6b78"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30" y="30" width="540" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/><text x="56" y="76" font-size="25" font-weight="800" fill="#1d2a3a" text-anchor="start">공기가 품을 수 있는 수증기 (§2)</text><text x="56" y="116" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">같은 공기라도 식으면 상대습도가</text><text x="56" y="146" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">올라가 이슬점(100%)에 닿습니다.</text><line x1="80" y1="780" x2="540" y2="780" stroke="#1d2a3a" stroke-width="3" /><rect x="110" y="703.968" width="100" height="76.032" fill="#dce8f7" stroke="#1f6fd1" stroke-width="2"/><text x="160" y="691.968" font-size="20" font-weight="700" fill="#1f6fd1" text-anchor="middle">4.8g/m³</text><text x="160" y="812" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="middle">0℃</text><rect x="260" y="505.968" width="100" height="274.032" fill="#dce8f7" stroke="#1f6fd1" stroke-width="2"/><text x="310" y="493.968" font-size="20" font-weight="700" fill="#1f6fd1" text-anchor="middle">17.3g/m³</text><text x="310" y="812" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="middle">20℃</text><rect x="410" y="300.048" width="100" height="479.952" fill="#dce8f7" stroke="#1f6fd1" stroke-width="2"/><text x="460" y="288.048" font-size="20" font-weight="700" fill="#1f6fd1" text-anchor="middle">30.3g/m³</text><text x="460" y="812" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="middle">30℃</text><rect x="410" y="505.968" width="100" height="274.032" fill="#8db6ea" stroke="#1f6fd1" stroke-width="2"/><text x="460" y="539.9680000000001" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">57%</text><line x1="212" y1="505.968" x2="408" y2="505.968" stroke="#d9482b" stroke-width="3" stroke-dasharray="10 7"/><line x1="400" y1="439.968" x2="222" y2="439.968" stroke="#d9482b" stroke-width="3" marker-end="url(#a-red)"/><text x="310" y="425.968" font-size="19" font-weight="700" fill="#d9482b" text-anchor="middle">식으면</text><text x="56" y="856" font-size="20" font-weight="700" fill="#d9482b" text-anchor="start">30℃·상대습도 57%인 공기는 20℃까지 식으면</text><text x="56" y="886" font-size="20" font-weight="700" fill="#d9482b" text-anchor="start">포화되어 물이 맺힙니다.</text><rect x="600" y="30" width="1042" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/><text x="626" y="76" font-size="25" font-weight="800" fill="#1d2a3a" text-anchor="start">컨테이너 결로의 하루 (§3.2~§3.5)</text><line x1="680" y1="330" x2="1600" y2="330" stroke="#5f6b78" stroke-width="2" /><line x1="680" y1="330" x2="680" y2="120" stroke="#5f6b78" stroke-width="2" marker-end="url(#a-sub)"/><text x="692" y="128" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">CTU 안 온도</text><path d="M 690 300 C 820 300, 880 150, 1000 150 C 1110 150, 1160 230, 1300 265 C 1420 295, 1500 305, 1600 305" fill="none" stroke="#e4572e" stroke-width="5"/><text x="760" y="360" font-size="20" font-weight="700" fill="#1d2a3a" text-anchor="middle">아침</text><line x1="760" y1="325" x2="760" y2="335" stroke="#5f6b78" stroke-width="2" /><text x="1000" y="360" font-size="20" font-weight="700" fill="#1d2a3a" text-anchor="middle">낮</text><line x1="1000" y1="325" x2="1000" y2="335" stroke="#5f6b78" stroke-width="2" /><text x="1300" y="360" font-size="20" font-weight="700" fill="#1d2a3a" text-anchor="middle">늦은 오후</text><line x1="1300" y1="325" x2="1300" y2="335" stroke="#5f6b78" stroke-width="2" /><text x="1560" y="360" font-size="20" font-weight="700" fill="#1d2a3a" text-anchor="middle">밤</text><line x1="1560" y1="325" x2="1560" y2="335" stroke="#5f6b78" stroke-width="2" /><text x="1190" y="140" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">갑판 맨 위 컨테이너는 하루 25℃ 넘게</text><text x="1190" y="166" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">오르내릴 수 있고, 선창 안은 변화가 작습니다</text><circle cx="840" cy="248" r="17" fill="#fff" stroke="#1d2a3a" stroke-width="3"/><text x="840" y="255" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="middle">①</text><circle cx="1300" cy="265" r="17" fill="#fff" stroke="#1d2a3a" stroke-width="3"/><text x="1300" y="272" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="middle">②</text><rect x="690" y="420" width="320" height="250" fill="#ffffff" stroke="#2f5aa8" stroke-width="6"/><rect x="710" y="586" width="90" height="66" fill="#d9a066" stroke="#a8743a" stroke-width="2"/><rect x="710" y="516" width="90" height="66" fill="#d9a066" stroke="#a8743a" stroke-width="2"/><rect x="810" y="586" width="90" height="66" fill="#d9a066" stroke="#a8743a" stroke-width="2"/><rect x="810" y="516" width="90" height="66" fill="#d9a066" stroke="#a8743a" stroke-width="2"/><rect x="910" y="586" width="90" height="66" fill="#d9a066" stroke="#a8743a" stroke-width="2"/><rect x="910" y="516" width="90" height="66" fill="#d9a066" stroke="#a8743a" stroke-width="2"/><rect x="702" y="656" width="296" height="10" fill="#b98a55"/><path d="M 760 520 q 10 -12 0 -24 q -10 -12 0 -24 q 10 -12 0 -24" fill="none" stroke="#1f6fd1" stroke-width="3" marker-end="url(#a-blue)"/><path d="M 850 520 q 10 -12 0 -24 q -10 -12 0 -24 q 10 -12 0 -24" fill="none" stroke="#1f6fd1" stroke-width="3" marker-end="url(#a-blue)"/><path d="M 940 520 q 10 -12 0 -24 q -10 -12 0 -24 q 10 -12 0 -24" fill="none" stroke="#1f6fd1" stroke-width="3" marker-end="url(#a-blue)"/><rect x="1220" y="420" width="320" height="250" fill="#ffffff" stroke="#2f5aa8" stroke-width="6"/><line x1="1220" y1="420" x2="1540" y2="420" stroke="#1f6fd1" stroke-width="10" /><rect x="1240" y="586" width="90" height="66" fill="#d9a066" stroke="#a8743a" stroke-width="2"/><rect x="1240" y="516" width="90" height="66" fill="#d9a066" stroke="#a8743a" stroke-width="2"/><rect x="1340" y="586" width="90" height="66" fill="#d9a066" stroke="#a8743a" stroke-width="2"/><rect x="1340" y="516" width="90" height="66" fill="#d9a066" stroke="#a8743a" stroke-width="2"/><rect x="1440" y="586" width="90" height="66" fill="#d9a066" stroke="#a8743a" stroke-width="2"/><rect x="1440" y="516" width="90" height="66" fill="#d9a066" stroke="#a8743a" stroke-width="2"/><rect x="1232" y="656" width="296" height="10" fill="#b98a55"/><path d="M 1250 426 q 6 10 0 14 q -6 -4 0 -14z" fill="#1f6fd1"/><path d="M 1283 426 q 6 10 0 14 q -6 -4 0 -14z" fill="#1f6fd1"/><path d="M 1316 426 q 6 10 0 14 q -6 -4 0 -14z" fill="#1f6fd1"/><path d="M 1349 426 q 6 10 0 14 q -6 -4 0 -14z" fill="#1f6fd1"/><path d="M 1382 426 q 6 10 0 14 q -6 -4 0 -14z" fill="#1f6fd1"/><path d="M 1415 426 q 6 10 0 14 q -6 -4 0 -14z" fill="#1f6fd1"/><path d="M 1448 426 q 6 10 0 14 q -6 -4 0 -14z" fill="#1f6fd1"/><path d="M 1481 426 q 6 10 0 14 q -6 -4 0 -14z" fill="#1f6fd1"/><path d="M 1514 426 q 6 10 0 14 q -6 -4 0 -14z" fill="#1f6fd1"/><path d="M 1315 460 q 6 10 0 14 q -6 -4 0 -14z" fill="#1f6fd1"/><line x1="1315" y1="478" x2="1315" y2="512" stroke="#1f6fd1" stroke-width="2" stroke-dasharray="4 5" marker-end="url(#a-blue)"/><path d="M 1425 460 q 6 10 0 14 q -6 -4 0 -14z" fill="#1f6fd1"/><line x1="1425" y1="478" x2="1425" y2="512" stroke="#1f6fd1" stroke-width="2" stroke-dasharray="4 5" marker-end="url(#a-blue)"/><line x1="1228" y1="440" x2="1228" y2="652" stroke="#1f6fd1" stroke-width="4" stroke-dasharray="8 6"/><line x1="1532" y1="440" x2="1532" y2="652" stroke="#1f6fd1" stroke-width="4" stroke-dasharray="8 6"/><line x1="1020" y1="545" x2="1210" y2="545" stroke="#1d2a3a" stroke-width="4" marker-end="url(#a-ink)"/><text x="1115" y="530" font-size="18" font-weight="700" fill="#5f6b78" text-anchor="middle">지붕부터 식음</text><text x="690" y="712" font-size="20" font-weight="600" fill="#1d2a3a" text-anchor="start">① 아침: 기온이 오르면 화물이</text><text x="690" y="741" font-size="20" font-weight="600" fill="#1d2a3a" text-anchor="start">수증기를 내놓아 위쪽 공기의</text><text x="690" y="770" font-size="20" font-weight="600" fill="#1d2a3a" text-anchor="start">습기가 늘어납니다. 결로 없음</text><text x="1220" y="712" font-size="20" font-weight="600" fill="#1f6fd1" text-anchor="start">② 늦은 오후: 천장 쪽 공기가 이슬점에</text><text x="1220" y="741" font-size="20" font-weight="600" fill="#1f6fd1" text-anchor="start">닿아 물방울이 화물 위로 떨어지고,</text><text x="1220" y="770" font-size="20" font-weight="600" fill="#1f6fd1" text-anchor="start">벽의 물은 흘러 더니지를 적십니다</text><path d="M 1380 816 L 1380 852 L 850 852 L 850 812" fill="none" stroke="#5f6b78" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a-sub)"/><text x="1115" y="888" font-size="20" font-weight="700" fill="#5f6b78" text-anchor="middle">③ 이 순환이 여러 날 반복되면 풀려나는 물의 양이 상당해집니다</text></svg>
