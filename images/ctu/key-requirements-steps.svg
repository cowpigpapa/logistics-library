<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker><marker id="a-sub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5f6b78"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="40" y="28" width="1592" height="120" fill="#f3f6fa" stroke="#c9d2dc" stroke-width="2" rx="16"/><text x="68" y="72" font-size="24" font-weight="800" fill="#1d2a3a" text-anchor="start">일반 §3.1  모든 단계에 공통</text><text x="68" y="116" font-size="21" font-weight="600" fill="#1f8a5b" text-anchor="start">✓ 안전한 작업 환경, 취급 장비, 알맞은 개인보호구</text><text x="620" y="116" font-size="21" font-weight="600" fill="#1f8a5b" text-anchor="start">✓ CTU와 고정 장비가 양호한지 점검</text><text x="1604" y="116" font-size="21" font-weight="600" fill="#d9482b" text-anchor="end">✕ 적입·고정·적출 중 흡연, 음식물 섭취</text><rect x="40" y="182" width="504" height="352" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/><circle cx="80" cy="224" r="20" fill="#1f6fd1"/><text x="80" y="232" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="114" y="234" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">계획</text><text x="520" y="234" font-size="20" font-weight="600" fill="#5f6b78" text-anchor="end">§3.2</text><line x1="60" y1="258" x2="524" y2="258" stroke="#c9d2dc" stroke-width="2" /><text x="68" y="294" font-size="21" font-weight="600" fill="#1f8a5b" text-anchor="start">✓ 운송에 맞는 CTU 유형 선택</text><text x="68" y="328" font-size="21" font-weight="600" fill="#1f8a5b" text-anchor="start">✓ 필요하면 적입 계획 작성</text><text x="68" y="362" font-size="21" font-weight="600" fill="#1f8a5b" text-anchor="start">✓ 화물·운송 방식·CTU에 맞는</text><text x="94" y="396" font-size="21" font-weight="600" fill="#1f8a5b" text-anchor="start">고정 방법 선택</text><text x="68" y="438" font-size="21" font-weight="600" fill="#d9482b" text-anchor="start">✕ CTU 허용 적재중량, CSC와</text><text x="94" y="472" font-size="21" font-weight="600" fill="#d9482b" text-anchor="start">도로·철도 최대 총중량 초과</text><line x1="548" y1="358" x2="578" y2="358" stroke="#1f6fd1" stroke-width="5" marker-end="url(#a-blue)"/><rect x="584" y="182" width="504" height="352" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/><circle cx="624" cy="224" r="20" fill="#1f6fd1"/><text x="624" y="232" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="658" y="234" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">적입</text><text x="1064" y="234" font-size="20" font-weight="600" fill="#5f6b78" text-anchor="end">§3.3</text><line x1="604" y1="258" x2="1068" y2="258" stroke="#c9d2dc" stroke-width="2" /><text x="612" y="294" font-size="21" font-weight="600" fill="#1f8a5b" text-anchor="start">✓ 무거운 화물은 바닥 전체에 분산</text><text x="612" y="328" font-size="21" font-weight="600" fill="#1f8a5b" text-anchor="start">✓ "이 면을 위로" 같은 취급 표시 준수</text><text x="612" y="362" font-size="21" font-weight="600" fill="#1f8a5b" text-anchor="start">✓ 무게중심을 올바른 위치에</text><text x="612" y="404" font-size="21" font-weight="600" fill="#d9482b" text-anchor="start">✕ 좁은 면적 집중, 편심 적재</text><text x="612" y="438" font-size="21" font-weight="600" fill="#d9482b" text-anchor="start">✕ 가벼운 화물 위에 무거운 화물</text><text x="612" y="472" font-size="21" font-weight="600" fill="#d9482b" text-anchor="start">✕ 젖은 화물 적입</text><line x1="1092" y1="358" x2="1122" y2="358" stroke="#1f6fd1" stroke-width="5" marker-end="url(#a-blue)"/><rect x="1128" y="182" width="504" height="352" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/><circle cx="1168" cy="224" r="20" fill="#1f6fd1"/><text x="1168" y="232" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="1202" y="234" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">위험물</text><text x="1608" y="234" font-size="20" font-weight="600" fill="#5f6b78" text-anchor="end">§3.4</text><line x1="1148" y1="258" x2="1612" y2="258" stroke="#c9d2dc" stroke-width="2" /><text x="1156" y="294" font-size="21" font-weight="600" fill="#1f8a5b" text-anchor="start">✓ 포장 표시·라벨 확인</text><text x="1156" y="328" font-size="21" font-weight="600" fill="#1f8a5b" text-anchor="start">✓ 위험물 규정대로, 가능하면 문 가까이</text><text x="1156" y="362" font-size="21" font-weight="600" fill="#1f8a5b" text-anchor="start">✓ CTU 외부에 표찰·표시 부착</text><text x="1156" y="404" font-size="21" font-weight="600" fill="#d9482b" text-anchor="start">✕ 격리 대상 화물 혼적</text><text x="1156" y="438" font-size="21" font-weight="600" fill="#d9482b" text-anchor="start">✕ 손상된 포장 적입</text><rect x="40" y="564" width="504" height="352" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/><circle cx="80" cy="606" r="20" fill="#1f6fd1"/><text x="80" y="614" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="114" y="616" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">고정</text><text x="520" y="616" font-size="20" font-weight="600" fill="#5f6b78" text-anchor="end">§3.5</text><line x1="60" y1="640" x2="524" y2="640" stroke="#c9d2dc" stroke-width="2" /><text x="68" y="676" font-size="21" font-weight="600" fill="#1f8a5b" text-anchor="start">✓ 필요하면 빈 공간 채우기</text><text x="68" y="710" font-size="21" font-weight="600" fill="#1f8a5b" text-anchor="start">✓ 블로킹·래싱으로 모든 방향의</text><text x="94" y="744" font-size="21" font-weight="600" fill="#1f8a5b" text-anchor="start">미끄럼과 전도 방지</text><text x="68" y="778" font-size="21" font-weight="600" fill="#1f8a5b" text-anchor="start">✓ 힘을 넓은 면적에 분산</text><text x="68" y="820" font-size="21" font-weight="600" fill="#d9482b" text-anchor="start">✕ CTU·화물·고정 장치에 과도한 응력</text><text x="68" y="854" font-size="21" font-weight="600" fill="#d9482b" text-anchor="start">✕ 웨빙 래싱을 매듭으로 체결</text><line x1="548" y1="740" x2="578" y2="740" stroke="#1f6fd1" stroke-width="5" marker-end="url(#a-blue)"/><rect x="584" y="564" width="504" height="352" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/><circle cx="624" cy="606" r="20" fill="#1f6fd1"/><text x="624" y="614" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="658" y="616" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">완료</text><text x="1064" y="616" font-size="20" font-weight="600" fill="#5f6b78" text-anchor="end">§3.6</text><line x1="604" y1="640" x2="1068" y2="640" stroke="#c9d2dc" stroke-width="2" /><text x="612" y="676" font-size="21" font-weight="600" fill="#1f8a5b" text-anchor="start">✓ 올바른 총중량 확정</text><text x="612" y="710" font-size="21" font-weight="600" fill="#1f8a5b" text-anchor="start">✓ 필요하면 봉인</text><text x="612" y="744" font-size="21" font-weight="600" fill="#1f8a5b" text-anchor="start">✓ CTU 번호·총중량·봉인 번호를</text><text x="638" y="778" font-size="21" font-weight="600" fill="#1f8a5b" text-anchor="start">서류에 기재</text><text x="612" y="812" font-size="21" font-weight="600" fill="#1f8a5b" text-anchor="start">✓ 필요하면 적입 증명서</text><line x1="1092" y1="740" x2="1122" y2="740" stroke="#1f6fd1" stroke-width="5" marker-end="url(#a-blue)"/><rect x="1128" y="564" width="504" height="352" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/><circle cx="1168" cy="606" r="20" fill="#1f6fd1"/><text x="1168" y="614" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">6</text><text x="1202" y="616" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">적출</text><text x="1608" y="616" font-size="20" font-weight="600" fill="#5f6b78" text-anchor="end">§3.7</text><line x1="1148" y1="640" x2="1612" y2="640" stroke="#c9d2dc" stroke-width="2" /><text x="1156" y="676" font-size="21" font-weight="600" fill="#1f8a5b" text-anchor="start">✓ 번호·봉인을 서류와 대조</text><text x="1156" y="710" font-size="21" font-weight="600" fill="#1f8a5b" text-anchor="start">✓ 외부 누출·해충 확인</text><text x="1156" y="744" font-size="21" font-weight="600" fill="#1f8a5b" text-anchor="start">✓ 환기 후 쏟아짐에 대비해 개문</text><text x="1156" y="778" font-size="21" font-weight="600" fill="#1f8a5b" text-anchor="start">✓ 꺼내며 손상 기록</text><text x="1156" y="812" font-size="21" font-weight="600" fill="#1f8a5b" text-anchor="start">✓ 고정재 제거·청소·이전 표찰 제거</text><path d="M 1380 534 L 1380 549 L 292 549 L 292 562" fill="none" stroke="#1f6fd1" stroke-width="4" marker-end="url(#a-blue)"/></svg>
