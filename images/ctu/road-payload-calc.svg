<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker><marker id="a-sub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5f6b78"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30" y="30" width="1612" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/><text x="64" y="84" font-size="28" font-weight="800" fill="#1d2a3a" text-anchor="start">실을 수 있는 화물 무게 = 40톤 − (트랙터 + 샤시 + 컨테이너 자중)</text><text x="64" y="124" font-size="20" font-weight="500" fill="#5f6b78" text-anchor="start">도로법 총중량 기준 40톤은 트랙터·샤시·컨테이너·화물을 모두 합친 차량 전체에 적용됩니다. 자중은 대표값입니다.</text><text x="64" y="296" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">40ft</text><rect x="230" y="230" width="265.5" height="110" fill="#5f6b78" stroke="#ffffff" stroke-width="3"/><text x="362.75" y="216" font-size="19" font-weight="700" fill="#5f6b78" text-anchor="middle">트랙터</text><text x="362.75" y="296" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">약 9t</text><rect x="495.5" y="230" width="147.5" height="110" fill="#8a96a3" stroke="#ffffff" stroke-width="3"/><text x="569.25" y="216" font-size="19" font-weight="700" fill="#5f6b78" text-anchor="middle">샤시</text><text x="569.25" y="296" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">약 5t</text><rect x="643" y="230" width="118" height="110" fill="#2f5aa8" stroke="#ffffff" stroke-width="3"/><text x="702" y="216" font-size="19" font-weight="700" fill="#5f6b78" text-anchor="middle">40ft 컨테이너</text><text x="702" y="296" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">약 4t</text><rect x="761" y="230" width="649" height="110" fill="#d9a066" stroke="#ffffff" stroke-width="3"/><text x="1085.5" y="216" font-size="19" font-weight="700" fill="#5f6b78" text-anchor="middle">화물</text><text x="1085.5" y="296" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="middle">약 22t</text><text x="64" y="536" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">20ft</text><rect x="230" y="470" width="265.5" height="110" fill="#5f6b78" stroke="#ffffff" stroke-width="3"/><text x="362.75" y="456" font-size="19" font-weight="700" fill="#5f6b78" text-anchor="middle">트랙터</text><text x="362.75" y="536" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">약 9t</text><rect x="495.5" y="470" width="112.1" height="110" fill="#8a96a3" stroke="#ffffff" stroke-width="3"/><text x="551.55" y="456" font-size="19" font-weight="700" fill="#5f6b78" text-anchor="middle">샤시</text><text x="551.55" y="536" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">약 3.8t</text><rect x="607.6" y="470" width="67.85" height="110" fill="#2f5aa8" stroke="#ffffff" stroke-width="3"/><text x="641.525" y="456" font-size="19" font-weight="700" fill="#5f6b78" text-anchor="middle">20ft</text><text x="641.525" y="536" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2.3t</text><rect x="675.45" y="470" width="734.55" height="110" fill="#d9a066" stroke="#ffffff" stroke-width="3"/><text x="1042.725" y="456" font-size="19" font-weight="700" fill="#5f6b78" text-anchor="middle">화물</text><text x="1042.725" y="536" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="middle">약 25t</text><path d="M 230 350 L 230 360 L 761 360 L 761 350" fill="none" stroke="#5f6b78" stroke-width="2"/><text x="495.5" y="388" font-size="19" font-weight="700" fill="#5f6b78" text-anchor="middle">자중 합계 18t</text><path d="M 230 590 L 230 600 L 675.45 600 L 675.45 590" fill="none" stroke="#5f6b78" stroke-width="2"/><text x="452.725" y="628" font-size="19" font-weight="700" fill="#5f6b78" text-anchor="middle">자중 합계 15.1t</text><line x1="1410" y1="180" x2="1410" y2="640" stroke="#d9482b" stroke-width="5" /><text x="1410" y="672" font-size="22" font-weight="800" fill="#d9482b" text-anchor="middle">40t 법정 기준</text><line x1="1528" y1="180" x2="1528" y2="640" stroke="#5f6b78" stroke-width="3" stroke-dasharray="10 8"/><text x="1522" y="704" font-size="19" font-weight="700" fill="#5f6b78" text-anchor="middle">44t 단속 기준</text><text x="1522" y="730" font-size="19" font-weight="700" fill="#5f6b78" text-anchor="middle">(측정 오차 감안)</text><line x1="230" y1="650" x2="1528" y2="650" stroke="#1d2a3a" stroke-width="2" /><line x1="230" y1="645" x2="230" y2="655" stroke="#1d2a3a" stroke-width="2" /><text x="230" y="680" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">0t</text><line x1="525" y1="645" x2="525" y2="655" stroke="#1d2a3a" stroke-width="2" /><text x="525" y="680" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">10t</text><line x1="820" y1="645" x2="820" y2="655" stroke="#1d2a3a" stroke-width="2" /><text x="820" y="680" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">20t</text><line x1="1115" y1="645" x2="1115" y2="655" stroke="#1d2a3a" stroke-width="2" /><text x="1115" y="680" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">30t</text><rect x="64" y="770" width="1544" height="112" fill="#f3f6fa" stroke="#c9d2dc" stroke-width="2" rx="12"/><text x="88" y="810" font-size="20" font-weight="600" fill="#1d2a3a" text-anchor="start">• 단속 기준 44t는 더 실어도 된다는 기준이 아닙니다. 냉동 컨테이너는 자중(40ft 약 4.5~5t)이 커서 그보다 적게 싣습니다.</text><text x="88" y="848" font-size="20" font-weight="600" fill="#1d2a3a" text-anchor="start">• 총중량이 40t 안이어도 무게중심이 앞쪽에 몰리면 트랙터 뒤축이 축하중 10t을 넘을 수 있습니다.</text></svg>
