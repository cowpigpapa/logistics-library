<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9aa5b1"/></marker><marker id="a-sub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5f6b78"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30" y="30" width="1612" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="54" y="72" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">ICC (A)·(B)·(C)가 담보하는 사고의 범위</text>
<rect x="60" y="100" width="1140" height="780" fill="#f4fbf7" stroke="#1f8a5b" stroke-width="3" rx="24"/>
<text x="90" y="144" font-size="23" font-weight="800" fill="#1f8a5b" text-anchor="start">(A) 면책 조항에 걸리지 않는 모든 위험(all risks)</text>
<text x="90" y="184" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">(B)에 더해: 도난·발하·불착 · 빗물·담수 젖음 · 하역·취급 중 파손</text>
<text x="90" y="214" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">제3자의 악의적 고의 손상 · 해적</text>
<rect x="110" y="260" width="1040" height="590" fill="#f5f9fe" stroke="#1f6fd1" stroke-width="3" rx="22"/>
<text x="140" y="302" font-size="23" font-weight="800" fill="#1f6fd1" text-anchor="start">(B) 열거 위험</text>
<text x="140" y="340" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">(C)에 더해: 지진·화산 분화·낙뢰 · 갑판 유실(washing overboard)</text>
<text x="140" y="370" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">해수·호수·강물 유입 · 선적·하역 중 바다에 떨어진 포장 단위 전손</text>
<rect x="160" y="420" width="940" height="400" fill="#ffffff" stroke="#e4572e" stroke-width="3" rx="20"/>
<text x="190" y="462" font-size="23" font-weight="800" fill="#e4572e" text-anchor="start">(C) 가장 좁은 열거 위험</text>
<text x="190" y="504" font-size="20" font-weight="600" fill="#1d2a3a" text-anchor="start">화재·폭발</text>
<text x="190" y="540" font-size="20" font-weight="600" fill="#1d2a3a" text-anchor="start">본선·부선의 좌초·교사·침몰·전복</text>
<text x="190" y="576" font-size="20" font-weight="600" fill="#1d2a3a" text-anchor="start">육상 운송용구의 전복·탈선</text>
<text x="190" y="612" font-size="20" font-weight="600" fill="#1d2a3a" text-anchor="start">물 이외의 외부 물체와 충돌·접촉</text>
<text x="190" y="648" font-size="20" font-weight="600" fill="#1d2a3a" text-anchor="start">피난항에서의 화물 하역</text>
<text x="190" y="684" font-size="20" font-weight="600" fill="#1d2a3a" text-anchor="start">공동해손 희생 · 투하</text>
<rect x="640" y="500" width="420" height="150" fill="#fdf4dc" stroke="#c99a2e" stroke-width="2" rx="12"/>
<text x="660" y="540" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="start">세 약관 모두(제2·3조)</text>
<text x="660" y="570" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="start">공동해손 분담금·구조비</text>
<text x="660" y="600" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="start">쌍방과실충돌 조항의 구상 책임</text>
<rect x="1230" y="100" width="386" height="380" fill="#fff7f5" stroke="#d9482b" stroke-width="2.5" rx="18"/>
<text x="1252" y="142" font-size="21" font-weight="800" fill="#d9482b" text-anchor="start">어느 약관에서도 안 나옴</text>
<text x="1252" y="184" font-size="18" font-weight="600" fill="#1d2a3a" text-anchor="start">제4조 일반 면책</text>
<text x="1252" y="214" font-size="18" font-weight="600" fill="#1d2a3a" text-anchor="start">통상의 누손·감량·마모</text>
<text x="1252" y="244" font-size="18" font-weight="600" fill="#1d2a3a" text-anchor="start">포장·준비 불충분(조건부)</text>
<text x="1252" y="274" font-size="18" font-weight="600" fill="#1d2a3a" text-anchor="start">고유 하자·성질</text>
<text x="1252" y="304" font-size="18" font-weight="600" fill="#1d2a3a" text-anchor="start">지연</text>
<text x="1252" y="334" font-size="18" font-weight="600" fill="#1d2a3a" text-anchor="start">피보험자의 고의적 비행</text>
<text x="1252" y="364" font-size="18" font-weight="600" fill="#1d2a3a" text-anchor="start">제5조 불감항·부적합(조건부)</text>
<rect x="1230" y="500" width="386" height="380" fill="#ffffff" stroke="#1d2a3a" stroke-width="2.5" rx="18"/>
<text x="1252" y="542" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="start">따로 사야 하는 위험</text>
<text x="1252" y="584" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">전쟁(제6조)</text>
<text x="1252" y="616" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">→ 협회전쟁약관</text>
<text x="1252" y="648" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start"> </text>
<text x="1252" y="680" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">파업·폭동·테러(제7조)</text>
<text x="1252" y="712" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">→ 협회파업약관</text>
</svg>
