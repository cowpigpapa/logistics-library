<text x="487.1428571428571" y="790" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="middle">3일</text>
<line x1="576.6666666666666" y1="762" x2="576.6666666666666" y2="770" stroke="#1d2a3a" stroke-width="2"/>
<text x="576.6666666666666" y="790" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="middle">7일</text>
<line x1="733.3333333333333" y1="762" x2="733.3333333333333" y2="770" stroke="#1d2a3a" stroke-width="2"/>
<text x="733.3333333333333" y="790" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="middle">14일</text>
<line x1="890.0" y1="762" x2="890.0" y2="770" stroke="#1d2a3a" stroke-width="2"/>
<text x="890.0" y="790" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="middle">21일</text>
<line x1="1260" y1="762" x2="1600" y2="762" stroke="#1d2a3a" stroke-width="2"/>
<line x1="1260.0" y1="762" x2="1260.0" y2="770" stroke="#1d2a3a" stroke-width="2"/>
<text x="1260.0" y="790" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="middle">0개월</text>
<line x1="1373.3333333333333" y1="762" x2="1373.3333333333333" y2="770" stroke="#1d2a3a" stroke-width="2"/>
<text x="1373.3333333333333" y="790" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="middle">12개월</text>
<line x1="1486.6666666666667" y1="762" x2="1486.6666666666667" y2="770" stroke="#1d2a3a" stroke-width="2"/>
<text x="1486.6666666666667" y="790" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="middle">24개월</text>
<line x1="1600.0" y1="762" x2="1600.0" y2="770" stroke="#1d2a3a" stroke-width="2"/>
<text x="1600.0" y="790" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="middle">36개월</text>
<text x="70" y="832" font-size="17" font-weight="700" fill="#1d2a3a" text-anchor="start">외관상 보이는 손해는 인수 때(또는 지체 없이) 서면으로. 기한 계산에 다툼이 있을 수 있으면 날짜를 앞당겨 서면 처리</text>
