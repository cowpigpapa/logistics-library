<text x="420" y="622" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">연속 6일</text>
<text x="940" y="598" font-size="17" font-weight="700" fill="#1d2a3a" text-anchor="start">기재대로 인도된 것으로 추정</text>
<rect x="1260" y="568" width="85.0" height="26" fill="#e4572e" rx="5"/>
<text x="1260" y="622" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">9개월</text>
<rect x="50" y="650" width="1572" height="94" fill="#f6f8fa" rx="8"/>
<text x="70" y="702" font-size="20" font-weight="800" fill="#6b4fa0" text-anchor="start">적하보험 보험금</text>
<rect x="420" y="672" width="8" height="26" fill="#6b4fa0" rx="3"/>
<text x="420" y="726" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">사고를 안 때 지체 없이</text>
<text x="940" y="702" font-size="17" font-weight="700" fill="#1d2a3a" text-anchor="start">늘어난 손해는 보상 안 됨</text>
<rect x="1260" y="672" width="340.0" height="26" fill="#6b4fa0" rx="5"/>
<text x="1260" y="726" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">3년(상법상 소멸시효)</text>
