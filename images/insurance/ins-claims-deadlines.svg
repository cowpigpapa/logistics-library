<text x="70" y="390" font-size="20" font-weight="800" fill="#8a6d3b" text-anchor="start">도로 CMR</text>
<rect x="420" y="360" width="156.66666666666666" height="26" fill="#8a6d3b" rx="5"/>
<text x="420" y="414" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">7일(일요일·공휴일 제외)</text>
<text x="940" y="390" font-size="17" font-weight="700" fill="#1d2a3a" text-anchor="start">정상 인도로 추정</text>
<rect x="1260" y="360" width="113.33333333333334" height="26" fill="#8a6d3b" rx="5"/>
<text x="1260" y="414" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">1년(고의 등 3년)</text>
<rect x="50" y="442" width="1572" height="94" fill="#f6f8fa" rx="8"/>
<text x="70" y="494" font-size="20" font-weight="800" fill="#8a6d3b" text-anchor="start">국내 육상(상법)</text>
<rect x="420" y="464" width="313.3333333333333" height="26" fill="#8a6d3b" rx="5"/>
<text x="420" y="518" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">2주</text>
<text x="940" y="494" font-size="17" font-weight="700" fill="#d9482b" text-anchor="start">운송인 책임 소멸(악의 제외)</text>
<rect x="1260" y="464" width="113.33333333333334" height="26" fill="#8a6d3b" rx="5"/>
<text x="1260" y="518" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">1년</text>
