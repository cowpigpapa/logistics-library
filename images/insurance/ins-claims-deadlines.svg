<text x="420" y="310" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">14일(연착 21일)</text>
<text x="940" y="286" font-size="17" font-weight="700" fill="#d9482b" text-anchor="start">소송할 수 없음</text>
<rect x="1260" y="256" width="226.66666666666669" height="26" fill="#1f8a5b" rx="5"/>
<text x="1260" y="310" font-size="16" font-weight="600" fill="#1d2a3a" text-anchor="start">2년</text>
