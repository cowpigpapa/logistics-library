<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9aa5b1"/></marker><marker id="a-sub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5f6b78"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30" y="30" width="1612" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="54" y="72" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">포장 면책(제4.3조)이 걸리는 경우</text>
<rect x="486" y="96" width="700" height="130" fill="#ffffff" stroke="#1d2a3a" stroke-width="2.5" rx="12"/>
<text x="836.0" y="133" font-size="23" font-weight="800" fill="#1d2a3a" text-anchor="middle">손해가 포장·준비 불충분에서 생겼나</text>
<text x="836.0" y="166" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="middle">&quot;운송 중 통상적인 사고를 견디기에&quot; 불충분해야 함</text>
<text x="836.0" y="192" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="middle">컨테이너 적입도 &quot;포장&quot;으로 봄</text>
<line x1="836" y1="230" x2="836" y2="270" stroke="#1d2a3a" stroke-width="3" marker-end="url(#a-ink)"/>
<rect x="486" y="274" width="700" height="80" fill="#f3f6f9" stroke="#1d2a3a" stroke-width="2.5" rx="12"/>
<text x="836.0" y="312" font-size="24" font-weight="800" fill="#1d2a3a" text-anchor="middle">누가, 언제 포장·적입했나</text>
<path d="M836 354 L836 380 L290 380 L290 418" fill="none" stroke="#1d2a3a" stroke-width="3" marker-end="url(#a-ink)"/>
<path d="M836 354 L836 380 L836 380 L836 418" fill="none" stroke="#1d2a3a" stroke-width="3" marker-end="url(#a-ink)"/>
<path d="M836 354 L836 380 L1382 380 L1382 418" fill="none" stroke="#1d2a3a" stroke-width="3" marker-end="url(#a-ink)"/>
<rect x="70" y="422" width="440" height="250" fill="#fff7f5" stroke="#d9482b" stroke-width="2.5" rx="12"/>
<text x="290.0" y="459" font-size="23" font-weight="800" fill="#d9482b" text-anchor="middle">피보험자나 그 직원</text>
<text x="290.0" y="492" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="middle">화주 자신이나 직원이</text>
<text x="290.0" y="520" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="middle">포장·적입</text>
<text x="290.0" y="548" font-size="20" font-weight="500" fill="#5f6b78" text-anchor="middle">&quot;직원&quot;에 독립 계약자는</text>
<text x="290.0" y="576" font-size="20" font-weight="500" fill="#5f6b78" text-anchor="middle">포함하지 않음</text>
<rect x="616" y="422" width="440" height="250" fill="#fff7f5" stroke="#d9482b" stroke-width="2.5" rx="12"/>
<text x="836.0" y="459" font-size="23" font-weight="800" fill="#d9482b" text-anchor="middle">보험 개시 전</text>
<text x="836.0" y="492" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="middle">출고를 위해 처음 움직이기 전</text>
<text x="836.0" y="520" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="middle">공장 내 수출 포장·</text>
<text x="836.0" y="548" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="middle">화주 적입(shipper&#x27;s load)</text>
<text x="836.0" y="576" font-size="20" font-weight="500" fill="#d9482b" text-anchor="middle">누가 했든 해당될 수 있음</text>
<rect x="1162" y="422" width="440" height="250" fill="#f4fbf7" stroke="#1f8a5b" stroke-width="2.5" rx="12"/>
<text x="1382.0" y="459" font-size="23" font-weight="800" fill="#1f8a5b" text-anchor="middle">보험 개시 후 독립 계약자</text>
<text x="1382.0" y="492" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="middle">예: 출고 뒤 수출항 CFS에서</text>
<text x="1382.0" y="520" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="middle">다른 업체가 혼재 적입</text>
<text x="1382.0" y="548" font-size="20" font-weight="500" fill="#5f6b78" text-anchor="middle">실제 적용은 사실관계와</text>
<text x="1382.0" y="576" font-size="20" font-weight="500" fill="#5f6b78" text-anchor="middle">보험사 판단에 따름</text>
<rect x="197.06" y="690" width="185.88" height="36" fill="#d9482b" rx="18.0"/>
<text x="290.0" y="715.92" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">면책 요건에 해당</text>
<rect x="743.06" y="690" width="185.88" height="36" fill="#d9482b" rx="18.0"/>
<text x="836.0" y="715.92" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">면책 요건에 해당</text>
<rect x="1264.09" y="690" width="235.81999999999996" height="36" fill="#1f8a5b" rx="18.0"/>
<text x="1382.0" y="715.92" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">문언상 면책 요건 아님</text>
<rect x="70" y="760" width="1532" height="120" fill="#fdf4dc" stroke="#c99a2e" stroke-width="2" rx="12"/>
<text x="96" y="800" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">보관 중 위험까지 넓힌 확장 조항 때문에 적입 때 이미 보험이 개시됐다고 보고 포장 면책을 적용하지 않은 판결이 있음</text>
<text x="96" y="834" font-size="19" font-weight="600" fill="#5f6b78" text-anchor="start">포워더가 포장을 점검할 일은 없지만, 화주의 포장 명세·적입 사진·적입 업체 기록이 청구에서 중요함</text>
</svg>
