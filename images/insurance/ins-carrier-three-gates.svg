<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9aa5b1"/></marker><marker id="a-sub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5f6b78"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30" y="30" width="1612" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="54" y="72" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">운송인에게서 돈을 받기까지 넘어야 할 세 관문</text>
<rect x="70" y="110" width="460" height="420" fill="#ffffff" stroke="#1f6fd1" stroke-width="3" rx="16"/>
<rect x="70" y="110" width="460" height="70" fill="#1f6fd1" rx="16"/>
<rect x="70" y="160" width="460" height="20" fill="#1f6fd1" rx="0"/>
<text x="300" y="156" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">1 책임이 있는가</text>
<text x="100" y="236" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">면책 사유가 인정되면 0원</text>
<text x="100" y="276" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">해상: 항해·선박 관리 과실, 화재,</text>
<text x="100" y="316" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">해상 고유의 위험 등</text>
<text x="100" y="356" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">항공: 화물 고유의 결함,</text>
<text x="100" y="396" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">운송인 아닌 사람의 포장 불량 등</text>
<line x1="536" y1="320" x2="594" y2="320" stroke="#1d2a3a" stroke-width="4" marker-end="url(#a-ink)"/>
<rect x="600" y="110" width="460" height="420" fill="#ffffff" stroke="#e4572e" stroke-width="3" rx="16"/>
<rect x="600" y="110" width="460" height="70" fill="#e4572e" rx="16"/>
<rect x="600" y="160" width="460" height="20" fill="#e4572e" rx="0"/>
<text x="830" y="156" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">2 한도는 얼마인가</text>
<text x="630" y="236" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">책임이 있어도 한도에서 끊김</text>
<text x="630" y="276" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">해상: 포장당 666.67 SDR 또는</text>
<text x="630" y="316" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">kg당 2 SDR 중 큰 금액</text>
<text x="630" y="356" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">항공(몬트리올): kg당 26 SDR</text>
<text x="630" y="396" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">도로(CMR): kg당 8.33 SDR</text>
<line x1="1066" y1="320" x2="1124" y2="320" stroke="#1d2a3a" stroke-width="4" marker-end="url(#a-ink)"/>
<rect x="1130" y="110" width="460" height="420" fill="#ffffff" stroke="#d9482b" stroke-width="3" rx="16"/>
<rect x="1130" y="110" width="460" height="70" fill="#d9482b" rx="16"/>
<rect x="1130" y="160" width="460" height="20" fill="#d9482b" rx="0"/>
<text x="1360" y="156" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">3 기한을 지켰는가</text>
<text x="1160" y="236" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">통지와 제소를 기한 안에</text>
<text x="1160" y="276" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">해상: 3일 통지(보이지 않는 손해),</text>
<text x="1160" y="316" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">1년 안에 재판상 청구</text>
<text x="1160" y="356" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">항공: 14일 통지, 2년 안에 제소</text>
<text x="1160" y="396" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">놓치면 소송이 막히기도 함</text>
<text x="830" y="506" font-size="17" font-weight="700" fill="#5f6b78" text-anchor="middle">이 문서가 자세히 다루는 관문</text>
<rect x="70" y="570" width="1520" height="290" fill="#e2f3ea" stroke="#1f8a5b" stroke-width="2.5" rx="16"/>
<text x="100" y="622" font-size="26" font-weight="800" fill="#1f8a5b" text-anchor="start">별도의 길: 적하보험</text>
<text x="100" y="676" font-size="23" font-weight="500" fill="#1d2a3a" text-anchor="start">운송인 과실 여부와 상관없이 담보 위험이면 보험금액 범위에서 보상</text>
<text x="100" y="724" font-size="23" font-weight="500" fill="#1d2a3a" text-anchor="start">보험사는 지급액 한도에서 화주의 운송인 청구권을 넘겨받아 운송인에게 구상</text>
<text x="100" y="772" font-size="23" font-weight="500" fill="#1d2a3a" text-anchor="start">그래서 같은 사고라도 두 경로의 결과가 다를 수 있음</text>
</svg>
