<rect x="110" y="96" width="470" height="140" fill="#fff7f5" stroke="#d9482b" stroke-width="2.5" rx="12"/>
<text x="126" y="132" font-size="22" font-weight="800" fill="#d9482b" text-anchor="start">불에 직접 탄 컨테이너</text>
<text x="126" y="164" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">단독해손</text>
<text x="126" y="189" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">그 화주가 부담(보험이 있으면 보험자)</text>
<text x="126" y="214" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">다른 사람에게서 받을 수 없음</text>
<line x1="345" y1="236" x2="438" y2="282" stroke="#d9482b" stroke-width="2.5" stroke-dasharray="6 5"/>
<rect x="620" y="96" width="470" height="140" fill="#f5f9fe" stroke="#1f6fd1" stroke-width="2.5" rx="12"/>
<text x="636" y="132" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="start">소화수에 젖은 옆 컨테이너</text>
<text x="636" y="164" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">공동해손 희생</text>
<text x="636" y="189" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">살아남은 배·화물·운임이</text>
<text x="636" y="214" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">가액 비율로 나눠 냄</text>
<line x1="855" y1="236" x2="556" y2="364" stroke="#1f6fd1" stroke-width="2.5" stroke-dasharray="6 5"/>
<rect x="1130" y="96" width="470" height="140" fill="#f4fbf7" stroke="#1f8a5b" stroke-width="2.5" rx="12"/>
<text x="1146" y="132" font-size="22" font-weight="800" fill="#1f8a5b" text-anchor="start">외부 구조업체의 보수</text>
<text x="1146" y="164" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">구조료</text>
<text x="1146" y="189" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">구조된 재산 가액에 비례해 부담</text>
<text x="1146" y="214" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">공동해손 담보와 별도로 구조 담보</text>
<line x1="1365" y1="236" x2="1290" y2="456" stroke="#1f8a5b" stroke-width="2.5" stroke-dasharray="6 5"/>
<rect x="56" y="620" width="1560" height="260" fill="#ffffff" stroke="#c9d2dc" stroke-width="2" rx="14"/>
<text x="80" y="660" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="start">공동해손 분담의 원리(문서의 가상 계산)</text>
<text x="80" y="712" font-size="18" font-weight="700" fill="#5f6b78" text-anchor="start">분담 가액 합계</text>
<text x="80" y="752" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">US$ 200,000,000</text>
<text x="80" y="786" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="start">선박 + 살아남은 화물 + 운임 해당분</text>
<text x="430" y="752" font-size="26" font-weight="800" fill="#5f6b78" text-anchor="start">→</text>
<text x="465" y="712" font-size="18" font-weight="700" fill="#5f6b78" text-anchor="start">인정된 공동해손</text>
<text x="465" y="752" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">US$ 20,000,000</text>
<text x="465" y="786" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="start">손해·비용 합계</text>
<text x="815" y="752" font-size="26" font-weight="800" fill="#5f6b78" text-anchor="start">→</text>
<text x="850" y="712" font-size="18" font-weight="700" fill="#5f6b78" text-anchor="start">분담률</text>
<text x="850" y="752" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">10%</text>
<text x="850" y="786" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="start">20,000,000 ÷ 200,000,000</text>
<text x="1200" y="752" font-size="26" font-weight="800" fill="#5f6b78" text-anchor="start">→</text>
<text x="1235" y="712" font-size="18" font-weight="700" fill="#5f6b78" text-anchor="start">내 화물 분담금</text>
<text x="1235" y="752" font-size="26" font-weight="800" fill="#1f6fd1" text-anchor="start">US$ 10,000</text>
<text x="1235" y="786" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="start">내 화물 분담 가액 US$ 100,000 × 10%</text>
<text x="80" y="846" font-size="18" font-weight="700" fill="#d9482b" text-anchor="start">내 화물에 아무 손해가 없어도 담보를 내야 화물을 받을 수 있습니다. 구조료가 따로 있으면 별도</text>
</svg>
