<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9aa5b1"/></marker><marker id="a-sub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5f6b78"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30" y="30" width="1612" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="54" y="72" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">같은 유실, B/L 품명란 한 줄로 갈리는 운송인 책임 한도</text>
<text x="56" y="104" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">예시: 40ft 컨테이너 1개 유실, 화물 800상자, 총중량 10,000kg, CIF 가액 2억 원. 운송인 책임 인정·면책 없음 가정</text>
<text x="70" y="210" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="start">CIF 가액(화물값)</text>
<rect x="470" y="186" width="182.0" height="44" fill="#9aa5b1" rx="6"/>
<text x="666.0" y="218" font-size="22" font-weight="800" fill="#9aa5b1" text-anchor="start">2억 원</text>
<text x="70" y="380" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="start">&quot;800 CARTONS&quot; 기재</text>
<text x="70" y="408" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="start">포장당 800 × 666.67 = 533,336 SDR</text>
<rect x="470" y="356" width="878.6505" height="44" fill="#1f6fd1" rx="6"/>
<text x="1362.6505" y="388" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="start">약 9억 6,555만 원</text>
<text x="470" y="432" font-size="17" font-weight="600" fill="#1d2a3a" text-anchor="start">한도가 화물값보다 커서 실제 손해(인도할 날 도착지 가격)까지</text>
<text x="70" y="550" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="start">&quot;1 X 40&#x27; CONTAINER S.T.C.&quot;만 기재</text>
<text x="70" y="578" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="start">컨테이너 = 1포장 → kg당 10,000 × 2 = 20,000 SDR</text>
<rect x="470" y="526" width="32.949098" height="44" fill="#d9482b" rx="6"/>
<text x="516.949098" y="558" font-size="22" font-weight="800" fill="#d9482b" text-anchor="start">약 3,621만 원</text>
<text x="470" y="602" font-size="17" font-weight="600" fill="#1d2a3a" text-anchor="start">CIF 가액의 약 18%</text>
<line x1="470" y1="690" x2="1380" y2="690" stroke="#1d2a3a" stroke-width="2"/>
<line x1="470.0" y1="690" x2="470.0" y2="700" stroke="#1d2a3a" stroke-width="2"/>
<text x="470.0" y="724" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="middle">0</text>
<line x1="652.0" y1="690" x2="652.0" y2="700" stroke="#1d2a3a" stroke-width="2"/>
<text x="652.0" y="724" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="middle">2억 원</text>
<line x1="834.0" y1="690" x2="834.0" y2="700" stroke="#1d2a3a" stroke-width="2"/>
<text x="834.0" y="724" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="middle">4억 원</text>
<line x1="1016.0" y1="690" x2="1016.0" y2="700" stroke="#1d2a3a" stroke-width="2"/>
<text x="1016.0" y="724" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="middle">6억 원</text>
<line x1="1198.0" y1="690" x2="1198.0" y2="700" stroke="#1d2a3a" stroke-width="2"/>
<text x="1198.0" y="724" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="middle">8억 원</text>
<line x1="1380.0" y1="690" x2="1380.0" y2="700" stroke="#1d2a3a" stroke-width="2"/>
<text x="1380.0" y="724" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="middle">10억 원</text>
<rect x="56" y="760" width="1560" height="120" fill="#ffffff" stroke="#c9d2dc" stroke-width="2" rx="12"/>
<text x="80" y="800" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">포워더는 화주 패킹리스트의 포장 수가 B/L 품명란에 그대로 들어가게 챙깁니다. 면책이 인정되면 배상은 0원입니다.</text>
<text x="80" y="834" font-size="19" font-weight="600" fill="#5f6b78" text-anchor="start">1 SDR = 1,810.39원(IMF, 2026. 10. 8.) 기준 예시, 실제 환산일과 금액은 법원이 정함</text>
</svg>
