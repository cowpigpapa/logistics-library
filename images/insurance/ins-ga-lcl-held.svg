<line x1="976" y1="517" x2="950" y2="543" stroke="#ffffff" stroke-width="6"/>
<text x="963" y="598" font-size="17" font-weight="800" fill="#d9482b" text-anchor="middle">담보 미제출</text>
<text x="610.0" y="370" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="middle">혼재 컨테이너 1대(Master B/L에는 포워더 이름만)</text>
<rect x="1140" y="420" width="120" height="100" fill="#d9482b" rx="14"/>
<path d="M1165 420 v-30 a35 35 0 0 1 70 0 v30" fill="none" stroke="#d9482b" stroke-width="12"/>
<text x="1200" y="486" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">반출 불가</text>
<text x="1290" y="440" font-size="19" font-weight="700" fill="#d9482b" text-anchor="start">한 화주라도 담보를 내지 않으면</text>
<text x="1290" y="470" font-size="19" font-weight="700" fill="#d9482b" text-anchor="start">같은 컨테이너의 다른 화주</text>
<text x="1290" y="500" font-size="19" font-weight="700" fill="#d9482b" text-anchor="start">화물까지 나가지 못함</text>
<rect x="56" y="690" width="760" height="190" fill="#f5f9fe" stroke="#1f6fd1" stroke-width="2.5" rx="12"/>
<text x="72" y="726" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="start">포워더가 그날 할 일</text>
<text x="72" y="758" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">House B/L 번호·품명·중량·송하인·수하인 내역을</text>
<text x="72" y="783" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">정산인에게 바로 보냄</text>
<text x="72" y="808" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">안내문(서식·제출처·기한·사이트 접속 정보)을 화주에게 전달</text>
<rect x="856" y="690" width="760" height="190" fill="#fff7f5" stroke="#d9482b" stroke-width="2.5" rx="12"/>
<text x="872" y="726" font-size="22" font-weight="800" fill="#d9482b" text-anchor="start">하지 않을 것</text>
<text x="872" y="758" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">화주 대신 자기 이름으로 맹약서에 서명하거나</text>
<text x="872" y="783" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">분담금을 보증하지 않음</text>
<text x="872" y="808" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="start">분담 의무는 화물 소유자에게 있음</text>
