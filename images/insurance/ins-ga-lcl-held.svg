<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30" y="30" width="1612" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="54" y="72" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">공동해손 선언 뒤 혼재(LCL) 컨테이너는 전부 모여야 나옵니다</text>
<rect x="56" y="100" width="290" height="130" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5" rx="12"/>
<text x="72" y="136" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="start">선언</text>
<text x="72" y="168" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">선주가 공동해손 선언</text>
<text x="72" y="193" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">정산인 지정</text>
<line x1="350" y1="165" x2="370" y2="165" stroke="#1d2a3a" stroke-width="3" marker-end="url(#a-ink)"/>
<rect x="374" y="100" width="290" height="130" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5" rx="12"/>
<text x="390" y="136" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="start">내역 요청</text>
<text x="390" y="168" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">정산인이 포워더에게</text>
<text x="390" y="193" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">혼재 내역을 급히 요구</text>
