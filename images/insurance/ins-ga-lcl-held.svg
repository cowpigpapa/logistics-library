<text x="1026" y="168" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">정산인 사이트에</text>
<text x="1026" y="193" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">확인된 컨테이너 게시</text>
<line x1="1304" y1="165" x2="1324" y2="165" stroke="#1d2a3a" stroke-width="3" marker-end="url(#a-ink)"/>
<rect x="1328" y="100" width="290" height="130" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5" rx="12"/>
<text x="1344" y="136" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="start">반출 요청</text>
<text x="1344" y="168" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">목록에 오르면</text>
<text x="1344" y="193" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">선사에 반출 요청</text>
