<text x="708" y="136" font-size="22" font-weight="800" fill="#e4572e" text-anchor="start">담보 제출</text>
<text x="708" y="168" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">화주별 맹약서 +</text>
<text x="708" y="193" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">보증장 또는 현금 공탁</text>
