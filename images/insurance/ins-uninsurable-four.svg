<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9aa5b1"/></marker><marker id="a-sub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5f6b78"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30" y="30" width="1612" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="54" y="72" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">보험이 막히는 네 가지 이유</text>
<rect x="60" y="100" width="760" height="60" fill="#e2f3ea" rx="12"/>
<text x="440" y="140" font-size="24" font-weight="800" fill="#1f8a5b" text-anchor="middle">조건을 맞추면 해결될 수 있음</text>
<rect x="852" y="100" width="760" height="60" fill="#fbe7e2" rx="12"/>
<text x="1232" y="140" font-size="24" font-weight="800" fill="#d9482b" text-anchor="middle">보험료로 해결되지 않음</text>
<rect x="60" y="180" width="760" height="330" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5" rx="12"/>
<text x="76" y="224" font-size="30" font-weight="800" fill="#1f8a5b" text-anchor="start">1 약관이 원래 보상하지 않는 손해</text>
<text x="76" y="267" font-size="27" font-weight="500" fill="#1d2a3a" text-anchor="start">부패 같은 화물 자체의 성질(고유 하자)</text>
<text x="76" y="304" font-size="27" font-weight="500" fill="#1d2a3a" text-anchor="start">지연, 포장·적입 불량</text>
<text x="76" y="341" font-size="27" font-weight="500" fill="#1d2a3a" text-anchor="start"> </text>
<text x="76" y="378" font-size="27" font-weight="500" fill="#5f6b78" text-anchor="start">→ 더 넓은 약관, 운송인 청구 등 다른 길 검토</text>
<rect x="60" y="530" width="760" height="330" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5" rx="12"/>
<text x="76" y="574" font-size="30" font-weight="800" fill="#1f8a5b" text-anchor="start">2 보험사가 받되 조건을 좁힘</text>
<text x="76" y="617" font-size="27" font-weight="500" fill="#1d2a3a" text-anchor="start">냉동식품 24시간 고장 조건</text>
<text x="76" y="654" font-size="27" font-weight="500" fill="#1d2a3a" text-anchor="start">중고품 녹·긁힘·기계 이상 제외</text>
<text x="76" y="691" font-size="27" font-weight="500" fill="#1d2a3a" text-anchor="start">갑판 적재 화물의 좁은 조건</text>
<text x="76" y="728" font-size="27" font-weight="500" fill="#5f6b78" text-anchor="start">→ 선적 전 검사·창내 적재 요청 등으로 보완</text>
<rect x="852" y="180" width="760" height="330" fill="#ffffff" stroke="#d9482b" stroke-width="2.5" rx="12"/>
<text x="868" y="224" font-size="30" font-weight="800" fill="#d9482b" text-anchor="start">3 법 때문에 보험금을 줄 수 없음</text>
<text x="868" y="267" font-size="27" font-weight="500" fill="#1d2a3a" text-anchor="start">제재 대상 국가·화물</text>
<text x="868" y="304" font-size="27" font-weight="500" fill="#1d2a3a" text-anchor="start">지급 자체가 제재 위반이 되면</text>
<text x="868" y="341" font-size="27" font-weight="500" fill="#1d2a3a" text-anchor="start">보험증권이 있어도 지급되지 않음</text>
<text x="868" y="378" font-size="27" font-weight="500" fill="#5f6b78" text-anchor="start">→ 운송 가능 여부부터 검토</text>
<rect x="852" y="530" width="760" height="330" fill="#ffffff" stroke="#d9482b" stroke-width="2.5" rx="12"/>
<text x="868" y="574" font-size="30" font-weight="800" fill="#d9482b" text-anchor="start">4 계약 자체가 무효</text>
<text x="868" y="617" font-size="27" font-weight="500" fill="#1d2a3a" text-anchor="start">이미 사고가 난 사실을 알고 드는 보험</text>
<text x="868" y="654" font-size="27" font-weight="500" fill="#1d2a3a" text-anchor="start">숨기고 청약하면 무효·보상 불가,</text>
<text x="868" y="691" font-size="27" font-weight="500" fill="#1d2a3a" text-anchor="start">사기 문제로 번질 수 있음</text>
<text x="868" y="728" font-size="27" font-weight="500" fill="#5f6b78" text-anchor="start">→ 사고 전에 들어야 함</text>
</svg>
