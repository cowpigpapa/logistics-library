<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34475c"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="24" y="22" width="1624" height="897" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="48" y="66" font-size="26" font-weight="800" fill="#1d2a3a">ISO 668이 정하는 Series 1 컨테이너의 바깥 틀과 관련 표준</text>
<text x="48" y="96" font-size="16" font-weight="600" fill="#34475c">ISO 668:2020/Amd 1:2022의 표 2·표 3 값입니다(단위 mm·kg). 형식별 실제 내부 치수와 최대 총중량은 장비마다 다르므로 선사 사양과 CSC 판으로 확인합니다.</text>

<!-- box drawing: front end face + top + right long side, hidden edges dashed -->
<g stroke="#1d2a3a" stroke-width="2.5" fill="none">
<polygon points="120,330 350,330 950,160 720,160" fill="#eef4fb"/>
<polygon points="350,330 950,160 950,405 350,575" fill="#dfe9f5"/>
<rect x="120" y="330" width="230" height="245" fill="#f5f8fc"/>
</g>
<g stroke="#5f6b78" stroke-width="2" stroke-dasharray="8 6" fill="none">
<line x1="720" y1="160" x2="720" y2="405"/>
<line x1="720" y1="405" x2="120" y2="575"/>
<line x1="720" y1="405" x2="950" y2="405"/>
</g>
<!-- corrugation hint on long side -->
<g stroke="#b8c7d9" stroke-width="1.5">
<line x1="410" y1="320" x2="410" y2="558"/><line x1="470" y1="303" x2="470" y2="541"/><line x1="530" y1="286" x2="530" y2="524"/><line x1="590" y1="269" x2="590" y2="507"/><line x1="650" y1="252" x2="650" y2="490"/><line x1="710" y1="235" x2="710" y2="473"/><line x1="770" y1="218" x2="770" y2="456"/><line x1="830" y1="201" x2="830" y2="439"/><line x1="890" y1="184" x2="890" y2="422"/>
</g>
<!-- 8 corner fittings -->
<g fill="#d9482b" stroke="#1d2a3a" stroke-width="1.5">
<rect x="112" y="322" width="16" height="16"/><rect x="342" y="322" width="16" height="16"/>
<rect x="112" y="567" width="16" height="16"/><rect x="342" y="567" width="16" height="16"/>
<rect x="712" y="152" width="16" height="16"/><rect x="942" y="152" width="16" height="16"/>
<rect x="942" y="397" width="16" height="16"/>
</g>
<rect x="712" y="397" width="16" height="16" fill="#ffffff" stroke="#d9482b" stroke-width="2" stroke-dasharray="4 3"/>

<!-- dimensions -->
<line x1="120" y1="612" x2="350" y2="612" stroke="#34475c" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="235" y="640" font-size="16" font-weight="800" fill="#1d2a3a" text-anchor="middle">폭 2,438 (8ft)</text>
<text x="235" y="662" font-size="14" font-weight="600" fill="#34475c" text-anchor="middle">모든 Series 1 공통</text>
<line x1="88" y1="330" x2="88" y2="575" stroke="#34475c" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="62" y="452" font-size="16" font-weight="800" fill="#1d2a3a" text-anchor="middle" transform="rotate(-90 62 452)">높이 2,438 · 2,591 · 2,896</text>
<line x1="372" y1="604" x2="972" y2="434" stroke="#34475c" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="700" y="560" font-size="16" font-weight="800" fill="#1d2a3a">길이 6,058(20ft) · 12,192(40ft)</text>
<text x="700" y="584" font-size="16" font-weight="800" fill="#1d2a3a">· 13,716(45ft)</text>

<!-- callouts for fittings -->
<line x1="930" y1="144" x2="946" y2="156" stroke="#d9482b" stroke-width="2"/>
<rect x="760" y="104" width="232" height="40" rx="8" fill="#fdf0ec" stroke="#d9482b" stroke-width="1.5"/>
<text x="776" y="130" font-size="15" font-weight="800" fill="#1d2a3a">코너 피팅 8개(■)</text>
<text x="120" y="700" font-size="14" font-weight="600" fill="#34475c">점선은 보이지 않는 모서리와 코너 피팅입니다. 문·잠금장치는 그리지 않았습니다.</text>

<!-- standard boxes under drawing -->
<rect x="48" y="724" width="300" height="168" rx="12" fill="#ffffff" stroke="#d9482b" stroke-width="2.5"/>
<text x="66" y="756" font-size="17" font-weight="800" fill="#d9482b">ISO 1161:2026</text>
<text x="66" y="784" font-size="15" font-weight="500" fill="#1d2a3a">코너·중간 피팅의 기본 치수,</text>
<text x="66" y="808" font-size="15" font-weight="500" fill="#1d2a3a">기능·강도 요건. 들어 올리기와</text>
<text x="66" y="832" font-size="15" font-weight="500" fill="#1d2a3a">트위스트록 고정이 이 8곳에</text>
<text x="66" y="856" font-size="15" font-weight="500" fill="#1d2a3a">걸립니다(2016년판을 대체).</text>
<rect x="366" y="724" width="300" height="168" rx="12" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5"/>
<text x="384" y="756" font-size="17" font-weight="800" fill="#1f8a5b">ISO 3874:2017</text>
<text x="384" y="784" font-size="15" font-weight="500" fill="#1d2a3a">ISO 1496에 맞게 만든 컨테이너의</text>
<text x="384" y="808" font-size="15" font-weight="500" fill="#1d2a3a">취급·고박 방법. 6항이 적컨테이너·</text>
<text x="384" y="832" font-size="15" font-weight="500" fill="#1d2a3a">빈 컨테이너 형식별 들어 올리기</text>
<text x="384" y="856" font-size="15" font-weight="500" fill="#1d2a3a">조건을 정합니다.</text>
<rect x="684" y="724" width="300" height="168" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="702" y="756" font-size="17" font-weight="800" fill="#1f6fd1">ISO 1496 제1~5부</text>
<text x="702" y="784" font-size="15" font-weight="500" fill="#1d2a3a">형식별 사양과 시험. ISO 668은</text>
<text x="702" y="808" font-size="15" font-weight="500" fill="#1d2a3a">요약만 하고, 내부 치수의 기준</text>
<text x="702" y="832" font-size="15" font-weight="500" fill="#1d2a3a">문서는 ISO 1496이라고 밝힙니다.</text>
<text x="702" y="856" font-size="15" font-weight="500" fill="#1d2a3a">번호·코드 표시는 ISO 6346.</text>

<!-- right table -->
<rect x="1010" y="124" width="614" height="768" rx="12" fill="#ffffff" stroke="#5f6b78" stroke-width="2"/>
<text x="1030" y="160" font-size="19" font-weight="800" fill="#1d2a3a">호칭(designation)과 외부 치수</text>
<line x1="1030" y1="176" x2="1604" y2="176" stroke="#c9d2dc" stroke-width="1.5"/>
<text x="1030" y="204" font-size="15" font-weight="800" fill="#34475c">길이</text>
<text x="1160" y="204" font-size="15" font-weight="800" fill="#34475c">호칭(높이 mm)</text>
<text x="1030" y="236" font-size="15" font-weight="700" fill="#1d2a3a">45ft 13,716</text>
<text x="1160" y="236" font-size="15" font-weight="500" fill="#1d2a3a">1EEE(2,896) · 1EE(2,591)</text>
<text x="1030" y="266" font-size="15" font-weight="700" fill="#1d2a3a">40ft 12,192</text>
<text x="1160" y="266" font-size="15" font-weight="500" fill="#1d2a3a">1AAA(2,896) · 1AA(2,591) · 1A(2,438) · 1AX</text>
<text x="1030" y="296" font-size="15" font-weight="700" fill="#1d2a3a">30ft 9,125</text>
<text x="1160" y="296" font-size="15" font-weight="500" fill="#1d2a3a">1BBB(2,896) · 1BB(2,591) · 1B(2,438) · 1BX</text>
<text x="1030" y="326" font-size="15" font-weight="700" fill="#1d2a3a">20ft 6,058</text>
<text x="1160" y="326" font-size="15" font-weight="500" fill="#1d2a3a">1CCC(2,896) · 1CC(2,591) · 1C(2,438) · 1CX</text>
<text x="1030" y="356" font-size="15" font-weight="700" fill="#1d2a3a">10ft 2,991</text>
<text x="1160" y="356" font-size="15" font-weight="500" fill="#1d2a3a">1D(2,438) · 1DX</text>
<text x="1030" y="384" font-size="13" font-weight="500" fill="#34475c">X: 높이 2,438 미만 · 현장 호칭(대개) 20GP 1CC · 40GP 1AA · 40HC 1AAA · 45HC 1EEE</text>

<rect x="1030" y="404" width="574" height="88" rx="8" fill="#fdf0ec"/>
<text x="1046" y="434" font-size="16" font-weight="800" fill="#1d2a3a">최대 총중량(rating, R)</text>
<text x="1046" y="462" font-size="15" font-weight="600" fill="#1d2a3a">1EEE~1CX 36,000kg · 1D·1DX 10,160kg (Amd 1:2022 표 2)</text>
<text x="1046" y="484" font-size="13" font-weight="500" fill="#34475c">2020년판 본문은 30,480kg을 기준으로 두고 조건부로 36,000kg까지 허용했습니다.</text>

<text x="1030" y="530" font-size="19" font-weight="800" fill="#1d2a3a">최소 내부 치수·문 치수(표 3)</text>
<line x1="1030" y1="546" x2="1604" y2="546" stroke="#c9d2dc" stroke-width="1.5"/>
<text x="1030" y="576" font-size="15" font-weight="500" fill="#1d2a3a">내부 폭 2,330 이상, 내부 높이 = 외부 높이 − 241</text>
<text x="1030" y="606" font-size="15" font-weight="500" fill="#1d2a3a">내부 길이: 20ft 5,867 · 40ft 11,998 · 45ft 13,542 이상</text>
<text x="1030" y="636" font-size="15" font-weight="500" fill="#1d2a3a">문 폭 2,286 이상</text>
<text x="1030" y="666" font-size="15" font-weight="500" fill="#1d2a3a">문 높이: 2,134(8ft) · 2,261(8ft 6in) · 2,566(9ft 6in) 이상</text>
<text x="1030" y="696" font-size="15" font-weight="500" fill="#1d2a3a">방열(리퍼) 컨테이너 내부 폭 2,200 이상</text>
<rect x="1030" y="718" width="574" height="152" rx="8" fill="#eef4fb"/>
<text x="1046" y="748" font-size="16" font-weight="800" fill="#1d2a3a">포워더가 읽는 법</text>
<text x="1046" y="776" font-size="15" font-weight="500" fill="#1d2a3a">· 표의 값은 "최소" 기준입니다. 적입 계획에는</text>
<text x="1046" y="800" font-size="15" font-weight="500" fill="#1d2a3a">  배정 장비의 선사 사양값을 씁니다.</text>
<text x="1046" y="828" font-size="15" font-weight="500" fill="#1d2a3a">· 최대 총중량은 장비마다 다르므로 CSC 판의</text>
<text x="1046" y="852" font-size="15" font-weight="500" fill="#1d2a3a">  값을, 국내 도로는 총중량 40톤·축하중 10톤 기준을 봅니다.</text>
</svg>
