<text x="48" y="66" font-size="26" font-weight="800" fill="#1d2a3a">T-11 팔레트(1,100×1,100mm)를 ISO 컨테이너 바닥에 놓으면: 위에서 본 계산</text>
<text x="48" y="96" font-size="16" font-weight="600" fill="#34475c">ISO 668 표 3의 최소 내부 치수(폭 2,330mm)로 그린 축척도입니다. 1단·한 방향 배열이며, 화물 돌출과 고박 여유는 넣지 않았습니다.</text>

