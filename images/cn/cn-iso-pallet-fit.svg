<text x="742" y="188" font-size="19" font-weight="800" fill="#1f8a5b">20ft: 길이 방향 5장 × 폭 방향 2장 = 10장</text>
<text x="742" y="222" font-size="16" font-weight="500" fill="#1d2a3a">남는 공간: 길이 367mm(5,867 − 5,500), 폭 130mm(2,330 − 2,200)</text>
<text x="742" y="252" font-size="16" font-weight="500" fill="#1d2a3a">바닥 면적 대비 팔레트 면적: 12.10㎡ ÷ 13.67㎡ ≒ 88.5%</text>
<text x="742" y="290" font-size="16" font-weight="500" fill="#1d2a3a">남는 폭 130mm는 팔레트 사이와 벽 쪽 틈으로 나뉩니다. 틈이 크면</text>
<text x="742" y="316" font-size="16" font-weight="500" fill="#1d2a3a">고임목·에어백 같은 고정재로 채우는 계획을 적입 작업자에게 받습니다.</text>
<text x="742" y="354" font-size="14" font-weight="600" fill="#34475c">분홍 칸 = 남는 공간. 선사 사양의 실제 내부 치수가 더 크면 여유도 커집니다.</text>

