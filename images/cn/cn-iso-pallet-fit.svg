<text x="1314" y="496" font-size="18" font-weight="800" fill="#1f8a5b">40ft: 10장 × 2장 = 20장</text>
<text x="1314" y="528" font-size="15" font-weight="500" fill="#1d2a3a">남는 길이 998mm</text>
<text x="1314" y="554" font-size="15" font-weight="500" fill="#1d2a3a">(11,998 − 11,000)</text>
<text x="1314" y="580" font-size="15" font-weight="500" fill="#1d2a3a">남는 폭 130mm</text>
<text x="1314" y="606" font-size="15" font-weight="500" fill="#1d2a3a">면적 비율 ≒ 86.6%</text>
<text x="1314" y="640" font-size="14" font-weight="600" fill="#34475c">문 쪽 998mm에는 1,100mm</text>
<text x="1314" y="662" font-size="14" font-weight="600" fill="#34475c">팔레트가 더 들어가지 않습니다.</text>

<rect x="48" y="730" width="512" height="166" rx="12" fill="#ffffff" stroke="#5f6b78" stroke-width="2"/>
<text x="66" y="762" font-size="17" font-weight="800" fill="#1d2a3a">ISO 6780:2003 크기(확인한 것)</text>
<text x="66" y="792" font-size="15" font-weight="500" fill="#1d2a3a">1,200×800 · 1,200×1,000 · 1,100×1,100mm</text>
<text x="66" y="820" font-size="15" font-weight="500" fill="#1d2a3a">1,200×1,000은 1,000mm 쪽을 폭 방향으로 2장 놓으면</text>
<text x="66" y="844" font-size="15" font-weight="500" fill="#1d2a3a">폭 330mm가 남고, 1,200mm 쪽 2장(2,400)은</text>
<text x="66" y="868" font-size="15" font-weight="500" fill="#1d2a3a">2,330mm 폭에 들어가지 않습니다.</text>
<rect x="580" y="730" width="512" height="166" rx="12" fill="#ffffff" stroke="#5f6b78" stroke-width="2"/>
<text x="598" y="762" font-size="17" font-weight="800" fill="#1d2a3a">한국 표준(KS)</text>
<text x="598" y="792" font-size="15" font-weight="500" fill="#1d2a3a">KS T 0006 유닛로드 시스템 통칙: 1,100×1,100mm</text>
<text x="598" y="816" font-size="15" font-weight="500" fill="#1d2a3a">팔레트를 기본으로 한 일관 수송 체계의 지침</text>
<text x="598" y="844" font-size="15" font-weight="500" fill="#1d2a3a">KS T ISO 6780 = ISO 6780:2003 일치(IDT)</text>
<text x="598" y="868" font-size="15" font-weight="500" fill="#1d2a3a">KS T 1372 일관수송용 평파렛트(제품 표준)</text>
<rect x="1112" y="730" width="512" height="166" rx="12" fill="#eef4fb" stroke="#c9d2dc" stroke-width="1.5"/>
<text x="1130" y="762" font-size="17" font-weight="800" fill="#1d2a3a">이 계산으로 정하지 않는 것</text>
<text x="1130" y="792" font-size="15" font-weight="500" fill="#1d2a3a">· 적재 단수와 상단 하중: 팔레트·포장의 시험값</text>
<text x="1130" y="816" font-size="15" font-weight="500" fill="#1d2a3a">· 총중량: CSC 판과 도로 중량 한도</text>
<text x="1130" y="840" font-size="15" font-weight="500" fill="#1d2a3a">· 직사각형 팔레트의 회전·혼합 배치 장수</text>
<text x="1130" y="864" font-size="15" font-weight="500" fill="#1d2a3a">· 리퍼는 내부 폭 2,200mm 이상으로 더 좁음</text>
