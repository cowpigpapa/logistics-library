<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<text x="40" y="58" font-size="28" font-weight="800" fill="#1d2a3a">수리 견적서 한 줄 읽기: CEDEX 위치 코드와 견적 항목</text>
<text x="40" y="92" font-size="18" fill="#5f6b78">ISO 9897(CEDEX)의 위치 코드 규칙과 IICL TB 002의 견적 항목 구성을 바탕으로 그린 예시입니다(금액은 넣지 않음)</text>
<rect x="40" y="118" width="820" height="800" rx="16" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="1.5"/>
<text x="70" y="160" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="start">40ft 컨테이너 왼쪽 측면(L)을 바깥에서 본 모습</text>
<text x="70" y="186" font-size="15" font-weight="500" fill="#5f6b78" text-anchor="start">왼쪽·오른쪽은 문 쪽 끝에서 앞쪽을 바라볼 때 기준이므로, 바깥에서 보면 문이 오른쪽에 옵니다</text>
<rect x="110" y="250" width="700" height="230" fill="#ffffff" stroke="#1d2a3a" stroke-width="2"/>
<rect x="110" y="250" width="700" height="16" fill="#dfe5ec" stroke="#1d2a3a" stroke-width="1"/>
<rect x="110" y="464" width="700" height="16" fill="#dfe5ec" stroke="#1d2a3a" stroke-width="1"/>
<line x1="110" y1="365.0" x2="810" y2="365.0" stroke="#5f6b78" stroke-width="1.5" stroke-dasharray="7 5"/>
<line x1="180.0" y1="250" x2="180.0" y2="480" stroke="#aab4bf" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="250.0" y1="250" x2="250.0" y2="480" stroke="#aab4bf" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="320.0" y1="250" x2="320.0" y2="480" stroke="#aab4bf" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="390.0" y1="250" x2="390.0" y2="480" stroke="#aab4bf" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="460.0" y1="250" x2="460.0" y2="480" stroke="#aab4bf" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="530.0" y1="250" x2="530.0" y2="480" stroke="#aab4bf" stroke-width="1" stroke-dasharray="4 4"/>
