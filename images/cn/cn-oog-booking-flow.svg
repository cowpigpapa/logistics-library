<rect x="40" y="100" width="360" height="220" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5" rx="14"/>
<rect x="41.5" y="101.5" width="357" height="62" fill="#eaf2fc" rx="13"/>
<circle cx="74" cy="133" r="18" fill="#1f6fd1"/>
<text x="74" y="140.2" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="102" y="141" font-size="23" font-weight="800" fill="#1f6fd1" text-anchor="start">견적·사전 문의</text>
<text x="62" y="198" font-size="18" font-weight="700" fill="#5f6b78" text-anchor="start">포워더</text>
<text x="62" y="234" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">화주 도면·중량·무게중심·사진으로</text>
<text x="62" y="261" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">장비와 초과 치수를 선사에 알림</text>
<rect x="444" y="100" width="360" height="220" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5" rx="14"/>
<rect x="445.5" y="101.5" width="357" height="62" fill="#eaf2fc" rx="13"/>
<circle cx="478" cy="133" r="18" fill="#1f6fd1"/>
