<text x="445.0" y="118" font-size="19" font-weight="700" fill="#1f6fd1" text-anchor="middle">Prefix(BIC 코드) = 앞 네 글자</text>
<text x="836" y="400" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="middle">J는 컨테이너에 붙이는 장비, Z는 트레일러·샤시. Prefix는 소유자를 나타내므로 리스 컨테이너는 운항 선사 사이트에서 조회합니다.</text>
<rect x="30" y="440" width="1612" height="471" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="54" y="482" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">체크 디지트 계산: 자리마다 값 × 가중치(1, 2, 4 … 512)를 더해 11로 나눈 나머지</text>
