<text x="260" y="772" font-size="22" font-weight="700" fill="#1d2a3a" text-anchor="start">합계 21 + 56 + 144 + 256 + 16 + 64 + 192 + 512 + 1280 + 3072 = 5613</text>
<rect x="260" y="796" width="760" height="76" fill="#fdeee9" stroke="#d9482b" stroke-width="3" rx="12"/>
<text x="284" y="845" font-size="26" font-weight="800" fill="#d9482b" text-anchor="start">5613 ÷ 11 = 510 … 나머지 3  →  KQXU 123456 3</text>
<text x="1060" y="812" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="start">글자 값: A=10부터 차례로, 11의 배수(11, 22, 33)는</text>
<text x="1060" y="838" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="start">건너뜀 → B=12, L=23, V=34 / K=21, Q=28, X=36, U=32</text>
<text x="1060" y="864" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="start">나머지가 10이면 체크 디지트는 0</text>
