<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5f6b78"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="24" y="22" width="1624" height="897" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="48" y="66" font-size="26" font-weight="800" fill="#1d2a3a">자발적 표준이 실무 의무가 되는 네 경로</text>
<text x="48" y="96" font-size="16" font-weight="600" fill="#34475c">ISO 표준은 원칙적으로 자발적으로 적용합니다. 협약·법률, 세관 규정, 계약, 국가표준(KS)이 특정 표준을 인용하면 그 범위에서 의무가 됩니다.</text>

<!-- left source box -->
<rect x="48" y="300" width="280" height="300" rx="14" fill="#1d2a3a"/>
<text x="188" y="350" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">ISO 표준</text>
<text x="188" y="382" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">원칙적으로 자발적 적용</text>
<line x1="78" y1="404" x2="298" y2="404" stroke="#5f6b78" stroke-width="1.5"/>
<text x="68" y="436" font-size="15" font-weight="500" fill="#ffffff">ISO 서문: 표준의 "자발적</text>
<text x="68" y="460" font-size="15" font-weight="500" fill="#ffffff">성격(voluntary nature)"을</text>
<text x="68" y="484" font-size="15" font-weight="500" fill="#ffffff">스스로 밝힙니다.</text>
<text x="68" y="520" font-size="15" font-weight="500" fill="#ffffff">원문은 유료이고, 판(edition)</text>
<text x="68" y="544" font-size="15" font-weight="500" fill="#ffffff">마다 내용이 다를 수 있으므로</text>
<text x="68" y="568" font-size="15" font-weight="500" fill="#ffffff">번호와 연도를 함께 적습니다.</text>

<!-- arrows -->
<path d="M328 400 C 360 400, 360 196, 392 196" stroke="#5f6b78" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M328 430 C 360 430, 360 382, 392 382" stroke="#5f6b78" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M328 470 C 360 470, 360 568, 392 568" stroke="#5f6b78" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M328 500 C 360 500, 360 754, 392 754" stroke="#5f6b78" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>

<!-- row 1 -->
<rect x="398" y="126" width="740" height="150" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="420" y="160" font-size="19" font-weight="800" fill="#1f6fd1">① 국제협약과 국내법</text>
<text x="420" y="192" font-size="15" font-weight="500" fill="#1d2a3a">국제컨테이너안전협약(CSC, 1972년 채택·1977년 발효): 국제 운송 컨테이너는</text>
<text x="420" y="216" font-size="15" font-weight="500" fill="#1d2a3a">체약국 주관청의 안전승인을 받고 안전승인판을 붙입니다.</text>
<text x="420" y="244" font-size="15" font-weight="500" fill="#1d2a3a">한국: 선박안전법 제23조의 컨테이너 형식승인·검정, 형식승인판(해양수산부).</text>
<rect x="1160" y="126" width="464" height="150" rx="12" fill="#eef4fb" stroke="#c9d2dc" stroke-width="1.5"/>
<text x="1180" y="160" font-size="16" font-weight="800" fill="#1d2a3a">실무에서</text>
<text x="1180" y="190" font-size="15" font-weight="500" fill="#1d2a3a">ISO 1496 시험 합격과 별개로 법정 승인이</text>
<text x="1180" y="214" font-size="15" font-weight="500" fill="#1d2a3a">있어야 합니다. 장비의 최대 총중량은</text>
<text x="1180" y="238" font-size="15" font-weight="500" fill="#1d2a3a">승인판(CSC 판)에 적힌 값을 씁니다.</text>

<!-- row 2 -->
<rect x="398" y="312" width="740" height="150" rx="12" fill="#ffffff" stroke="#d9482b" stroke-width="2.5"/>
<text x="420" y="346" font-size="19" font-weight="800" fill="#d9482b">② 세관·보안 규정</text>
<text x="420" y="378" font-size="15" font-weight="500" fill="#1d2a3a">미국 6 U.S.C. 944(a)(4)(B)(i): 늦어도 2008년 10월 15일부터 미국으로 가는</text>
<text x="420" y="402" font-size="15" font-weight="500" fill="#1d2a3a">모든 컨테이너가 ISO/PAS 17712 씰 기준을 충족하도록 요구합니다.</text>
<text x="420" y="430" font-size="15" font-weight="500" fill="#1d2a3a">CTPAT 같은 보안 프로그램은 고보안(H) 등급 씰과 씰 관리 절차를 요구합니다.</text>
<rect x="1160" y="312" width="464" height="150" rx="12" fill="#fdf0ec" stroke="#c9d2dc" stroke-width="1.5"/>
<text x="1180" y="346" font-size="16" font-weight="800" fill="#1d2a3a">실무에서</text>
<text x="1180" y="376" font-size="15" font-weight="500" fill="#1d2a3a">씰 번호가 기재되는 B/L·터미널 기록·</text>
<text x="1180" y="400" font-size="15" font-weight="500" fill="#1d2a3a">해당 신고 자료 사이의 일치를 확인합니다.</text>
<text x="1180" y="424" font-size="15" font-weight="500" fill="#1d2a3a">번호가 다르면 정정 요청이 먼저입니다.</text>

<!-- row 3 -->
<rect x="398" y="498" width="740" height="150" rx="12" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5"/>
<text x="420" y="532" font-size="19" font-weight="800" fill="#1f8a5b">③ 계약</text>
<text x="420" y="564" font-size="15" font-weight="500" fill="#1d2a3a">선사 장비 사양·운송약관, 터미널 반입 조건, 화주의 입찰 요청서(RFQ)와</text>
<text x="420" y="588" font-size="15" font-weight="500" fill="#1d2a3a">물류 계약서가 "ISO 6780 팔레트", "ISO 17712 H등급 씰", "ISO 14083 기준</text>
<text x="420" y="612" font-size="15" font-weight="500" fill="#1d2a3a">배출량 보고"처럼 표준을 조건으로 적으면 그 계약 당사자에게 의무가 됩니다.</text>
<rect x="1160" y="498" width="464" height="150" rx="12" fill="#eaf6f0" stroke="#c9d2dc" stroke-width="1.5"/>
<text x="1180" y="532" font-size="16" font-weight="800" fill="#1d2a3a">실무에서</text>
<text x="1180" y="562" font-size="15" font-weight="500" fill="#1d2a3a">계약서의 표준 번호·판·적용 범위를</text>
<text x="1180" y="586" font-size="15" font-weight="500" fill="#1d2a3a">확인하고, 포워더의 계약 범위 밖인</text>
<text x="1180" y="610" font-size="15" font-weight="500" fill="#1d2a3a">항목은 누가 이행하는지 적어 둡니다.</text>

<!-- row 4 -->
<rect x="398" y="684" width="740" height="150" rx="12" fill="#ffffff" stroke="#6b4fbb" stroke-width="2.5"/>
<text x="420" y="718" font-size="19" font-weight="800" fill="#6b4fbb">④ 국가표준(KS) 부합화</text>
<text x="420" y="750" font-size="15" font-weight="500" fill="#1d2a3a">국가기술표준원은 ISO를 KS로 옮겨 둡니다. KS T ISO 6780은 ISO 6780:2003과,</text>
<text x="420" y="774" font-size="15" font-weight="500" fill="#1d2a3a">KS T ISO 668은 ISO 668:1995와 일치(IDT)로 등록되어 있습니다.</text>
<text x="420" y="802" font-size="15" font-weight="500" fill="#1d2a3a">KS T 0006(유닛로드 시스템 통칙)은 1,100×1,100mm 팔레트를 기본으로 합니다.</text>
<rect x="1160" y="684" width="464" height="150" rx="12" fill="#f1edfa" stroke="#c9d2dc" stroke-width="1.5"/>
<text x="1180" y="718" font-size="16" font-weight="800" fill="#1d2a3a">실무에서</text>
<text x="1180" y="748" font-size="15" font-weight="500" fill="#1d2a3a">국내 규격서·공공 입찰이 KS를 인용하면</text>
<text x="1180" y="772" font-size="15" font-weight="500" fill="#1d2a3a">KS가 따르는 ISO 판이 현행 ISO 판과</text>
<text x="1180" y="796" font-size="15" font-weight="500" fill="#1d2a3a">같은지 표준 정보 페이지에서 확인합니다.</text>

<text x="48" y="884" font-size="15" font-weight="600" fill="#34475c">출처: ISO 668:2020/Amd 1:2022 서문, IMO CSC 안내, 해양수산부 컨테이너 형식승인정보(공공데이터포털), 6 U.S.C. 944, 국가표준인증 통합정보시스템(2026. 11. 5. 확인)</text>
</svg>
