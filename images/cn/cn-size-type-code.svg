<text x="699.0" y="538" font-size="92" font-weight="800" fill="#c98a12" text-anchor="middle">1</text>
<text x="120" y="410" font-size="24" font-weight="800" fill="#1d2a3a" text-anchor="start">22G1 = 20ft 일반 드라이(20GP/20DV)</text>
<rect x="800" y="440" width="26" height="26" fill="#1f6fd1" rx="6"/>
<text x="813" y="460" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="840" y="461" font-size="20" font-weight="800" fill="#1f6fd1" text-anchor="start">길이</text>
<text x="950" y="461" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">2 = 20ft (6058mm)</text>
<rect x="800" y="476" width="26" height="26" fill="#1f8a5b" rx="6"/>
<text x="813" y="496" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="840" y="497" font-size="20" font-weight="800" fill="#1f8a5b" text-anchor="start">높이</text>
<text x="950" y="497" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">2 = 8ft 6in (2591mm) 표준</text>
<rect x="800" y="512" width="26" height="26" fill="#e4572e" rx="6"/>
<text x="813" y="532" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="840" y="533" font-size="20" font-weight="800" fill="#e4572e" text-anchor="start">형식 그룹</text>
<text x="950" y="533" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">G = 일반용 드라이 컨테이너</text>
