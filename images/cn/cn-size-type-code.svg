<text x="840" y="289" font-size="20" font-weight="800" fill="#c98a12" text-anchor="start">세부 형식</text>
<text x="950" y="289" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">1 = 상부 패시브 벤트</text>
<rect x="120" y="430" width="150" height="150" fill="#eaf2fc" stroke="#1f6fd1" stroke-width="3" rx="12"/>
