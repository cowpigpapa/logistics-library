<text x="1530" y="190" font-size="12" font-weight="800" fill="#1d2a3a" text-anchor="middle">123456 3</text>
<text x="1530" y="212" font-size="17" font-weight="800" fill="#e4572e" text-anchor="middle">45G1</text>
<text x="1450.0" y="596" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">번호 11자리 아래에 네 자리 코드</text>
<line x1="60" y1="662" x2="1612" y2="662" stroke="#c9d2dc" stroke-width="1.5"/>
<text x="60" y="694" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="start">자리별로 자주 보는 값</text>
<rect x="60" y="712" width="372" height="170" fill="#eaf2fc" stroke="#1f6fd1" stroke-width="2" rx="12"/>
<text x="80" y="748" font-size="21" font-weight="800" fill="#1f6fd1" text-anchor="start">첫째 길이</text>
<text x="80" y="784" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">2 = 20ft</text>
<text x="80" y="814" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">4 = 40ft</text>
<text x="80" y="844" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">L 또는 5 = 45ft</text>
<rect x="452" y="712" width="372" height="170" fill="#e8f5ee" stroke="#1f8a5b" stroke-width="2" rx="12"/>
<text x="472" y="748" font-size="21" font-weight="800" fill="#1f8a5b" text-anchor="start">둘째 높이</text>
<text x="472" y="784" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">2 = 8ft 6in 표준</text>
<text x="472" y="814" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">5 = 9ft 6in 하이큐브</text>
<text x="472" y="844" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">8 = 4ft 3in 하프하이트</text>
<rect x="844" y="712" width="372" height="170" fill="#fdeee8" stroke="#e4572e" stroke-width="2" rx="12"/>
<text x="864" y="748" font-size="21" font-weight="800" fill="#e4572e" text-anchor="start">셋째 형식 그룹</text>
<text x="864" y="784" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">G 드라이 · R 리퍼</text>
<text x="864" y="814" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">U 오픈탑 · P 플랫랙</text>
<text x="864" y="844" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">T·K·N 탱크</text>
<rect x="1236" y="712" width="372" height="170" fill="#fbf3e2" stroke="#c98a12" stroke-width="2" rx="12"/>
<text x="1256" y="748" font-size="21" font-weight="800" fill="#c98a12" text-anchor="start">넷째 세부 형식</text>
<text x="1256" y="784" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">R1 냉동·가열</text>
<text x="1256" y="814" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">U1 헤더 탈착</text>
<text x="1256" y="844" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">P3 접이식 끝벽</text>
<text x="1612" y="694" font-size="17" font-weight="500" fill="#5f6b78" text-anchor="end">45ft 표기(L·5)와 탱크 코드(T·K·N)는 판(1995·2022)에 따라 다름</text>
