<text x="1070.5454545454545" y="188" font-size="16" font-weight="700" fill="#d9482b" text-anchor="start">CSC 60mm 넘으면 정지 기준</text>
<text x="80" y="342" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="start">앞·뒤 헤더</text>
<text x="80" y="368" font-size="15" font-weight="500" fill="#5f6b78" text-anchor="start">front·rear header</text>
