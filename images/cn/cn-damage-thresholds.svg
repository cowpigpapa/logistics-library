<line x1="866.4" y1="642" x2="866.4" y2="650" stroke="#1d2a3a" stroke-width="1.5"/>
<text x="866.3636363636363" y="672" font-size="15" font-weight="500" fill="#5f6b78" text-anchor="middle">40</text>
<line x1="965.5" y1="642" x2="965.5" y2="650" stroke="#1d2a3a" stroke-width="1.5"/>
<text x="965.4545454545455" y="672" font-size="15" font-weight="500" fill="#5f6b78" text-anchor="middle">50</text>
<line x1="1064.5" y1="642" x2="1064.5" y2="650" stroke="#1d2a3a" stroke-width="1.5"/>
<text x="1064.5454545454545" y="672" font-size="15" font-weight="500" fill="#5f6b78" text-anchor="middle">60</text>
<line x1="1163.6" y1="642" x2="1163.6" y2="650" stroke="#1d2a3a" stroke-width="1.5"/>
<text x="1163.6363636363635" y="672" font-size="15" font-weight="500" fill="#5f6b78" text-anchor="middle">70</text>
<line x1="1262.7" y1="642" x2="1262.7" y2="650" stroke="#1d2a3a" stroke-width="1.5"/>
<text x="1262.7272727272725" y="672" font-size="15" font-weight="500" fill="#5f6b78" text-anchor="middle">80</text>
<line x1="1361.8" y1="642" x2="1361.8" y2="650" stroke="#1d2a3a" stroke-width="1.5"/>
<text x="1361.8181818181818" y="672" font-size="15" font-weight="500" fill="#5f6b78" text-anchor="middle">90</text>
<line x1="1460.9" y1="642" x2="1460.9" y2="650" stroke="#1d2a3a" stroke-width="1.5"/>
<text x="1460.909090909091" y="672" font-size="15" font-weight="500" fill="#5f6b78" text-anchor="middle">100</text>
<line x1="1560.0" y1="642" x2="1560.0" y2="650" stroke="#1d2a3a" stroke-width="1.5"/>
