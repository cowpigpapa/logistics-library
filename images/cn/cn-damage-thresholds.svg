<line x1="866.4" y1="310" x2="866.4" y2="368" stroke="#8a5a00" stroke-width="3"/>
<text x="872.3636363636363" y="306" font-size="16" font-weight="700" fill="#8a5a00" text-anchor="start">UCIRC 40mm 넘으면 수리</text>
<line x1="1262.7" y1="310" x2="1262.7" y2="368" stroke="#d9482b" stroke-width="3"/>
<text x="1268.7272727272725" y="306" font-size="16" font-weight="700" fill="#d9482b" text-anchor="start">CSC 80mm 넘으면 정지 기준</text>
<text x="80" y="460" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="start">하부 측면 레일</text>
<text x="80" y="486" font-size="15" font-weight="500" fill="#5f6b78" text-anchor="start">bottom side rail</text>
<rect x="470" y="436" width="495.5" height="50" fill="#d7eee1"/>
