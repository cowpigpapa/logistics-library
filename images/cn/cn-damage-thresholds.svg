<text x="971.4545454545455" y="424" font-size="16" font-weight="700" fill="#8a5a00" text-anchor="start">UCIRC 50mm 넘으면 수리</text>
<line x1="1460.9" y1="428" x2="1460.9" y2="486" stroke="#d9482b" stroke-width="3"/>
<text x="1454.909090909091" y="424" font-size="16" font-weight="700" fill="#d9482b" text-anchor="end">CSC 100mm 넘으면 정지 기준</text>
