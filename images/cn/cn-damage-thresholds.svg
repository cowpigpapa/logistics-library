<text x="1560" y="696" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="end">휨·찌그러짐 깊이(mm)</text>
<rect x="40" y="738" width="1592" height="180" rx="16" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="1.5"/>
<rect x="70" y="760" width="34" height="22" fill="#d7eee1" stroke="#9aa6b2"/>
<text x="116" y="778" font-size="17" font-weight="600" fill="#1d2a3a" text-anchor="start">UCIRC 표의 수리 기준 미만</text>
<rect x="590" y="760" width="34" height="22" fill="#f7e2b5" stroke="#9aa6b2"/>
<text x="636" y="778" font-size="17" font-weight="600" fill="#1d2a3a" text-anchor="start">UCIRC 수리 대상, CSC 정지 기준에는 못 미침</text>
<rect x="1110" y="760" width="34" height="22" fill="#f6cfc6" stroke="#9aa6b2"/>
<text x="1156" y="778" font-size="17" font-weight="600" fill="#1d2a3a" text-anchor="start">CSC/Circ.134 정지 기준(실린 컨테이너)</text>
<text x="70" y="822" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">· 구멍·절단·찢어짐·균열은 깊이와 관계없이 UCIRC 수리 대상입니다. CSC는 균열·찢어짐 길이 기준을 따로 둡니다(예: 상부 레일 45mm, 코너 포스트 50mm).</text>
<text x="70" y="852" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">· UCIRC 코너 포스트 값은 찌그러짐(dent) 25mm, CSC 값은 국부 변형 50mm입니다. CSC 기준은 수리·운용 기준으로 쓰지 말라고 원문이 명시합니다.</text>
<text x="70" y="882" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">· IICL-6(리스 반납 기준)은 유료 자료라 수치를 싣지 않았습니다. 출처: UCIRC 제3판(BIC·ICS·WSC, 2023), IMO CSC/Circ.134(2005) 부속서 1.</text>
</svg>