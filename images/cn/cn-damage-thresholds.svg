<text x="668.1818181818181" y="672" font-size="15" font-weight="500" fill="#5f6b78" text-anchor="middle">20</text>
<line x1="767.3" y1="642" x2="767.3" y2="650" stroke="#1d2a3a" stroke-width="1.5"/>
