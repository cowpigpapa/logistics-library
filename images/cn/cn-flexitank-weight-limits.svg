<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect width="1672" height="941" fill="#ffffff"/>
<text x="36" y="52" font-size="27" font-weight="800" fill="#1d2a3a">20ft에 액체를 몇 톤까지 실을까: 기준마다 다른 상한과 측벽이 받는 힘</text>
<text x="36" y="84" font-size="18" fill="#5f6b78">CTU Code는 숫자 대신 "CTU 운영자(운송인)와 합의한 값"을 넘지 말라고 합니다(부속서 7 5.2.3). 아래 값들은 그 합의의 출발점입니다.</text>

<!-- LEFT PANEL -->
<rect x="24" y="108" width="800" height="806" rx="16" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2"/>
<text x="50" y="148" font-size="21" font-weight="800" fill="#1d2a3a">① 액체 중량 상한, 누가 얼마를 말하나</text>
<text x="50" y="176" font-size="16" fill="#5f6b78">가로축: 플렉시탱크 안 액체의 질량(톤)</text>
<!-- axis: x0=120 -> 0t, 22px per t, 30t -> 780 -->
<g stroke="#e3e8ee" stroke-width="1">
<line x1="120" y1="200" x2="120" y2="780"/><line x1="230" y1="200" x2="230" y2="780"/><line x1="340" y1="200" x2="340" y2="780"/><line x1="450" y1="200" x2="450" y2="780"/><line x1="560" y1="200" x2="560" y2="780"/><line x1="670" y1="200" x2="670" y2="780"/><line x1="780" y1="200" x2="780" y2="780"/>
</g>
<g font-size="15" fill="#5f6b78" text-anchor="middle">
<text x="120" y="804">0</text><text x="230" y="804">5</text><text x="340" y="804">10</text><text x="450" y="804">15</text><text x="560" y="804">20</text><text x="670" y="804">25</text><text x="780" y="804">30톤</text>
</g>
<!-- payload reference line 28.33t -> 120+28.33*22 = 743 -->
<line x1="743" y1="200" x2="743" y2="780" stroke="#1d2a3a" stroke-width="2" stroke-dasharray="7 5"/>
<text x="737" y="222" font-size="14" fill="#1d2a3a" text-anchor="end">20GP 최대 적재 28,330kg</text>
<text x="737" y="240" font-size="13" fill="#5f6b78" text-anchor="end">(선사 공개 사양 예, 최대 총중량 30,480kg)</text>

<!-- bars -->
<!-- 24t -> 528px -> end 648 -->
<rect x="120" y="268" width="528" height="44" rx="6" fill="#d9482b"/>
<text x="634" y="297" font-size="18" font-weight="800" fill="#ffffff" text-anchor="end">24,000kg</text>
<text x="120" y="334" font-size="16" font-weight="700" fill="#1d2a3a">COA 실무 규약 V6(2019)·PAS 1008:2016의 최대치</text>
<text x="120" y="356" font-size="15" fill="#5f6b78">용량도 24,000L 이하. 20GP는 최대 총중량 30,480kg 이상이어야 함</text>

<!-- 18t IUMI -> 396 -> end 516 -->
<rect x="120" y="392" width="396" height="44" rx="6" fill="#e4572e" opacity="0.85"/>
<text x="502" y="421" font-size="18" font-weight="800" fill="#ffffff" text-anchor="end">18,000kg</text>
<text x="120" y="458" font-size="16" font-weight="700" fill="#1d2a3a">국제해상보험연맹(IUMI) 권고 한계값(비중 1.0 기준, 2024)</text>
<text x="120" y="480" font-size="15" fill="#5f6b78">"COA 최대치는 컨테이너 구조의 의도적 과적"이라고 평가</text>

<!-- 18t GL restricted -->
<rect x="120" y="516" width="396" height="44" rx="6" fill="#1f6fd1"/>
<text x="502" y="545" font-size="18" font-weight="800" fill="#ffffff" text-anchor="end">18톤</text>
<text x="120" y="582" font-size="16" font-weight="700" fill="#1d2a3a">GL·독일보험협회(GDV) 조사: 제한 항로</text>
<text x="120" y="604" font-size="15" fill="#5f6b78">북대서양 일부 해역 제외, 길이 170m 넘는 선박일 때(횡가속 0.6g 가정)</text>

<!-- 15t GL unrestricted -> 330 -> end 450 -->
<rect x="120" y="640" width="330" height="44" rx="6" fill="#1f6fd1" opacity="0.7"/>
<text x="436" y="669" font-size="18" font-weight="800" fill="#ffffff" text-anchor="end">15톤</text>
<text x="120" y="706" font-size="16" font-weight="700" fill="#1d2a3a">GL·GDV 조사: 무제한 항로</text>
<text x="120" y="728" font-size="15" fill="#5f6b78">해상 횡가속 0.8g 적용, 길이 170m 넘는 선박일 때</text>

<text x="50" y="850" font-size="15" fill="#1d2a3a">비중이 1보다 큰 액체(당밀·글리세린 등)는 같은 부피라도 더 무거워집니다.</text>
<text x="50" y="874" font-size="15" fill="#1d2a3a">24,000L × 비중 1.1 = 26.4톤으로, 질량 24,000kg 상한을 먼저 넘습니다.</text>
<text x="50" y="898" font-size="13" fill="#5f6b78">출처: COA CoP V6-O 4.2, PAS 1008:2016(BSI), IUMI Annex 1(2024. 10.), GDV/GL Flexitank 조사 보고서(2012)</text>

<!-- RIGHT PANEL -->
<rect x="848" y="108" width="800" height="806" rx="16" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2"/>
<text x="874" y="148" font-size="21" font-weight="800" fill="#1d2a3a">② 측벽 한쪽이 받는 옆 방향 힘 (어림)</text>
<text x="874" y="176" font-size="16" fill="#5f6b78">액체는 마찰로 버티지 못해 옆 방향 관성력을 벽이 거의 다 받습니다.</text>
<text x="874" y="198" font-size="16" fill="#5f6b78">힘 ≈ 액체 질량 × 0.8g (CTU Code 5장, 해역 C 횡방향 계수). 톤의 무게로 표시</text>

<!-- axis x0=944, 30px per t, 0..22t -> 944..1604 -->
<g stroke="#e3e8ee" stroke-width="1">
<line x1="944" y1="230" x2="944" y2="640"/><line x1="1094" y1="230" x2="1094" y2="640"/><line x1="1244" y1="230" x2="1244" y2="640"/><line x1="1394" y1="230" x2="1394" y2="640"/><line x1="1544" y1="230" x2="1544" y2="640"/>
</g>
<g font-size="15" fill="#5f6b78" text-anchor="middle">
<text x="944" y="664">0</text><text x="1094" y="664">5</text><text x="1244" y="664">10</text><text x="1394" y="664">15</text><text x="1544" y="664">20톤</text>
</g>
<!-- side wall test load 0.6P = 0.6*28.33=17.0t -> 944+17*30 = 1454 -->
<line x1="1454" y1="230" x2="1454" y2="640" stroke="#1f8a5b" stroke-width="3"/>
<text x="1462" y="252" font-size="15" font-weight="800" fill="#1f8a5b">측벽 시험 하중</text>
<text x="1462" y="272" font-size="15" font-weight="800" fill="#1f8a5b">0.6P ≈ 17.0톤</text>
<text x="1462" y="292" font-size="13" fill="#1f8a5b">(P = 28,330kg)</text>

<!-- bars: 15t -> 12.0 -> 360 ; 18t -> 14.4 -> 432 ; 24t -> 19.2 -> 576 -->
<text x="874" y="345" font-size="16" font-weight="700" fill="#1d2a3a" text-anchor="start">15톤</text>
<rect x="944" y="320" width="360" height="40" rx="6" fill="#1f6fd1" opacity="0.7"/>
<text x="1290" y="347" font-size="17" font-weight="800" fill="#ffffff" text-anchor="end">12.0톤</text>

<text x="874" y="445" font-size="16" font-weight="700" fill="#1d2a3a" text-anchor="start">18톤</text>
<rect x="944" y="420" width="432" height="40" rx="6" fill="#1f6fd1"/>
<text x="1362" y="447" font-size="17" font-weight="800" fill="#ffffff" text-anchor="end">14.4톤</text>

<text x="874" y="545" font-size="16" font-weight="700" fill="#1d2a3a" text-anchor="start">24톤</text>
<rect x="944" y="520" width="576" height="40" rx="6" fill="#d9482b"/>
<text x="1506" y="547" font-size="17" font-weight="800" fill="#ffffff" text-anchor="end">19.2톤</text>
<text x="1444" y="588" font-size="14" font-weight="700" fill="#d9482b" text-anchor="end">시험 하중을 넘음 →</text>

<!-- notes -->
<rect x="874" y="696" width="750" height="196" rx="12" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5"/>
<g font-size="15" fill="#1d2a3a">
<text x="894" y="726"><tspan font-weight="800">측벽 시험 하중</tspan>: 드라이 컨테이너 측벽은 적재 중량(P)의 60%를 벽 전체에 고르게</text>
<text x="894" y="748">받는 시험을 거칩니다(CTU Code §6.2.4, ISO 1496-1).</text>
<text x="894" y="778"><tspan font-weight="800" fill="#d9482b">실제는 더 불리</tspan>: 플렉시탱크는 벽 아래쪽에 몰려 밀고, 정지 상태의 액체 압력도</text>
<text x="894" y="800">이미 벽에 걸려 있습니다. 그래서 접촉 높이를 낮게(약 1.3m 제안, UK P&amp;I) 하라고 합니다.</text>
<text x="894" y="830"><tspan font-weight="800">이 계산은 판정용이 아닙니다</tspan>: 비교를 위한 단순화이며, 실제 가속도는 선박 크기·</text>
<text x="894" y="852">복원성·적재 위치(갑판 위 바깥 열, 선수·선미)에 따라 달라집니다.</text>
<text x="894" y="878" font-size="13" fill="#5f6b78">출처: CTU Code(MSC.1/Circ.1497) 5장 표·§6.2.4, Carefully to Carry 34장(UK P&amp;I, 2023), 선사 공개 20GP 사양</text>
</g>
</svg>
