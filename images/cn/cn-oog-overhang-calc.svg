<text x="1004" y="72" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">계산 (단위 mm, 6절 예시)</text>
<rect x="1004" y="97" width="614" height="40" fill="#fdeee9" rx="8"/>
<text x="1018" y="124" font-size="20" font-weight="800" fill="#d9482b" text-anchor="start">선사에 신고할 값</text>
<text x="1018" y="172" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="start">① 오버와이드</text>
<text x="1186" y="172" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">3,000 − 2,440 = 560 → 좌우 각 280</text>
<text x="1018" y="214" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="start">② 바닥 위 높이</text>
<text x="1186" y="214" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">2,800 + 100(받침목) = 2,900</text>
<text x="1018" y="256" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="start">③ 오버하이트</text>
<text x="1186" y="256" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">2,900 − 1,940 = 960 (하이큐브 640)</text>
<rect x="1004" y="283" width="614" height="40" fill="#eaf2fc" rx="8"/>
<text x="1018" y="310" font-size="20" font-weight="800" fill="#1f6fd1" text-anchor="start">운송사와 함께 볼 값</text>
<text x="1018" y="358" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="start">④ 바닥 높이 어림</text>
<text x="1186" y="358" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">2,591 − 1,940 = 약 651</text>
<text x="1018" y="400" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="start">⑤ 도로 높이</text>
<text x="1186" y="400" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">h + 651 + 2,900 = h + 3,551</text>
<text x="1186" y="442" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">4,000 이하가 되려면 h ≤ 449</text>
<text x="1018" y="484" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="start">⑥ 도로 폭</text>
<text x="1186" y="484" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">3,000 &gt; 2,500 → 운행허가 대상</text>
<text x="1018" y="526" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="start">⑦ 도로 총중량</text>
<text x="1186" y="526" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">9 + 5 + 5.2 + 28 = 47.2t &gt; 40t</text>
<text x="1018" y="568" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="start">⑧ 허가 기준표</text>
<text x="1186" y="568" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">6축 이상 48t · 5축 45.2t까지</text>
<text x="1186" y="610" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">(가장 먼 축간거리 13.0m 이상 14.0m 미만)</text>
<text x="1004" y="670" font-size="17" font-weight="500" fill="#5f6b78" text-anchor="start">컨테이너 샤시 상면 높이는 대체로 449mm보다 높아 4.0m를 넘기 쉽습니다. 트랙터</text>
<text x="1004" y="695" font-size="17" font-weight="500" fill="#5f6b78" text-anchor="start">9t·샤시 5t·플랫랙 5.2t은 대표값·공개 사양이고, 실제 장비 값으로 다시</text>
<text x="1004" y="720" font-size="17" font-weight="500" fill="#5f6b78" text-anchor="start">계산합니다.</text>
