<text x="794.5" y="580.745" font-size="15" font-weight="600" fill="#1f6fd1" text-anchor="start">in-gauge 높이</text>
<line x1="782.5" y1="388.39500000000004" x2="782.5" y2="239.59500000000003" stroke="#d9482b" stroke-width="2.5" marker-end="url(#md9482b)" marker-start="url(#md9482b)"/>
<text x="794.5" y="273.595" font-size="20" font-weight="800" fill="#d9482b" text-anchor="start">960 초과</text>
<line x1="689.1" y1="338.795" x2="922.5" y2="338.795" stroke="#1f8a5b" stroke-width="2" stroke-dasharray="4 4"/>
<text x="794.5" y="360.795" font-size="15" font-weight="700" fill="#1f8a5b" text-anchor="start">하이큐브 2,260</text>
<text x="794.5" y="378.795" font-size="15" font-weight="700" fill="#1f8a5b" text-anchor="start">→ 640 초과</text>
<text x="794.5" y="750" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="start">가는 점선: in-gauge 범위</text>
<text x="794.5" y="772" font-size="15" font-weight="600" fill="#5f6b78" text-anchor="start">붉은 칸: 기준을 넘는 부분</text>
<line x1="177.5" y1="790" x2="177.5" y2="689.095" stroke="#5f6b78" stroke-width="2" marker-end="url(#m5f6b78)" marker-start="url(#m5f6b78)"/>
<text x="167.5" y="745.5475" font-size="17" font-weight="800" fill="#1d2a3a" text-anchor="end">약 651</text>
<line x1="177.5" y1="689.095" x2="177.5" y2="239.59500000000003" stroke="#5f6b78" stroke-width="2" marker-end="url(#m5f6b78)" marker-start="url(#m5f6b78)"/>
<text x="167.5" y="464.345" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="end">2,900</text>
<text x="167.5" y="486.345" font-size="14" font-weight="600" fill="#5f6b78" text-anchor="end">받침목 100</text>
<text x="167.5" y="504.345" font-size="14" font-weight="600" fill="#5f6b78" text-anchor="end">포함</text>
