<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9aa5b1"/></marker><marker id="a-sub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5f6b78"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30" y="30" width="1612" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="54" y="72" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">D/O는 두 겹, 통관은 따로</text>
<rect x="56" y="96" width="1560" height="210" fill="#f5f9fe" rx="14"/>
<text x="80" y="136" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="start">Master 단계</text>
<rect x="56" y="326" width="1560" height="210" fill="#f4fbf7" rx="14"/>
<text x="80" y="362" font-size="22" font-weight="800" fill="#1f8a5b" text-anchor="start">House 단계</text>
<rect x="80" y="160" width="260" height="116" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5" rx="12"/>
<text x="210" y="204" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle">선사(실제운송인)</text>
<text x="210" y="236" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">Master B/L 발행</text>
<rect x="480" y="160" width="260" height="116" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5" rx="12"/>
<text x="610" y="204" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle">수입지 포워더 파트너</text>
<text x="610" y="236" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">Master B/L 수하인</text>
<text x="610" y="259" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">원본 또는 서렌더 확인</text>
<rect x="880" y="160" width="260" height="116" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5" rx="12"/>
<text x="1010" y="204" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle">선사 D/O</text>
<text x="1010" y="236" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">터미널에서 화물을</text>
<text x="1010" y="259" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">빼 오는 근거</text>
<rect x="1280" y="160" width="260" height="116" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5" rx="12"/>
<text x="1410" y="204" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle">CY·CFS 반출</text>
<text x="1410" y="236" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">포워더 쪽으로</text>
<line x1="344" y1="218" x2="476" y2="218" stroke="#1f6fd1" stroke-width="3" marker-end="url(#a-blue)"/>
<line x1="744" y1="218" x2="876" y2="218" stroke="#1f6fd1" stroke-width="3" marker-end="url(#a-blue)"/>
<line x1="1144" y1="218" x2="1276" y2="218" stroke="#1f6fd1" stroke-width="3" marker-end="url(#a-blue)"/>
<rect x="80" y="390" width="260" height="116" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5" rx="12"/>
<text x="210" y="434" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle">수입자(화주)</text>
<text x="210" y="466" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">House B/L 원본 제출</text>
<text x="210" y="489" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">또는 발행인 서렌더 통지</text>
<rect x="480" y="390" width="260" height="116" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5" rx="12"/>
<text x="610" y="434" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle">포워더</text>
<text x="610" y="466" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">원본 회수·배서 확인</text>
<text x="610" y="489" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">운임·로컬 차지 정산</text>
<rect x="880" y="390" width="260" height="116" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5" rx="12"/>
<text x="1010" y="434" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle">House D/O</text>
<text x="1010" y="466" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">포워더가 화주에게</text>
<text x="1010" y="489" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">발행</text>
<rect x="1280" y="390" width="260" height="116" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5" rx="12"/>
<text x="1410" y="434" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle">보세창고 출고</text>
<text x="1410" y="466" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">House D/O로</text>
<line x1="344" y1="448" x2="476" y2="448" stroke="#1f8a5b" stroke-width="3" marker-end="url(#a-green)"/>
<line x1="744" y1="448" x2="876" y2="448" stroke="#1f8a5b" stroke-width="3" marker-end="url(#a-green)"/>
<line x1="1144" y1="448" x2="1276" y2="448" stroke="#1f8a5b" stroke-width="3" marker-end="url(#a-green)"/>
<rect x="880" y="556" width="520" height="54" fill="#fbe7e2" stroke="#d9482b" stroke-width="2" rx="10"/>
<text x="1140" y="590" font-size="19" font-weight="800" fill="#d9482b" text-anchor="middle">Master D/O를 수입자에게 넘기지 않음(사례 7)</text>
<rect x="56" y="640" width="1560" height="240" fill="#ffffff" stroke="#1d2a3a" stroke-width="2" rx="14"/>
<text x="84" y="684" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="start">세관 쪽 반출 요건은 별개</text>
<text x="84" y="728" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">보세구역 운영인은 수입신고 수리 물품의 반출승인정보를 확인하고 반출신고(보세화물관리에 관한 고시 제10조)</text>
<text x="84" y="768" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">수입신고 수리일부터 15일 안에 반출(제19조, 별표 1의 보세구역) · 고시 본문에는 D/O 규정이 없음</text>
<text x="84" y="808" font-size="20" font-weight="700" fill="#d9482b" text-anchor="start">세관 요건을 갖춰도 D/O 없이 내주면 운송인 쪽 책임 문제가 남음</text>
</svg>
