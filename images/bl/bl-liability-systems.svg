<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9aa5b1"/></marker><marker id="a-sub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5f6b78"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30" y="30" width="1612" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="54" y="72" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">복합운송 책임 체계: 손해 구간을 알 때와 모를 때</text>
<text x="560" y="104" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="start">구간을 알 때</text>
<text x="1110" y="104" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="start">구간을 모를 때</text>
<rect x="56" y="130" width="1560" height="236" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5" rx="12"/>
<text x="80" y="170" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="start">한국 상법 제816조</text>
<rect x="80" y="186" width="88.0" height="31" fill="#1f6fd1" rx="15.5"/>
<text x="124.0" y="207.62" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">네트워크</text>
<rect x="82" y="280" width="63.1875" height="22" fill="#8a6d3b" rx="5"/>
<text x="113.59375" y="272" font-size="16" font-weight="700" fill="#8a6d3b" text-anchor="middle">트럭</text>
<rect x="149.1875" y="280" width="197.56250000000003" height="22" fill="#1f6fd1" rx="5"/>
<text x="247.96875" y="272" font-size="16" font-weight="700" fill="#1f6fd1" text-anchor="middle">바다</text>
<rect x="350.75" y="280" width="103.50000000000001" height="22" fill="#6b4fa0" rx="5"/>
<text x="402.5" y="272" font-size="16" font-weight="700" fill="#6b4fa0" text-anchor="middle">철도</text>
<rect x="458.25" y="280" width="49.75000000000001" height="22" fill="#8a6d3b" rx="5"/>
<text x="483.125" y="272" font-size="16" font-weight="700" fill="#8a6d3b" text-anchor="middle">트럭</text>
<text x="113" y="330" font-size="15" font-weight="700" fill="#8a6d3b" text-anchor="middle">육상</text>
<text x="248" y="330" font-size="15" font-weight="700" fill="#1f6fd1" text-anchor="middle">해상</text>
<text x="402" y="330" font-size="15" font-weight="700" fill="#6b4fa0" text-anchor="middle">철도</text>
<text x="483" y="330" font-size="15" font-weight="700" fill="#8a6d3b" text-anchor="middle">도로</text>
<text x="80" y="356" font-size="15" font-weight="500" fill="#5f6b78" text-anchor="start">구간마다 원래 그 구간에 적용될 규칙</text>
<text x="560" y="184" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">그 구간에 적용될 법으로 책임</text>
<text x="560" y="214" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">(한도만이 아니라 책임 규정 전체로</text>
<text x="560" y="244" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">읽는 것이 자연스러움)</text>
<text x="1110" y="184" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">운송거리가 가장 긴 구간의 법</text>
<text x="1110" y="214" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">거리가 같거나 정할 수 없으면</text>
<text x="1110" y="244" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">운임이 가장 비싼 구간의 법</text>
<text x="1110" y="274" font-size="19" font-weight="500" fill="#5f6b78" text-anchor="start">한국 출발 장거리는 대개 해상 규정</text>
<rect x="56" y="382" width="1560" height="236" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5" rx="12"/>
<text x="80" y="422" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="start">UNCTAD/ICC 규칙 · FIATA FBL</text>
<rect x="80" y="438" width="126.58999999999999" height="31" fill="#e4572e" rx="15.5"/>
<text x="143.295" y="459.62" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">수정 네트워크</text>
<rect x="82" y="532" width="63.1875" height="22" fill="#8a6d3b" rx="5"/>
<text x="113.59375" y="524" font-size="16" font-weight="700" fill="#8a6d3b" text-anchor="middle">트럭</text>
<rect x="149.1875" y="532" width="197.56250000000003" height="22" fill="#1f6fd1" rx="5"/>
<text x="247.96875" y="524" font-size="16" font-weight="700" fill="#1f6fd1" text-anchor="middle">바다</text>
<rect x="350.75" y="532" width="103.50000000000001" height="22" fill="#6b4fa0" rx="5"/>
<text x="402.5" y="524" font-size="16" font-weight="700" fill="#6b4fa0" text-anchor="middle">철도</text>
<rect x="458.25" y="532" width="49.75000000000001" height="22" fill="#8a6d3b" rx="5"/>
<text x="483.125" y="524" font-size="16" font-weight="700" fill="#8a6d3b" text-anchor="middle">트럭</text>
<rect x="80" y="566" width="430" height="26" fill="#fdebe4" rx="6"/>
<text x="295" y="585" font-size="15" font-weight="700" fill="#e4572e" text-anchor="middle">FBL 하나 + 구간 강행 한도만 끼워 넣음</text>
<text x="560" y="436" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">책임 원칙은 FBL 그대로</text>
<text x="560" y="466" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">한도만 그 구간 강행 협약·법의</text>
<text x="560" y="496" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">&#x27;다른 한도&#x27;(높든 낮든) 적용</text>
<text x="1110" y="436" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">포장당 666.67 SDR 또는</text>
<text x="1110" y="466" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">kg당 2 SDR 중 큰 금액</text>
<text x="1110" y="496" font-size="19" font-weight="500" fill="#5f6b78" text-anchor="start">해상·내수로 구간이 없으면</text>
<text x="1110" y="526" font-size="19" font-weight="500" fill="#5f6b78" text-anchor="start">kg당 8.33 SDR</text>
<rect x="56" y="634" width="1560" height="236" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5" rx="12"/>
<text x="80" y="674" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="start">1980 UN 복합운송협약</text>
<rect x="80" y="690" width="154.47" height="31" fill="#9aa5b1" rx="15.5"/>
<text x="157.235" y="711.62" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">수정 단일(미발효)</text>
<rect x="82" y="784" width="63.1875" height="22" fill="#8a6d3b" rx="5"/>
<text x="113.59375" y="776" font-size="16" font-weight="700" fill="#8a6d3b" text-anchor="middle">트럭</text>
<rect x="149.1875" y="784" width="197.56250000000003" height="22" fill="#1f6fd1" rx="5"/>
<text x="247.96875" y="776" font-size="16" font-weight="700" fill="#1f6fd1" text-anchor="middle">바다</text>
<rect x="350.75" y="784" width="103.50000000000001" height="22" fill="#6b4fa0" rx="5"/>
<text x="402.5" y="776" font-size="16" font-weight="700" fill="#6b4fa0" text-anchor="middle">철도</text>
<rect x="458.25" y="784" width="49.75000000000001" height="22" fill="#8a6d3b" rx="5"/>
<text x="483.125" y="776" font-size="16" font-weight="700" fill="#8a6d3b" text-anchor="middle">트럭</text>
<rect x="80" y="818" width="430" height="26" fill="#eef1f4" rx="6"/>
<text x="295" y="837" font-size="15" font-weight="700" fill="#5f6b78" text-anchor="middle">전 구간에 협약 하나(현재 효력 없음)</text>
<text x="560" y="688" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">책임 원칙은 하나</text>
<text x="560" y="718" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">구간 규칙의 한도가 협약보다</text>
<text x="560" y="748" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">높을 때만 그 한도</text>
<text x="1110" y="688" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">포장당 920 SDR 또는</text>
<text x="1110" y="718" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">kg당 2.75 SDR 중 큰 금액</text>
<text x="1110" y="748" font-size="19" font-weight="500" fill="#5f6b78" text-anchor="start">해상·내수로가 없으면 kg당 8.33 SDR</text>
<line x1="540" y1="120" x2="540" y2="886" stroke="#c9d2dc" stroke-width="2"/>
<line x1="1090" y1="120" x2="1090" y2="886" stroke="#c9d2dc" stroke-width="2"/>
