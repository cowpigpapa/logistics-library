<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30" y="30" width="1612" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="56" y="76" font-size="28" font-weight="800" fill="#1d2a3a">유럽 트럭 구간의 계약은 대개 세 겹입니다</text>
<text x="56" y="110" font-size="19" font-weight="600" fill="#5f6b78">누가 누구에게 어떤 규칙으로 책임지는지는 각 계약에서 맡은 자격으로 정해집니다</text>
<!-- boxes row -->
<rect x="60" y="160" width="300" height="130" fill="#ffffff" stroke="#1d2a3a" stroke-width="3" rx="12"/>
<text x="210" y="215" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="middle">화주</text>
<text x="210" y="252" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">한국 수출자 등</text>
<rect x="460" y="160" width="300" height="130" fill="#eef4fc" stroke="#1f6fd1" stroke-width="3" rx="12"/>
<text x="610" y="215" font-size="26" font-weight="800" fill="#1f6fd1" text-anchor="middle">한국 포워더</text>
<text x="610" y="252" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">문 앞까지 House B/L·FBL</text>
<rect x="860" y="160" width="300" height="130" fill="#eef4fc" stroke="#1f6fd1" stroke-width="3" rx="12"/>
<text x="1010" y="215" font-size="26" font-weight="800" fill="#1f6fd1" text-anchor="middle">유럽 파트너</text>
<text x="1010" y="252" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">트럭 구간 수배</text>
<rect x="1260" y="160" width="340" height="130" fill="#eaf6f0" stroke="#1f8a5b" stroke-width="3" rx="12"/>
<text x="1430" y="215" font-size="26" font-weight="800" fill="#1f8a5b" text-anchor="middle">트럭 회사</text>
<text x="1430" y="252" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">CMR 운송장 발행</text>
<line x1="365" y1="225" x2="452" y2="225" stroke="#1d2a3a" stroke-width="4" marker-end="url(#a-ink)"/>
<line x1="765" y1="225" x2="852" y2="225" stroke="#1d2a3a" stroke-width="4" marker-end="url(#a-ink)"/>
<line x1="1165" y1="225" x2="1252" y2="225" stroke="#1d2a3a" stroke-width="4" marker-end="url(#a-ink)"/>
<!-- contract labels -->
<rect x="60" y="330" width="500" height="250" fill="#ffffff" stroke="#c9d2dc" stroke-width="2" rx="12"/>
<text x="84" y="372" font-size="22" font-weight="800" fill="#1d2a3a">① 화주 ↔ 한국 포워더</text>
<text x="84" y="412" font-size="19" font-weight="600" fill="#1d2a3a">복합운송 계약(포워더가 운송인)</text>
<text x="84" y="447" font-size="19" font-weight="600" fill="#1d2a3a">또는 운송 주선 계약</text>
<text x="84" y="492" font-size="17" font-weight="600" fill="#5f6b78">한국 법원이면 손해 구간의 법(상법 제816조)</text>
<text x="84" y="522" font-size="17" font-weight="600" fill="#5f6b78">트럭 구간에 CMR이 직접 적용되는지는</text>
<text x="84" y="550" font-size="17" font-weight="600" fill="#5f6b78">나라마다 판단이 갈림(영국 2002, 독일 2008)</text>
<rect x="586" y="330" width="500" height="250" fill="#ffffff" stroke="#c9d2dc" stroke-width="2" rx="12"/>
<text x="610" y="372" font-size="22" font-weight="800" fill="#1d2a3a">② 한국 포워더 ↔ 유럽 파트너</text>
<text x="610" y="412" font-size="19" font-weight="600" fill="#1d2a3a">파트너가 확정 운임으로 국경 트럭</text>
<text x="610" y="447" font-size="19" font-weight="600" fill="#1d2a3a">운송을 맡으면 CMR상 운송인 가능</text>
<text x="610" y="492" font-size="17" font-weight="600" fill="#5f6b78">독일 HGB 제459조, BGH 2010</text>
<text x="610" y="522" font-size="17" font-weight="600" fill="#5f6b78">주선인이려면 계약할 때 분명히 밝힘</text>
<text x="610" y="550" font-size="17" font-weight="600" fill="#5f6b78">(네덜란드 2022)</text>
<rect x="1112" y="330" width="500" height="250" fill="#ffffff" stroke="#c9d2dc" stroke-width="2" rx="12"/>
<text x="1136" y="372" font-size="22" font-weight="800" fill="#1d2a3a">③ 파트너 ↔ 트럭 회사</text>
<text x="1136" y="412" font-size="19" font-weight="600" fill="#1d2a3a">CMR 운송계약. 트럭 회사가 다시</text>
<text x="1136" y="447" font-size="19" font-weight="600" fill="#1d2a3a">맡기면 하청(제3조) 또는 연속 운송인</text>
<text x="1136" y="482" font-size="19" font-weight="600" fill="#1d2a3a">(제34조)</text>
<text x="1136" y="522" font-size="17" font-weight="600" fill="#5f6b78">운송장의 운송인 칸과 서명이 자격의 증거</text>
<text x="1136" y="550" font-size="17" font-weight="600" fill="#5f6b78">(영국 2006)</text>
<!-- bottom: claims -->
<rect x="60" y="610" width="1552" height="270" fill="#fff4ef" stroke="#e4572e" stroke-width="2" rx="12"/>
<text x="84" y="652" font-size="22" font-weight="800" fill="#d9482b">사고가 나면 (CMR 구간)</text>
<text x="84" y="700" font-size="19" font-weight="700" fill="#1d2a3a">누구에게</text>
<text x="230" y="700" font-size="19" font-weight="600" fill="#1d2a3a">첫 운송인, 마지막 운송인, 사고 구간 운송인 (제36조). 하청의 행위도 계약운송인 책임 (제3조)</text>
<text x="84" y="745" font-size="19" font-weight="700" fill="#1d2a3a">어디서</text>
<text x="230" y="745" font-size="19" font-weight="600" fill="#1d2a3a">합의한 당사국 법원, 피고 소재지, 인수지·인도지 나라만 (제31조). 운송장에 없는 관할 합의는 연속 운송인에게 안 미침</text>
<text x="84" y="790" font-size="19" font-weight="700" fill="#1d2a3a">언제까지</text>
<text x="230" y="790" font-size="19" font-weight="600" fill="#1d2a3a">유보: 인도 때 / 7일(일요일·공휴일 제외) / 연착 21일 (제30조). 소송 1년, 고의 등 3년 (제32조)</text>
<text x="84" y="835" font-size="19" font-weight="700" fill="#1d2a3a">얼마까지</text>
<text x="230" y="835" font-size="19" font-weight="600" fill="#1d2a3a">총중량 kg당 8.33 SDR (제23조). 가액·특별 이익 신고(제24조·제26조)나 고의(제29조)면 한도 초과</text>
</svg>
