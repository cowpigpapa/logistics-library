<text x="48" y="900" font-size="14" font-weight="700" fill="#5f6b78" text-anchor="start">연안 거점: 중국 정부 「중국–유럽 화물열차 건설 발전 계획(2016~2020)」의 해상·철도 연계 거점 목록</text>
