<circle cx="884" cy="894" r="4" fill="#e4572e"/>
<text x="898" y="900" font-size="15" font-weight="700" fill="#1d2a3a" text-anchor="start">중부회랑은 카스피해 횡단에 더해 흑해 횡단 또는 아할칼라키 환적이 붙음</text>
