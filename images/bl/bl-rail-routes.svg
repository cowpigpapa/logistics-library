<text x="898" y="840" font-size="15" font-weight="700" fill="#1d2a3a" text-anchor="start">SMGS 인도 기간: 궤간 환적·대차 교환마다 2일 추가(제24조 제3항)</text>
<circle cx="884" cy="864" r="4" fill="#e4572e"/>
