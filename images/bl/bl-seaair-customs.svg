<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5f6b78"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fd1"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9482b"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f8a5b"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="24" y="22" width="1624" height="897" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="48" y="66" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">한국 항구에서 인천공항까지: 복합환적 절차와 7일 운송기한</text>
<text x="48" y="96" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="start">「환적화물 처리절차에 관한 특례고시」(관세청고시 제2026-47호) 제6조~제8조·제10조·제12조를 단순화했습니다. 칸 간격은 시간 비례가 아닙니다.</text>
<rect x="48.0" y="128" width="240" height="236" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="64.0" y="162" font-size="18" font-weight="800" fill="#1f6fd1" text-anchor="start">1 입항 전</text>
<text x="64.0" y="196" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">하우스적재화물목록에</text>
<text x="64.0" y="223" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">보세운송인과 반출 예정지</text>
<text x="64.0" y="250" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">보세구역을 적어 신고</text>
<text x="64.0" y="277" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">(House B/L 단위,</text>
<text x="64.0" y="304" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">최초 입항지 세관장)</text>
<text x="64.0" y="348" font-size="14" font-weight="600" fill="#5f6b78" text-anchor="start">제8조 제1항·제2항</text>
<rect x="314.4" y="128" width="240" height="236" rx="12" fill="#ffffff" stroke="#e4572e" stroke-width="2.5"/>
<text x="330.4" y="162" font-size="18" font-weight="800" fill="#e4572e" text-anchor="start">2 하선신고</text>
<text x="330.4" y="196" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">선사나 하역업체가</text>
<text x="330.4" y="223" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">하선신고</text>
<text x="330.4" y="250" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">→ 이날부터</text>
<text x="330.4" y="277" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">7일 운송기한 시작</text>
<text x="330.4" y="348" font-size="14" font-weight="600" fill="#5f6b78" text-anchor="start">제4조, 제8조 제5항</text>
<rect x="580.8" y="128" width="240" height="236" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="596.8" y="162" font-size="18" font-weight="800" fill="#1f6fd1" text-anchor="start">3 하선장소에서 인계</text>
<text x="596.8" y="196" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">운송인이 적재화물목록</text>
<text x="596.8" y="223" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">사본을 운영인에게 제시</text>
<text x="596.8" y="250" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">운영인은 이상 여부</text>
<text x="596.8" y="277" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">확인 뒤 반출신고</text>
<text x="596.8" y="348" font-size="14" font-weight="600" fill="#5f6b78" text-anchor="start">제8조 제3항</text>
<rect x="847.1999999999999" y="128" width="240" height="236" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="863.1999999999999" y="162" font-size="18" font-weight="800" fill="#1f6fd1" text-anchor="start">4 트럭 운송</text>
<text x="863.1999999999999" y="196" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">보세운송업체, 또는</text>
<text x="863.1999999999999" y="223" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">담보를 낸 화주등</text>
<text x="863.1999999999999" y="250" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">(간이보세운송업체는</text>
<text x="863.1999999999999" y="277" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">담보 생략 가능)</text>
<text x="863.1999999999999" y="348" font-size="14" font-weight="600" fill="#5f6b78" text-anchor="start">제7조 제6항</text>
<rect x="1113.6" y="128" width="240" height="236" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="1129.6" y="162" font-size="18" font-weight="800" fill="#1f6fd1" text-anchor="start">5 공항 쪽 보세창고</text>
<text x="1129.6" y="196" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">운영인이 이상 여부</text>
<text x="1129.6" y="223" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">확인 뒤 반입신고</text>
<text x="1129.6" y="250" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">흔히 이곳에서 적출과</text>
<text x="1129.6" y="277" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">팔레트·ULD 빌드업</text>
<text x="1129.6" y="348" font-size="14" font-weight="600" fill="#5f6b78" text-anchor="start">제8조 제3항, 제6조</text>
<rect x="1380.0" y="128" width="240" height="236" rx="12" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5"/>
<text x="1396.0" y="162" font-size="18" font-weight="800" fill="#1f8a5b" text-anchor="start">6 항공사 터미널·탑재</text>
<text x="1396.0" y="196" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">출항 적재화물목록</text>
<text x="1396.0" y="223" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">AWB·위험물·보안</text>
<text x="1396.0" y="250" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">서류 확인 뒤 탑재</text>
<text x="1396.0" y="348" font-size="14" font-weight="600" fill="#5f6b78" text-anchor="start">항공 구간 절차</text>
<path d="M290.0 246 L310.4 246" stroke="#5f6b78" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M556.4 246 L576.8 246" stroke="#5f6b78" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M822.8 246 L843.1999999999999 246" stroke="#5f6b78" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M1089.1999999999998 246 L1109.6 246" stroke="#5f6b78" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M1355.6 246 L1376.0 246" stroke="#5f6b78" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M434.4 392 L434.4 408 L1233.6 408 L1233.6 392" stroke="#e4572e" stroke-width="3" fill="none"/>
<text x="834.0" y="438" font-size="18" font-weight="800" fill="#e4572e" text-anchor="middle">하선신고일부터 7일 안에 공항 쪽으로 운송(제8조 제5항)</text>
<rect x="48" y="470" width="510" height="250" rx="12" fill="#ffffff" stroke="#e4572e" stroke-width="2.5"/>
<text x="68" y="506" font-size="18" font-weight="800" fill="#e4572e" text-anchor="start">7일 안에 운송하지 못하면</text>
<text x="68" y="540" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">입항지 세관장에게 복합환적화물</text>
<text x="68" y="570" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">운송신고를 취하해야 함</text>
<text x="68" y="600" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">반출 예정지를 최초 입항지 보세구역으로</text>
<text x="68" y="630" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">바꾸는 것으로 취하를 갈음할 수 있음</text>
<text x="68" y="660" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="start">제8조 제6항</text>
<rect x="581" y="470" width="510" height="250" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="601" y="506" font-size="18" font-weight="800" fill="#1f6fd1" text-anchor="start">해상 컨테이너에서 꺼내 다시 쌓을 때</text>
<text x="601" y="540" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">적출입 작업 전까지 환적신고서 제출,</text>
<text x="601" y="570" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">작업은 CFS나 공항 내 보세구역(제6조)</text>
<text x="601" y="600" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">개장·분할구분·합병 등은</text>
<text x="601" y="630" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">보수작업 승인 대상(제10조)</text>
<text x="601" y="660" font-size="16" font-weight="700" fill="#1f6fd1" text-anchor="start">적출 뒤 빈 컨테이너 반납: 무료 기간·Detention 확인</text>
<text x="601" y="690" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="start">제6조 제1항 환적신고의 적용일은 관할 세관 확인</text>
<rect x="1114" y="470" width="506" height="250" rx="12" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5"/>
<text x="1134" y="506" font-size="18" font-weight="800" fill="#1f8a5b" text-anchor="start">목적지에서 직접운송을 증명할 때</text>
<text x="1134" y="540" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">하역·재선적·운송에 필요한 작업 등</text>
<text x="1134" y="570" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">외의 가공 없이 국외로 나가면</text>
<text x="1134" y="600" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">세관장이 비가공증명서를</text>
<text x="1134" y="630" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">발급할 수 있음</text>
<text x="1134" y="660" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="start">제12조</text>
<rect x="48" y="742" width="1572" height="156" rx="12" fill="#eef4fb" stroke="#c9d2dc" stroke-width="1.5"/>
<text x="68" y="778" font-size="18" font-weight="800" fill="#1d2a3a" text-anchor="start">알아 둘 정의</text>
<text x="68" y="810" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">복합환적: 들어온 운송수단의 물품을 다른 세관 관할로 운송해 나가는 운송수단에 옮겨 싣는 것(관세법 제2조 제15호).</text>
<text x="68" y="840" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">특례고시는 같은 세관 관할 안에서 선박에서 항공기로 옮겨 싣는 것도 복합환적에 넣습니다(제2조 제2호).</text>
<text x="68" y="870" font-size="16" font-weight="500" fill="#1d2a3a" text-anchor="start">선박으로 들어와 공항으로 운송한 뒤 외국으로 나가는 환적화물은 모선 단위 1건으로 일괄 보세운송신고를 할 수 있습니다(제7조 제1항 제1호).</text>
</svg>
