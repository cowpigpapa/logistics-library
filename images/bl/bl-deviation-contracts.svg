<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="24" y="22" width="1624" height="897" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="48" y="66" font-size="26" font-weight="800" fill="#1d2a3a">경로가 바뀌어 생긴 돈, 세 계약이 따로 답한다</text>
<text x="48" y="96" font-size="16" font-weight="600" fill="#5f6b78">같은 비용이라도 운송계약·매매계약·적하보험이 각자 다른 답을 냅니다. 한 계약에서 받은 답으로 다른 계약의 답을 대신하지 않습니다.</text>
<rect x="350" y="120" width="414" height="70" rx="10" fill="#1f6fd1"/>
<text x="557.0" y="151" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle">운송계약</text>
<text x="557.0" y="176" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">B/L 약관 · 상법 · 헤이그-비스비</text>
<rect x="776" y="120" width="414" height="70" rx="10" fill="#1f8a5b"/>
<text x="983.0" y="151" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle">매매계약</text>
<text x="983.0" y="176" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">인코텀스 · 계약서 · CISG</text>
<rect x="1202" y="120" width="414" height="70" rx="10" fill="#d9482b"/>
<text x="1409.0" y="151" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle">적하보험</text>
<text x="1409.0" y="176" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">ICC · 협회전쟁약관(화물)</text>
<text x="60" y="164" font-size="18" font-weight="800" fill="#1d2a3a">비용 항목</text>
<rect x="48" y="202" width="1576" height="124" rx="10" fill="#ffffff" stroke="#dbe2ea" stroke-width="1.5"/>
<text x="64" y="250" font-size="19" font-weight="800" fill="#1d2a3a">우회로 늘어난 운임</text>
<text x="64" y="278" font-size="16" font-weight="600" fill="#5f6b78">우회·긴급 할증료</text>
<text x="366" y="244" font-size="16" font-weight="700" fill="#1d2a3a">장애 조항이 있으면 운송인이</text>
<text x="366" y="270" font-size="16" font-weight="500" fill="#1d2a3a">추가 운임을 청구할 수 있음</text>
<text x="366" y="296" font-size="16" font-weight="500" fill="#1d2a3a">적용일은 공표·tariff 규칙</text>
<text x="792" y="244" font-size="16" font-weight="700" fill="#1d2a3a">운송계약을 맺은 쪽이 냄</text>
<text x="792" y="270" font-size="16" font-weight="500" fill="#1d2a3a">(C·D조건 매도인, E·F조건 매수인)</text>
<text x="792" y="296" font-size="16" font-weight="500" fill="#1d2a3a">부킹 뒤 생긴 할증은 계약서로</text>
<text x="1218" y="257" font-size="16" font-weight="700" fill="#1d2a3a">화물 손해가 아니라</text>
<text x="1218" y="283" font-size="16" font-weight="500" fill="#1d2a3a">운송 비용이므로 담보 대상 아님</text>
<rect x="48" y="334" width="1576" height="124" rx="10" fill="#f3f6f9" stroke="#dbe2ea" stroke-width="1.5"/>
<text x="64" y="382" font-size="19" font-weight="800" fill="#1d2a3a">대체 항구 양하 뒤</text>
<text x="64" y="410" font-size="16" font-weight="600" fill="#5f6b78">보관료·계속운송비</text>
<text x="366" y="376" font-size="16" font-weight="700" fill="#1d2a3a">운송 포기 조항: 그 항구에서</text>
<text x="366" y="402" font-size="16" font-weight="500" fill="#1d2a3a">인도한 것으로 보고 운임은 그대로,</text>
<text x="366" y="428" font-size="16" font-weight="500" fill="#1d2a3a">추가 비용은 화주(Merchant) 부담</text>
<text x="792" y="376" font-size="16" font-weight="700" fill="#1d2a3a">C조건은 선적 뒤 위험이 매수인,</text>
<text x="792" y="402" font-size="16" font-weight="500" fill="#1d2a3a">비용 부담은 계약 문구에 따름</text>
<text x="792" y="428" font-size="16" font-weight="500" fill="#1d2a3a">D조건은 목적지까지 매도인 쪽</text>
<text x="1218" y="376" font-size="16" font-weight="700" fill="#1d2a3a">ICC 제12조: 담보 위험으로 끊긴</text>
<text x="1218" y="402" font-size="16" font-weight="500" fill="#1d2a3a">경우만, 전쟁 원인이면 면책(제6조)</text>
<text x="1218" y="428" font-size="16" font-weight="500" fill="#1d2a3a">전쟁약관에는 계속운송비 조항 없음</text>
<rect x="48" y="466" width="1576" height="124" rx="10" fill="#ffffff" stroke="#dbe2ea" stroke-width="1.5"/>
<text x="64" y="514" font-size="19" font-weight="800" fill="#1d2a3a">늦게 도착한 손해</text>
<text x="64" y="542" font-size="16" font-weight="600" fill="#5f6b78">납기 위약·시세 하락</text>
<text x="366" y="508" font-size="16" font-weight="700" fill="#1d2a3a">합리적 이로·약관상 경로 변경은</text>
<text x="366" y="534" font-size="16" font-weight="500" fill="#1d2a3a">위반이 아님(헤이그-비스비 제4조</text>
<text x="366" y="560" font-size="16" font-weight="500" fill="#1d2a3a">제4항, 상법 제796조 제8호)</text>
<text x="792" y="508" font-size="16" font-weight="700" fill="#1d2a3a">운임이 올랐다는 것만으로</text>
<text x="792" y="534" font-size="16" font-weight="500" fill="#1d2a3a">계약은 끝나지 않음(Tsakiroglou)</text>
<text x="792" y="560" font-size="16" font-weight="500" fill="#1d2a3a">면책은 불가항력 조항·CISG 제79조</text>
<text x="1218" y="508" font-size="16" font-weight="700" fill="#1d2a3a">지연으로 생긴 손해는 면책</text>
<text x="1218" y="534" font-size="16" font-weight="500" fill="#1d2a3a">(ICC 제4.5조)</text>
<text x="1218" y="560" font-size="16" font-weight="500" fill="#1d2a3a">화물은 이로 중에도 계속 담보(제8.3조)</text>
<rect x="48" y="598" width="1576" height="124" rx="10" fill="#f3f6f9" stroke="#dbe2ea" stroke-width="1.5"/>
<text x="64" y="646" font-size="19" font-weight="800" fill="#1d2a3a">공동해손 분담</text>
<text x="64" y="674" font-size="16" font-weight="600" fill="#5f6b78">피난항 입항·구조</text>
<text x="366" y="640" font-size="16" font-weight="700" fill="#1d2a3a">B/L 공동해손 조항이 정한</text>
<text x="366" y="666" font-size="16" font-weight="500" fill="#1d2a3a">요크-앤트워프 규칙으로 정산</text>
<text x="366" y="692" font-size="16" font-weight="500" fill="#1d2a3a">담보를 내야 화물 인도</text>
<text x="792" y="640" font-size="16" font-weight="700" fill="#1d2a3a">화물 이해관계자가 분담</text>
<text x="792" y="666" font-size="16" font-weight="500" fill="#1d2a3a">누가 화물 주인인지는</text>
<text x="792" y="692" font-size="16" font-weight="500" fill="#1d2a3a">조건별 위험 이전 시점이 가름</text>
<text x="1218" y="640" font-size="16" font-weight="700" fill="#1d2a3a">ICC 제2조로 분담금 보상</text>
<text x="1218" y="666" font-size="16" font-weight="500" fill="#1d2a3a">(면책 원인으로 생긴 것 제외)</text>
<text x="1218" y="692" font-size="16" font-weight="500" fill="#1d2a3a">보험사 보증장으로 담보 제공</text>
<rect x="48" y="730" width="1576" height="124" rx="10" fill="#ffffff" stroke="#dbe2ea" stroke-width="1.5"/>
<text x="64" y="778" font-size="19" font-weight="800" fill="#1d2a3a">Demurrage·Detention</text>
<text x="64" y="806" font-size="16" font-weight="600" fill="#5f6b78">터미널 보관료</text>
<text x="366" y="772" font-size="16" font-weight="700" fill="#1d2a3a">선사 tariff와 그 항구의</text>
<text x="366" y="798" font-size="16" font-weight="500" fill="#1d2a3a">무료 기간에 따름</text>
<text x="366" y="824" font-size="16" font-weight="500" fill="#1d2a3a">대체 항구는 무료 기간이 다를 수 있음</text>
<text x="792" y="785" font-size="16" font-weight="700" fill="#1d2a3a">누가 낼지 계약서에 쓰지 않으면</text>
<text x="792" y="811" font-size="16" font-weight="500" fill="#1d2a3a">다툼이 됨(인코텀스에 항목 없음)</text>
<text x="1218" y="798" font-size="16" font-weight="700" fill="#1d2a3a">담보 대상 아님</text>
<line x1="770" y1="202" x2="770" y2="854" stroke="#dbe2ea" stroke-width="1.5"/>
<line x1="1196" y1="202" x2="1196" y2="854" stroke="#dbe2ea" stroke-width="1.5"/>
<line x1="344" y1="202" x2="344" y2="854" stroke="#c9d2dc" stroke-width="2"/>
<text x="48" y="882" font-size="15" font-weight="600" fill="#5f6b78">각 칸은 원칙입니다. 실제 결과는 B/L·House B/L 약관, 매매계약 문구, 보험증권 조건이 정합니다. 할증료 금액은 싣지 않았습니다.</text>
</svg>