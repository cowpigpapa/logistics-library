<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="24" y="22" width="1624" height="897" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="48" y="66" font-size="26" font-weight="800" fill="#1d2a3a">홍해에서 호르무즈까지: 사건과 계약 규칙이 함께 움직인 순서</text>
<text x="48" y="96" font-size="16" font-weight="600" fill="#5f6b78">점 사이 간격은 시간에 비례하지 않습니다. 파랑은 해역 사건, 초록은 규제·표준 조항, 빨강은 판결, 주황은 선사 공지입니다.</text>
<line x1="70" y1="430" x2="1600" y2="430" stroke="#5f6b78" stroke-width="4" stroke-linecap="round"/>
<circle cx="190" cy="430" r="11" fill="#1f6fd1" stroke="#ffffff" stroke-width="3"/>
<line x1="190" y1="418" x2="190" y2="360" stroke="#1f6fd1" stroke-width="2.5"/>
<rect x="48" y="236" width="284" height="124" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="64" y="268" font-size="18" font-weight="800" fill="#1f6fd1">2023. 11. 19.</text>
<text x="64" y="300" font-size="16" font-weight="700" fill="#1d2a3a">후티가 상선 나포,</text>
<text x="64" y="328" font-size="15" font-weight="500" fill="#1d2a3a">이후 홍해 상선 공격 이어짐</text>
<circle cx="352" cy="430" r="11" fill="#1f6fd1" stroke="#ffffff" stroke-width="3"/>
<line x1="352" y1="442" x2="352" y2="500" stroke="#1f6fd1" stroke-width="2.5"/>
<rect x="210" y="500" width="284" height="124" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="226" y="532" font-size="18" font-weight="800" fill="#1f6fd1">2023. 12.~</text>
<text x="226" y="564" font-size="16" font-weight="700" fill="#1d2a3a">컨테이너선 희망봉 우회,</text>
<text x="226" y="592" font-size="15" font-weight="500" fill="#1d2a3a">우회·긴급 할증 등장</text>
<circle cx="513" cy="430" r="11" fill="#1f6fd1" stroke="#ffffff" stroke-width="3"/>
<line x1="513" y1="418" x2="513" y2="360" stroke="#1f6fd1" stroke-width="2.5"/>
<rect x="371" y="236" width="284" height="124" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="387" y="268" font-size="18" font-weight="800" fill="#1f6fd1">2024. 1. 10.</text>
<text x="387" y="300" font-size="16" font-weight="700" fill="#1d2a3a">유엔 안보리 결의 2722호</text>
<text x="387" y="328" font-size="15" font-weight="500" fill="#1d2a3a">후티 공격 규탄</text>
<circle cx="674" cy="430" r="11" fill="#1f8a5b" stroke="#ffffff" stroke-width="3"/>
<line x1="674" y1="442" x2="674" y2="500" stroke="#1f8a5b" stroke-width="2.5"/>
<rect x="532" y="500" width="284" height="124" rx="12" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5"/>
<text x="548" y="532" font-size="18" font-weight="800" fill="#1f8a5b">2024. 1. 12.</text>
<text x="548" y="564" font-size="16" font-weight="700" fill="#1d2a3a">미국 FMC 홍해 할증 권고</text>
<text x="548" y="592" font-size="15" font-weight="500" fill="#1d2a3a">화물 수령 때 유효한 tariff만</text>
<circle cx="836" cy="430" r="11" fill="#d9482b" stroke="#ffffff" stroke-width="3"/>
<line x1="836" y1="418" x2="836" y2="360" stroke="#d9482b" stroke-width="2.5"/>
<rect x="694" y="236" width="284" height="124" rx="12" fill="#ffffff" stroke="#d9482b" stroke-width="2.5"/>
<text x="710" y="268" font-size="18" font-weight="800" fill="#d9482b">2024. 1. 17.</text>
<text x="710" y="300" font-size="16" font-weight="700" fill="#1d2a3a">영국 대법원 The Polar</text>
<text x="710" y="328" font-size="15" font-weight="500" fill="#1d2a3a">해적 몸값도 화주가 공동해손 분담</text>
<circle cx="998" cy="430" r="11" fill="#1f8a5b" stroke="#ffffff" stroke-width="3"/>
<line x1="998" y1="442" x2="998" y2="500" stroke="#1f8a5b" stroke-width="2.5"/>
<rect x="856" y="500" width="284" height="124" rx="12" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5"/>
<text x="872" y="532" font-size="18" font-weight="800" fill="#1f8a5b">2025. 4.</text>
<text x="872" y="564" font-size="16" font-weight="700" fill="#1d2a3a">BIMCO 전쟁 위험 조항 2025년판</text>
<text x="872" y="592" font-size="15" font-weight="500" fill="#1d2a3a">우회 시 운임을 시간·비용으로 조정</text>
<circle cx="1159" cy="430" r="11" fill="#1f6fd1" stroke="#ffffff" stroke-width="3"/>
<line x1="1159" y1="418" x2="1159" y2="360" stroke="#1f6fd1" stroke-width="2.5"/>
<rect x="1017" y="236" width="284" height="124" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="1033" y="268" font-size="18" font-weight="800" fill="#1f6fd1">2026. 2. 28.</text>
<text x="1033" y="300" font-size="16" font-weight="700" fill="#1d2a3a">호르무즈 해협 분쟁 시작</text>
<text x="1033" y="328" font-size="15" font-weight="500" fill="#1d2a3a">(IMO 발표 기준)</text>
<circle cx="1320" cy="430" r="11" fill="#e4572e" stroke="#ffffff" stroke-width="3"/>
<line x1="1320" y1="442" x2="1320" y2="500" stroke="#e4572e" stroke-width="2.5"/>
<rect x="1178" y="500" width="284" height="124" rx="12" fill="#ffffff" stroke="#e4572e" stroke-width="2.5"/>
<text x="1194" y="532" font-size="18" font-weight="800" fill="#e4572e">2026. 4. 9.</text>
<text x="1194" y="564" font-size="16" font-weight="700" fill="#1d2a3a">한 대형 선사 공지</text>
<text x="1194" y="592" font-size="15" font-weight="500" fill="#1d2a3a">완주·반송·목적지 변경 중 선택</text>
<circle cx="1482" cy="430" r="11" fill="#1f6fd1" stroke="#ffffff" stroke-width="3"/>
<line x1="1482" y1="418" x2="1482" y2="360" stroke="#1f6fd1" stroke-width="2.5"/>
<rect x="1340" y="236" width="284" height="124" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="1356" y="268" font-size="18" font-weight="800" fill="#1f6fd1">2026. 6. 15.</text>
<text x="1356" y="300" font-size="16" font-weight="700" fill="#1d2a3a">IMO, 미국·이란 평화 합의 환영</text>
<text x="1356" y="328" font-size="15" font-weight="500" fill="#1d2a3a">선원 대피 계획 추진</text>
<rect x="48" y="760" width="1572" height="124" rx="12" fill="#eef4fb" stroke="#c9d2dc" stroke-width="1.5"/>
<text x="68" y="796" font-size="18" font-weight="800" fill="#1d2a3a">읽는 법</text>
<text x="68" y="828" font-size="16" font-weight="500" fill="#1d2a3a">해역 사건이 생기면 선사는 B/L 약관의 장애 조항과 할증료로, 용선 시장은 BIMCO 전쟁 위험 조항으로, 규제 당국은 공시·적용일 규칙으로 비용을 나눕니다.</text>
<text x="68" y="856" font-size="16" font-weight="500" fill="#1d2a3a">할증료 금액은 계속 바뀌므로 싣지 않았습니다. 금액과 적용일은 선사 공지와 tariff에서 확인합니다.</text>
</svg>