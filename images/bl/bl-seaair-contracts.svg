<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5f6b78"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f6fd1"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d9482b"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f8a5b"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="24" y="22" width="1624" height="897" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="48" y="66" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">Sea &amp; Air 계약의 세 가지 짜임: 화주가 청구할 상대가 달라진다</text>
<text x="48" y="96" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="start">화살표는 운송을 맡기는 쪽에서 맡는 쪽으로 향합니다. 서류 이름보다 누가 자기 이름으로 구간을 맡았는지가 책임을 정합니다.</text>
<rect x="48" y="118" width="1572" height="204" rx="12" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5"/>
<text x="68" y="162" font-size="30" font-weight="800" fill="#e4572e" text-anchor="start">A</text>
<text x="68" y="194" font-size="16" font-weight="800" fill="#1d2a3a" text-anchor="start">구간별 따로 계약</text>
<rect x="48" y="338" width="1572" height="204" rx="12" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5"/>
<text x="68" y="382" font-size="30" font-weight="800" fill="#e4572e" text-anchor="start">B</text>
<text x="68" y="414" font-size="16" font-weight="800" fill="#1d2a3a" text-anchor="start">한 포워더가 전 구간</text>
<rect x="48" y="558" width="1572" height="204" rx="12" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5"/>
<text x="68" y="602" font-size="30" font-weight="800" fill="#e4572e" text-anchor="start">C</text>
<text x="68" y="634" font-size="16" font-weight="800" fill="#1d2a3a" text-anchor="start">항공 구간만 한국 포워더</text>
<rect x="250" y="180" width="180" height="80" rx="12" fill="#ffffff" stroke="#5f6b78" stroke-width="2.5"/>
<text x="340.0" y="214.0" font-size="18" font-weight="800" fill="#1d2a3a" text-anchor="middle">화주</text>
<text x="340.0" y="240.0" font-size="15" font-weight="500" fill="#5f6b78" text-anchor="middle">(또는 대리인)</text>
<rect x="560" y="134" width="320" height="76" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="720.0" y="166.0" font-size="18" font-weight="800" fill="#1d2a3a" text-anchor="middle">해상 운송인</text>
<text x="720.0" y="192.0" font-size="15" font-weight="500" fill="#5f6b78" text-anchor="middle">선사 또는 B/L 발행 포워더</text>
<rect x="560" y="230" width="320" height="76" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="720.0" y="262.0" font-size="18" font-weight="800" fill="#1d2a3a" text-anchor="middle">항공 운송인</text>
<text x="720.0" y="288.0" font-size="15" font-weight="500" fill="#5f6b78" text-anchor="middle">항공사 또는 AWB 발행 포워더</text>
