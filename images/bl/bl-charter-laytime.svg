<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <pattern id="hatchGrey" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#e3e8ee"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#a9b4c0" stroke-width="3"/>
    </pattern>
    <pattern id="hatchRain" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#d9482b"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#f3b3a5" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="1672" height="941" fill="#ffffff"/>
  <text x="56" y="58" font-size="30" font-weight="700" fill="#1d2a3a">정박기간과 체선 시간을 세는 법(가상 예시)</text>
  <text x="56" y="90" font-size="18" fill="#5f6b78">정박기간 3일, 일요일·공휴일 제외(SHEX), 기상 작업일 조건. 기산 시각은 상법 제829조 제2항(오전 통지 → 그날 13시)을 적용했습니다.</text>

  <!-- timeline panel -->
  <rect x="40" y="110" width="1592" height="452" rx="16" fill="#fbfcfd" stroke="#c9d2dc"/>

  <!-- day bands: x = 130 + 10*h, h from Thu 06:00 -->
  <g font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="middle">
    <rect x="130" y="130" width="180" height="36" fill="#eef2f6"/>
    <text x="220" y="154">목</text>
    <rect x="310" y="130" width="240" height="36" fill="#ffffff"/>
    <text x="430" y="154">금</text>
    <rect x="550" y="130" width="240" height="36" fill="#eef2f6"/>
    <text x="670" y="154">토</text>
    <rect x="790" y="130" width="240" height="36" fill="#ffffff"/>
    <text x="910" y="154">일</text>
    <rect x="1030" y="130" width="240" height="36" fill="#eef2f6"/>
    <text x="1150" y="154">월</text>
    <rect x="1270" y="130" width="240" height="36" fill="#ffffff"/>
    <text x="1390" y="154">화</text>
    <rect x="1510" y="130" width="60" height="36" fill="#eef2f6"/>
    <text x="1540" y="154">수</text>
  </g>
  <g stroke="#c9d2dc" stroke-width="1">
    <line x1="310" y1="130" x2="310" y2="410"/>
    <line x1="550" y1="130" x2="550" y2="410"/>
    <line x1="790" y1="130" x2="790" y2="410"/>
    <line x1="1030" y1="130" x2="1030" y2="410"/>
    <line x1="1270" y1="130" x2="1270" y2="410"/>
    <line x1="1510" y1="130" x2="1510" y2="410"/>
  </g>
  <line x1="130" y1="190" x2="1570" y2="190" stroke="#5f6b78" stroke-width="2"/>

  <!-- lane labels -->
  <g font-size="18" font-weight="700" fill="#1d2a3a">
    <text x="56" y="252">정박기간</text>
    <text x="56" y="276" font-size="15" font-weight="400" fill="#5f6b78">(Laytime)</text>
    <text x="56" y="346">체선</text>
    <text x="56" y="370" font-size="15" font-weight="400" fill="#5f6b78">(demurrage)</text>
  </g>

  <!-- laytime lane -->
  <rect x="200" y="232" width="190" height="50" fill="#1f8a5b"/>
  <rect x="390" y="232" width="60" height="50" fill="url(#hatchGrey)" stroke="#a9b4c0"/>
  <rect x="450" y="232" width="340" height="50" fill="#1f8a5b"/>
  <rect x="790" y="232" width="240" height="50" fill="url(#hatchGrey)" stroke="#a9b4c0"/>
  <rect x="1030" y="232" width="190" height="50" fill="#1f8a5b"/>
  <g font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">
    <text x="295" y="263">19시간</text>
    <text x="620" y="263">34시간</text>
    <text x="1125" y="263">19시간</text>
  </g>
  <text x="910" y="263" font-size="17" font-weight="700" fill="#1d2a3a" text-anchor="middle">일요일: 셈에서 뺌</text>

  <!-- demurrage lane -->
  <rect x="1220" y="326" width="150" height="50" fill="#d9482b"/>
  <rect x="1370" y="326" width="60" height="50" fill="url(#hatchRain)"/>
  <rect x="1430" y="326" width="110" height="50" fill="#d9482b"/>
  <text x="1295" y="357" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">32시간</text>

  <!-- event markers -->
  <g stroke="#1d2a3a" stroke-width="2" stroke-dasharray="5 4">
    <line x1="175" y1="196" x2="175" y2="420"/>
    <line x1="1220" y1="196" x2="1220" y2="420"/>
    <line x1="1540" y1="196" x2="1540" y2="420"/>
  </g>
  <circle cx="175" cy="190" r="7" fill="#1f6fd1"/>
  <circle cx="200" cy="190" r="7" fill="#1f8a5b"/>
  <circle cx="1220" cy="190" r="7" fill="#d9482b"/>
  <circle cx="1540" cy="190" r="7" fill="#1d2a3a"/>

  <!-- event labels -->
  <g font-size="17" fill="#1d2a3a">
    <text x="140" y="446" font-weight="700">목 10:30 NOR(오전 통지)</text>
    <text x="140" y="470">→ 그날 13:00부터 정박기간 기산</text>
    <text x="400" y="312" font-size="15" fill="#5f6b78">금 08~14시 비</text>
    <text x="400" y="330" font-size="15" fill="#5f6b78">→ 정박기간에서 뺌</text>
    <text x="1220" y="446" font-weight="700" text-anchor="middle">월 19:00 정박기간 3일 끝</text>
    <text x="1220" y="470" text-anchor="middle">이때부터 체선</text>
    <text x="1400" y="400" font-size="15" fill="#d9482b" text-anchor="middle">화 10~16시 비: 체선 중이라 그대로 셈</text>
    <text x="1600" y="446" font-weight="700" text-anchor="end">수 03:00 양하 완료</text>
  </g>

  <!-- sums -->
  <rect x="140" y="494" width="620" height="50" rx="10" fill="#e8f4ee" stroke="#1f8a5b"/>
  <text x="160" y="526" font-size="18" fill="#1d2a3a"><tspan font-weight="700">정박기간</tspan> 19 + 34 + 19 = 72시간(3일). 비와 일요일은 뺍니다.</text>
  <rect x="890" y="494" width="710" height="50" rx="10" fill="#fbe9e4" stroke="#d9482b"/>
  <text x="910" y="526" font-size="18" fill="#1d2a3a"><tspan font-weight="700">체선</tspan> 월 19:00 ~ 수 03:00 = 32시간(1일 8시간) × 계약의 체선료 일당</text>

  <!-- lower boxes -->
  <rect x="40" y="586" width="512" height="334" rx="16" fill="#fbfcfd" stroke="#c9d2dc"/>
  <rect x="580" y="586" width="512" height="334" rx="16" fill="#fbfcfd" stroke="#c9d2dc"/>
  <rect x="1120" y="586" width="512" height="334" rx="16" fill="#fbfcfd" stroke="#c9d2dc"/>

  <g font-size="21" font-weight="700">
    <text x="64" y="626" fill="#1f6fd1">NOR이 무효이면</text>
    <text x="604" y="626" fill="#1f8a5b">조출료(despatch)</text>
    <text x="1144" y="626" fill="#d9482b">컨테이너 Demurrage와 다른 점</text>
  </g>
  <g font-size="17" fill="#1d2a3a">
    <text x="64" y="664">배가 계약이 정한 곳에 도착하기 전이나</text>
    <text x="64" y="690">준비되지 않은 상태에서 낸 NOR은 무효입니다.</text>
    <text x="64" y="724">다시 내지 않으면 하역을 시작해도</text>
    <text x="64" y="750">정박기간이 저절로 시작되지 않습니다</text>
    <text x="64" y="776">(동의·권리 포기·금반언이 없을 때).</text>
    <text x="64" y="818" font-weight="700">Trans Trade v Sebat(영국, 2026)</text>
    <text x="64" y="844">도선사 승선 지점에서 낸 NOR을 다시 내지 않아</text>
    <text x="64" y="870">양하항 체선료 84만 달러 인정이 취소됨</text>

    <text x="604" y="664">정박기간 전에 하역을 끝내면 선주가</text>
    <text x="604" y="690">절약한 시간만큼 용선자에게 지급합니다.</text>
    <text x="604" y="728" font-weight="700">예: 토 20:00에 양하를 끝냈다면</text>
    <text x="604" y="754">정박기간 끝(월 19:00)까지 남은 시간은</text>
    <text x="604" y="784">· 근무시간 절약 기준: 일요일 빼고</text>
    <text x="624" y="808">4 + 19 = 23시간</text>
    <text x="604" y="838">· 전체 시간 절약 기준: 일요일 포함</text>
    <text x="624" y="862">4 + 24 + 19 = 47시간</text>
    <text x="604" y="896" font-size="15" fill="#5f6b78">어느 기준인지 계약에 적습니다(정의집 32·33).</text>

    <text x="1144" y="664"><tspan font-weight="700">무엇</tspan>  선박의 대기 ↔ 컨테이너 장비 사용</text>
    <text x="1144" y="702"><tspan font-weight="700">누가</tspan>  선주–용선자 ↔ 선사–화주</text>
    <text x="1144" y="740"><tspan font-weight="700">근거</tspan>  용선계약·상법 제829조 ↔ 선사 tariff</text>
    <text x="1144" y="778"><tspan font-weight="700">시작</tspan>  유효한 NOR 뒤 정박기간 ↔ 무료 기간 뒤</text>
    <text x="1144" y="816"><tspan font-weight="700">단위</tspan>  선박 한 척의 하루 ↔ 컨테이너 한 대의 하루</text>
    <text x="1144" y="862" font-size="15" fill="#5f6b78">같은 영어 단어를 쓰지만 서로 다른 제도입니다.</text>
    <text x="1144" y="886" font-size="15" fill="#5f6b78">정박기간 예외는 체선 중에는 적용하지 않습니다(정의집 30).</text>
  </g>
</svg>
