<text x="110.0" y="602.0" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">본선 적재 표기의 날짜가 선적일</text>
<text x="110.0" y="626.0" font-size="14" font-weight="600" fill="#d9482b" text-anchor="start">하자 예: 기한 경과, 선박명·서명 없는 적재 표기(93다15632)</text>
