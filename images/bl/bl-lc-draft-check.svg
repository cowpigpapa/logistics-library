<text x="82.0" y="391.8" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
<text x="110.0" y="392.0" font-size="18" font-weight="800" fill="#123d70" text-anchor="start">44A 수탁지 · 44E 적재항</text>
<text x="110.0" y="418.0" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">Place of Receipt, Port of Loading</text>
<text x="110.0" y="442.0" font-size="14" font-weight="600" fill="#d9482b" text-anchor="start">하자 예: 수탁지가 있는데 적재 표기에 적재항·선명 없음</text>
