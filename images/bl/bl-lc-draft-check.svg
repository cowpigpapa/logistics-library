<rect width="1672" height="941" fill="#ffffff"/>
<rect x="24" y="22" width="1624" height="897" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="48.0" y="66.0" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">B/L 초안을 신용장과 맞대어 보는 항목</text>
<text x="48.0" y="96.0" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="start">왼쪽 신용장(SWIFT MT 700)의 난과 오른쪽 B/L 칸에 같은 번호를 붙였습니다. 빨간 글씨는 판결과 실무에서 자주 문제 된 하자의 예입니다.</text>
