<text x="110.0" y="484.0" font-size="18" font-weight="800" fill="#123d70" text-anchor="start">44F 양륙항 · 44B 최종 목적지</text>
<text x="110.0" y="510.0" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">Port of Discharge, Place of Delivery</text>
<text x="110.0" y="534.0" font-size="14" font-weight="600" fill="#d9482b" text-anchor="start">하자 예: 신용장과 다른 항구, 지역 이름만 적음</text>
