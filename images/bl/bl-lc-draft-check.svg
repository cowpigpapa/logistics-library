<rect x="48.0" y="148.0" width="790.0" height="16.0" rx="0" fill="#123d70" stroke="#123d70" stroke-width="1.5"/>
<text x="68.0" y="149.0" font-size="18" font-weight="800" fill="#ffffff" text-anchor="start">신용장(SWIFT MT 700)에서 볼 곳</text>
<circle cx="82.0" cy="202.0" r="15" fill="#e4572e"/>
<text x="82.0" y="207.8" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
<text x="110.0" y="208.0" font-size="18" font-weight="800" fill="#123d70" text-anchor="start">46A 요구서류</text>
<text x="110.0" y="234.0" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">B/L 종류·원본 수(full set, 2/3 등)·운임 표시·clean on board</text>
<text x="110.0" y="258.0" font-size="14" font-weight="600" fill="#d9482b" text-anchor="start">하자 예: 원본 수 불일치, 용선계약용 양식(2012다113438)</text>
<path d="M68 268 H818" stroke="#c9d2dc" stroke-width="1" fill="none"/>
<circle cx="82.0" cy="294.0" r="15" fill="#e4572e"/>
<text x="82.0" y="299.8" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
<text x="110.0" y="300.0" font-size="18" font-weight="800" fill="#123d70" text-anchor="start">46A 수하인·통지처 문구</text>
<text x="110.0" y="326.0" font-size="15" font-weight="500" fill="#1d2a3a" text-anchor="start">To order of 개설은행 / To order(백지배서) / notify 개설의뢰인</text>
<text x="110.0" y="350.0" font-size="14" font-weight="600" fill="#d9482b" text-anchor="start">하자 예: 은행명 철자 다름, 지시식 대신 기명식, 통지처 주소 다름</text>
