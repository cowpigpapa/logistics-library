<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5f6b78"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="24" y="22" width="1624" height="897" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="48" y="66" font-size="26" font-weight="800" fill="#1d2a3a">운송 중 장애가 생겼을 때 운송인이 고를 수 있는 길과 비용의 행방</text>
<text x="48" y="96" font-size="16" font-weight="600" fill="#5f6b78">컨테이너 선사 B/L 약관과 FIATA FBL(1992)의 공통 구조를 단순화했습니다. 실제 권리는 그 B/L의 약관 문구가 정합니다.</text>
<rect x="48" y="250" width="300" height="170" rx="12" fill="#ffffff" stroke="#5f6b78" stroke-width="2.5"/>
<text x="66" y="286" font-size="19" font-weight="800" fill="#1d2a3a">운송 중 장애</text>
<text x="66" y="318" font-size="16" font-weight="500" fill="#1d2a3a">전쟁 위험·해협 봉쇄</text>
<text x="66" y="344" font-size="16" font-weight="500" fill="#1d2a3a">파업·항만 폐쇄</text>
<text x="66" y="370" font-size="16" font-weight="500" fill="#1d2a3a">운송인이 합리적 노력으로</text>
<text x="66" y="396" font-size="16" font-weight="500" fill="#1d2a3a">피할 수 없는 사정</text>
<rect x="410" y="250" width="370" height="170" rx="12" fill="#ffffff" stroke="#e4572e" stroke-width="3"/>
<text x="428" y="286" font-size="19" font-weight="800" fill="#e4572e">질문 1</text>
<text x="428" y="318" font-size="16" font-weight="500" fill="#1d2a3a">B/L에 자유 약관·장애 조항이</text>
<text x="428" y="344" font-size="16" font-weight="500" fill="#1d2a3a">있고, 이 사정이 그 범위인가</text>
<text x="428" y="370" font-size="16" font-weight="500" fill="#1d2a3a">(약관 해석은 계약의 주된 목적에</text>
<text x="428" y="396" font-size="16" font-weight="500" fill="#1d2a3a">비추어 좁게 읽힐 수 있음)</text>
<path d="M348 335 L404 335" stroke="#5f6b78" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<rect x="860" y="118" width="760" height="124" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="878" y="158" font-size="19" font-weight="800" fill="#1f6fd1">(a) 다른 경로로 계약 목적지까지 운송</text>
<text x="878" y="188" font-size="16" font-weight="500" fill="#1d2a3a">운송인이 정하는 추가 운임을 청구할 수 있음</text>
<text x="878" y="214" font-size="16" font-weight="500" fill="#1d2a3a">약관상 계약 운송으로 보아 이로가 아님</text>
<rect x="860" y="256" width="760" height="124" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="878" y="296" font-size="19" font-weight="800" fill="#1f6fd1">(b) 운송을 멈추고 보관한 뒤 이어서 운송</text>
<text x="878" y="326" font-size="16" font-weight="500" fill="#1d2a3a">추가 운임과 보관 비용을 청구할 수 있음, 멈추는 기간은 약속하지 않음</text>
<text x="878" y="352" font-size="16" font-weight="500" fill="#1d2a3a">나중에 (c)로 바꿀 권리를 남겨 둠</text>
<rect x="860" y="394" width="760" height="150" rx="12" fill="#ffffff" stroke="#d9482b" stroke-width="2.5"/>
<text x="878" y="434" font-size="19" font-weight="800" fill="#d9482b">(c) 운송을 끝내고 안전한 항구에 화물을 내려놓음</text>
<text x="878" y="464" font-size="16" font-weight="500" fill="#1d2a3a">그곳에서 인도한 것으로 보고 운송인 책임은 끝남</text>
<text x="878" y="490" font-size="16" font-weight="500" fill="#1d2a3a">운임은 전액 그대로(이미 낸 운임은 돌려받지 못함)</text>
<text x="878" y="516" font-size="16" font-weight="500" fill="#1d2a3a">추가 비용·계속운송은 화주(Merchant) 몫</text>
<path d="M780 300 L820 300 L820 180 L854 180" stroke="#1f6fd1" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<text x="790" y="290" font-size="16" font-weight="800" fill="#1f6fd1">예</text>
<path d="M820 318 L854 318" stroke="#1f6fd1" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M820 300 L820 469 L854 469" stroke="#1f6fd1" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<rect x="410" y="600" width="370" height="150" rx="12" fill="#ffffff" stroke="#e4572e" stroke-width="3"/>
<text x="428" y="641" font-size="19" font-weight="800" fill="#e4572e">질문 2(약관 밖의 경로 변경)</text>
<text x="428" y="672" font-size="15" font-weight="500" fill="#1d2a3a">인명·재산 구조, 또는</text>
<text x="428" y="697" font-size="15" font-weight="500" fill="#1d2a3a">합리적(정당한) 이로인가</text>
<text x="428" y="722" font-size="15" font-weight="500" fill="#1d2a3a">헤이그-비스비 제4조 제4항, 상법 제796조 제8호</text>
<path d="M595 420 L595 594" stroke="#5f6b78" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<text x="606" y="520" font-size="16" font-weight="800" fill="#5f6b78">아니오</text>
<rect x="860" y="578" width="760" height="86" rx="12" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5"/>
<text x="878" y="612" font-size="19" font-weight="800" fill="#1f8a5b">예 → 위반이 아님</text>
<text x="878" y="642" font-size="16" font-weight="500" fill="#1d2a3a">그 이로로 생긴 멸실·손상은 배상 책임이 없음</text>
<rect x="860" y="676" width="760" height="110" rx="12" fill="#ffffff" stroke="#5f6b78" stroke-width="2.5"/>
<text x="878" y="710" font-size="19" font-weight="800" fill="#5f6b78">아니오 → 부당 이로(계약 위반)</text>
<text x="878" y="740" font-size="15" font-weight="500" fill="#1d2a3a">운송인이 배상 책임을 짐. 면책 조항·책임 한도까지 잃는지는</text>
<text x="878" y="766" font-size="15" font-weight="500" fill="#1d2a3a">영국에서도 확정되지 않았다고 영국 항소법원이 적음(2003)</text>
<path d="M780 640 L854 621" stroke="#1f8a5b" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M780 710 L854 731" stroke="#5f6b78" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<rect x="48" y="806" width="1572" height="92" rx="12" fill="#eef4fb" stroke="#c9d2dc" stroke-width="1.5"/>
<text x="68" y="842" font-size="18" font-weight="800" fill="#1d2a3a">어느 길이든 화주 쪽에서 바로 할 일</text>
<text x="68" y="874" font-size="16" font-weight="500" fill="#1d2a3a">선사 공지·청구 근거 보관 · 보험사에 즉시 통지하고 담보 연장 요청(ICC 제9조) · House B/L 약관과 Master B/L 약관 대조 · 매매 상대방에 장애 통지(CISG 제79조 제4항)</text>
</svg>