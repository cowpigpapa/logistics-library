<rect x="221.0" y="118.0" width="228.3" height="74.0" rx="8" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="1.5"/>
<text x="335.2" y="150.0" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">제19조</text>
<text x="335.2" y="176.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">복합운송서류</text>
