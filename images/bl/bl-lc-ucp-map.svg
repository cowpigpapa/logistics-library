<text x="48.0" y="66.0" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">UCP 600 운송서류 조항 지도: 서류 이름이 아니라 덮는 운송으로 정해진다</text>
<text x="48.0" y="96.0" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="start">조항 요지를 단순화했습니다. 개별 신용장은 이 규정을 바꾸거나 배제할 수 있으므로 실제 기준은 신용장 문언입니다.</text>
