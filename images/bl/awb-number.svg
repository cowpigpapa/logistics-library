<text x="1381.0" y="394" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle"></text>
<rect x="350" y="470" width="1190" height="150" fill="#ffffff" stroke="#d9482b" stroke-width="2.5" rx="14"/>
<text x="380" y="518" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="start">체크 디지트 = 일련번호 7자리를 7로 나눈 나머지(가중치 없는 모듈러스 7)</text>
<text x="380" y="578" font-size="32" font-weight="800" fill="#d9482b" text-anchor="start">1234567 ÷ 7 = 176366 … 나머지 5</text>
<text x="940" y="578" font-size="28" font-weight="800" fill="#1d2a3a" text-anchor="start">→ 체크 디지트 5</text>
<rect x="350" y="660" width="570" height="180" fill="#ffffff" stroke="#1d2a3a" stroke-width="2.5" rx="12"/>
<text x="366" y="698" font-size="24" font-weight="800" fill="#1d2a3a" text-anchor="start">걸러 주는 것</text>
<text x="366" y="733" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">숫자 하나를 잘못 옮겨 적으면</text>
<text x="366" y="762" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">대부분 여기서 걸림</text>
<text x="366" y="791" font-size="21" font-weight="500" fill="#d9482b" text-anchor="start">맞는다고 실제 발행된 번호라는 뜻은 아님</text>
<rect x="970" y="660" width="570" height="180" fill="#ffffff" stroke="#1d2a3a" stroke-width="2.5" rx="12"/>
<text x="986" y="698" font-size="24" font-weight="800" fill="#1d2a3a" text-anchor="start">House AWB 번호</text>
<text x="986" y="733" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">IATA 공통 규칙 없이 포워더가 정함</text>
<text x="986" y="762" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">항공사 사이트 조회는 MAWB 번호로</text>
<text x="986" y="791" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">미국 세관 규정: 하우스 번호 12자리까지</text>
