<text x="483.0" y="394" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">발행 항공사 코드(예: 180)</text>
<path d="M670 300 q0 18 18 18 L975.0 318 q12 0 12 16 q0 -16 12 -16 L1286 318 q18 0 18 -18" fill="none" stroke="#1d2a3a" stroke-width="3"/>
<text x="987.0" y="366" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="middle">4~10 일련번호 7자리</text>
<text x="987.0" y="394" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">항공사가 매김</text>
