<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs>
<marker id="bp-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker>
<marker id="bp-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker>
<marker id="bp-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker>
</defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="24" y="24" width="1624" height="893" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="60" y="76" font-size="29" font-weight="800" fill="#1d2a3a">운송인이 도산하면: 회생·파산 절차와 채권의 자리</text>
<text x="60" y="110" font-size="18" font-weight="600" fill="#5f6b78">채무자 회생 및 파산에 관한 법률(시행 2026. 10. 2.) 기준. 괄호는 조문 번호입니다</text>

<!-- Left: rehabilitation flow -->
<text x="60" y="158" font-size="21" font-weight="800" fill="#1f6fd1">회생절차의 흐름</text>

<rect x="60" y="174" width="540" height="74" rx="10" fill="#ffffff" stroke="#1d2a3a" stroke-width="2"/>
<text x="80" y="206" font-size="19" font-weight="800" fill="#1d2a3a">① 회생절차 개시 신청 (제34조)</text>
<text x="80" y="234" font-size="16" font-weight="500" fill="#34475c">변제기 채무를 갚으면 사업 계속에 현저한 지장이 있을 때 등</text>
<line x1="330" y1="248" x2="330" y2="270" stroke="#1d2a3a" stroke-width="2.5" marker-end="url(#bp-ink)"/>

<rect x="60" y="274" width="540" height="100" rx="10" fill="#eef4fb" stroke="#1f6fd1" stroke-width="2"/>
<text x="80" y="306" font-size="19" font-weight="800" fill="#1d2a3a">② 보전처분·포괄적 금지명령 (제43조·제45조)</text>
<text x="80" y="334" font-size="16" font-weight="500" fill="#34475c">개시 여부 결정 전까지 모든 회생채권자의 강제집행·</text>
<text x="80" y="358" font-size="16" font-weight="500" fill="#34475c">가압류·담보권 실행을 금지하고, 이미 한 것은 중지</text>
<line x1="330" y1="374" x2="330" y2="396" stroke="#1d2a3a" stroke-width="2.5" marker-end="url(#bp-ink)"/>

<rect x="60" y="400" width="540" height="100" rx="10" fill="#ffffff" stroke="#1d2a3a" stroke-width="2"/>
<text x="80" y="432" font-size="19" font-weight="800" fill="#1d2a3a">③ 개시결정: 신청일부터 1개월 안 (제49조)</text>
<text x="80" y="460" font-size="16" font-weight="500" fill="#34475c">회생채권에 기한 강제집행 금지·중지 (제58조)</text>
<text x="80" y="484" font-size="16" font-weight="500" fill="#34475c">관리인이 업무와 재산의 관리·처분권을 가짐</text>
<line x1="330" y1="500" x2="330" y2="522" stroke="#1d2a3a" stroke-width="2.5" marker-end="url(#bp-ink)"/>

<rect x="60" y="526" width="540" height="100" rx="10" fill="#fff7e6" stroke="#b7791f" stroke-width="2"/>
<text x="80" y="558" font-size="19" font-weight="800" fill="#1d2a3a">④ 진행 중인 운송계약의 선택 (제119조)</text>
<text x="80" y="586" font-size="16" font-weight="500" fill="#34475c">쌍방 모두 이행을 마치지 않은 계약은 관리인이</text>
<text x="80" y="610" font-size="16" font-weight="500" fill="#34475c">해제·해지하거나 이행을 선택. 상대방은 확답을 최고</text>
<line x1="330" y1="626" x2="330" y2="648" stroke="#d9482b" stroke-width="2.5" marker-end="url(#bp-red)"/>

<rect x="60" y="652" width="540" height="100" rx="10" fill="#fdecea" stroke="#d9482b" stroke-width="2"/>
<text x="80" y="684" font-size="19" font-weight="800" fill="#1d2a3a">⑤ 회생절차 폐지 → 파산선고 (제286조·제6조)</text>
<text x="80" y="712" font-size="16" font-weight="500" fill="#34475c">청산가치가 계속기업가치보다 크면 폐지될 수 있고,</text>
<text x="80" y="736" font-size="16" font-weight="500" fill="#34475c">파산으로 넘어가면 공익채권은 재단채권이 됨</text>

<!-- Right: claims table -->
<text x="650" y="158" font-size="21" font-weight="800" fill="#1f6fd1">내 채권은 어디에 들어가나</text>
<rect x="650" y="174" width="962" height="52" rx="8" fill="#1f6fd1"/>
<text x="670" y="207" font-size="18" font-weight="800" fill="#ffffff">구분</text>
<text x="880" y="207" font-size="18" font-weight="800" fill="#ffffff">회생절차</text>
<text x="1250" y="207" font-size="18" font-weight="800" fill="#ffffff">파산절차</text>

<rect x="650" y="226" width="962" height="104" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5"/>
<text x="670" y="260" font-size="17" font-weight="800" fill="#1d2a3a">개시 전 원인의</text>
<text x="670" y="284" font-size="17" font-weight="800" fill="#1d2a3a">일반 채권</text>
<text x="880" y="260" font-size="16" font-weight="600" fill="#1d2a3a">회생채권 (제118조)</text>
<text x="880" y="284" font-size="15" font-weight="500" fill="#34475c">신고하고 회생계획에 따라 변제</text>
<text x="880" y="308" font-size="15" font-weight="500" fill="#34475c">관리인 해지로 인한 손해배상도 여기 (제121조)</text>
<text x="1250" y="260" font-size="16" font-weight="600" fill="#1d2a3a">파산채권 (제423조)</text>
<text x="1250" y="284" font-size="15" font-weight="500" fill="#34475c">신고·조사·확정 후 비율 배당</text>
<text x="1250" y="308" font-size="15" font-weight="500" fill="#34475c">관재인 해지 손해배상도 여기 (제337조)</text>

<rect x="650" y="330" width="962" height="104" fill="#f4f7fb" stroke="#c9d2dc" stroke-width="1.5"/>
<text x="670" y="364" font-size="17" font-weight="800" fill="#1d2a3a">담보가 붙은 채권</text>
<text x="670" y="388" font-size="15" font-weight="500" fill="#34475c">(유치권 포함)</text>
<text x="880" y="364" font-size="16" font-weight="600" fill="#1d2a3a">회생담보권 (제141조)</text>
<text x="880" y="388" font-size="15" font-weight="500" fill="#34475c">유치권·질권·저당권 등으로 담보된 범위</text>
<text x="880" y="412" font-size="15" font-weight="500" fill="#34475c">개별 실행은 금지, 회생계획으로 변제</text>
<text x="1250" y="364" font-size="16" font-weight="600" fill="#1d2a3a">별제권 (제411조·제412조)</text>
<text x="1250" y="388" font-size="15" font-weight="500" fill="#34475c">파산재단 재산 위의 유치권 등은</text>
<text x="1250" y="412" font-size="15" font-weight="500" fill="#34475c">파산절차에 의하지 않고 행사</text>

<rect x="650" y="434" width="962" height="104" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5"/>
<text x="670" y="468" font-size="17" font-weight="800" fill="#1d2a3a">개시 후 생긴 비용</text>
<text x="670" y="492" font-size="17" font-weight="800" fill="#1d2a3a">사무관리·부당이득</text>
<text x="880" y="468" font-size="16" font-weight="600" fill="#1d2a3a">공익채권 (제179조)</text>
<text x="880" y="492" font-size="15" font-weight="500" fill="#34475c">회생절차에 의하지 않고 수시로, 회생채권보다</text>
<text x="880" y="516" font-size="15" font-weight="500" fill="#34475c">먼저 변제 (제180조)</text>
<text x="1250" y="468" font-size="16" font-weight="600" fill="#1d2a3a">재단채권 (제473조)</text>
<text x="1250" y="492" font-size="15" font-weight="500" fill="#34475c">파산채권보다 먼저 변제 (제476조)</text>
<text x="1250" y="516" font-size="15" font-weight="500" fill="#34475c">재단 부족이면 비율 변제 (제477조)</text>

<rect x="650" y="538" width="962" height="104" fill="#eaf6f0" stroke="#1f8a5b" stroke-width="2"/>
<text x="670" y="572" font-size="17" font-weight="800" fill="#1f8a5b">채무자 것이 아닌</text>
<text x="670" y="596" font-size="17" font-weight="800" fill="#1f8a5b">재산(화주의 화물)</text>
<text x="880" y="572" font-size="16" font-weight="600" fill="#1d2a3a">환취권 (제70조)</text>
<text x="880" y="596" font-size="15" font-weight="500" fill="#34475c">회생절차 개시는 채무자에게 속하지 않는</text>
<text x="880" y="620" font-size="15" font-weight="500" fill="#34475c">재산을 돌려받을 권리에 영향 없음</text>
<text x="1250" y="572" font-size="16" font-weight="600" fill="#1d2a3a">환취권 (제407조)</text>
<text x="1250" y="596" font-size="15" font-weight="500" fill="#34475c">파산선고도 같음. 다만 화물을 점유한 제3자의</text>
<text x="1250" y="620" font-size="15" font-weight="500" fill="#34475c">유치권 요구는 따로 해결해야 함</text>

<rect x="650" y="660" width="962" height="92" rx="10" fill="#fff7e6" stroke="#b7791f" stroke-width="2"/>
<text x="670" y="694" font-size="17" font-weight="800" fill="#1d2a3a">한진해운 비용 소송의 쟁점</text>
<text x="670" y="722" font-size="16" font-weight="500" fill="#34475c">포워더·화주가 낸 하역비·대체운송비가 공익채권(재단채권)이냐 회생채권(파산채권)이냐.</text>
<text x="670" y="744" font-size="16" font-weight="500" fill="#34475c">재단채권이면 수시로 청구할 수 있지만, 파산채권이면 배당을 기다려야 합니다.</text>

<!-- Bottom: cross-border strip -->
<rect x="60" y="776" width="1552" height="120" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="84" y="810" font-size="20" font-weight="800" fill="#1f6fd1">국경을 넘는 도산</text>
<text x="84" y="842" font-size="16" font-weight="600" fill="#1d2a3a">외국 절차 → 한국: 외국도산절차의 대표자가 서울회생법원(합의부 전속, 제630조)에 승인 신청(제631조),</text>
<text x="84" y="866" font-size="16" font-weight="500" fill="#34475c">법원은 신청일부터 1개월 안에 결정(제632조)하고, 강제집행·경매·가압류 금지 등 지원처분(제636조)을 할 수 있습니다.</text>
<text x="84" y="890" font-size="16" font-weight="600" fill="#1d2a3a">한국 절차 → 외국: 관리인은 외국법이 허용하는 바에 따라 외국에서 활동(제640조). 한진해운은 미국 Chapter 15로 승인을 신청했습니다.</text>
</svg>
