<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="m-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5f6b78"/></marker><marker id="m-org" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30" y="30" width="1612" height="500" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<rect x="30" y="550" width="1612" height="360" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="56" y="76" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">한국 CASS: 한 달 두 번 청구, 다음 달 15일과 말일에 송금 (예시 2026년)</text>
<text x="56" y="108" font-size="20" font-weight="500" fill="#5f6b78" text-anchor="start">결의 801r 제2.5.3항(한국)과 부록 A: 연 24회 청구, 유예기간 10일</text>
<line x1="110.0" y1="430" x2="1599.6" y2="430" stroke="#5f6b78" stroke-width="2"/>
<line x1="110.0" y1="422" x2="110.0" y2="438" stroke="#5f6b78" stroke-width="2"/>
<text x="110.0" y="466" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">10. 1.</text>
<line x1="404.0" y1="422" x2="404.0" y2="438" stroke="#5f6b78" stroke-width="2"/>
<text x="404.0" y="466" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">10. 16.</text>
<line x1="717.6" y1="422" x2="717.6" y2="438" stroke="#5f6b78" stroke-width="2"/>
<text x="717.6" y="466" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">11. 1.</text>
<line x1="992.0" y1="422" x2="992.0" y2="438" stroke="#5f6b78" stroke-width="2"/>
<text x="992.0" y="466" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">11. 15.</text>
<line x1="1286.0" y1="422" x2="1286.0" y2="438" stroke="#5f6b78" stroke-width="2"/>
<text x="1286.0" y="466" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">11. 30.</text>
<line x1="1482.0" y1="422" x2="1482.0" y2="438" stroke="#5f6b78" stroke-width="2"/>
<text x="1482.0" y="466" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">12. 10.</text>
<text x="404.0" y="500" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="middle">10월</text>
<text x="992.0" y="500" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="middle">11월</text>
<text x="1482.0" y="500" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="middle">12월</text>
<rect x="110.0" y="150" width="294.0" height="52" rx="8" fill="#e8f0fb" stroke="#1f6fd1" stroke-width="2"/>
<text x="257.0" y="184" font-size="19" font-weight="800" fill="#1f6fd1" text-anchor="middle">청구 기간 ① 1일~15일</text>
<path d="M 404.0 176 L 978.0 176" fill="none" stroke="#1f6fd1" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#m-blue)"/>
<circle cx="992.0" cy="176" r="12" fill="#1f6fd1"/>
<text x="1014.0" y="170" font-size="19" font-weight="800" fill="#1f6fd1" text-anchor="start">송금일: 다음 달 15일</text>
<text x="1014.0" y="196" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">11. 15.이 일요일이면 정산소가 여는 다음 날</text>
<rect x="404.0" y="270" width="313.6" height="52" rx="8" fill="#e6f4ed" stroke="#1f8a5b" stroke-width="2"/>
<text x="560.8" y="304" font-size="19" font-weight="800" fill="#1f8a5b" text-anchor="middle">청구 기간 ② 16일~말일</text>
<path d="M 717.6 296 L 1272.0 296" fill="none" stroke="#1f8a5b" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#m-green)"/>
<rect x="1286.0" y="276" width="196.0" height="40" fill="#fdeeea" stroke="#d9482b" stroke-width="2"/>
<circle cx="1286.0" cy="296" r="12" fill="#1f8a5b"/>
<text x="1268.0" y="356" font-size="19" font-weight="800" fill="#1f8a5b" text-anchor="end">송금일: 다음 달 말일 (11. 30.)</text>
<text x="1384.0" y="262" font-size="19" font-weight="800" fill="#d9482b" text-anchor="middle">유예기간 10일</text>
<text x="1490.0" y="356" font-size="18" font-weight="700" fill="#d9482b" text-anchor="end">12. 10.까지 못 내면</text>
<text x="1490.0" y="382" font-size="18" font-weight="700" fill="#d9482b" text-anchor="end">불이행(default) 조치</text>
<text x="56" y="596" font-size="24" font-weight="800" fill="#1d2a3a" text-anchor="start">청구서가 나온 뒤의 마감 순서 (결의 801r 제2.14항·제2.6항)</text>
<rect x="60" y="640" width="268" height="100" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="194.0" y="682.7" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="middle">청구서 배포</text>
<text x="194.0" y="712.7" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">IATA 청구 달력의 날</text>
<line x1="332" y1="690" x2="372" y2="690" stroke="#5f6b78" stroke-width="3" marker-end="url(#m-ink)"/>
<rect x="378" y="640" width="268" height="100" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="512.0" y="682.7" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="middle">이의 등록 마감</text>
<text x="512.0" y="712.7" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">배포 뒤 4일 이상</text>
<line x1="650" y1="690" x2="690" y2="690" stroke="#5f6b78" stroke-width="3" marker-end="url(#m-ink)"/>
<rect x="696" y="640" width="268" height="100" rx="12" fill="#ffffff" stroke="#e4572e" stroke-width="2.5"/>
<text x="830.0" y="682.7" font-size="22" font-weight="800" fill="#e4572e" text-anchor="middle">항공사 응답 마감</text>
<text x="830.0" y="712.7" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">송금일 4일 이상 전</text>
<line x1="968" y1="690" x2="1008" y2="690" stroke="#5f6b78" stroke-width="3" marker-end="url(#m-ink)"/>
<rect x="1014" y="640" width="268" height="100" rx="12" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5"/>
<text x="1148.0" y="682.7" font-size="22" font-weight="800" fill="#1f8a5b" text-anchor="middle">송금일</text>
<text x="1148.0" y="712.7" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">정산 계좌 도착 기준</text>
<line x1="1286" y1="690" x2="1326" y2="690" stroke="#5f6b78" stroke-width="3" marker-end="url(#m-ink)"/>
<rect x="1332" y="640" width="268" height="100" rx="12" fill="#ffffff" stroke="#d9482b" stroke-width="2.5"/>
<text x="1466.0" y="682.7" font-size="22" font-weight="800" fill="#d9482b" text-anchor="middle">유예기간 끝</text>
<text x="1466.0" y="712.7" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">송금일 뒤 10일</text>
<text x="56" y="790" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">무응답 이의는 정정 처리 때 자동 승인됩니다. 항공사는 나중에 거절했어야 할 건을 다음 청구 기간에 다시 청구할 수 있습니다.</text>
<text x="56" y="824" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">송금이 늦으면 이상 통지(notice of irregularity)가 나가고, 12개월 안에 4번 쌓이면 불이행 조치와 함께 검토 대상이 됩니다.</text>
<text x="56" y="872" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="start">실제 날짜는 IATA가 매년 11월 1일 전에 배포하는 다음 해 CASS 청구 달력(billing calendar)으로 확인합니다.</text>
</svg>
