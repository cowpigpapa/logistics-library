<text x="84" y="738" font-size="21" font-weight="700" fill="#1d2a3a" text-anchor="start">선적일까지 세는 방식은 본선이 늦으면 화주 잘못 없이도 일수가 늘어납니다.</text>
<text x="84" y="774" font-size="20" font-weight="600" fill="#1d2a3a" text-anchor="start">가장 이른 반출일을 계산해 운송사와 적입 장소에 알리고, 서류 마감 때문에 미리 빼야 하면 그 일수를 견적에 반영합니다.</text>
<text x="84" y="810" font-size="20" font-weight="600" fill="#5f6b78" text-anchor="start">Hapag-Lloyd 방식에서 마감일이 바뀔 때의 처리는 선사에 확인합니다.</text>
