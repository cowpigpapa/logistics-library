<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5f6b78"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="24" y="22" width="1624" height="897" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="48" y="66" font-size="26" font-weight="800" fill="#1d2a3a">파트너 정산이 밀릴 때의 순서: 무엇을 멈출 수 있고, 무엇은 멈추면 안 되나</text>
<text x="48" y="96" font-size="16" font-weight="600" fill="#5f6b78">계약서에 적어 둔 만큼만 쓸 수 있는 조치가 많습니다. 기한과 한도의 숫자는 각 계약서가 정합니다.</text>

<rect x="48" y="126" width="206" height="150" rx="12" fill="#ffffff" stroke="#5f6b78" stroke-width="2.5"/>
<text x="64" y="160" font-size="17" font-weight="800" fill="#1d2a3a">① 청구</text>
<text x="64" y="190" font-size="15" font-weight="500" fill="#1d2a3a">건별 인보이스·</text>
<text x="64" y="214" font-size="15" font-weight="500" fill="#1d2a3a">데빗·크레딧 노트</text>
<text x="64" y="238" font-size="15" font-weight="500" fill="#1d2a3a">B/L 번호를 적음</text>

<rect x="276" y="126" width="206" height="150" rx="12" fill="#ffffff" stroke="#5f6b78" stroke-width="2.5"/>
<text x="292" y="160" font-size="17" font-weight="800" fill="#1d2a3a">② SOA 송부</text>
<text x="292" y="190" font-size="15" font-weight="500" fill="#1d2a3a">정한 주기(예: 월말)</text>
<text x="292" y="214" font-size="15" font-weight="500" fill="#1d2a3a">받을 쪽·줄 쪽을</text>
<text x="292" y="238" font-size="15" font-weight="500" fill="#1d2a3a">각각 표시</text>

<rect x="504" y="126" width="206" height="150" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="520" y="160" font-size="17" font-weight="800" fill="#1f6fd1">③ 확인 기한</text>
<text x="520" y="190" font-size="15" font-weight="500" fill="#1d2a3a">기한 안에 이의가</text>
<text x="520" y="214" font-size="15" font-weight="500" fill="#1d2a3a">없으면 확정(약정)</text>
<text x="520" y="238" font-size="15" font-weight="500" fill="#1d2a3a">이의 항목만 분리</text>

<rect x="732" y="126" width="206" height="150" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="748" y="160" font-size="17" font-weight="800" fill="#1f6fd1">④ 지급 기한</text>
<text x="748" y="190" font-size="15" font-weight="500" fill="#1d2a3a">다툼 없는 금액은</text>
<text x="748" y="214" font-size="15" font-weight="500" fill="#1d2a3a">기한 안에 지급</text>
<text x="748" y="238" font-size="15" font-weight="500" fill="#1d2a3a">정산 통화·환율 확인</text>

<rect x="960" y="126" width="206" height="150" rx="12" fill="#ffffff" stroke="#e4572e" stroke-width="2.5"/>
<text x="976" y="160" font-size="17" font-weight="800" fill="#e4572e">⑤ 연체</text>
<text x="976" y="190" font-size="15" font-weight="500" fill="#1d2a3a">서면 독촉</text>
<text x="976" y="214" font-size="15" font-weight="500" fill="#1d2a3a">약정 연체 이자</text>
<text x="976" y="238" font-size="15" font-weight="500" fill="#1d2a3a">담당 임원 보고</text>

<rect x="1188" y="126" width="206" height="150" rx="12" fill="#ffffff" stroke="#e4572e" stroke-width="2.5"/>
<text x="1204" y="160" font-size="17" font-weight="800" fill="#e4572e">⑥ 한도 초과</text>
<text x="1204" y="190" font-size="15" font-weight="500" fill="#1d2a3a">미리 서면 통지한 뒤</text>
<text x="1204" y="214" font-size="15" font-weight="500" fill="#1d2a3a">신규 부킹 중지,</text>
<text x="1204" y="238" font-size="15" font-weight="500" fill="#1d2a3a">선지급 전환</text>

<rect x="1416" y="126" width="206" height="150" rx="12" fill="#ffffff" stroke="#d9482b" stroke-width="3"/>
<text x="1432" y="160" font-size="17" font-weight="800" fill="#d9482b">⑦ 해지</text>
<text x="1432" y="190" font-size="15" font-weight="500" fill="#1d2a3a">진행 중 화물 처리</text>
<text x="1432" y="214" font-size="15" font-weight="500" fill="#1d2a3a">최종 SOA 확정</text>
<text x="1432" y="238" font-size="15" font-weight="500" fill="#1d2a3a">미정산 청구</text>

<path d="M254 201 L272 201" stroke="#5f6b78" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M482 201 L500 201" stroke="#5f6b78" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M710 201 L728 201" stroke="#5f6b78" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M938 201 L956 201" stroke="#5f6b78" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M1166 201 L1184 201" stroke="#5f6b78" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M1394 201 L1412 201" stroke="#5f6b78" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>

<rect x="48" y="296" width="1574" height="52" rx="10" fill="#eef4fb" stroke="#c9d2dc" stroke-width="1.5"/>
<text x="68" y="330" font-size="16" font-weight="700" fill="#1d2a3a">운송주선 채권의 1년 시효(상법 제122조)는 채무 승인으로 중단될 수 있습니다(민법 제168조). 1년 안에 파트너의 잔액 확인 서면을 받아 둡니다.</text>

<rect x="48" y="370" width="774" height="524" rx="12" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5"/>
<text x="70" y="410" font-size="20" font-weight="800" fill="#1f8a5b">계약서에 적어 두면 쓸 수 있는 조치</text>
<text x="70" y="452" font-size="16" font-weight="700" fill="#1d2a3a">· 신규 부킹 접수 중지</text>
<text x="88" y="478" font-size="15" font-weight="500" fill="#1d2a3a">한도와 통지 방법·기간을 조항으로 정해 둔 경우</text>
<text x="70" y="518" font-size="16" font-weight="700" fill="#1d2a3a">· 선지급(Prepaid) 전환, 보증·예치금 요구</text>
<text x="88" y="544" font-size="15" font-weight="500" fill="#1d2a3a">Collect 화물 비율을 줄이고 서렌더·인도 시점을 조정</text>
<text x="70" y="584" font-size="16" font-weight="700" fill="#1d2a3a">· 같은 SOA 안의 반대 채권과 차감</text>
<text x="88" y="610" font-size="15" font-weight="500" fill="#1d2a3a">차감 정산은 외국환거래법 신고 기준을 함께 확인</text>
<text x="70" y="650" font-size="16" font-weight="700" fill="#1d2a3a">· 네트워크 공식 분쟁 등록</text>
<text x="88" y="676" font-size="15" font-weight="500" fill="#1d2a3a">규정이 정한 기한 안에, 거래 당시 회원 자격 기록과 함께</text>
<text x="70" y="716" font-size="16" font-weight="700" fill="#1d2a3a">· 이미 맡은 화물의 유치(법이 허용하는 범위)</text>
<text x="88" y="742" font-size="15" font-weight="500" fill="#1d2a3a">잡을 수 있는 범위는 유치권 문서 참고</text>
<text x="70" y="782" font-size="16" font-weight="700" fill="#1d2a3a">· 해지 통지와 최종 SOA</text>
<text x="88" y="808" font-size="15" font-weight="500" fill="#1d2a3a">진행 중 화물은 끝까지 처리한다는 조항과 함께</text>

<rect x="848" y="370" width="774" height="524" rx="12" fill="#ffffff" stroke="#d9482b" stroke-width="2.5"/>
<text x="870" y="410" font-size="20" font-weight="800" fill="#d9482b">멈추면 안 되거나 조심할 것</text>
<text x="870" y="452" font-size="16" font-weight="700" fill="#1d2a3a">· 통지 없이 이미 받은 화물을 묶어 두기</text>
<text x="888" y="478" font-size="15" font-weight="500" fill="#1d2a3a">싱가포르 고등법원은 미리 알리지 않고 파트너 화물을</text>
<text x="888" y="502" font-size="15" font-weight="500" fill="#1d2a3a">잡아 둔 현지 대리인의 계약 위반을 인정(2001)</text>
<text x="870" y="542" font-size="16" font-weight="700" fill="#1d2a3a">· 파트너의 지난 미수로 화주 화물 잡기</text>
<text x="888" y="568" font-size="15" font-weight="500" fill="#1d2a3a">화물은 파트너가 아니라 수입자·B/L 소지인의 것</text>
<text x="870" y="608" font-size="16" font-weight="700" fill="#1d2a3a">· 다툼 있는 한 건 때문에 전액 지급 거절</text>
<text x="888" y="634" font-size="15" font-weight="500" fill="#1d2a3a">다툼 없는 금액은 내고 이의 항목만 따로 협의</text>
<text x="870" y="674" font-size="16" font-weight="700" fill="#1d2a3a">· 사업을 넘겨받은 새 회사에 옛 빚 청구</text>
<text x="888" y="700" font-size="15" font-weight="500" fill="#1d2a3a">자산만 사들인 새 회사가 빚을 넘겨받았다는 증거가</text>
<text x="888" y="724" font-size="15" font-weight="500" fill="#1d2a3a">없으면 청구가 기각될 수 있음(같은 판결)</text>
<text x="870" y="764" font-size="16" font-weight="700" fill="#1d2a3a">· 다른 회사 계좌로 보내 달라는 요청</text>
<text x="888" y="790" font-size="15" font-weight="500" fill="#1d2a3a">송금 사기와 제3자 지급 신고를 먼저 확인</text>
</svg>
