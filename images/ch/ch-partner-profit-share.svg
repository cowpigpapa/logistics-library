<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="24" y="22" width="1624" height="897" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="48" y="66" font-size="26" font-weight="800" fill="#1d2a3a">Profit Share 계산의 뼈대: 무엇을 먼저 빼고 남은 것을 나누나(가상 숫자)</text>
<text x="48" y="96" font-size="16" font-weight="600" fill="#5f6b78">이익 배분은 주로 프리핸드·공동 영업 화물에 쓰입니다. 프리핸드 Prepaid 화물 1건을 50:50으로 나눈다고 가정한 가상 숫자(USD)입니다.</text>

<rect x="48" y="122" width="1000" height="772" rx="12" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5"/>
<line x1="80" y1="800" x2="1020" y2="800" stroke="#5f6b78" stroke-width="2"/>

<rect x="100" y="240" width="150" height="560" fill="#1f6fd1"/>
<text x="175" y="226" font-size="20" font-weight="800" fill="#1f6fd1" text-anchor="middle">2,000</text>
<line x1="250" y1="240" x2="290" y2="240" stroke="#5f6b78" stroke-width="1.5" stroke-dasharray="5 4"/>

<rect x="290" y="240" width="150" height="392" fill="#c4ccd6"/>
<text x="365" y="440" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="middle">−1,400</text>
<line x1="440" y1="632" x2="480" y2="632" stroke="#5f6b78" stroke-width="1.5" stroke-dasharray="5 4"/>

<rect x="480" y="632" width="150" height="14" fill="#e4572e"/>
<text x="555" y="618" font-size="20" font-weight="800" fill="#e4572e" text-anchor="middle">−50</text>
<line x1="630" y1="646" x2="670" y2="646" stroke="#5f6b78" stroke-width="1.5" stroke-dasharray="5 4"/>

<rect x="670" y="646" width="150" height="154" fill="#1f8a5b"/>
<text x="745" y="632" font-size="20" font-weight="800" fill="#1f8a5b" text-anchor="middle">550</text>
<line x1="820" y1="646" x2="860" y2="646" stroke="#5f6b78" stroke-width="1.5" stroke-dasharray="5 4"/>

<rect x="860" y="646" width="150" height="77" fill="#e4572e" fill-opacity="0.85"/>
<rect x="860" y="723" width="150" height="77" fill="#1f6fd1" fill-opacity="0.85"/>
<text x="935" y="680" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">해외 파트너</text>
<text x="935" y="704" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">275</text>
<text x="935" y="757" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">한국 포워더</text>
<text x="935" y="781" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">275</text>
<text x="935" y="632" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="middle">50 : 50</text>

<text x="175" y="830" font-size="16" font-weight="700" fill="#1d2a3a" text-anchor="middle">화주에게 받은</text>
<text x="175" y="852" font-size="16" font-weight="700" fill="#1d2a3a" text-anchor="middle">해상운임(매출)</text>
<text x="365" y="830" font-size="16" font-weight="700" fill="#1d2a3a" text-anchor="middle">선사에 낸</text>
<text x="365" y="852" font-size="16" font-weight="700" fill="#1d2a3a" text-anchor="middle">Master 운임</text>
<text x="555" y="830" font-size="16" font-weight="700" fill="#1d2a3a" text-anchor="middle">파트너 핸들링 피</text>
<text x="555" y="852" font-size="16" font-weight="700" fill="#1d2a3a" text-anchor="middle">(먼저 원가로)</text>
<text x="745" y="830" font-size="16" font-weight="700" fill="#1d2a3a" text-anchor="middle">배분 대상</text>
<text x="745" y="852" font-size="16" font-weight="700" fill="#1d2a3a" text-anchor="middle">이익</text>
<text x="935" y="830" font-size="16" font-weight="700" fill="#1d2a3a" text-anchor="middle">나눈 뒤</text>
<text x="935" y="852" font-size="16" font-weight="700" fill="#1d2a3a" text-anchor="middle">각자 몫</text>

<text x="80" y="160" font-size="18" font-weight="800" fill="#1d2a3a">배분 대상 이익 = 합의한 매출 항목 − 합의한 원가 항목</text>
<text x="80" y="188" font-size="15" font-weight="500" fill="#5f6b78">도착지에서 수입자에게 받는 로컬 차지는 이 예에서 배분 대상 밖이라고 가정했습니다.</text>

<rect x="1076" y="122" width="546" height="300" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="1098" y="160" font-size="19" font-weight="800" fill="#1f6fd1">이 건의 SOA에 적히는 것</text>
<text x="1098" y="200" font-size="16" font-weight="500" fill="#1d2a3a">한국 포워더가 해외 파트너에게 줄 돈</text>
<text x="1098" y="236" font-size="17" font-weight="700" fill="#1d2a3a">핸들링 피 50 + 이익 배분 275 = 325</text>
<text x="1098" y="276" font-size="16" font-weight="500" fill="#1d2a3a">한국 포워더에게 남는 것</text>
<text x="1098" y="312" font-size="17" font-weight="700" fill="#1d2a3a">2,000 − 1,400 − 325 = 275</text>
<text x="1098" y="352" font-size="15" font-weight="500" fill="#5f6b78">같은 달 반대 방향 건(노미네이션 등)이 있으면</text>
<text x="1098" y="376" font-size="15" font-weight="500" fill="#5f6b78">SOA에서 차감하고 차액만 송금합니다.</text>
<text x="1098" y="400" font-size="15" font-weight="500" fill="#5f6b78">차감 정산은 외국환거래법 신고 대상일 수 있습니다.</text>

<rect x="1076" y="440" width="546" height="454" rx="12" fill="#ffffff" stroke="#e4572e" stroke-width="2.5"/>
<text x="1098" y="478" font-size="19" font-weight="800" fill="#e4572e">나누기 전에 계약서로 정할 것</text>
<text x="1098" y="516" font-size="16" font-weight="700" fill="#1d2a3a">1. 원가 기준과 증빙</text>
<text x="1118" y="542" font-size="15" font-weight="500" fill="#1d2a3a">선사·항공사 청구서(Debit Note) 기준 순원가인지</text>
<text x="1098" y="580" font-size="16" font-weight="700" fill="#1d2a3a">2. 할증료 인상분</text>
<text x="1118" y="606" font-size="15" font-weight="500" fill="#1d2a3a">부킹 뒤 오른 GRI·BAF 등을 원가로 인정하나</text>
<text x="1098" y="644" font-size="16" font-weight="700" fill="#1d2a3a">3. 핸들링 피의 단위와 계산 순서</text>
<text x="1118" y="670" font-size="15" font-weight="500" fill="#1d2a3a">B/L·건당인지, 이익을 나누기 전에 빼는지</text>
<text x="1098" y="708" font-size="16" font-weight="700" fill="#1d2a3a">4. 배분 시점</text>
<text x="1118" y="734" font-size="15" font-weight="500" fill="#1d2a3a">출항 기준인지, 운임을 실제로 받은 뒤인지</text>
<text x="1098" y="772" font-size="16" font-weight="700" fill="#1d2a3a">5. 손실도 나누나</text>
<text x="1118" y="798" font-size="15" font-weight="500" fill="#1d2a3a">운임 미회수, D&amp;D·보관료, 클레임 비용</text>
<text x="1098" y="836" font-size="16" font-weight="700" fill="#1d2a3a">6. 환율과 정산 통화</text>
<text x="1118" y="862" font-size="15" font-weight="500" fill="#1d2a3a">어느 날짜 환율로 바꾸고 환차손은 누가 지나</text>
</svg>
