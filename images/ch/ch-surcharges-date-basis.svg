<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker><marker id="a-sub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5f6b78"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<text x="40" y="58" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start" >같은 화물, 다른 기준일: 새 할증료가 붙는가 (예시)</text>
<rect x="30" y="80" width="1612" height="540" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16" />
<line x1="80" y1="200" x2="1600" y2="200" stroke="#1d2a3a" stroke-width="4" marker-end="url(#a-ink)"/>
<line x1="520" y1="140" x2="520" y2="505" stroke="#d9482b" stroke-width="4" stroke-dasharray="10 6"/>
<rect x="390" y="96" width="260" height="40" fill="#d9482b" stroke="#d9482b" stroke-width="2" rx="8" />
<text x="520" y="123" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" >새 할증료 적용 시작일</text>
<rect x="520" y="270" width="1100" height="235" fill="#fdebe5" stroke="none" stroke-width="2" rx="0" opacity="0.55"/>
<circle cx="240" cy="200" r="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="5"/>
<text x="240" y="174" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle" >부킹일</text>
<text x="240" y="242" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle" >부킹 확인서 발행일</text>
<circle cx="820" cy="200" r="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="5"/>
<text x="820" y="174" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle" >반입일</text>
<text x="820" y="242" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle" >터미널 반입 기록, EIR</text>
<circle cx="1120" cy="200" r="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="5"/>
<text x="1120" y="174" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle" >출항 예정일</text>
<text x="1120" y="242" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle" >선사 스케줄</text>
<circle cx="1420" cy="200" r="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="5"/>
<text x="1420" y="174" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle" >실제 출항일</text>
<text x="1420" y="242" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle" >B/L 본선 적재일</text>
<text x="380" y="242" font-size="1" font-weight="600" fill="#1d2a3a" text-anchor="start" ></text>
<text x="60" y="308" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="start" >부킹일 기준</text>
<circle cx="240" cy="300" r="10" fill="#1f8a5b" stroke="#1f8a5b" stroke-width="2"/>
<text x="258" y="308" font-size="20" font-weight="800" fill="#1f8a5b" text-anchor="start" >붙지 않음</text>
<text x="60" y="366" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="start" >반입일 기준</text>
<circle cx="820" cy="358" r="10" fill="#d9482b" stroke="#d9482b" stroke-width="2"/>
<text x="838" y="366" font-size="20" font-weight="800" fill="#d9482b" text-anchor="start" >붙음</text>
<text x="60" y="424" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="start" >출항 예정일 기준</text>
<circle cx="1120" cy="416" r="10" fill="#d9482b" stroke="#d9482b" stroke-width="2"/>
<text x="1138" y="424" font-size="20" font-weight="800" fill="#d9482b" text-anchor="start" >붙음</text>
<text x="60" y="482" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="start" >실제 출항일 기준</text>
<circle cx="1420" cy="474" r="10" fill="#d9482b" stroke="#d9482b" stroke-width="2"/>
<text x="1438" y="482" font-size="20" font-weight="800" fill="#d9482b" text-anchor="start" >붙음</text>
<text x="540" y="270" font-size="1" font-weight="600" fill="#1d2a3a" text-anchor="start" ></text>
<text x="60" y="552" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start" >가격 산정일(PCD)이나 컨테이너 인수일을 기준으로 삼는 선사도 있다. 할증료마다 선사가 정한 기준일을 부킹 확인서·반입 기록·B/L 날짜와 맞춘다.</text>
<text x="60" y="586" font-size="19" font-weight="600" fill="#5f6b78" text-anchor="start" >출항이 밀려 요율 기간 경계를 넘을 때도 기준일 규칙이 결과를 정한다.</text>
<rect x="30" y="640" width="1612" height="270" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16" />
<text x="54" y="682" font-size="24" font-weight="800" fill="#1d2a3a" text-anchor="start" >요율을 올리는 날짜에는 법이 정한 최소 간격이 있다</text>
<text x="60" y="753" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="start" >한국 (해운법 제28조)</text>
<circle cx="560" cy="745" r="10" fill="#ffffff" stroke="#1f6fd1" stroke-width="4"/>
<text x="560" y="723" font-size="19" font-weight="700" fill="#1f6fd1" text-anchor="middle" >공표</text>
<line x1="572" y1="745" x2="1088" y2="745" stroke="#1f6fd1" stroke-width="4" marker-end="url(#a-blue)"/>
<text x="830" y="731" font-size="20" font-weight="800" fill="#1f6fd1" text-anchor="middle" >15일 전까지 공표</text>
<circle cx="1100" cy="745" r="10" fill="#1f6fd1" stroke="#1f6fd1" stroke-width="4"/>
<text x="1100" y="723" font-size="19" font-weight="700" fill="#1f6fd1" text-anchor="middle" >적용일</text>
<text x="60" y="848" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="start" >미국 FMC (46 CFR 520.8)</text>
<circle cx="560" cy="840" r="10" fill="#ffffff" stroke="#1f8a5b" stroke-width="4"/>
<text x="560" y="818" font-size="19" font-weight="700" fill="#1f8a5b" text-anchor="middle" >공시</text>
<line x1="572" y1="840" x2="1088" y2="840" stroke="#1f8a5b" stroke-width="4" marker-end="url(#a-green)"/>
<text x="830" y="826" font-size="20" font-weight="800" fill="#1f8a5b" text-anchor="middle" >인상분은 30일 뒤 효력</text>
<circle cx="1100" cy="840" r="10" fill="#1f8a5b" stroke="#1f8a5b" stroke-width="4"/>
<text x="1100" y="818" font-size="19" font-weight="700" fill="#1f8a5b" text-anchor="middle" >효력</text>
<text x="1150" y="750" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start" >정기 컨테이너 화물의 할증료 포함</text>
<text x="1150" y="845" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start" >비용을 낮추는 변경은 공시 즉시</text>
</svg>
