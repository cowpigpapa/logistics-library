<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5f6b78"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="24" y="22" width="1624" height="897" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="48" y="66" font-size="26" font-weight="800" fill="#1d2a3a">선복 공유(VSA)·슬롯 용선·얼라이언스의 구조와 2025년 재편</text>
<text x="48" y="96" font-size="16" font-weight="600" fill="#5f6b78">왼쪽은 일반 구조(선사 A~D는 가상)입니다. 오른쪽은 미국 연방해사위원회(FMC) 공고와 연방관보, 선사 공식 발표로 확인한 사실만 적었습니다.</text>

<!-- LEFT -->
<rect x="48" y="118" width="780" height="776" rx="12" fill="#ffffff" stroke="#c9d2dc" stroke-width="2"/>
<text x="72" y="152" font-size="19" font-weight="800" fill="#1d2a3a">한 서비스에 여러 선사가 배와 공간을 나누는 방식</text>

<rect x="72" y="172" width="210" height="64" rx="10" fill="#1f6fd1"/>
<text x="177" y="202" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">선사 A(회원)</text>
<text x="177" y="225" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">선박 2척 투입</text>
<rect x="333" y="172" width="210" height="64" rx="10" fill="#1f6fd1"/>
<text x="438" y="202" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">선사 B(회원)</text>
<text x="438" y="225" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">선박 1척 투입</text>
<rect x="594" y="172" width="210" height="64" rx="10" fill="#1f6fd1"/>
<text x="699" y="202" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">선사 C(회원)</text>
<text x="699" y="225" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">선박 1척 투입</text>
<path d="M177 236 L177 272" stroke="#5f6b78" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M438 236 L438 272" stroke="#5f6b78" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M699 236 L699 272" stroke="#5f6b78" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>

<rect x="72" y="278" width="732" height="196" rx="12" fill="#eef4fc" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="92" y="310" font-size="18" font-weight="800" fill="#1d2a3a">공동 서비스(루프) 하나: 회원 선사가 낸 선박 4척으로 주 1회 운항</text>
<rect x="92" y="326" width="164" height="56" rx="8" fill="#ffffff" stroke="#1f6fd1" stroke-width="2"/>
<text x="174" y="350" font-size="15" font-weight="800" fill="#1d2a3a" text-anchor="middle">선박 1</text>
<text x="174" y="372" font-size="13" font-weight="600" fill="#5f6b78" text-anchor="middle">A가 운항</text>
<rect x="268" y="326" width="164" height="56" rx="8" fill="#ffffff" stroke="#1f6fd1" stroke-width="2"/>
<text x="350" y="350" font-size="15" font-weight="800" fill="#1d2a3a" text-anchor="middle">선박 2</text>
<text x="350" y="372" font-size="13" font-weight="600" fill="#5f6b78" text-anchor="middle">A가 운항</text>
<rect x="444" y="326" width="164" height="56" rx="8" fill="#ffffff" stroke="#1f6fd1" stroke-width="2"/>
<text x="526" y="350" font-size="15" font-weight="800" fill="#1d2a3a" text-anchor="middle">선박 3</text>
<text x="526" y="372" font-size="13" font-weight="600" fill="#5f6b78" text-anchor="middle">B가 운항</text>
<rect x="620" y="326" width="164" height="56" rx="8" fill="#ffffff" stroke="#1f6fd1" stroke-width="2"/>
<text x="702" y="350" font-size="15" font-weight="800" fill="#1d2a3a" text-anchor="middle">선박 4</text>
<text x="702" y="372" font-size="13" font-weight="600" fill="#5f6b78" text-anchor="middle">C가 운항</text>
<text x="92" y="414" font-size="15" font-weight="600" fill="#1d2a3a">배마다 A·B·C가 정한 비율로 공간을 나눠 씁니다. 각 선사는 자기 몫의</text>
<text x="92" y="438" font-size="15" font-weight="600" fill="#1d2a3a">공간을 자기 이름으로 팔고(부킹 접수, B/L 발행), 서비스 이름과 항차 번호도</text>
<text x="92" y="462" font-size="15" font-weight="600" fill="#1d2a3a">선사마다 따로 붙이는 경우가 많습니다(실무 관행).</text>

<rect x="72" y="494" width="356" height="132" rx="12" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5"/>
<text x="92" y="526" font-size="17" font-weight="800" fill="#1f8a5b">선사 D(비회원): 슬롯 용선</text>
<text x="92" y="554" font-size="14" font-weight="600" fill="#1d2a3a">배는 내지 않고, 정한 구간의 공간을</text>
<text x="92" y="578" font-size="14" font-weight="600" fill="#1d2a3a">대가를 주고 빌려 자기 이름으로 팝니다.</text>
<text x="92" y="604" font-size="14" font-weight="600" fill="#1d2a3a">공간을 맞바꾸면 슬롯 교환입니다.</text>
<path d="M250 494 L250 474" stroke="#1f8a5b" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>

<rect x="448" y="494" width="356" height="132" rx="12" fill="#ffffff" stroke="#e4572e" stroke-width="2.5"/>
<text x="468" y="526" font-size="17" font-weight="800" fill="#e4572e">포워더가 선사 B에 부킹하면</text>
<text x="468" y="554" font-size="14" font-weight="600" fill="#1d2a3a">부킹 확인서와 B/L은 B의 이름으로 나오지만</text>
<text x="468" y="578" font-size="14" font-weight="600" fill="#1d2a3a">화물은 A가 운항하는 선박 1에 실릴 수 있습니다.</text>
<text x="468" y="604" font-size="14" font-weight="600" fill="#1d2a3a">선명·항차는 부킹 확인서로 대조합니다.</text>

<rect x="72" y="646" width="732" height="228" rx="12" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2"/>
<text x="92" y="678" font-size="17" font-weight="800" fill="#1d2a3a">법령의 이름</text>
<text x="92" y="708" font-size="14" font-weight="600" fill="#1d2a3a">미국 46 CFR 535.104: 선복 용선 협정(space charter agreement)은 선사가 다른 선사에</text>
<text x="92" y="730" font-size="14" font-weight="600" fill="#1d2a3a">대가를 받고 선박 공간을 제공하는 협정, 운항 협정(sailing agreement)은 기항 항만·</text>
<text x="92" y="752" font-size="14" font-weight="600" fill="#1d2a3a">기항 빈도·투입 선박 규모를 정하는 협정, 선복 합리화(capacity rationalization)는</text>
<text x="92" y="774" font-size="14" font-weight="600" fill="#1d2a3a">선사들이 공동으로 선박 수·공간을 줄이거나 제한하는 것입니다.</text>
<text x="92" y="808" font-size="14" font-weight="600" fill="#1d2a3a">한국 해운법 제29조 제1항: 운임·선박배치·화물의 적재 그 밖의 운송조건에 관한</text>
<text x="92" y="830" font-size="14" font-weight="600" fill="#1d2a3a">외항화물운송사업자 사이의 계약이나 공동행위가 "협약"이며, 협약을 하면</text>
<text x="92" y="852" font-size="14" font-weight="600" fill="#1d2a3a">해양수산부장관에게 신고해야 합니다(같은 조 제2항, 4절).</text>

<!-- RIGHT -->
<rect x="852" y="118" width="772" height="776" rx="12" fill="#ffffff" stroke="#c9d2dc" stroke-width="2"/>
<text x="876" y="152" font-size="19" font-weight="800" fill="#1d2a3a">2025년 재편 연혁</text>
<line x1="900" y1="176" x2="900" y2="486" stroke="#1f6fd1" stroke-width="3"/>
<circle cx="900" cy="186" r="7" fill="#1f6fd1"/>
<text x="922" y="192" font-size="15" font-weight="800" fill="#1d2a3a">2023. 1.</text>
<text x="1040" y="192" font-size="15" font-weight="600" fill="#1d2a3a">Maersk·MSC가 2M을 2025년 1월에 끝낸다고 발표</text>
<circle cx="900" cy="230" r="7" fill="#1f6fd1"/>
<text x="922" y="236" font-size="15" font-weight="800" fill="#1d2a3a">2024. 1. 17.</text>
<text x="1040" y="236" font-size="15" font-weight="600" fill="#1d2a3a">Maersk·Hapag-Lloyd가 Gemini Cooperation 발표,</text>
<text x="1040" y="258" font-size="15" font-weight="600" fill="#1d2a3a">Hapag-Lloyd는 2025년 1월 말 THE Alliance 탈퇴 예정</text>
<circle cx="900" cy="296" r="7" fill="#1f6fd1"/>
<text x="922" y="302" font-size="15" font-weight="800" fill="#1d2a3a">2024. 3. 12.</text>
<text x="1040" y="302" font-size="15" font-weight="600" fill="#1d2a3a">OCEAN Alliance 협정 기간을 2032. 3. 31.까지 늘리는</text>
<text x="1040" y="324" font-size="15" font-weight="600" fill="#1d2a3a">수정(012426-007) 공고, 제안 효력일 2024. 4. 15.</text>
<circle cx="900" cy="362" r="7" fill="#1f6fd1"/>
<text x="922" y="368" font-size="15" font-weight="800" fill="#1d2a3a">2024. 9. 9.</text>
<text x="1040" y="368" font-size="15" font-weight="600" fill="#1d2a3a">Gemini Cooperation 협정 FMC 효력 발생</text>
<circle cx="900" cy="406" r="7" fill="#1f6fd1"/>
<text x="922" y="412" font-size="15" font-weight="800" fill="#1d2a3a">2024. 10. 28.</text>
<text x="1040" y="412" font-size="15" font-weight="600" fill="#1d2a3a">Premier Alliance 협정 FMC 제출</text>
<circle cx="900" cy="450" r="7" fill="#e4572e"/>
<text x="922" y="456" font-size="15" font-weight="800" fill="#1d2a3a">2025. 2.</text>
<text x="1040" y="456" font-size="15" font-weight="600" fill="#1d2a3a">Gemini 네트워크 운영 시작(2. 1., 선사 발표),</text>
<text x="1040" y="478" font-size="15" font-weight="600" fill="#1d2a3a">Premier Alliance 협정 효력 발생(2. 9., FMC)</text>

<text x="876" y="526" font-size="18" font-weight="800" fill="#1d2a3a">FMC에 등록된 세 얼라이언스 협정(공고 표기)</text>
<rect x="876" y="540" width="724" height="40" fill="#1f6fd1"/>
<text x="890" y="566" font-size="15" font-weight="800" fill="#ffffff">협정 이름 · FMC 번호</text>
<text x="1100" y="566" font-size="15" font-weight="800" fill="#ffffff">당사자</text>
<rect x="876" y="580" width="724" height="82" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5"/>
<text x="890" y="608" font-size="15" font-weight="800" fill="#1d2a3a">Gemini Cooperation</text>
<text x="890" y="632" font-size="14" font-weight="600" fill="#5f6b78">No. 201429</text>
<text x="1100" y="608" font-size="14" font-weight="600" fill="#1d2a3a">Maersk A/S; Hapag-Lloyd AG·Hapag-Lloyd USA, LLC</text>
<text x="1100" y="632" font-size="14" font-weight="600" fill="#1d2a3a">(단일 당사자로 행동)</text>
<rect x="876" y="662" width="724" height="82" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5"/>
<text x="890" y="690" font-size="15" font-weight="800" fill="#1d2a3a">Premier Alliance</text>
<text x="890" y="714" font-size="14" font-weight="600" fill="#5f6b78">No. 201435</text>
<text x="1100" y="690" font-size="14" font-weight="600" fill="#1d2a3a">HMM Co., Ltd.; Ocean Network Express Pte. Ltd.;</text>
<text x="1100" y="714" font-size="14" font-weight="600" fill="#1d2a3a">Yang Ming Joint Service Agreement</text>
<rect x="876" y="744" width="724" height="96" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.5"/>
<text x="890" y="772" font-size="15" font-weight="800" fill="#1d2a3a">The OCEAN Alliance</text>
<text x="890" y="796" font-size="14" font-weight="600" fill="#5f6b78">No. 012426</text>
<text x="1100" y="772" font-size="14" font-weight="600" fill="#1d2a3a">American President Lines·APL; CMA CGM S.A.;</text>
<text x="1100" y="796" font-size="14" font-weight="600" fill="#1d2a3a">COSCO Shipping Lines; Evergreen Line Joint Service</text>
<text x="1100" y="820" font-size="14" font-weight="600" fill="#1d2a3a">Agreement; OOCL(Europe)·Orient Overseas Container Line</text>
<text x="876" y="868" font-size="13" font-weight="600" fill="#5f6b78">FMC 협정은 미국 항로가 대상입니다. 미국을 거치지 않는 항로의 협력과 개별 슬롯 협정은 따로 확인합니다.</text>
</svg>
