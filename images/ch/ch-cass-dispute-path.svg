<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="m-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5f6b78"/></marker><marker id="m-org" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30" y="30" width="520" height="820" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<rect x="570" y="30" width="520" height="820" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<rect x="1110" y="30" width="532" height="820" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="56" y="76" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">① 송금 전: CASSLink 이의</text>
<text x="56" y="108" font-size="20" font-weight="500" fill="#5f6b78" text-anchor="start">포워더가 청구 오류를 찾았을 때</text>
<text x="596" y="76" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">② 송금일: 분쟁이 남았을 때</text>
<text x="596" y="108" font-size="20" font-weight="500" fill="#5f6b78" text-anchor="start">분쟁 금액을 빼고 송금하는 경우</text>
<text x="1136" y="76" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">③ 항공사가 정정할 때</text>
<text x="1136" y="108" font-size="20" font-weight="500" fill="#5f6b78" text-anchor="start">운임 정정 통지(CCA)</text>
<rect x="60" y="140" width="460" height="96" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="290.0" y="180.0" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="middle">오류 발견</text>
<text x="290.0" y="210.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">중량·요율·PP/CC·할증료</text>
<line x1="290" y1="240" x2="290" y2="270" stroke="#5f6b78" stroke-width="3" marker-end="url(#m-ink)"/>
<rect x="60" y="276" width="460" height="110" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="290.0" y="308.0" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="middle">CASSLink 온라인 이의 등록</text>
<text x="290.0" y="338.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">이의 등록 마감 안에</text>
<text x="290.0" y="368.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">(마감은 CASS 한국 청구 달력)</text>
<line x1="290" y1="390" x2="290" y2="420" stroke="#5f6b78" stroke-width="3" marker-end="url(#m-ink)"/>
<rect x="60" y="426" width="460" height="180" rx="12" fill="#ffffff" stroke="#e4572e" stroke-width="2.5"/>
<text x="290.0" y="478.0" font-size="21" font-weight="800" fill="#e4572e" text-anchor="middle">항공사 응답</text>
<text x="290.0" y="508.0" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="middle">수락: 요청대로 정정</text>
<text x="290.0" y="538.0" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="middle">거절: 정정하지 않음</text>
<text x="290.0" y="568.0" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="middle">정정: 다른 금액으로 고침</text>
<line x1="290" y1="610" x2="290" y2="640" stroke="#5f6b78" stroke-width="3" marker-end="url(#m-ink)"/>
<rect x="60" y="646" width="460" height="160" rx="12" fill="#ffffff" stroke="#c9d2dc" stroke-width="2"/>
<text x="290.0" y="703.0" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="middle">응답 마감과</text>
<text x="290.0" y="733.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">응답이 없는 이의의 처리는</text>
<text x="290.0" y="763.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">CASS 국가 규정으로 확인</text>
<rect x="600" y="140" width="460" height="130" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="830.0" y="182.0" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="middle">분쟁 금액 서면 통지</text>
<text x="830.0" y="212.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">AWB 번호·금액·사유·이의 번호를</text>
<text x="830.0" y="242.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">송금 전에 정산소와 항공사에</text>
<line x1="830" y1="274" x2="830" y2="304" stroke="#5f6b78" stroke-width="3" marker-end="url(#m-ink)"/>
<rect x="600" y="310" width="460" height="96" rx="12" fill="#ffffff" stroke="#e4572e" stroke-width="2.5"/>
<text x="830.0" y="350.0" font-size="22" font-weight="800" fill="#e4572e" text-anchor="middle">분쟁이 없는 금액은</text>
<text x="830.0" y="380.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">송금일에 송금</text>
<path d="M 700 410 L 700 460" fill="none" stroke="#1f8a5b" stroke-width="3" marker-end="url(#m-green)"/>
<path d="M 960 410 L 960 460" fill="none" stroke="#d9482b" stroke-width="3" marker-end="url(#m-red)"/>
<rect x="600" y="466" width="210" height="130" rx="12" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5"/>
<text x="705.0" y="508.0" font-size="22" font-weight="800" fill="#1f8a5b" text-anchor="middle">상업적 분쟁</text>
<text x="705.0" y="538.0" font-size="18" font-weight="600" fill="#1d2a3a" text-anchor="middle">확인되면</text>
<text x="705.0" y="568.0" font-size="18" font-weight="600" fill="#1d2a3a" text-anchor="middle">선언 보류·철회</text>
<rect x="850" y="466" width="210" height="130" rx="12" fill="#ffffff" stroke="#d9482b" stroke-width="2.5"/>
<text x="955.0" y="508.0" font-size="22" font-weight="800" fill="#d9482b" text-anchor="middle">근거가 없으면</text>
<text x="955.0" y="538.0" font-size="18" font-weight="600" fill="#1d2a3a" text-anchor="middle">미송금으로</text>
<text x="955.0" y="568.0" font-size="18" font-weight="600" fill="#1d2a3a" text-anchor="middle">이상 통지</text>
<rect x="600" y="646" width="460" height="160" rx="12" fill="#ffffff" stroke="#c9d2dc" stroke-width="2"/>
<text x="830.0" y="688.0" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle">불이행 선언이 철회되면</text>
<text x="830.0" y="718.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">커미션 지급, 이상 통지 삭제</text>
<text x="830.0" y="748.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">(1991년 EU 결정이 설명한 규칙)</text>
<text x="830.0" y="778.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">증빙·예치 요건은 CASS 국가 규정</text>
<rect x="1140" y="140" width="472" height="110" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="1376.0" y="187.0" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="middle">항공사 재계량·요율 오류</text>
<text x="1376.0" y="217.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">운임 정정 통지(CCA) 발행</text>
<line x1="1376" y1="254" x2="1376" y2="284" stroke="#5f6b78" stroke-width="3" marker-end="url(#m-ink)"/>
<rect x="1140" y="290" width="472" height="110" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2"/>
<text x="1376.0" y="337.0" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="middle">정정분이 청구에 반영</text>
<text x="1376.0" y="367.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">원 AWB·부킹 확인·화주 서류와 대조</text>
<line x1="1376" y1="404" x2="1376" y2="434" stroke="#5f6b78" stroke-width="3" marker-end="url(#m-ink)"/>
<rect x="1140" y="440" width="472" height="96" rx="12" fill="#ffffff" stroke="#e4572e" stroke-width="2.5"/>
<text x="1376.0" y="480.0" font-size="22" font-weight="800" fill="#e4572e" text-anchor="middle">정정 내용에 동의하지 않으면</text>
<text x="1376.0" y="510.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">그 항공사와 직접 협의</text>
<rect x="1140" y="590" width="472" height="216" rx="12" fill="#ffffff" stroke="#d9482b" stroke-width="2.5"/>
<text x="1376.0" y="645.0" font-size="21" font-weight="800" fill="#d9482b" text-anchor="middle">화주·파트너 청구와 연결</text>
<text x="1376.0" y="675.0" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="middle">정정분을 House AWB·화주 청구서·</text>
<text x="1376.0" y="705.0" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="middle">파트너 요금 청구서(debit note)에</text>
<text x="1376.0" y="735.0" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="middle">반영할지 정함</text>
<text x="1376.0" y="765.0" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="middle">(화주와의 견적·계약 조건에 따름)</text>
<text x="836" y="896" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="middle">근거: CASSLink 온라인 분쟁 처리(Air Cargo News 2022), 불이행 선언의 보류·철회(EU 결정 91/481/EEC). 마감과 기한은 CASS 국가 규정.</text>
</svg>
