<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="m-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5f6b78"/></marker><marker id="m-org" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<rect x="30" y="30" width="520" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<rect x="570" y="30" width="520" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<rect x="1110" y="30" width="532" height="880" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="16"/>
<text x="56" y="76" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">선불(PP) Master AWB</text>
<text x="56" y="108" font-size="20" font-weight="500" fill="#5f6b78" text-anchor="start">출발지 CASS 청구서로 정산</text>
<rect x="60" y="150" width="460" height="104" rx="12" fill="#e8f0fb" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="290.0" y="194.0" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="middle">+ 기본운임</text>
<text x="290.0" y="224.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">화물 중량에 비례하는 운임</text>
<rect x="60" y="280" width="460" height="104" rx="12" fill="#e8f0fb" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="290.0" y="324.0" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="middle">+ 할증료</text>
<text x="290.0" y="354.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">유류·보안할증료, 할인되지 않음</text>
<rect x="60" y="410" width="460" height="104" rx="12" fill="#e8f0fb" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="290.0" y="454.0" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="middle">+ 항공사 기타 요금</text>
<text x="290.0" y="484.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">위험물 취급수수료 등, 항공사가 정함</text>
<rect x="60" y="560" width="460" height="120" rx="12" fill="#ffffff" stroke="#c9d2dc" stroke-width="2"/>
<text x="290.0" y="597.0" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="middle">화주에게 받는 돈</text>
<text x="290.0" y="627.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">신용 기간(예: 30일·60일) 뒤 수금</text>
<text x="290.0" y="657.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">CASS 정산과 별개 계약</text>
<text x="290" y="740" font-size="20" font-weight="800" fill="#d9482b" text-anchor="middle">포워더가 송금일에 항공사에 냄</text>
<text x="290" y="770" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">(화주 미수와 무관)</text>
<text x="596" y="76" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">착불(CC) Master AWB</text>
<text x="596" y="108" font-size="20" font-weight="500" fill="#5f6b78" text-anchor="start">운임은 도착지에서 수하인이 냄</text>
<rect x="600" y="150" width="460" height="104" rx="12" fill="#ffffff" stroke="#c9d2dc" stroke-width="2"/>
<text x="830.0" y="194.0" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="middle">운임·요금</text>
<text x="830.0" y="224.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">도착지에서 수하인이 냄</text>
<rect x="600" y="280" width="460" height="120" rx="12" fill="#e6f4ed" stroke="#1f8a5b" stroke-width="2.5"/>
<text x="830.0" y="317.0" font-size="22" font-weight="800" fill="#1f8a5b" text-anchor="middle">인도의 조건</text>
<text x="830.0" y="347.0" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">요금을 내야 인도를 청구</text>
<text x="830.0" y="377.0" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">몬트리올 협약 제13조 제1항, 상법 제920조·제141조</text>
<rect x="600" y="426" width="460" height="120" rx="12" fill="#ffffff" stroke="#e4572e" stroke-width="2"/>
<text x="830.0" y="463.0" font-size="22" font-weight="800" fill="#e4572e" text-anchor="middle">수하인이 안 받거나 연락 두절</text>
<text x="830.0" y="493.0" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">송하인의 처분권이 되살아남</text>
<text x="830.0" y="523.0" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="middle">몬트리올 협약 제12조 제4항, 상법 제917조 제4항</text>
<rect x="600" y="572" width="460" height="104" rx="12" fill="#ffffff" stroke="#c9d2dc" stroke-width="2"/>
<text x="830.0" y="616.0" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="middle">착지불 수수료</text>
<text x="830.0" y="646.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">기타 요금이라 항공사가 정함</text>
<text x="830" y="740" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="middle">착불을 받는지와 수수료 조건은</text>
<text x="830" y="770" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="middle">부킹 전에 항공사에 확인</text>
<text x="1136" y="76" font-size="26" font-weight="800" fill="#1d2a3a" text-anchor="start">포워더끼리의 착불 거래</text>
<text x="1136" y="108" font-size="20" font-weight="500" fill="#5f6b78" text-anchor="start">공정위 의결서가 조사한 한국행 도착지불 거래</text>
<rect x="1140" y="140" width="472" height="96" rx="12" fill="#ffffff" stroke="#5f6b78" stroke-width="2"/>
<text x="1376.0" y="180.0" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="middle">수하인(수입자)</text>
<text x="1376.0" y="210.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">도착지 포워더와 운송계약</text>
<line x1="1376" y1="240" x2="1376" y2="268" stroke="#5f6b78" stroke-width="3" marker-end="url(#m-ink)"/>
<rect x="1140" y="274" width="472" height="96" rx="12" fill="#ffffff" stroke="#5f6b78" stroke-width="2"/>
<text x="1376.0" y="314.0" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="middle">도착지 포워더</text>
<text x="1376.0" y="344.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">출발지 파트너에게 운송 의뢰</text>
<line x1="1376" y1="374" x2="1376" y2="402" stroke="#5f6b78" stroke-width="3" marker-end="url(#m-ink)"/>
<rect x="1140" y="408" width="472" height="96" rx="12" fill="#ffffff" stroke="#1f6fd1" stroke-width="2.5"/>
<text x="1376.0" y="448.0" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="middle">출발지 포워더</text>
<text x="1376.0" y="478.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">항공사와 계약하고 운임을 냄</text>
<line x1="1376" y1="508" x2="1376" y2="536" stroke="#5f6b78" stroke-width="3" marker-end="url(#m-ink)"/>
<rect x="1140" y="542" width="472" height="130" rx="12" fill="#ffffff" stroke="#e4572e" stroke-width="2"/>
<text x="1376.0" y="584.0" font-size="21" font-weight="800" fill="#e4572e" text-anchor="middle">요금 청구서(debit note)</text>
<text x="1376.0" y="614.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">AWB 번호·중량·할증료·기본운임을</text>
<text x="1376.0" y="644.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">항공사 청구 그대로 적어 도착지 포워더에게</text>
<text x="1376" y="718" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="middle">도착지 포워더는 수하인에게 청구서(invoice)</text>
<text x="1376" y="780" font-size="20" font-weight="800" fill="#d9482b" text-anchor="middle">매매 조건이 착불이어도</text>
<text x="1376" y="810" font-size="20" font-weight="800" fill="#d9482b" text-anchor="middle">Master AWB는 선불로 출발지 CASS에</text>
<text x="1376" y="840" font-size="20" font-weight="800" fill="#d9482b" text-anchor="middle">청구될 수 있음</text>
</svg>
