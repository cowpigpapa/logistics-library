<text x="148.8" y="490.8" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="start">시차로 메우지 못하는 급등분</text>
<text x="148.8" y="515.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">→ 긴급 유류할증(EBS 등)을 따로 붙인다</text>
