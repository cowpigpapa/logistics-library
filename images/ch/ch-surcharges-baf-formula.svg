<text x="1038.4" y="514.8" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="start">유가가 내렸는데 BAF는 그대로?</text>
<text x="1038.4" y="539.0" font-size="18" font-weight="600" fill="#5f6b78" text-anchor="start">→ ①과 ④로 설명한다</text>
