<text x="72" y="418" font-size="24" font-weight="800" fill="#d9482b" text-anchor="start">인도</text>
<text x="72" y="453" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">도착 운송수단 위에서</text>
<text x="72" y="482" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">하차 준비된 상태로 인도</text>
<text x="72" y="511" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start"> </text>
<text x="72" y="540" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">하차 작업과 그 위험: 매수인</text>
<text x="72" y="569" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">DDP도 하차는 DAP와 같음</text>
<rect x="56" y="660" width="468" height="200" fill="#ffffff" stroke="#1d2a3a" stroke-width="2.5" rx="12"/>
<text x="72" y="698" font-size="24" font-weight="800" fill="#1d2a3a" text-anchor="start">하차 비용</text>
<text x="72" y="733" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">매수인</text>
<text x="72" y="761" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">매도인 운송계약에 하차비가 들어 있으면</text>
<text x="72" y="789" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">매도인이 내고 따로 합의 없이 회수 불가</text>
<rect x="602" y="380" width="468" height="250" fill="#fff7f5" stroke="#d9482b" stroke-width="2.5" rx="12"/>
<text x="618" y="418" font-size="24" font-weight="800" fill="#d9482b" text-anchor="start">인도</text>
<text x="618" y="453" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">지정 장소에서 내린 뒤 인도</text>
<text x="618" y="482" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start"> </text>
<text x="618" y="511" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">하차 작업·위험·비용: 매도인</text>
<text x="618" y="540" font-size="21" font-weight="500" fill="#d9482b" text-anchor="start">매도인이 목적지에서 하차를</text>
<text x="618" y="569" font-size="21" font-weight="500" fill="#d9482b" text-anchor="start">해야 하는 유일한 조건</text>
<rect x="602" y="660" width="468" height="200" fill="#ffffff" stroke="#1d2a3a" stroke-width="2.5" rx="12"/>
<text x="618" y="698" font-size="24" font-weight="800" fill="#1d2a3a" text-anchor="start">확인할 것</text>
<text x="618" y="733" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">그 장소에서 하차를 수배할 수 있는지</text>
<text x="618" y="761" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">하차 위험을 지기 싫으면 DAP</text>
<rect x="1148" y="380" width="468" height="250" fill="#fff8f4" stroke="#e4572e" stroke-width="2.5" rx="12"/>
<text x="1164" y="418" font-size="24" font-weight="800" fill="#e4572e" text-anchor="start">인도·위험</text>
<text x="1164" y="453" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">위험은 이미 출발지에서</text>
<text x="1164" y="482" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">최초 운송인에게 넘긴 때 이전</text>
<text x="1164" y="511" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start"> </text>
<text x="1164" y="540" font-size="21" font-weight="500" fill="#1d2a3a" text-anchor="start">하차 작업과 위험: 매수인</text>
<rect x="1148" y="660" width="468" height="200" fill="#ffffff" stroke="#1d2a3a" stroke-width="2.5" rx="12"/>
<text x="1164" y="698" font-size="24" font-weight="800" fill="#1d2a3a" text-anchor="start">하차·양하 비용</text>
<text x="1164" y="733" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">운송계약에 매도인 부담으로</text>
<text x="1164" y="761" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">되어 있으면 매도인, 아니면 매수인</text>
<text x="1164" y="789" font-size="20" font-weight="500" fill="#1d2a3a" text-anchor="start">CFR·CIF 목적항 양하비도 같은 구조</text>
