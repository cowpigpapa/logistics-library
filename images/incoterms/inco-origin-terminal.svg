<polygon points="170,360 156,384 184,384" fill="#d9482b"/>
<text x="170" y="414" font-size="20" font-weight="800" fill="#d9482b" text-anchor="middle">EXW 인도</text>
<text x="170" y="442" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="middle">싣지 않은 상태로</text>
<text x="170" y="465" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="middle">매수인 처분에 맡김(상차 의무 없음)</text>
<polygon points="390,360 376,384 404,384" fill="#d9482b"/>
<text x="390" y="414" font-size="20" font-weight="800" fill="#d9482b" text-anchor="middle">FCA (a) 인도</text>
<text x="390" y="442" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="middle">매수인 차량에 실은 때</text>
<text x="390" y="465" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="middle">상차는 매도인</text>
<polygon points="610,360 596,384 624,384" fill="#d9482b"/>
<text x="610" y="414" font-size="20" font-weight="800" fill="#d9482b" text-anchor="middle">FCA (b) 인도</text>
<text x="610" y="442" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="middle">매도인 차량 위, 하차 준비 상태</text>
<text x="610" y="465" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="middle">하차는 매수인 쪽(운송인)</text>
<polygon points="1300,360 1286,384 1314,384" fill="#d9482b"/>
<text x="1300" y="414" font-size="20" font-weight="800" fill="#d9482b" text-anchor="middle">FOB 인도</text>
<text x="1300" y="442" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="middle">본선에 적재한 때</text>
<text x="1300" y="465" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="middle">그 전 터미널 비용은 매도인 쪽</text>
<rect x="620" y="560" width="680" height="56" fill="#fdf4dc" stroke="#c99a2e" stroke-width="2" rx="10"/>
<text x="960" y="596" font-size="19" font-weight="700" fill="#1d2a3a" text-anchor="middle">THC·부두사용료·CFS 작업료·씰 비용: 규칙에 항목 이름이 없음(③)</text>
<line x1="620" y1="588" x2="620" y2="530" stroke="#c99a2e" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="1300" y1="588" x2="1300" y2="530" stroke="#c99a2e" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="120" y="650" width="680" height="180" fill="#f5f9fe" stroke="#1f6fd1" stroke-width="2.5" rx="12"/>
<text x="136" y="686" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="start">FCA (b) 터미널 인도로 읽으면</text>
<text x="136" y="718" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">반입 뒤 터미널 안의 비용 = 인도 후 비용</text>
<text x="136" y="744" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">→ 원칙상 매수인</text>
<text x="136" y="770" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">다만 선사·포워더가 송하인에게 청구하는 일이 많아</text>
<text x="136" y="796" font-size="19" font-weight="500" fill="#d9482b" text-anchor="start">항목별 부담을 계약에 적어야 하는 대표 항목</text>
<rect x="870" y="650" width="680" height="180" fill="#f4fbf7" stroke="#1f8a5b" stroke-width="2.5" rx="12"/>
<text x="886" y="686" font-size="22" font-weight="800" fill="#1f8a5b" text-anchor="start">FOB로 읽으면</text>
<text x="886" y="718" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">본선에 실어야 인도가 끝나므로</text>
<text x="886" y="744" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">그 전 터미널 비용 = 인도 전 비용</text>
<text x="886" y="770" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">→ 원칙상 매도인</text>
<text x="886" y="796" font-size="19" font-weight="500" fill="#d9482b" text-anchor="start">매수인 지정 포워더의 청구 범위를 계약에 적을 것</text>
</svg>
