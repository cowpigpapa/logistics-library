<circle cx="620" cy="530" r="5" fill="#1f8a5b"/>
<rect x="760.0" y="462.0" width="872.0" height="120.0" fill="#ffffff" stroke="#1d2a3a" stroke-width="2" rx="12"/>
<text x="776.0" y="496.5" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="start">Cd·Pb 기호 · 별도 유예 없음</text>
<text x="776.0" y="527.3" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">카드뮴 0.002% 초과 또는 납 0.004% 초과 시. 분리수거 기호 아래, 그 기호의 4분의 1 이상 크기</text>
