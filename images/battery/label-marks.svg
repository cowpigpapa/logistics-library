<text x="776.0" y="361.3" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">가장 넓은 면의 3% 이상(원통형 셀은 1.5% 이상), 최대 5 × 5 cm. 0.47 × 0.47 cm보다 작아지면 본체</text>
<text x="776.0" y="386.3" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">대신 포장에 1 × 1 cm 이상</text>
