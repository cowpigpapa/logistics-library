<text x="776.0" y="632.5" font-size="21" font-weight="800" fill="#e4572e" text-anchor="start">QR 코드 · 2027년 2월 18일부터</text>
<text x="776.0" y="663.3" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">모든 배터리. LMT·2kWh 초과 산업용·전기차는 배터리 여권으로, 그 밖의 배터리는 라벨 정보·적합성</text>
<text x="776.0" y="688.3" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">선언 등으로 연결</text>
<line x1="344.0" y1="756.0" x2="760.0" y2="673.0" stroke="#e4572e" stroke-width="2"/>
<circle cx="344" cy="756" r="5" fill="#e4572e"/>
<rect x="760.0" y="764.0" width="872.0" height="120.0" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="12"/>
<text x="776.0" y="800.0" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">본체에 표시할 수 없으면 포장과 동봉 서류에 표시합니다(제13조(7)). 이때는 포장이 법정 표시</text>
<text x="776.0" y="825.0" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">매체이므로 재포장·라벨 작업으로 가리면 안 됩니다.</text>
<text x="400.0" y="860.0" font-size="16" font-weight="600" fill="#5f6b78" text-anchor="middle">그림의 배치와 비율은 예시입니다</text>
