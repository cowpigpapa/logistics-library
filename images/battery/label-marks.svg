<text x="776.0" y="195.3" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">"2026년 8월 18일 또는 이행법률 발효 후 18개월 중 늦은 날"부터. 실제 적용일은 제13조(10)</text>
<text x="776.0" y="220.3" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">이행법률의 발효일로 계산합니다.</text>
