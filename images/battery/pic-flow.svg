<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="ar-1d2a3a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker><marker id="ar-5f6b78" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5f6b78"/></marker><marker id="ar-d9482b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="ar-1f6fd1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="ar-1f8a5b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="ar-e4572e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker><marker id="ar-c98a0b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c98a0b"/></marker><marker id="ar-8a96a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a96a3"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<text x="40.0" y="58.0" font-size="30" font-weight="800" fill="#1d2a3a" text-anchor="start">사전 서면 통지 및 동의(PIC): 통지에서 회수 완료까지</text>
<text x="40.0" y="94.0" font-size="19" font-weight="500" fill="#5f6b78" text-anchor="start">폐기물운송규정 제5~9조. 기한은 영업일과 일을 구분합니다.</text>
<rect x="40.0" y="130.0" width="1592.0" height="190.0" fill="#ffffff" stroke="#c9d2dc" stroke-width="2" rx="14"/>
<rect x="40.0" y="130.0" width="150.0" height="190.0" fill="#eef1f4" stroke="#1d2a3a" stroke-width="2" rx="14"/>
<text x="115.0" y="233.0" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="middle">통지자</text>
<rect x="40.0" y="340.0" width="1592.0" height="230.0" fill="#ffffff" stroke="#c9d2dc" stroke-width="2" rx="14"/>
<rect x="40.0" y="340.0" width="150.0" height="230.0" fill="#fdeee8" stroke="#e4572e" stroke-width="2" rx="14"/>
<text x="115.0" y="449.0" font-size="21" font-weight="800" fill="#e4572e" text-anchor="middle">관할당국</text>
<text x="115.0" y="477.0" font-size="15.5" font-weight="700" fill="#e4572e" text-anchor="middle">발송·경유·목적지</text>
<rect x="40.0" y="590.0" width="1592.0" height="190.0" fill="#ffffff" stroke="#c9d2dc" stroke-width="2" rx="14"/>
<rect x="40.0" y="590.0" width="150.0" height="190.0" fill="#e7f4ed" stroke="#1f8a5b" stroke-width="2" rx="14"/>
<text x="115.0" y="693.0" font-size="21" font-weight="800" fill="#1f8a5b" text-anchor="middle">운송인·시설</text>
<rect x="210.0" y="150.0" width="250.0" height="150.0" fill="#eef1f4" stroke="#1d2a3a" stroke-width="2" rx="12"/>
<text x="222.0" y="178.7" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="start">① 통지 제출</text>
<text x="222.0" y="207.6" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">통지서(부속서 IA)</text>
<text x="222.0" y="230.6" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">이동서류(부속서 IB)</text>
<text x="222.0" y="253.6" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">계약서 사본, 재정보증</text>
<rect x="210.0" y="370.0" width="250.0" height="170.0" fill="#fdeee8" stroke="#e4572e" stroke-width="2" rx="12"/>
<text x="222.0" y="398.7" font-size="19" font-weight="800" fill="#e4572e" text-anchor="start">② 서류 보완 요청</text>
<text x="222.0" y="427.6" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">제출 후 10영업일 이내 요청,</text>
<text x="222.0" y="450.6" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">통지자는 10영업일 이내 답변.</text>
<text x="222.0" y="473.6" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">추가 요청은 최대 두 번</text>
<rect x="490.0" y="370.0" width="230.0" height="170.0" fill="#fdeee8" stroke="#e4572e" stroke-width="2" rx="12"/>
<text x="502.0" y="398.7" font-size="19" font-weight="800" fill="#e4572e" text-anchor="start">③ 인정과 완료</text>
<text x="502.0" y="427.6" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">목적지·경유 당국은</text>
<text x="502.0" y="450.6" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">3영업일 이내 인정 통보.</text>
<text x="502.0" y="473.6" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">적정하게 완료되면 목적지</text>
<text x="502.0" y="496.6" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">당국이 통지자에게 알림</text>
<rect x="750.0" y="370.0" width="270.0" height="170.0" fill="#fdeee8" stroke="#e4572e" stroke-width="2" rx="12"/>
<text x="762.0" y="398.7" font-size="19" font-weight="800" fill="#e4572e" text-anchor="start">④ 30일 이내 결정</text>
<text x="762.0" y="427.6" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">조건 없는 동의 · 조건부 동의 ·</text>
<text x="762.0" y="450.6" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">이의 · 부동의. 경유 당국은</text>
<text x="762.0" y="473.6" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">묵시적 동의 가능</text>
<rect x="1050.0" y="370.0" width="270.0" height="170.0" fill="#fdeee8" stroke="#e4572e" stroke-width="2" rx="12"/>
<text x="1062.0" y="398.7" font-size="19" font-weight="800" fill="#e4572e" text-anchor="start">⑤ 동의 유효기간</text>
<text x="1062.0" y="427.6" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">각 당국이 정한 기간 중 가장 이른</text>
<text x="1062.0" y="450.6" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">종료일에 만료, 최대 1년</text>
<rect x="1050.0" y="150.0" width="270.0" height="150.0" fill="#eef1f4" stroke="#1d2a3a" stroke-width="2" rx="12"/>
<text x="1062.0" y="178.7" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="start">⑥ 이동서류 제출</text>
<text x="1062.0" y="207.6" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">운송 2영업일 전. 실제</text>
<text x="1062.0" y="230.6" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">수량·운송인·컨테이너 번호는</text>
<text x="1062.0" y="253.6" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">출발 전까지(제16조(2))</text>
<rect x="1350.0" y="610.0" width="258.0" height="150.0" fill="#e7f4ed" stroke="#1f8a5b" stroke-width="2" rx="12"/>
<text x="1362.0" y="638.7" font-size="19" font-weight="800" fill="#1f8a5b" text-anchor="start">⑦ 운송과 수령</text>
<text x="1362.0" y="667.6" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">동의 유효기간 안에 시설이 수령</text>
<rect x="1350.0" y="370.0" width="258.0" height="170.0" fill="#ffffff" stroke="#d9482b" stroke-width="2" rx="12" stroke-dasharray="7 5"/>
<text x="1362.0" y="398.7" font-size="19" font-weight="800" fill="#d9482b" text-anchor="start">동의 철회</text>
<text x="1362.0" y="427.6" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">조성 불일치, 조건 위반,</text>
<text x="1362.0" y="450.6" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">재정보증·계약 종료 등이면</text>
<text x="1362.0" y="473.6" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">철회. 운송·처리를 계속할 수</text>
<text x="1362.0" y="496.6" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">없음</text>
<rect x="1050.0" y="610.0" width="270.0" height="150.0" fill="#e7f4ed" stroke="#1f8a5b" stroke-width="2" rx="12"/>
<text x="1062.0" y="638.7" font-size="19" font-weight="800" fill="#1f8a5b" text-anchor="start">⑧ 회수·처분 완료</text>
<text x="1062.0" y="667.6" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">수령 후 1년 이내(더 짧게 정해질</text>
<text x="1062.0" y="690.6" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="start">수 있음)</text>
<line x1="440.0" y1="300.0" x2="440.0" y2="366.0" stroke="#1d2a3a" stroke-width="3" marker-end="url(#ar-1d2a3a)"/>
<line x1="460.0" y1="455.0" x2="486.0" y2="455.0" stroke="#e4572e" stroke-width="3" marker-end="url(#ar-e4572e)"/>
<line x1="720.0" y1="455.0" x2="746.0" y2="455.0" stroke="#e4572e" stroke-width="3" marker-end="url(#ar-e4572e)"/>
<line x1="1020.0" y1="455.0" x2="1046.0" y2="455.0" stroke="#e4572e" stroke-width="3" marker-end="url(#ar-e4572e)"/>
<line x1="1185.0" y1="370.0" x2="1185.0" y2="304.0" stroke="#1d2a3a" stroke-width="3" marker-end="url(#ar-1d2a3a)"/>
<polyline points="1320.0,225.0 1622.0,225.0 1622.0,685.0 1618.0,685.0" fill="none" stroke="#1d2a3a" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar-1d2a3a)"/>
<line x1="1346.0" y1="685.0" x2="1324.0" y2="685.0" stroke="#1f8a5b" stroke-width="3" marker-end="url(#ar-1f8a5b)"/>
<text x="1530.0" y="590.0" font-size="1" font-weight="500" fill="#1d2a3a" text-anchor="start"></text>
<text x="220.0" y="320.0" font-size="15" font-weight="700" fill="#5f6b78" text-anchor="start">제5조, 제6조, 제7조</text>
<text x="220.0" y="560.0" font-size="15" font-weight="700" fill="#5f6b78" text-anchor="start">제8조</text>
<text x="500.0" y="560.0" font-size="15" font-weight="700" fill="#5f6b78" text-anchor="start">제8조(7)~(12)</text>
<text x="760.0" y="560.0" font-size="15" font-weight="700" fill="#5f6b78" text-anchor="start">제9조(1)~(3)</text>
<text x="1060.0" y="560.0" font-size="15" font-weight="700" fill="#5f6b78" text-anchor="start">제9조(4)</text>
<text x="1360.0" y="560.0" font-size="15" font-weight="700" fill="#5f6b78" text-anchor="start">제9조(7)~(9)</text>
<text x="1360.0" y="780.0" font-size="15" font-weight="700" fill="#5f6b78" text-anchor="start">제9조(4)·(5)</text>
<text x="1060.0" y="780.0" font-size="15" font-weight="700" fill="#5f6b78" text-anchor="start">제9조(6)</text>
<rect x="40.0" y="812.0" width="1592.0" height="90.0" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="14"/>
<text x="64.0" y="848.0" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">통지할 때 계약(제6조)과 재정보증 또는 동등한 보험(제7조)을 함께 갖춥니다. 재정보증은 수송비, 회수·처분 비용, 90일 보관 비용을 보장하고, 시설의 완료 증명서가 접수되면</text>
<text x="64.0" y="874.0" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">해제됩니다.</text>
</svg>
