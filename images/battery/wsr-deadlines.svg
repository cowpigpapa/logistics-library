<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="ar-1d2a3a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker><marker id="ar-5f6b78" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5f6b78"/></marker><marker id="ar-d9482b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="ar-1f6fd1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="ar-1f8a5b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="ar-e4572e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker><marker id="ar-c98a0b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c98a0b"/></marker><marker id="ar-8a96a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a96a3"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<text x="40.0" y="62.0" font-size="30" font-weight="800" fill="#1d2a3a" text-anchor="start">폐기물 운송 서류와 기한: 구 규정 → 현행 규정</text>
<text x="40.0" y="98.0" font-size="20" font-weight="500" fill="#5f6b78" text-anchor="start">규정 (EC) No 1013/2006 → 규정 (EU) 2024/1157, 2026년 5월 21일부터 일반 적용</text>
<text x="52.0" y="140.0" font-size="20" font-weight="800" fill="#5f6b78" text-anchor="start">항목</text>
<text x="462.0" y="140.0" font-size="20" font-weight="800" fill="#5f6b78" text-anchor="start">구 규정</text>
<text x="952.0" y="140.0" font-size="20" font-weight="800" fill="#5f6b78" text-anchor="start">현행 규정</text>
<text x="1462.0" y="140.0" font-size="20" font-weight="800" fill="#5f6b78" text-anchor="start">근거</text>
<line x1="40.0" y1="154.0" x2="1632.0" y2="154.0" stroke="#c9d2dc" stroke-width="2"/>
<rect x="30.0" y="166.0" width="1612.0" height="86.0" fill="#f6f8fa" stroke="#f6f8fa" stroke-width="0" rx="8"/>
<text x="52.0" y="218.0" font-size="20" font-weight="700" fill="#1d2a3a" text-anchor="start">서류 제출 방식</text>
<rect x="450.0" y="176.0" width="430.0" height="70.0" fill="#eef1f4" stroke="#8a96a3" stroke-width="2" rx="12"/>
<text x="464.0" y="217.8" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="start">우편이 기본, 합의하면 팩스·이메일</text>
<line x1="888.0" y1="211.0" x2="932.0" y2="211.0" stroke="#1f6fd1" stroke-width="4" marker-end="url(#ar-1f6fd1)"/>
<rect x="940.0" y="176.0" width="490.0" height="70.0" fill="#e9f1fc" stroke="#1f6fd1" stroke-width="2" rx="12"/>
<text x="954.0" y="217.8" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="start">전자 제출·교환 의무(중앙시스템 또는 상호운용 시스템)</text>
<text x="1462.0" y="218.0" font-size="19" font-weight="700" fill="#5f6b78" text-anchor="start">제27조</text>
<text x="52.0" y="308.0" font-size="20" font-weight="700" fill="#1d2a3a" text-anchor="start">PIC 이동서류 제출</text>
<rect x="450.0" y="266.0" width="430.0" height="70.0" fill="#eef1f4" stroke="#8a96a3" stroke-width="2" rx="12"/>
<text x="464.0" y="307.8" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="start">운송 3영업일 전</text>
<line x1="888.0" y1="301.0" x2="932.0" y2="301.0" stroke="#1f6fd1" stroke-width="4" marker-end="url(#ar-1f6fd1)"/>
<rect x="940.0" y="266.0" width="490.0" height="70.0" fill="#e9f1fc" stroke="#1f6fd1" stroke-width="2" rx="12"/>
<text x="954.0" y="295.3" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="start">2영업일 전. 실제 수량·운송인·컨테이너 번호는 출발</text>
<text x="954.0" y="320.3" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="start">전까지</text>
<text x="1462.0" y="308.0" font-size="19" font-weight="700" fill="#5f6b78" text-anchor="start">제16조(2)</text>
<rect x="30.0" y="346.0" width="1612.0" height="86.0" fill="#f6f8fa" stroke="#f6f8fa" stroke-width="0" rx="8"/>
<text x="52.0" y="398.0" font-size="20" font-weight="700" fill="#1d2a3a" text-anchor="start">부속서 VII 서류</text>
<rect x="450.0" y="356.0" width="430.0" height="70.0" fill="#eef1f4" stroke="#8a96a3" stroke-width="2" rx="12"/>
<text x="464.0" y="397.8" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="start">주선자가 운송 전 서명, 화물에 동반</text>
<line x1="888.0" y1="391.0" x2="932.0" y2="391.0" stroke="#1f6fd1" stroke-width="4" marker-end="url(#ar-1f6fd1)"/>
<rect x="940.0" y="356.0" width="490.0" height="70.0" fill="#e9f1fc" stroke="#1f6fd1" stroke-width="2" rx="12"/>
<text x="954.0" y="397.8" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="start">운송 시작 2영업일 전까지 전자 작성</text>
<text x="1462.0" y="398.0" font-size="19" font-weight="700" fill="#5f6b78" text-anchor="start">제18조(4)~(6)</text>
<text x="52.0" y="488.0" font-size="20" font-weight="700" fill="#1d2a3a" text-anchor="start">부속서 VII 수령 확인</text>
<rect x="450.0" y="446.0" width="430.0" height="70.0" fill="#eef1f4" stroke="#8a96a3" stroke-width="2" rx="12"/>
<text x="464.0" y="487.8" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="start">수령 시 서명, 기한 없음</text>
<line x1="888.0" y1="481.0" x2="932.0" y2="481.0" stroke="#1f6fd1" stroke-width="4" marker-end="url(#ar-1f6fd1)"/>
<rect x="940.0" y="446.0" width="490.0" height="70.0" fill="#e9f1fc" stroke="#1f6fd1" stroke-width="2" rx="12"/>
<text x="954.0" y="487.8" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="start">수령 후 2영업일 이내</text>
<text x="1462.0" y="488.0" font-size="19" font-weight="700" fill="#5f6b78" text-anchor="start">제18조(8)</text>
<rect x="30.0" y="526.0" width="1612.0" height="86.0" fill="#f6f8fa" stroke="#f6f8fa" stroke-width="0" rx="8"/>
<text x="52.0" y="578.0" font-size="20" font-weight="700" fill="#1d2a3a" text-anchor="start">부속서 VII 완료 증명</text>
<rect x="450.0" y="536.0" width="430.0" height="70.0" fill="#eef1f4" stroke="#8a96a3" stroke-width="2" rx="12"/>
<text x="464.0" y="577.8" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="start">없음</text>
<line x1="888.0" y1="571.0" x2="932.0" y2="571.0" stroke="#1f6fd1" stroke-width="4" marker-end="url(#ar-1f6fd1)"/>
<rect x="940.0" y="536.0" width="490.0" height="70.0" fill="#e9f1fc" stroke="#1f6fd1" stroke-width="2" rx="12"/>
<text x="954.0" y="577.8" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="start">회수 완료 후 30일·수령 후 1년 이내</text>
<text x="1462.0" y="578.0" font-size="19" font-weight="700" fill="#5f6b78" text-anchor="start">제18조(9)</text>
<text x="52.0" y="668.0" font-size="20" font-weight="700" fill="#1d2a3a" text-anchor="start">완료할 수 없는 부속서 VII 운송</text>
<rect x="450.0" y="626.0" width="430.0" height="70.0" fill="#eef1f4" stroke="#8a96a3" stroke-width="2" rx="12"/>
<text x="464.0" y="667.8" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="start">불법인 경우만 반송 규정</text>
<line x1="888.0" y1="661.0" x2="932.0" y2="661.0" stroke="#1f6fd1" stroke-width="4" marker-end="url(#ar-1f6fd1)"/>
<rect x="940.0" y="626.0" width="490.0" height="70.0" fill="#e9f1fc" stroke="#1f6fd1" stroke-width="2" rx="12"/>
<text x="954.0" y="667.8" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="start">주선자 또는 수하인이 90일 안에 반송·대체 회수</text>
<text x="1462.0" y="668.0" font-size="19" font-weight="700" fill="#5f6b78" text-anchor="start">제23조</text>
<rect x="30.0" y="706.0" width="1612.0" height="86.0" fill="#f6f8fa" stroke="#f6f8fa" stroke-width="0" rx="8"/>
<text x="52.0" y="758.0" font-size="20" font-weight="700" fill="#1d2a3a" text-anchor="start">문서 보관</text>
<rect x="450.0" y="716.0" width="430.0" height="70.0" fill="#eef1f4" stroke="#8a96a3" stroke-width="2" rx="12"/>
<text x="464.0" y="757.8" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="start">운송 시작일부터 3년</text>
<line x1="888.0" y1="751.0" x2="932.0" y2="751.0" stroke="#1f6fd1" stroke-width="4" marker-end="url(#ar-1f6fd1)"/>
<rect x="940.0" y="716.0" width="490.0" height="70.0" fill="#e9f1fc" stroke="#1f6fd1" stroke-width="2" rx="12"/>
<text x="954.0" y="757.8" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="start">완료 증명서 제공일부터 5년</text>
<text x="1462.0" y="758.0" font-size="19" font-weight="700" fill="#5f6b78" text-anchor="start">제20조</text>
<text x="52.0" y="848.0" font-size="20" font-weight="700" fill="#1d2a3a" text-anchor="start">실험실 분석용 폐기물(EU 안)</text>
<rect x="450.0" y="806.0" width="430.0" height="70.0" fill="#eef1f4" stroke="#8a96a3" stroke-width="2" rx="12"/>
<text x="464.0" y="847.8" font-size="18" font-weight="500" fill="#5f6b78" text-anchor="start">25kg 이하</text>
<line x1="888.0" y1="841.0" x2="932.0" y2="841.0" stroke="#1f6fd1" stroke-width="4" marker-end="url(#ar-1f6fd1)"/>
<rect x="940.0" y="806.0" width="490.0" height="70.0" fill="#e9f1fc" stroke="#1f6fd1" stroke-width="2" rx="12"/>
<text x="954.0" y="847.8" font-size="18" font-weight="700" fill="#1d2a3a" text-anchor="start">250kg 이하 또는 당국과 합의한 양</text>
<text x="1462.0" y="848.0" font-size="19" font-weight="700" fill="#5f6b78" text-anchor="start">제4조(5)</text>
</svg>
