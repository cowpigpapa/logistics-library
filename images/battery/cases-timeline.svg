<text x="516.0" y="212.0" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="start">반품·단종 재고 소형 가전</text>
<text x="516.0" y="244.0" font-size="17.5" font-weight="600" fill="#1d2a3a" text-anchor="start">작동 미확인·보호 부족 기기가 섞이면</text>
<text x="516.0" y="268.0" font-size="17.5" font-weight="600" fill="#1d2a3a" text-anchor="start">폐기물</text>
<text x="516.0" y="330.0" font-size="17" font-weight="800" fill="#1d2a3a" text-anchor="start">→ 로트 전체의 시험 기록과 포장</text>
