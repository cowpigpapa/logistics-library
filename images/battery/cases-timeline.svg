<text x="64.0" y="876.0" font-size="18.5" font-weight="600" fill="#1d2a3a" text-anchor="start">품명 오신고·일반 품명  ·  "녹색목록"이라는 화주 설명을 그대로 믿음  ·  반품·재고를 묶음으로 보냄  ·  경유국·환적항 누락  ·  위험물 요건 누락</text>
