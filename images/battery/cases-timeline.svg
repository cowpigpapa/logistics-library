<text x="216.0" y="622.0" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="start">규격 미달로 반품된 경유</text>
<text x="216.0" y="654.0" font-size="17.5" font-weight="600" fill="#1d2a3a" text-anchor="start">계약대로 환불받으려 반품한 것은 버린</text>
<text x="216.0" y="678.0" font-size="17.5" font-weight="600" fill="#1d2a3a" text-anchor="start">것 아님</text>
<text x="216.0" y="740.0" font-size="17" font-weight="800" fill="#1d2a3a" text-anchor="start">→ 반품 계약과 처리 계획을 서류로</text>
