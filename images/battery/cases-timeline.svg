<text x="906.0" y="212.0" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="start">폐리튬배터리, B/L "컴퓨터 부품"</text>
<text x="906.0" y="244.0" font-size="17.5" font-weight="600" fill="#1d2a3a" text-anchor="start">항만 반입 중 고속도로에서 전소</text>
<text x="906.0" y="330.0" font-size="17" font-weight="800" fill="#1d2a3a" text-anchor="start">→ 수거품의 품명과 단락 방지</text>
