<text x="76.0" y="212.0" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="start">폐전선 17개 컨테이너</text>
<text x="76.0" y="244.0" font-size="17.5" font-weight="600" fill="#1d2a3a" text-anchor="start">녹색목록 두 물질의 결합물은 녹색목록</text>
<text x="76.0" y="268.0" font-size="17.5" font-weight="600" fill="#1d2a3a" text-anchor="start">아님</text>
<text x="76.0" y="330.0" font-size="17" font-weight="800" fill="#1d2a3a" text-anchor="start">→ "녹색목록"이라는 말보다 코드 문언</text>
