<text x="736.0" y="622.0" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="start">이물질 최대 10% 폐지 혼합물</text>
<text x="736.0" y="654.0" font-size="17.5" font-weight="600" fill="#1d2a3a" text-anchor="start">단일 녹색목록 항목이 아님</text>
<text x="736.0" y="740.0" font-size="17" font-weight="800" fill="#1d2a3a" text-anchor="start">→ 섞이면 PIC가 될 수 있음</text>
