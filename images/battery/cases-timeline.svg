<text x="1256.0" y="622.0" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="start">825,000kg, 컨테이너 33개</text>
<text x="1256.0" y="654.0" font-size="17.5" font-weight="600" fill="#1d2a3a" text-anchor="start">비유해로 신고, 운송 중지·반송</text>
<text x="1256.0" y="740.0" font-size="17" font-weight="800" fill="#1d2a3a" text-anchor="start">→ EU 환적만 해도 EU 당국이 세운다</text>
