<text x="1296.0" y="212.0" font-size="17" font-weight="600" fill="#5f6b78" text-anchor="start">"깨끗한 플라스틱" 신고 폐기물</text>
<text x="1296.0" y="244.0" font-size="17.5" font-weight="600" fill="#1d2a3a" text-anchor="start">전기 폐기물을 안쪽에 숨김, 벌금</text>
<text x="1296.0" y="268.0" font-size="17.5" font-weight="600" fill="#1d2a3a" text-anchor="start">£80,000</text>
<text x="1296.0" y="330.0" font-size="17" font-weight="800" fill="#1d2a3a" text-anchor="start">→ 녹색목록 허위 기재와 반복 선적</text>
<rect x="40.0" y="800.0" width="1592.0" height="104.0" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="14"/>
