<text x="440.0" y="331.8" font-size="20" font-weight="800" fill="#1d2a3a" text-anchor="middle">고유식별자</text>
<text x="440.0" y="360.8" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="middle">ISO/IEC 15459 또는</text>
<text x="440.0" y="383.8" font-size="16.5" font-weight="500" fill="#1d2a3a" text-anchor="middle">동등 표준</text>
<line x1="542.0" y1="350.0" x2="590.0" y2="350.0" stroke="#1d2a3a" stroke-width="3" marker-end="url(#ar-1d2a3a)"/>
<rect x="596.0" y="128.0" width="1036.0" height="170.0" fill="#e7f4ed" stroke="#1f8a5b" stroke-width="2" rx="14"/>
<text x="620.0" y="166.0" font-size="22" font-weight="800" fill="#1f8a5b" text-anchor="start">① 공개 정보</text>
<text x="763.2" y="166.0" font-size="17" font-weight="700" fill="#5f6b78" text-anchor="start">누구나, 무료</text>
<text x="620.0" y="200.0" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">라벨 정보(제조자·범주·제조 장소·일자·무게·용량·화학계·유해물질·소화약제), 물질 구성, 탄소발자국, 재활용 원료</text>
<text x="620.0" y="227.0" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">함량, 정격 용량·전압·기대수명, 적합성 선언 등</text>
<rect x="596.0" y="312.0" width="1036.0" height="112.0" fill="#fdeee8" stroke="#e4572e" stroke-width="2" rx="14"/>
<text x="620.0" y="350.0" font-size="22" font-weight="800" fill="#e4572e" text-anchor="start">② 당국용 정보</text>
<text x="786.1" y="350.0" font-size="17" font-weight="700" fill="#5f6b78" text-anchor="start">통보기관·시장감시당국·집행위원회</text>
<text x="620.0" y="384.0" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">요건 준수를 입증하는 시험성적서 결과</text>
<rect x="596.0" y="438.0" width="1036.0" height="196.0" fill="#e9f1fc" stroke="#1f6fd1" stroke-width="2" rx="14"/>
<text x="620.0" y="476.0" font-size="22" font-weight="800" fill="#1f6fd1" text-anchor="start">③ 정당한 이익이 있는 자</text>
<text x="890.4" y="476.0" font-size="17" font-weight="700" fill="#5f6b78" text-anchor="start">수리·재제조·세컨드라이프·재활용 사업자, 구매자 등</text>
<text x="620.0" y="510.0" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">모델: 상세 구성, 부품번호, 해체 정보, 안전조치(제2항, 집행위원회도 열람)</text>
<text x="620.0" y="544.0" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">개별 배터리: 건전상태(SoH), 지위(원래·용도변경·재사용·재제조·폐기물), 사이클 수, 사고 이력(제4항)</text>
<text x="40.0" y="710.0" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="start">여권을 책임지는 자는 배터리의 지위를 따라 바뀝니다</text>
<rect x="40.0" y="730.0" width="372.0" height="150.0" fill="#eef1f4" stroke="#1d2a3a" stroke-width="2" rx="12"/>
<text x="56.0" y="764.5" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="start">출시·사용 개시</text>
<text x="56.0" y="795.3" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">시장 출시자가 정보의 정확성 책임(서면</text>
<text x="56.0" y="820.3" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">대리 가능)</text>
<line x1="416.0" y1="805.0" x2="442.0" y2="805.0" stroke="#1d2a3a" stroke-width="3" marker-end="url(#ar-1d2a3a)"/>
<rect x="446.0" y="730.0" width="372.0" height="150.0" fill="#e9f1fc" stroke="#1f6fd1" stroke-width="2" rx="12"/>
<text x="462.0" y="764.5" font-size="21" font-weight="800" fill="#1f6fd1" text-anchor="start">재사용·용도변경·재제조</text>
<text x="462.0" y="795.3" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">다시 출시한 사업자가 원래 여권에 연결된</text>
<text x="462.0" y="820.3" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">새 여권</text>
<line x1="822.0" y1="805.0" x2="848.0" y2="805.0" stroke="#1d2a3a" stroke-width="3" marker-end="url(#ar-1d2a3a)"/>
<rect x="852.0" y="730.0" width="372.0" height="150.0" fill="#fdeee8" stroke="#e4572e" stroke-width="2" rx="12"/>
<text x="868.0" y="764.5" font-size="21" font-weight="800" fill="#e4572e" text-anchor="start">폐배터리</text>
<text x="868.0" y="795.3" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">생산자, 생산자책임조직 또는 폐기물 관리</text>
<text x="868.0" y="820.3" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">사업자로 책임 이전</text>
<line x1="1228.0" y1="805.0" x2="1254.0" y2="805.0" stroke="#1d2a3a" stroke-width="3" marker-end="url(#ar-1d2a3a)"/>
<rect x="1258.0" y="730.0" width="372.0" height="150.0" fill="#fbeae6" stroke="#d9482b" stroke-width="2" rx="12"/>
<text x="1274.0" y="764.5" font-size="21" font-weight="800" fill="#d9482b" text-anchor="start">재활용</text>
<text x="1274.0" y="795.3" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">여권 소멸</text>
</svg>
