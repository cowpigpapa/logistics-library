<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="ar-1d2a3a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker><marker id="ar-5f6b78" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5f6b78"/></marker><marker id="ar-d9482b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="ar-1f6fd1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="ar-1f8a5b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="ar-e4572e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker><marker id="ar-c98a0b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c98a0b"/></marker><marker id="ar-8a96a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a96a3"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<text x="40.0" y="58.0" font-size="30" font-weight="800" fill="#1d2a3a" text-anchor="start">네덜란드 PGS 37-2: 48시간 크로스도킹인가, 저장인가</text>
<text x="40.0" y="94.0" font-size="19" font-weight="500" fill="#5f6b78" text-anchor="start">PGS 37-2는 허가 조건이나 지방자치단체 규정에 반영되어 있을 때 적용됩니다. 판단은 창고 운영자의 기록과 서류로 합니다.</text>
<rect x="40.0" y="140.0" width="300.0" height="110.0" fill="#eef1f4" stroke="#1d2a3a" stroke-width="2" rx="12"/>
<text x="190.0" y="187.5" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="middle">입고되는 리튬배터리</text>
<text x="190.0" y="219.6" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="middle">제3자 앞 화물</text>
<rect x="390.0" y="130.0" width="560.0" height="330.0" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="14"/>
<text x="414.0" y="172.0" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="start">네 조건을 모두 입증할 수 있나</text>
<rect x="414.0" y="210.0" width="30.0" height="30.0" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5" rx="6"/>
<polyline points="420.0,225.0 427.0,233.0 439.0,217.0" fill="none" stroke="#1f8a5b" stroke-width="3" stroke-linejoin="round"/>
<text x="458.0" y="232.0" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">운송 전후의 일시 환적이다</text>
<rect x="414.0" y="270.0" width="30.0" height="30.0" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5" rx="6"/>
<polyline points="420.0,285.0 427.0,293.0 439.0,277.0" fill="none" stroke="#1f8a5b" stroke-width="3" stroke-linejoin="round"/>
<text x="458.0" y="292.0" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">UN 승인 포장을 개봉하지 않았다</text>
<rect x="414.0" y="330.0" width="30.0" height="30.0" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5" rx="6"/>
<polyline points="420.0,345.0 427.0,353.0 439.0,337.0" fill="none" stroke="#1f8a5b" stroke-width="3" stroke-linejoin="round"/>
<text x="458.0" y="352.0" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">제3자 목적지가 특정되어 있다</text>
<rect x="414.0" y="390.0" width="30.0" height="30.0" fill="#ffffff" stroke="#1f8a5b" stroke-width="2.5" rx="6"/>
<polyline points="420.0,405.0 427.0,413.0 439.0,397.0" fill="none" stroke="#1f8a5b" stroke-width="3" stroke-linejoin="round"/>
<text x="458.0" y="412.0" font-size="19" font-weight="600" fill="#1d2a3a" text-anchor="start">체류가 최대 48시간이다(입고·출고 시각 기록)</text>
<line x1="340.0" y1="195.0" x2="386.0" y2="195.0" stroke="#1d2a3a" stroke-width="3" marker-end="url(#ar-1d2a3a)"/>
<line x1="950.0" y1="240.0" x2="1000.0" y2="240.0" stroke="#1f8a5b" stroke-width="4" marker-end="url(#ar-1f8a5b)"/>
<text x="975.0" y="222.0" font-size="18" font-weight="800" fill="#1f8a5b" text-anchor="middle">예</text>
<rect x="1004.0" y="150.0" width="628.0" height="160.0" fill="#e7f4ed" stroke="#1f8a5b" stroke-width="2" rx="12"/>
<text x="1020.0" y="185.4" font-size="22" font-weight="800" fill="#1f8a5b" text-anchor="start">저장 범위에서 제외될 수 있음</text>
<text x="1020.0" y="216.3" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">48시간을 넘길 가능성이 생기면 PGS 적합 저장 구획으로 옮기고 관할당국</text>
<text x="1020.0" y="241.3" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">조건을 확인합니다.</text>
<polyline points="540.0,460.0 540.0,502.0" fill="none" stroke="#d9482b" stroke-width="4" stroke-linejoin="round" marker-end="url(#ar-d9482b)"/>
<text x="560.0" y="490.0" font-size="18" font-weight="700" fill="#d9482b" text-anchor="start">아니오: 검사·충전·분류·주문 대기, 목적지 미정</text>
<rect x="1004.0" y="336.0" width="628.0" height="124.0" fill="#ffffff" stroke="#1f6fd1" stroke-width="2" rx="12"/>
<text x="1020.0" y="369.6" font-size="20" font-weight="800" fill="#1f6fd1" text-anchor="start">창고 자체 보관용 배터리</text>
<text x="1020.0" y="399.2" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">늦어도 12시간 안에 PGS 적합 보관 구역으로. 하역장당 25,000kg, 하역장 네</text>
<text x="1020.0" y="423.2" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">곳까지</text>
<rect x="40.0" y="506.0" width="1592.0" height="400.0" fill="#fbfcfd" stroke="#d9482b" stroke-width="2" rx="14"/>
<text x="64.0" y="548.0" font-size="22" font-weight="800" fill="#d9482b" text-anchor="start">통상의 저장: PGS 37-2가 적용되기 시작하는 양(방화구획당 하한)</text>
<text x="64.0" y="578.0" font-size="16.5" font-weight="500" fill="#5f6b78" text-anchor="start">최대 보관량이 아니라 적용이 시작되는 하한입니다. 종류가 섞이면 종류별 보관량을 각 하한으로 나눈 값의 합이 1 이상일 때 넘은 것으로 봅니다.</text>
<text x="64.0" y="638.0" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="start">그룹 1</text>
<text x="150.0" y="638.0" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">ADR 특별규정 188 충족 소형</text>
<rect x="560.0" y="618.0" width="940.0" height="30.0" fill="#8fb0d6" stroke="#1f6fd1" stroke-width="1.5" rx="4"/>
<text x="1512.0" y="640.0" font-size="19" font-weight="800" fill="#1f6fd1" text-anchor="start">1,000kg</text>
<text x="64.0" y="694.0" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="start">그룹 2</text>
<text x="150.0" y="694.0" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">그룹 1이 아닌 배터리</text>
<rect x="560.0" y="674.0" width="313.0" height="30.0" fill="#8fb0d6" stroke="#1f6fd1" stroke-width="1.5" rx="4"/>
<text x="885.0" y="696.0" font-size="19" font-weight="800" fill="#1f6fd1" text-anchor="start">333kg</text>
<text x="64.0" y="750.0" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="start">그룹 3</text>
<text x="150.0" y="750.0" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">그 배터리가 든 차량·기계 옥외 보관</text>
<rect x="560.0" y="730.0" width="313.0" height="30.0" fill="#8fb0d6" stroke="#1f6fd1" stroke-width="1.5" rx="4"/>
<text x="885.0" y="752.0" font-size="19" font-weight="800" fill="#1f6fd1" text-anchor="start">333kg, 보관 면적 2,500m² 초과</text>
<text x="64.0" y="806.0" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="start">그룹 4</text>
<text x="150.0" y="806.0" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">손상·결함 배터리</text>
<rect x="560.0" y="786.0" width="28.2" height="30.0" fill="#d9482b" stroke="#d9482b" stroke-width="1.5" rx="4"/>
<text x="600.2" y="808.0" font-size="19" font-weight="800" fill="#d9482b" text-anchor="start">30kg</text>
<text x="64.0" y="862.0" font-size="19" font-weight="800" fill="#1d2a3a" text-anchor="start">그룹 5</text>
<text x="150.0" y="862.0" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">재사용·재활용 목적(완전 방전 포함)</text>
<rect x="560.0" y="842.0" width="313.0" height="30.0" fill="#8fb0d6" stroke="#1f6fd1" stroke-width="1.5" rx="4"/>
<text x="885.0" y="864.0" font-size="19" font-weight="800" fill="#1f6fd1" text-anchor="start">333kg</text>
</svg>
