<text x="1326.0" y="154.0" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">8</text>
<text x="1352.0" y="155.0" font-size="21" font-weight="800" fill="#1f6fd1" text-anchor="start">픽업과 창고</text>
<text x="1318.0" y="186.0" font-size="17" font-weight="800" fill="#1f6fd1" text-anchor="start">·</text>
<text x="1330.0" y="186.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">수량·포장 상태를 예약과 대조</text>
<text x="1318.0" y="213.0" font-size="17" font-weight="800" fill="#1f6fd1" text-anchor="start">·</text>
<text x="1330.0" y="213.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">중고품 포장 외부 기록 사진</text>
<text x="1318.0" y="240.0" font-size="17" font-weight="800" fill="#1f6fd1" text-anchor="start">·</text>
<text x="1330.0" y="240.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">경유 창고의 허가·보험 서류</text>
<rect x="1300.0" y="318.0" width="332.0" height="150.0" fill="#e9f1fc" stroke="#1f6fd1" stroke-width="2" rx="12"/>
<circle cx="1326" cy="346" r="16" fill="#1f6fd1"/>
<text x="1326.0" y="352.0" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">9</text>
<text x="1352.0" y="353.0" font-size="21" font-weight="800" fill="#1f6fd1" text-anchor="start">운송 중 검사</text>
<text x="1318.0" y="384.0" font-size="17" font-weight="800" fill="#1f6fd1" text-anchor="start">·</text>
<text x="1330.0" y="384.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">증빙을 바로 낼 수 있게</text>
<text x="1318.0" y="411.0" font-size="17" font-weight="800" fill="#1f6fd1" text-anchor="start">·</text>
<text x="1330.0" y="411.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">못 내면 억류될 수 있음</text>
<rect x="1300.0" y="496.0" width="332.0" height="178.0" fill="#e9f1fc" stroke="#1f6fd1" stroke-width="2" rx="12"/>
<circle cx="1326" cy="524" r="16" fill="#1f6fd1"/>
<text x="1326.0" y="530.0" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">10</text>
<text x="1352.0" y="531.0" font-size="21" font-weight="800" fill="#1f6fd1" text-anchor="start">도착과 완료</text>
<text x="1318.0" y="562.0" font-size="17" font-weight="800" fill="#1f6fd1" text-anchor="start">·</text>
<text x="1330.0" y="562.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">수령 확인, 완료 증명 추적</text>
<text x="1318.0" y="589.0" font-size="17" font-weight="800" fill="#1f6fd1" text-anchor="start">·</text>
<text x="1330.0" y="589.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">완료 불가면 90일 안 반송</text>
<text x="1318.0" y="616.0" font-size="17" font-weight="800" fill="#1f6fd1" text-anchor="start">·</text>
<text x="1330.0" y="616.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">문서 5년 이상 보관</text>
<rect x="1300.0" y="702.0" width="332.0" height="168.0" fill="#eef1f4" stroke="#1d2a3a" stroke-width="2" rx="12"/>
<rect x="1310.0" y="714.0" width="62.0" height="32.0" fill="#1d2a3a" stroke="#1d2a3a" stroke-width="0" rx="16"/>
<text x="1341.0" y="736.0" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">11·12</text>
<text x="1382.0" y="737.0" font-size="21" font-weight="800" fill="#1d2a3a" text-anchor="start">선적 파일</text>
<text x="1318.0" y="768.0" font-size="17" font-weight="800" fill="#1d2a3a" text-anchor="start">·</text>
<text x="1330.0" y="768.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">화물별 문서 묶음</text>
<text x="1318.0" y="795.0" font-size="17" font-weight="800" fill="#1d2a3a" text-anchor="start">·</text>
<text x="1330.0" y="795.0" font-size="17" font-weight="500" fill="#1d2a3a" text-anchor="start">선적별 확인 기록(표지)</text>
