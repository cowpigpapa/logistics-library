<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<defs><marker id="ar-1d2a3a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2a3a"/></marker><marker id="ar-5f6b78" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5f6b78"/></marker><marker id="ar-d9482b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9482b"/></marker><marker id="ar-1f6fd1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f6fd1"/></marker><marker id="ar-1f8a5b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker><marker id="ar-e4572e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e4572e"/></marker><marker id="ar-c98a0b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c98a0b"/></marker><marker id="ar-8a96a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a96a3"/></marker></defs>
<rect width="1672" height="941" fill="#ffffff"/>
<text x="40.0" y="58.0" font-size="30" font-weight="800" fill="#1d2a3a" text-anchor="start">출발 전부터 완료 증명까지 지켜야 할 기한</text>
<text x="40.0" y="94.0" font-size="19" font-weight="500" fill="#5f6b78" text-anchor="start">EU 안 폐기물 운송 기준(폐기물운송규정). 간격은 실제 기간에 비례하지 않습니다.</text>
<rect x="60.0" y="353.0" width="1560.0" height="14.0" fill="#dfe6ee" stroke="#dfe6ee" stroke-width="0" rx="7"/>
<circle cx="208" cy="360" r="11" fill="#1f6fd1" stroke="#fff" stroke-width="3"/>
<rect x="90.0" y="140.0" width="236.0" height="180.0" fill="#e9f1fc" stroke="#1f6fd1" stroke-width="2" rx="12"/>
<text x="104.0" y="172.0" font-size="19" font-weight="800" fill="#1f6fd1" text-anchor="start">운송 시작 2영업일 전</text>
<text x="104.0" y="206.0" font-size="16.5" font-weight="600" fill="#1d2a3a" text-anchor="start">PIC 이동서류 제출</text>
<text x="104.0" y="230.0" font-size="16.5" font-weight="600" fill="#1d2a3a" text-anchor="start">부속서 VII 서류 전자 작성</text>
<text x="104.0" y="306.0" font-size="14.5" font-weight="700" fill="#5f6b78" text-anchor="start">제16조(2), 제18조(5)</text>
<line x1="208.0" y1="320.0" x2="208.0" y2="348.0" stroke="#1f6fd1" stroke-width="2"/>
<text x="208.0" y="402.0" font-size="18" font-weight="700" fill="#5f6b78" text-anchor="middle">−2영업일</text>
<circle cx="468" cy="360" r="11" fill="#1f6fd1" stroke="#fff" stroke-width="3"/>
<rect x="350.0" y="140.0" width="236.0" height="180.0" fill="#e9f1fc" stroke="#1f6fd1" stroke-width="2" rx="12"/>
<text x="364.0" y="172.0" font-size="19" font-weight="800" fill="#1f6fd1" text-anchor="start">출발 전</text>
<text x="364.0" y="206.0" font-size="16.5" font-weight="600" fill="#1d2a3a" text-anchor="start">실제 수량·운송인·</text>
<text x="364.0" y="230.0" font-size="16.5" font-weight="600" fill="#1d2a3a" text-anchor="start">컨테이너 번호 입력</text>
<text x="364.0" y="306.0" font-size="14.5" font-weight="700" fill="#5f6b78" text-anchor="start">제16조(2), 제18조(5)</text>
<line x1="468.0" y1="320.0" x2="468.0" y2="348.0" stroke="#1f6fd1" stroke-width="2"/>
<text x="468.0" y="402.0" font-size="18" font-weight="700" fill="#5f6b78" text-anchor="middle">출발</text>
<circle cx="728" cy="360" r="11" fill="#e4572e" stroke="#fff" stroke-width="3"/>
<rect x="610.0" y="140.0" width="236.0" height="180.0" fill="#fdeee8" stroke="#e4572e" stroke-width="2" rx="12"/>
<text x="624.0" y="172.0" font-size="19" font-weight="800" fill="#e4572e" text-anchor="start">운송 중</text>
<text x="624.0" y="206.0" font-size="16.5" font-weight="600" fill="#1d2a3a" text-anchor="start">검사 가능(출발지·목적지·</text>
<text x="624.0" y="230.0" font-size="16.5" font-weight="600" fill="#1d2a3a" text-anchor="start">국경·도중)</text>
<text x="624.0" y="254.0" font-size="16.5" font-weight="600" fill="#1d2a3a" text-anchor="start">서류 즉시 제시</text>
<text x="624.0" y="306.0" font-size="14.5" font-weight="700" fill="#5f6b78" text-anchor="start">제60조, 제61조</text>
<line x1="728.0" y1="320.0" x2="728.0" y2="348.0" stroke="#e4572e" stroke-width="2"/>
<text x="728.0" y="402.0" font-size="18" font-weight="700" fill="#5f6b78" text-anchor="middle">이동</text>
<circle cx="988" cy="360" r="11" fill="#1f8a5b" stroke="#fff" stroke-width="3"/>
<rect x="870.0" y="140.0" width="236.0" height="180.0" fill="#e7f4ed" stroke="#1f8a5b" stroke-width="2" rx="12"/>
<text x="884.0" y="172.0" font-size="19" font-weight="800" fill="#1f8a5b" text-anchor="start">시설 수령</text>
<text x="884.0" y="206.0" font-size="16.5" font-weight="600" fill="#1d2a3a" text-anchor="start">PIC는 동의 유효기간 안에</text>
<text x="884.0" y="230.0" font-size="16.5" font-weight="600" fill="#1d2a3a" text-anchor="start">시설이 수령</text>
<text x="884.0" y="306.0" font-size="14.5" font-weight="700" fill="#5f6b78" text-anchor="start">제9조(4)·(5)</text>
<line x1="988.0" y1="320.0" x2="988.0" y2="348.0" stroke="#1f8a5b" stroke-width="2"/>
<text x="988.0" y="402.0" font-size="18" font-weight="700" fill="#5f6b78" text-anchor="middle">수령</text>
<circle cx="1238" cy="360" r="11" fill="#1f8a5b" stroke="#fff" stroke-width="3"/>
<rect x="1120.0" y="140.0" width="236.0" height="180.0" fill="#e7f4ed" stroke="#1f8a5b" stroke-width="2" rx="12"/>
<text x="1134.0" y="172.0" font-size="19" font-weight="800" fill="#1f8a5b" text-anchor="start">수령 후 2영업일</text>
<text x="1134.0" y="206.0" font-size="16.5" font-weight="600" fill="#1d2a3a" text-anchor="start">수령 확인</text>
<text x="1134.0" y="306.0" font-size="14.5" font-weight="700" fill="#5f6b78" text-anchor="start">제16조(5), 제18조(8)</text>
<line x1="1238.0" y1="320.0" x2="1238.0" y2="348.0" stroke="#1f8a5b" stroke-width="2"/>
<text x="1238.0" y="402.0" font-size="18" font-weight="700" fill="#5f6b78" text-anchor="middle">+2영업일</text>
<circle cx="1488" cy="360" r="11" fill="#1f8a5b" stroke="#fff" stroke-width="3"/>
<rect x="1370.0" y="140.0" width="236.0" height="180.0" fill="#e7f4ed" stroke="#1f8a5b" stroke-width="2" rx="12"/>
<text x="1384.0" y="172.0" font-size="19" font-weight="800" fill="#1f8a5b" text-anchor="start">회수 완료 후 30일</text>
<text x="1384.0" y="206.0" font-size="16.5" font-weight="600" fill="#1d2a3a" text-anchor="start">완료 증명</text>
<text x="1384.0" y="230.0" font-size="16.5" font-weight="600" fill="#1d2a3a" text-anchor="start">(수령 후 1년 이내)</text>
<text x="1384.0" y="306.0" font-size="14.5" font-weight="700" fill="#5f6b78" text-anchor="start">제16조(6), 제18조(9)</text>
<line x1="1488.0" y1="320.0" x2="1488.0" y2="348.0" stroke="#1f8a5b" stroke-width="2"/>
<text x="1488.0" y="402.0" font-size="18" font-weight="700" fill="#5f6b78" text-anchor="middle">완료+30일</text>
<rect x="1080.0" y="430.0" width="540.0" height="70.0" fill="#e9f1fc" stroke="#1f6fd1" stroke-width="2" rx="12"/>
<text x="1100.0" y="462.0" font-size="20" font-weight="800" fill="#1f6fd1" text-anchor="start">문서 보관 5년 이상</text>
<text x="1100.0" y="488.0" font-size="17" font-weight="600" fill="#1d2a3a" text-anchor="start">완료 증명서 제공일부터 (제20조)</text>
<line x1="1488.0" y1="412.0" x2="1488.0" y2="430.0" stroke="#1f6fd1" stroke-width="2" stroke-dasharray="4 4"/>
<text x="40.0" y="560.0" font-size="24" font-weight="800" fill="#1d2a3a" text-anchor="start">예정대로 끝나지 않을 때</text>
<rect x="40.0" y="585.0" width="520.0" height="170.0" fill="#fdeee8" stroke="#e4572e" stroke-width="2" rx="12"/>
<text x="56.0" y="635.5" font-size="22" font-weight="800" fill="#e4572e" text-anchor="start">운송을 완료할 수 없을 때</text>
<text x="56.0" y="667.6" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">즉시 화주에게 알립니다. 통지자 또는 운송을 주선하는</text>
<text x="56.0" y="694.6" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">자가 90일 안에 반송하거나 대체 처리합니다.</text>
<text x="56.0" y="721.6" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">제22조, 제23조</text>
<rect x="580.0" y="585.0" width="520.0" height="170.0" fill="#fbeae6" stroke="#d9482b" stroke-width="2" rx="12"/>
<text x="596.0" y="638.1" font-size="22" font-weight="800" fill="#d9482b" text-anchor="start">불법 운송으로 판정되면</text>
<text x="596.0" y="669.1" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">30일 안에 반송하거나 처리해야 하고, 수송·처리·보관</text>
<text x="596.0" y="694.1" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">비용이 청구됩니다.</text>
<text x="596.0" y="719.1" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">제25조, 제26조</text>
<rect x="1120.0" y="585.0" width="512.0" height="170.0" fill="#eef1f4" stroke="#1d2a3a" stroke-width="2" rx="12"/>
<text x="1136.0" y="638.1" font-size="22" font-weight="800" fill="#1d2a3a" text-anchor="start">검사에서 서류를 못 내면</text>
<text x="1136.0" y="669.1" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">서류가 제출될 때까지 폐기물과 운송수단이 억류되고</text>
<text x="1136.0" y="694.1" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">수송이 중단될 수 있습니다.</text>
<text x="1136.0" y="719.1" font-size="18" font-weight="500" fill="#1d2a3a" text-anchor="start">제61조(4)</text>
<rect x="40.0" y="790.0" width="1592.0" height="110.0" fill="#fbfcfd" stroke="#c9d2dc" stroke-width="2" rx="14"/>
<text x="64.0" y="830.0" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">EU 밖 수출은 기한이 다릅니다. 목적지 시설은 수령 후 3일(제44조에 따른 수령 확인은 3영업일) 안에 서명된 이동서류 사본을 보내고, 폐기물이 EU를 떠난 뒤 42일 동안 수령 정보가</text>
<text x="64.0" y="856.0" font-size="19" font-weight="500" fill="#1d2a3a" text-anchor="start">없으면 발송 당국이 목적지 당국에 알립니다(제38조, 제44조).</text>
</svg>
