<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>사고 비용 정산 입력 화면 시안 · 작업 중 · Logistics Library</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261004-01">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
/* 입력 화면 시안: 메인은 결과(클레임 목록·유형별 집계)만, 입력은 팝업(클레임 + 지불 내역 + 회수 내역). 데이터 모델은 /share/claim-core.js */
:root{--bg:#e9ecef;--paper:#fff;--ink:#18222d;--muted:#56626e;--line:#d3d9df;--line2:#c3cbd3;--head:#f1f3f5;--chrome:#23303d;--blue:#1f5fbf;--blue-soft:#eef4fc;
--claim:#7d5605;--claim-soft:#fbf6ea;--pay:#9a2f22;--pay-soft:#fbeeec;--rec:#1a6648;--rec-soft:#eaf5ef;--ref:#1f4f9a;--ref-soft:#e7eef9;--f:'IBM Plex Sans KR','Malgun Gothic',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.55 var(--f)}
.lab-bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:8px 16px;background:#fff8e1;border-bottom:1px solid #e9d9a6;font-size:13px;color:#5c4a12}
.lab-bar a{color:var(--blue);font-weight:700;text-decoration:none}.lab-bar a:hover{text-decoration:underline}.lab-bar a[aria-current]{color:#5c4a12}
.top{background:var(--chrome);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:20px;padding:0 20px;min-height:42px;font-size:13px}
.top b{font-size:15px}.top span{color:#c4ccd4}.top .on{color:#fff;font-weight:700}.top .who{margin-left:auto;font-size:12px}
.wrap{max-width:1440px;margin:0 auto;padding:14px 20px 40px;display:grid;gap:12px}
.title{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px}
.title small{display:block;font-size:12px;color:var(--muted)}.title h1{margin:0;font-size:18px}
.box{background:var(--paper);border:1px solid var(--line2);padding:12px 14px;display:grid;gap:10px}
.box h2{margin:0;font-size:14px}
.btn{font:inherit;font-size:13px;min-height:32px;padding:0 14px;border-radius:3px;border:1px solid var(--line2);background:var(--paper);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}.btn.out{border-color:var(--blue);color:var(--blue)}
.btn.sm{min-height:26px;padding:0 8px;font-size:12px}.btn.del{color:var(--pay)}
button:focus-visible,select:focus,input:focus{outline:2px solid var(--blue);outline-offset:1px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.f{font:inherit;font-size:13px;color:var(--ink);border:1px solid var(--line2);border-radius:3px;padding:3px 6px;background:var(--paper);height:30px;width:100%}
.f.num{text-align:right}.f:disabled{background:var(--head);color:var(--muted)}
.filters .f{width:auto}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:12px;font-weight:500;color:#3d4954;background:var(--head);text-align:left;padding:6px 8px;border:1px solid var(--line);white-space:nowrap}
td{font-size:13px;padding:5px 8px;border:1px solid var(--line);vertical-align:middle;background:var(--paper)}
td.num,th.num{text-align:right;white-space:nowrap}
tbody tr.click{cursor:pointer}tbody tr.click:hover td{background:var(--blue-soft)}
tfoot td{background:var(--head);font-weight:700}
.c-pay{color:var(--pay)}.c-rec{color:var(--rec)}.c-ref{color:var(--ref)}
.st{display:inline-block;font-size:12px;padding:0 7px;border-radius:3px;background:var(--head)}.st[data-s="종결"]{background:var(--rec-soft);color:var(--rec)}
.kpi{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line2);background:var(--paper)}
.kpi div{padding:9px 12px;border-right:1px solid var(--line)}.kpi div:last-child{border-right:0;background:var(--head)}
.kpi small{display:block;font-size:11.5px;color:var(--muted)}.kpi b{font-size:16px;font-variant-numeric:tabular-nums}
/* 팝업 */
dialog{border:1px solid var(--line2);border-radius:4px;padding:0;width:min(1180px,calc(100vw - 24px));max-height:calc(100vh - 32px);color:var(--ink);font:13.5px/1.55 var(--f)}
dialog::backdrop{background:rgba(24,34,45,.45)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 16px;background:var(--chrome);color:#fff;position:sticky;top:0;z-index:2}
.dh h3{margin:0;font-size:15px}.dh button{font:inherit;background:none;border:0;color:#fff;font-size:20px;line-height:1;cursor:pointer;min-width:32px;min-height:32px}
.db{padding:12px 16px;display:grid;gap:14px}
.sec{display:grid;gap:8px}
.sec-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-bottom:2px solid var(--line2);padding-bottom:4px}
.sec-h h4{margin:0;font-size:14px}.sec-h h4 span{font-size:12px;font-weight:400;color:var(--muted);margin-left:8px}
.sec.claim .sec-h{border-color:var(--claim)}.sec.pay .sec-h{border-color:var(--pay)}.sec.rec .sec-h{border-color:var(--rec)}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px 10px}
.grid label{display:grid;gap:2px;font-size:12px;color:var(--muted)}
.grid .w2{grid-column:span 2}.grid .w3{grid-column:span 3}.grid .w6{grid-column:1/-1}
.grid label.cond{background:var(--claim-soft);padding:4px 6px;border-radius:3px}
.empty{font-size:12.5px;color:var(--muted);padding:6px 2px}
.res{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line2)}
.res div{padding:8px 10px;border-right:1px solid var(--line);font-size:11.5px;color:var(--muted)}.res div:last-child{border-right:0;background:var(--head)}
.res b{display:block;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.warn{color:var(--pay);font-size:12.5px;min-height:1em}
.df{display:flex;justify-content:space-between;gap:8px;padding:10px 16px;border-top:1px solid var(--line);background:var(--head);position:sticky;bottom:0}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid .w3,.grid .w2{grid-column:span 2}.kpi{grid-template-columns:repeat(3,minmax(0,1fr))}.res{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="lab-bar" id="labbar"><a href="/lab">← 작업 중 목록</a><span>검토용 시안 · 금액과 이름은 예시 · 새로고침하면 예시로 돌아갑니다</span><a href="/lab/claim-model">데이터 설계</a><a href="/lab/claim-screens" aria-current="page">입력 화면 시안</a><a href="/lab/claim-scenarios">시나리오 입력</a></div>
<div class="top"><b>QMS</b><span>부적합 등록</span><span>부적합 조회</span><span class="on">비용 정산</span><span>통계</span><span class="who">운영팀 담당자</span></div>
<main class="wrap">
  <div class="title"><div><small>비용 정산 › 클레임 관리</small><h1>클레임 관리</h1></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="btn" id="xls">엑셀 내려받기</button><button type="button" class="btn pri" id="new">+ 클레임 등록</button></div></div>

  <div id="kpi"></div>

  <div class="box">
    <div class="row"><h2>유형별 집계</h2><span class="hint" style="font-size:12px;color:var(--muted)">아래 목록 필터와 같이 움직입니다</span></div>
    <div class="scroll" id="pivot"></div>
  </div>

  <div class="box">
    <div class="row"><h2>클레임 목록</h2>
      <div class="filters"><select class="f" id="fType" aria-label="클레임 유형"></select><select class="f" id="fStatus" aria-label="상태"></select><input class="f" id="fq" placeholder="IRR No.·제목·청구인 검색" aria-label="검색" style="width:220px"></div></div>
    <div class="scroll" id="list"></div>
    <p style="margin:0;font-size:12px;color:var(--muted)">행을 누르면 입력 팝업이 열립니다. 메인 화면에는 결과만 보입니다.</p>
  </div>
</main>

<dialog id="dlg" aria-labelledby="dTitle">
  <div class="dh"><h3 id="dTitle"></h3><button type="button" id="dX" aria-label="닫기">×</button></div>
  <div class="db" id="dBody"></div>
  <div class="df" id="dFoot"></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="/share/claim-core.js"></script>
<script>
(() => {
  const C = ClaimCore, K = C.CODES, $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = n => (Number(n) || 0).toLocaleString('ko-KR');
  const num = s => Number(String(s || '').replace(/[^0-9]/g, '')) || 0;
  const clone = o => JSON.parse(JSON.stringify(o));
  const today = () => new Date().toISOString().slice(0, 10);
  let claims = clone(C.SAMPLES);

  const opt = (list, v, blank) => (blank ? `<option value="">${blank}</option>` : '') + list.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}"${val === v ? ' selected' : ''}>${esc(Array.isArray(o) ? val + ' ' + lab : lab)}</option>`; }).join('');
  const sel = (f, list, v, extra) => `<select class="f" data-f="${f}"${extra || ''}>${opt(list, v)}</select>`;
  const inp = (f, v, extra) => `<input class="f" data-f="${f}" value="${esc(v)}"${extra || ''}>`;
  const money = (f, v) => `<input class="f num" data-f="${f}" value="${v ? fmt(v) : ''}" inputmode="numeric">`;

  // ---- 메인 ----
  $('fType').innerHTML = opt(K.type.map(x => [x[0], x[1]]), '', '유형 전체');
  $('fStatus').innerHTML = opt(K.status, '', '상태 전체');
  const shown = () => {
    const t = $('fType').value, s = $('fStatus').value, q = $('fq').value.trim();
    return claims.filter(c => (!t || c.type === t) && (!s || c.status === s) && (!q || (c.irr + ' ' + c.title + ' ' + c.claimant + ' ' + (c.claimantName || '')).includes(q)));
  };
  function totals(list) {
    return list.reduce((a, c) => { const k = C.calc(c); a.n++; a.total += c.total; a.pay += k.pay; a.other += k.ins + k.cust + k.partner; a.rec += k.rec; a.net += k.net; a.cut += k.cut; a.insAll += k.insAll; return a; },
      { n: 0, total: 0, pay: 0, other: 0, rec: 0, net: 0, cut: 0, insAll: 0 });
  }
  function render() {
    const list = shown(), t = totals(list);
    $('kpi').innerHTML = `<div class="kpi"><div><small>클레임</small><b>${t.n}건</b></div><div><small>총 클레임 금액</small><b>${fmt(t.total)}</b></div><div><small>당사 지불</small><b class="c-pay">${fmt(t.pay)}</b></div>
      <div><small>당사 회수</small><b class="c-rec">${fmt(t.rec)}</b></div><div><small>보험 처리 계 (직접 보상 + 보험금 수령)</small><b class="c-ref">${fmt(t.insAll)}</b></div><div><small>당사 순손실 → Impact</small><b>${fmt(t.net)}</b></div></div>`;
    const piv = K.type.map(([code, name]) => [code, name, totals(list.filter(c => c.type === code))]).filter(x => x[2].n);
    $('pivot').innerHTML = `<table style="min-width:860px"><thead><tr><th>클레임 유형</th><th class="num">건수</th><th class="num">총 클레임 금액</th><th class="num">당사 지불</th><th class="num">보험사·제3자 부담</th><th class="num">당사 회수</th><th class="num">보험 처리 계</th><th class="num">감액·미지급</th><th class="num">당사 순손실</th></tr></thead>
      <tbody>${piv.map(([code, name, x]) => `<tr><td>${esc(code)} ${esc(name)}</td><td class="num">${x.n}</td><td class="num">${fmt(x.total)}</td><td class="num c-pay">${fmt(x.pay)}</td><td class="num c-ref">${fmt(x.other)}</td><td class="num c-rec">${fmt(x.rec)}</td><td class="num c-ref">${fmt(x.insAll)}</td><td class="num">${fmt(x.cut)}</td><td class="num"><b>${fmt(x.net)}</b></td></tr>`).join('') || '<tr><td colspan="9" style="color:var(--muted)">조건에 맞는 클레임이 없습니다.</td></tr>'}</tbody>
      <tfoot><tr><td>합계</td><td class="num">${t.n}</td><td class="num">${fmt(t.total)}</td><td class="num">${fmt(t.pay)}</td><td class="num">${fmt(t.other)}</td><td class="num">${fmt(t.rec)}</td><td class="num">${fmt(t.insAll)}</td><td class="num">${fmt(t.cut)}</td><td class="num">${fmt(t.net)}</td></tr></tfoot></table>`;
    $('list').innerHTML = `<table style="min-width:1240px"><thead><tr><th>클레임 ID</th><th>IRR No.</th><th>제목</th><th>클레임 유형</th><th>청구인</th><th>책임 판단</th><th class="num">총 클레임 금액</th><th class="num">당사 지불</th><th class="num">보험사·제3자</th><th class="num">당사 회수</th><th class="num">당사 순손실</th><th>상태</th></tr></thead>
      <tbody>${list.map(c => { const k = C.calc(c); return `<tr class="click" data-id="${esc(c.id)}" tabindex="0"><td>${esc(c.id)}</td><td>${esc(c.irr)}</td><td>${esc(c.title)}</td><td>${esc(C.label(K.type, c.type))}</td><td>${esc(c.claimant)}</td><td>${esc(c.liability)}</td>
        <td class="num">${fmt(c.total)}</td><td class="num c-pay">${fmt(k.pay)}</td><td class="num c-ref">${fmt(k.ins + k.cust + k.partner)}</td><td class="num c-rec">${fmt(k.rec)}</td><td class="num"><b>${fmt(k.net)}</b></td><td><span class="st" data-s="${esc(c.status)}">${esc(c.status)}</span></td></tr>`; }).join('')}</tbody></table>`;
  }
  ['fType', 'fStatus'].forEach(id => $(id).addEventListener('change', render));
  $('fq').addEventListener('input', render);
  const openRow = e => { const tr = e.target.closest('tr[data-id]'); if (tr) openDlg(claims.findIndex(c => c.id === tr.dataset.id)); };
  $('list').addEventListener('click', openRow);
  $('list').addEventListener('keydown', e => { if (e.key === 'Enter') openRow(e); });
  $('new').onclick = () => openDlg(-1);
  $('xls').onclick = () => C.exportXlsx(shown(), '사고비용정산_' + today() + '.xlsx');

  // ---- 팝업 ----
  const dlg = $('dlg');
  let d = null, idx = -1;
  const blank = () => ({ id: '', irr: '', title: '', type: 'CV-D', claimant: '고객 (화주·수하인)', claimantName: '', orig: '', origAmt: 0, issuedTo: '', liability: '협의 중', status: '접수', cur: 'KRW', total: 0, date: today(), closed: '', story: '', pays: [], recs: [] });
  function openDlg(i) {
    idx = i; d = i < 0 ? blank() : clone(claims[i]);
    $('dTitle').textContent = i < 0 ? '클레임 등록' : `클레임 ${d.id} 수정`;
    paint(); dlg.showModal();
  }
  function claimSec() {
    const cvs = d.type === 'CV-S', fn = d.type === 'FN';
    return `<div class="sec claim"><div class="sec-h"><h4>클레임<span>무엇을 얼마 청구받았나</span></h4></div><div class="grid">
      <label>IRR No.${inp('irr', d.irr, ' placeholder="IRR-2026-0000"')}</label><label class="w3">제목${inp('title', d.title)}</label><label>상태${sel('status', K.status, d.status)}</label>
      <label class="w2">클레임 유형${sel('type', K.type.map(x => [x[0], x[1]]), d.type)}</label><label>청구인 구분${sel('claimant', K.claimant, d.claimant)}</label><label>청구인${inp('claimantName', d.claimantName)}</label><label>책임 판단${sel('liability', K.liability, d.liability)}</label><label>접수일${inp('date', d.date)}</label>
      ${cvs ? `<label class="cond w2">원청구인 (처음 청구한 쪽)${sel('orig', K.claimant, d.orig || '고객 (화주·수하인)')}</label><label class="cond">원청구 금액${money('origAmt', d.origAmt)}</label>` : ''}
      ${fn ? `<label class="cond w2">과태료 부과 대상 (누구 앞으로 나왔나)${sel('issuedTo', K.issuedTo, d.issuedTo || '당사')}</label>` : ''}
      <label>총 클레임 금액${money('total', d.total)}</label><label>통화${sel('cur', ['KRW', 'USD', 'EUR', 'JPY', 'CNY'], d.cur)}</label><label>종결일${inp('closed', d.closed)}</label>
      <label class="w6">경위·비고${inp('story', d.story)}</label></div></div>`;
  }
  function paySec() {
    return `<div class="sec pay"><div class="sec-h"><h4>지불 내역<span>돈이 나간 건마다 한 줄 · 당사 보험사가 직접 보냈으면 지불 주체를 당사 보험사로(당사 지불 0) · 보험사가 일부를 내고 차액을 당사가 냈다면 두 줄</span></h4><button type="button" class="btn sm out" data-a="addPay">+ 지불 추가</button></div>
      ${d.pays.length ? `<div class="scroll"><table style="min-width:860px"><thead><tr><th style="width:150px">지불 주체</th><th style="width:250px">지불 수단</th><th class="num" style="width:150px">금액</th><th style="width:120px">일자</th><th>증빙번호</th><th style="width:56px"></th></tr></thead><tbody>
      ${d.pays.map((x, i) => `<tr data-k="pays" data-i="${i}"><td>${sel('payer', K.payer, x.payer)}</td><td>${sel('method', K.payMethod, x.payer === '당사' ? x.method : 'P1', x.payer === '당사' ? '' : ' disabled')}${x.payer === '당사' ? '' : `<small style="color:var(--muted)">${x.payer === '당사 보험사' ? '보험사가 청구인에게 직접 지급' : '당사를 거치지 않고 직접 납부·지급'}</small>`}</td>
        <td>${money('amount', x.amount)}</td><td>${inp('date', x.date)}</td><td>${inp('ref', x.ref, ' placeholder="송금번호, 크레딧 노트, 인보이스"')}</td><td><button type="button" class="btn sm del" data-a="delPay" data-i="${i}">삭제</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">아직 지불 내역이 없습니다. 지급 거절·협의 중이면 비워 둡니다.</div>'}</div>`;
  }
  function recSec() {
    return `<div class="sec rec"><div class="sec-h"><h4>회수 내역<span>당사가 돌려받은 건마다 한 줄 · 당사가 먼저 내고 보험으로 받았으면 보험금 수령</span></h4><button type="button" class="btn sm out" data-a="addRec">+ 회수 추가</button></div>
      ${d.recs.length ? `<div class="scroll"><table style="min-width:860px"><thead><tr><th style="width:150px">회수처</th><th style="width:250px">회수 수단</th><th class="num" style="width:150px">금액</th><th style="width:120px">일자</th><th>증빙번호</th><th style="width:56px"></th></tr></thead><tbody>
      ${d.recs.map((x, i) => `<tr data-k="recs" data-i="${i}"><td>${sel('from', K.recFrom, x.from)}</td><td>${sel('method', K.recMethod, x.method)}</td><td>${money('amount', x.amount)}</td><td>${inp('date', x.date)}</td><td>${inp('ref', x.ref, ' placeholder="입금번호, 매입 인보이스, 보험 청구번호"')}</td><td><button type="button" class="btn sm del" data-a="delRec" data-i="${i}">삭제</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">회수한 금액이 없으면 비워 둡니다.</div>'}</div>`;
  }
  function resSec() {
    const k = C.calc(d), over = k.pay + k.ins + k.cust + k.partner > d.total && d.total > 0;
    return `<div class="sec"><div class="res"><div>당사 지불<b class="c-pay">${fmt(k.pay)}</b></div><div>보험사·제3자 부담<b class="c-ref">${fmt(k.ins + k.cust + k.partner)}</b></div><div>당사 회수<b class="c-rec">${fmt(k.rec)}</b></div><div>감액·미지급<b>${fmt(k.cut)}</b></div><div>당사 순손실<b>${fmt(k.net)}</b></div></div>
      <div class="warn" id="warn">${over ? '지불 합계가 총 클레임 금액보다 큽니다. 금액을 확인해 주세요.' : ''}</div></div>`;
  }
  function paint() {
    $('dBody').innerHTML = claimSec() + paySec() + recSec() + `<div id="resWrap">${resSec()}</div>`;
    $('dFoot').innerHTML = `<span>${idx >= 0 ? '<button type="button" class="btn del" data-a="remove">클레임 삭제</button>' : ''}</span><span style="display:flex;gap:6px"><button type="button" class="btn" data-a="cancel">취소</button><button type="button" class="btn pri" data-a="save">저장</button></span>`;
  }
  const refreshRes = () => { $('resWrap').innerHTML = resSec(); };
  function setVal(el) {
    const f = el.dataset.f; if (!f) return false;
    const tr = el.closest('tr[data-k]'), numF = ['total', 'origAmt', 'amount'].includes(f);
    const v = numF ? num(el.value) : el.value;
    if (tr) {
      const line = d[tr.dataset.k][+tr.dataset.i]; line[f] = v;
      if (tr.dataset.k === 'pays' && f === 'payer' && v !== '당사') line.method = 'P1';
      if (tr.dataset.k === 'recs' && f === 'from' && v === '당사 보험사') line.method = 'R3';
      if (tr.dataset.k === 'recs' && f === 'method' && v === 'R3') line.from = '당사 보험사';
    } else d[f] = v;
    return true;
  }
  dlg.addEventListener('input', e => { if (setVal(e.target) && e.target.classList.contains('num')) refreshRes(); });
  dlg.addEventListener('change', e => {
    if (!setVal(e.target)) return;
    const f = e.target.dataset.f;
    if (['type', 'payer', 'from', 'method'].includes(f)) paint(); else refreshRes();
  });
  dlg.addEventListener('focusout', e => { if (e.target.classList.contains('num')) e.target.value = num(e.target.value) ? fmt(num(e.target.value)) : ''; });
  dlg.addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a;
    if (a === 'addPay') { d.pays.push({ payer: '당사', method: 'P1', amount: 0, date: today(), ref: '' }); return paint(); }
    if (a === 'addRec') { d.recs.push({ from: '협력사', method: 'R1', amount: 0, date: today(), ref: '' }); return paint(); }
    if (a === 'delPay') { d.pays.splice(+b.dataset.i, 1); return paint(); }
    if (a === 'delRec') { d.recs.splice(+b.dataset.i, 1); return paint(); }
    if (a === 'cancel') return dlg.close();
    if (a === 'remove') { claims.splice(idx, 1); dlg.close(); return render(); }
    if (a === 'save') {
      if (!d.total) { $('warn').textContent = '총 클레임 금액을 넣어 주세요.'; return; }
      if (d.type !== 'CV-S') { d.orig = ''; d.origAmt = 0; }
      if (d.type !== 'FN') d.issuedTo = '';
      if (!d.title) d.title = C.label(K.type, d.type);
      if (idx < 0) { const base = (d.irr.match(/(\d{4})$/) || ['', '0000'])[1]; let n = 1; while (claims.some(c => c.id === `CL-${base}-${n}`)) n++; d.id = `CL-${base}-${n}`; claims.unshift(d); }
      else claims[idx] = d;
      dlg.close(); render();
    }
  });
  $('dX').onclick = () => dlg.close();
  render();
})();
</script>
</body>
</html>
