# Supabase 무료 플랜은 7일 동안 API 요청이 없으면 프로젝트를 멈춘다(2026-10-26 에 onharu-services 가 멈췄다 —
# CubeStow 의 로그인·저장이 함께 섰다). 하루 두 번 가벼운 요청을 보내 "쓰고 있다"로 남긴다.
# 쓰는 키는 사이트 JS 에 이미 들어 있는 공개 키(publishable)라 비밀이 아니다.
# 예약 작업은 저장소의 기본 가지(main)에서만 돈다 — 이 파일은 main 에 있어야 한다.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 2,14 * * *"   # UTC 02:17·14:17 = 한국 11:17·23:17
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: onharu-services (CubeStow 로그인·저장)
            ref: wejegdshcpqqqhhjbtox
            key: sb_publishable_nUwCSEDHdD5sgQAooaJwew_g8hL0r0C
          - name: onharu-analytics (방문자 DB)
            ref: yihsukyedtlsdbexthlu
            key: sb_publishable_vgcDAWoOJRD8Xvp2p4Ew9A_exTmzuXM
    steps:
      - name: ${{ matrix.name }}
        run: |
          set -u
          base="https://${{ matrix.ref }}.supabase.co"
          # REST 와 Auth 양쪽에 한 번씩. 멈춰 있으면(응답 없음/5xx) 실패로 남겨 메일이 오게 한다.
          rest=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -H "apikey: ${{ matrix.key }}" "$base/rest/v1/")
          auth=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -H "apikey: ${{ matrix.key }}" "$base/auth/v1/health")
          echo "rest=$rest auth=$auth"
          case "$rest" in 2*|3*|4*) ;; *) echo "::error::${{ matrix.name }} 가 응답하지 않는다 (rest=$rest). 멈춘 것일 수 있다 — 대시보드에서 되살린다."; exit 1;; esac
